<text x="352" y="243" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">cnt[&#x27;w&#x27;] = 1, 重新合法</text>
<path d="M255 262 L255 290" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr_D85A30)"/>
<text x="266" y="298" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">被踢掉的 &#x27;w&#x27; = 重复的那个, left 2 → 3</text>
<text x="40" y="336" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">invariant (每次更新 best 时都成立): s[left..right] 没有重复字符</text>
<text x="40" y="358" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">left 停在&quot;刚好让 ch 不重复&quot;的位置: 再多缩只会让 window 更短</text>
