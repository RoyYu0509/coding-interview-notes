<svg width="100%" viewBox="0 0 680 412" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>为什么只有新进来的 ch 可能重复</title><defs><marker id="arr_52514E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">s = &quot;pwwkew&quot;, right = 5, ch = &#x27;w&#x27; · 进来之前 window = s[2..4] = &quot;wke&quot; 是合法的</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">旧 window 没有重复 → 新出现的重复一定涉及 ch → 只检查 cnt[ch] &gt; 1</text>
