<svg width="100%" viewBox="0 0 680 472" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>求最长 vs 求最短: 记答案的位置不同</title><defs><marker id="arr_52514E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">两种模板只差一件事: while 条件是&quot;不合法&quot;还是&quot;合法&quot;, 以及记答案放在 while 的外面还是里面</text>
<rect x="40" y="50" width="280" height="132" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="54" y="70" font-size="14" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">最长: 合法时记答案</text>
<text x="54" y="96" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">for right ...:</text>
<text x="54" y="114" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">    x 进 window</text>
<text x="54" y="132" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">    while 不合法:</text>
<text x="54" y="150" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">        移 left</text>
<text x="54" y="168" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">    best = max(best, len)   # 外面</text>
<rect x="360" y="50" width="280" height="132" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="374" y="70" font-size="14" fill="#712B13" text-anchor="start" font-weight="500" dominant-baseline="central">最短: 合法时先记答案, 再缩</text>
<text x="374" y="96" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">for right ...:</text>
<text x="374" y="114" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">    x 进 window</text>
<text x="374" y="132" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">    while 合法:</text>
<text x="374" y="150" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">        best = min(best, len)   # 里面</text>
<text x="374" y="168" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">        移 left</text>
<text x="40" y="206" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">为什么最短是&quot;合法才缩&quot;:</text>
<text x="40" y="228" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums 全是正数 → total 随 right 增大, 随 left 增大而减小 (单调)</text>
<text x="40" y="246" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window 合法 (total &gt;= target) 时, 缩 left 只会让 window 更短, 是下一个候选;</text>
<text x="40" y="264" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">缩到刚好不合法, 说明 left 再往右没有意义 (此 right 的最短 window 已找到)</text>
<text x="40" y="296" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">例: right = 4, window [3,1,2,4] total = 10 ≥ 7</text>
<rect x="40" y="312" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="51.0" y="326.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="62" y="312" width="22" height="26" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="73.0" y="326.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="84" y="312" width="22" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95.0" y="326.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="106" y="312" width="22" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="117.0" y="326.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="128" y="312" width="22" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="139.0" y="326.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="150" y="312" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="161.0" y="326.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="188" y="326" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">len = 4, total = 3+1+2+4 = 10 ≥ 7: best = 4, pop 3</text>
<rect x="40" y="352" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="51.0" y="366.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="62" y="352" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="73.0" y="366.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="84" y="352" width="22" height="26" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="95.0" y="366.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="106" y="352" width="22" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="117.0" y="366.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="128" y="352" width="22" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="139.0" y="366.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="150" y="352" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="161.0" y="366.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="188" y="366" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">len = 3, total = 1+2+4 = 7 ≥ 7: best = 3, pop 1</text>
<rect x="40" y="392" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="51.0" y="406.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="62" y="392" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="73.0" y="406.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="84" y="392" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="95.0" y="406.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="106" y="392" width="22" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="117.0" y="406.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="128" y="392" width="22" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="139.0" y="406.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="150" y="392" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="161.0" y="406.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="188" y="406" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">len = 2, total = 2+4 = 6 &lt; 7: 不合法, 停</text>
<rect x="33" y="441" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="54" y="448" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">移出 window 的</text>
<rect x="157.8" y="441" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="178.8" y="448" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window 里其他的</text>
<rect x="288.0" y="441" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="309.0" y="448" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window 外</text></svg>
