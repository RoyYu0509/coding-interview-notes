<svg width="100%" viewBox="0 0 680 328" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>exactly K = atMost(K) - atMost(K-1)</title><defs><marker id="arr_52514E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [1,2,1,2,3], k = 2 · 全部 subarray 里, 按&quot;不同数字的种类数&quot;分类</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">&quot;恰好 K 种&quot; 本身不单调, 不能直接滑: window 扩大可能 K → K+1, 缩小可能 K → K-1, 两个方向都会破坏</text>
<text x="40" y="56" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">&quot;最多 K 种&quot; 单调: 扩大只会让种类变多 → 超了就缩 left, 是标准模板</text>
<text x="40" y="90" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">atMost(2) = 12 个 subarray (种类数 ≤ 2)</text>
<rect x="40" y="104" width="200" height="34" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="140.0" y="122.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">种类 ≤ 1: 5 个 = atMost(1)</text>
<rect x="240" y="104" width="280" height="34" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="380.0" y="122.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">种类 = 2: 7 个 = 要的答案</text>
<rect x="237" y="101" width="286" height="40" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="160" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">→ 恰好 2 种 = atMost(2) - atMost(1) = 12 - 5 = 7</text>
<text x="40" y="194" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">7 个 subarray 是: [1,2] [2,1] [1,2] [1,2,1] [2,1,2] [1,2,1,2] [2,3]</text>
<text x="40" y="212" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">(位置不同但内容相同的算多个, 按起止下标数)</text>
<text x="40" y="252" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">同一套 at_most(k) 函数调两次, 每次 O(n) → 总共 O(n)</text>
<text x="40" y="272" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">这个技巧可以推广到任何&quot;恰好 K&quot;: Binary Subarrays With Sum, Count Number of Nice Subarrays</text>
<rect x="33" y="297" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="54" y="304" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">种类 ≤ K-1</text>
<rect x="138.0" y="297" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="159.0" y="304" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">种类恰好 K</text>
<rect x="235.2" y="297" width="14" height="14" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="256.2" y="304" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">答案</text></svg>
