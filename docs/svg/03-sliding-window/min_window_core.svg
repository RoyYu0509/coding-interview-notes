<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>need / missing: 怎么 O(1) 判断 window 覆盖了 t</title><defs><marker id="arr_52514E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">t = &quot;ABC&quot; → need 起始 = {A:1, B:1, C:1}, missing = 3 · 每进一个字符 need[ch] -= 1, 每出一个 need[ch] += 1</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">不用每次比较两个 Counter: 只在&quot;缺的&quot;字符进来时 missing -1, &quot;不缺&quot;的字符出去时 missing 不变</text>
<rect x="40" y="60" width="290" height="230" rx="6" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="54" y="82" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">window = &quot;ABAEC&quot; (s[0..4])</text>
<text x="54" y="102" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">A, B, C 都进来了, 合法</text>
<text x="54" y="134" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[A]</text>
<rect x="120" y="120" width="38" height="28" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="139.0" y="135.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">-1</text>
<text x="168" y="134" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">多 1 个 (window 里有 2 个 A)</text>
<text x="54" y="166" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[B]</text>
<rect x="120" y="152" width="38" height="28" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="139.0" y="167.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="168" y="166" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">刚好</text>
<text x="54" y="198" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[C]</text>
<rect x="120" y="184" width="38" height="28" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="139.0" y="199.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="168" y="198" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">刚好</text>
<text x="54" y="230" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[E]</text>
<rect x="120" y="216" width="38" height="28" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="139.0" y="231.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">-1</text>
<text x="168" y="230" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">t 里没有, 一律是多余的</text>
<text x="54" y="262" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">missing = 0, 合法</text>
<rect x="350" y="60" width="290" height="230" rx="6" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="364" y="82" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">pop &#x27;A&#x27;, &#x27;B&#x27; 之后: &quot;AEC&quot;</text>
<text x="364" y="102" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">pop A: 0, 不缺, 仍合法 → pop B: 变成 1</text>
<text x="364" y="134" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[A]</text>
<rect x="430" y="120" width="38" height="28" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="449.0" y="135.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="478" y="134" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">刚好</text>
<text x="364" y="166" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[B]</text>
<rect x="430" y="152" width="38" height="28" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="449.0" y="167.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="478" y="166" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">缺 1 个 → missing + 1</text>
<text x="364" y="198" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[C]</text>
<rect x="430" y="184" width="38" height="28" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="449.0" y="199.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="478" y="198" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">刚好</text>
<text x="364" y="230" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">need[E]</text>
<rect x="430" y="216" width="38" height="28" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="449.0" y="231.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">-1</text>
<text x="478" y="230" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">多余</text>
<text x="364" y="262" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">missing = 1, 不合法</text>
<path d="M334 175 L346 175" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr_52514E)"/>
<text x="40" y="322" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">need[c] &gt; 0 才说明 c 是&quot;缺&quot;的 → 只有这时进/出才改变 missing; 其余情况 need 在 0 以下上下浮动不影响合法性</text>
<text x="40" y="342" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">missing == 0 ⇔ t 里每个字符 (含重复次数) window 都够了 → 判断合法只要 O(1)</text>
<rect x="33" y="369" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="54" y="376" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">还缺 (&gt; 0)</text>
<rect x="132.6" y="369" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="153.6" y="376" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">刚好 (= 0)</text>
<rect x="232.2" y="369" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="253.2" y="376" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">多出来 (&lt; 0)</text></svg>
