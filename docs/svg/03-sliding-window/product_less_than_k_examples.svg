<svg width="100%" viewBox="0 0 680 254" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Subarray Product Less Than K examples</title><defs><marker id="arr_52514E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">全是正整数。数一数: 有多少段连续的数, 乘起来 &lt; k</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Example:  nums = [10,5,2,6], k = 100  →  8</text>
<text x="57.0" y="148" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">0</text>
<text x="91.0" y="148" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">1</text>
<text x="125.0" y="148" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2</text>
<text x="159.0" y="148" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">3</text>
<rect x="40" y="104" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="57.0" y="120.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
<rect x="74" y="104" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="91.0" y="120.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="108" y="104" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="125.0" y="120.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="142" y="104" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="159.0" y="120.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<path d="M43 96 L43 88 L139 88 L139 96" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="200" y="90" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">10 × 5 × 2 = 100, 不 &lt; 100 ✗</text>
<text x="40" y="170" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">合法的 8 段: [10]  [5]  [2]  [6]  [10,5]=50  [5,2]=10  [2,6]=12  [5,2,6]=60</text>
<text x="40" y="188" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">答案是&quot;个数&quot;, 不是长度: 同一个数可以出现在很多段里</text>
<line x1="40" y1="212" x2="640" y2="212" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="33" y="227" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="54" y="234" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">答案 substring / subarray</text>
<rect x="231.6" y="227" width="14" height="14" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="252.6" y="234" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">答案的范围</text>
<rect x="327.6" y="227" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="348.6" y="234" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">看起来像, 但不对 (原因写在右边)</text></svg>
