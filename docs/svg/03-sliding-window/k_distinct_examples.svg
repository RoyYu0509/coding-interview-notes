<text x="234" y="90" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">[1,2,3] 有 3 种 ✗</text>
<text x="40" y="170" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">恰好 2 种的 7 段: [1,2]  [2,1]  [1,2]  [2,3]  [1,2,1]  [2,1,2]  [1,2,1,2]</text>
