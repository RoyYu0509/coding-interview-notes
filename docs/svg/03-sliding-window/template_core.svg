<text x="340" y="110" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">brute force: 试遍所有 (left, right)</text>
<text x="340" y="130" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">= 上三角全部 21 格 → O(n²) 个 window</text>
<text x="340" y="150" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">每个 window 还要重新检查一遍 → O(n²) ~ O(n³)</text>
<text x="340" y="190" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">sliding window: 只走有 ring 的 9 格</text>
<text x="340" y="210" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">路径: (0,0) → (0,1) → (0,2) → (1,2) → (2,2)</text>
<text x="340" y="226" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">         (2,3) → (2,4) → (2,5) → (3,5)</text>
<text x="340" y="252" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">right 只往右, left 只往下, 从不回头</text>
<text x="340" y="290" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">为什么 left 不用回退:</text>
<text x="340" y="310" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">(left=1, right=2) 已经 ✗, right 再往右,</text>
<text x="340" y="326" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">(left=1, right=3..5) 一定也 ✗ (超集更差)</text>
<text x="340" y="342" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">→ 小于等于当前 left 的起点不会再合法</text>
<text x="340" y="358" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">→ left 只需要向右走, 总共最多 n 步</text>
<text x="340" y="394" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">每个 right 对应的最小合法 left</text>
<text x="340" y="410" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">随 right 单调不减 → 双指针共 2n 步</text>
<rect x="33" y="439" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="54" y="446" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">合法</text>
<rect x="93" y="439" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="114" y="446" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">不合法</text>
<rect x="165" y="439" width="14" height="14" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="186" y="446" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">sliding window 走过的格</text></svg>
