<svg width="100%" viewBox="0 0 680 422" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>计数: 以 right 结尾的合法 subarray 个数 = right - left + 1</title><defs><marker id="arr_52514E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [10,5,2,6], k = 100, right = 3 (x = 6), 缩完之后 left = 1 · window = [5,2,6], prod = 60</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">固定右端点 right, 合法的起点是连续的一段 left..right (起点越靠左乘积越大, 单调)</text>
<rect x="70" y="70" width="40" height="30" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="90.0" y="86.0" font-size="14" fill="#B4B2A9" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
<rect x="110" y="70" width="40" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="130.0" y="86.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="150" y="70" width="40" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="170.0" y="86.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="190" y="70" width="40" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="210.0" y="86.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="90" y="112" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">idx 0</text>
<text x="130" y="112" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">idx 1</text>
<text x="170" y="112" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">idx 2</text>
<text x="210" y="112" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">idx 3</text>
<rect x="192" y="140" width="36" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="210" y="149" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">[6]</text>
<text x="250" y="149" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">prod = 6 &lt; 100  ✓</text>
<rect x="152" y="178" width="76" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="190" y="187" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">[2,6]</text>
<text x="250" y="187" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">prod = 2 × 6 = 12 &lt; 100  ✓</text>
<rect x="112" y="216" width="116" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="170" y="225" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">[5,2,6]</text>
<text x="250" y="225" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">prod = 5 × 2 × 6 = 60 &lt; 100  ✓</text>
<rect x="72" y="254" width="156" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="150" y="263" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="250" y="263" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">prod = 10 × 5 × 2 × 6 = 600 ≥ 100  ✗ (left = 0 已被缩掉)</text>
<text x="40" y="304" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">→ 以 right = 3 结尾的合法 subarray 有 3 个 = right - left + 1 = 3 - 1 + 1</text>
<text x="40" y="326" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">每个 subarray 只按它的右端点数一次 → 不重不漏; 把每个 right 的个数相加就是答案</text>
<text x="40" y="346" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">和前面的差别: 前面是 best = max(...) 只关心最大的 window; 这里每一步 ans += (个数)</text>
<text x="40" y="366" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">注意: 只在 nums 全是正数时 prod 才单调. 有 0 或负数就不能用</text>
<rect x="33" y="391" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="54" y="398" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window 里 (合法起点)</text>
<rect x="195.0" y="391" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="216.0" y="398" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">新进来的 6</text>
<rect x="292.2" y="391" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="313.2" y="398" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">已被缩掉</text></svg>
