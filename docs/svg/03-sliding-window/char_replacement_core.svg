<svg width="100%" viewBox="0 0 680 384" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Longest Repeating Character Replacement 的合法条件</title><defs><marker id="arr_52514E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_898781" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr_D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window 里出现最多的字符保持不动, 其余字符都替换成它 → 需替换数 = len - max</text>
<text x="40" y="38" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">合法 ⇔ len - max ≤ k  (k = 1)</text>
<text x="40" y="86" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">window</text>
<rect x="130" y="70" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="147.0" y="87.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">A</text>
<rect x="164" y="70" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="181.0" y="87.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">A</text>
<rect x="198" y="70" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="215.0" y="87.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">B</text>
<rect x="232" y="70" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="249.0" y="87.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">A</text>
<text x="320" y="76" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">len = 4, max = A:3</text>
<text x="320" y="96" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">需替换 = 4 - 3 = 1 ≤ k = 1, 合法</text>
<text x="40" y="156" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">window</text>
<rect x="130" y="140" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="147.0" y="157.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">A</text>
<rect x="164" y="140" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="181.0" y="157.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">A</text>
<rect x="198" y="140" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="215.0" y="157.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">B</text>
<rect x="232" y="140" width="34" height="32" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="249.0" y="157.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">A</text>
<rect x="266" y="140" width="34" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="283.0" y="157.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">B</text>
<text x="320" y="146" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">len = 5, max = A:3</text>
<text x="320" y="166" font-size="12" fill="#712B13" text-anchor="start" font-weight="500" dominant-baseline="central">需替换 = 5 - 3 = 2 &gt; k = 1, 不合法</text>
<path d="M147 180 L147 214" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr_D85A30)"/>
<text x="160" y="224" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">不合法 → pop 最左的 A, left 右移 1</text>
<text x="40" y="268" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">monotone: right 往右扩, len - max 只增不减 (len 加 1, max 最多加 1)</text>
<text x="40" y="290" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">所以不合法了只能缩 left, 不用回头试更小的 left</text>
<text x="40" y="310" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">和上一题的差别: 合法条件要用&quot;window 里的最大频率&quot;, 用 max(cnt.values()), 最多 26 项, 仍是 O(n)</text>
<text x="40" y="330" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">(另有一种 max_freq 只增不减的省略写法, 面试不需要, 这里不展开)</text>
<rect x="33" y="353" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="54" y="360" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">新进 window 的</text>
<rect x="157.8" y="353" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/>
<text x="178.8" y="360" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">移出 window 的</text>
<rect x="282.6" y="353" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="303.6" y="360" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window 里其他的</text>
<rect x="412.8" y="353" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="433.8" y="360" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window 外</text></svg>
