<text x="159.0" y="120.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">B</text>
<rect x="37" y="101" width="142" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="200" y="119" font-size="14" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">把两个 B 改成 A → &quot;AAAA&quot;</text>
