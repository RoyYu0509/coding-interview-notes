<text x="40" y="288" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">和上一题的差别: 合法条件从&quot;没有重复&quot;换成&quot;zeros &lt;= k&quot;, 状态从 cnt 换成一个整数 zeros</text>
