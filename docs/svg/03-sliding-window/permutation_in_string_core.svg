<text x="40" y="340" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">识别: 题目说&quot;长度恰好是 m&quot; 或 &quot;连续 m 个&quot; → 固定窗口, 不是 while 缩 left, 而是 if right &gt;= m 踢一个</text>
<text x="40" y="360" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">Find All Anagrams in a String: 完全同一个模板, 把 return True 换成 res.append(right - m + 1)</text>
