<text x="40" y="170" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">答案 &quot;BANC&quot; (index 9..12): 含 B, A, C, 长度 4, 是所有&quot;包含 A,B,C 的段&quot;里最短的</text>
<line x1="40" y1="194" x2="640" y2="194" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="214" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Example 2:  s = &quot;a&quot;, t = &quot;aa&quot;  →  &quot;&quot;</text>
<text x="57.0" y="300" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">0</text>
<rect x="40" y="256" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="57.0" y="272.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">a</text>
<text x="40" y="322" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">t 要两个 a, s 只有一个 a → 不存在, 返回空字符串</text>
