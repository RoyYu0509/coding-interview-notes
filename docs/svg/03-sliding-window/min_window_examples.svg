<path d="M43 96 L43 88 L217 88 L217 96" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="454" y="90" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">&quot;ADOBEC&quot; 也包含 A, B, C, 但长度 6</text>
