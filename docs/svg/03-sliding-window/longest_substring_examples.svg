<line x1="40" y1="310" x2="640" y2="310" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="330" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Example 3:  s = &quot;pwwkew&quot;  →  3</text>
