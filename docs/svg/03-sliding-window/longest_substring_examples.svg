<text x="40" y="438" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">注意: &quot;pwke&quot; 不算 —— 它跳过了 index 2 的 w, 不是连续的一段 (那叫 subsequence, 不是 substring)</text>
