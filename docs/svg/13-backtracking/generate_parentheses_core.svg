<text x="40" y="419" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">答案 ["(())","()()"] · 节点数 13 (含 5 个被剪掉的)</text>
<text x="40" y="441" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">没有剪枝要枚举 2^4 = 16 个串再检查; 剪枝后只展开了 8 个节点, 叶子全是答案</text>
