<line x1="190" y1="171" x2="265" y2="211" stroke="#8A8984" stroke-width="1.2"/>
<line x1="377.5" y1="105" x2="415" y2="145" stroke="#8A8984" stroke-width="1.2"/>
<line x1="415" y1="171" x2="415" y2="211" stroke="#8A8984" stroke-width="1.2"/>
<line x1="377.5" y1="105" x2="565" y2="145" stroke="#8A8984" stroke-width="1.2"/>
<rect x="362.5" y="79" width="30" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="377.5" y="92" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[]</text>
<rect x="174.29" y="145" width="31.42" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190" y="158" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[1]</text>
<rect x="92.92" y="211" width="44.16" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115" y="224" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[1,2]</text>
<rect x="86.55" y="277" width="56.9" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115" y="290" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[1,2,3]</text>
<rect x="242.92" y="211" width="44.16" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="265" y="224" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[1,3]</text>
<rect x="399.29" y="145" width="31.42" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="415" y="158" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[2]</text>
<rect x="392.92" y="211" width="44.16" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="415" y="224" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[2,3]</text>
<rect x="549.29" y="145" width="31.42" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="565" y="158" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[3]</text>
<text x="40" y="353" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">节点数 = 2^3 = 8 =&gt; 8 个答案 (每个节点收集一次)</text>
<text x="40" y="375" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">[2,1] 不会出现: 选了 2 之后 start = 2, 只能再选 3</text>
<rect x="40" y="398" width="18" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="64" y="405" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">收集到的答案</text>
