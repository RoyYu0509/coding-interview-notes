<svg width="100%" viewBox="0 0 680 376" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Word Search: 用 board 本身当 used[]</title><desc>同一个 board 在 DFS 不同时刻的四个快照: 标记 # 和恢复。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">board = A B A / B B D · word = ABAD · 做选择 = 把格子改成 #, 撤销 = 改回原字母</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central"># 的位置 = path 走过的格子, 所以 "同一格不能用两次" 不需要额外的 used 或 set</text>
<text x="40" y="66" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">进入 dfs 前</text>
<rect x="40" y="82" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="58" y="100" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">A</text>
<rect x="78" y="82" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="96" y="100" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="116" y="82" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="134" y="100" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">A</text>
<rect x="40" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="58" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="78" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="96" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="116" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="134" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">D</text>
<text x="40" y="172" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">原始 board</text>
<text x="40" y="188" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">A B A / B B D</text>
<text x="190" y="66" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">t2: 走了 A→B</text>
<rect x="190" y="82" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="208" y="100" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">#</text>
<rect x="228" y="82" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="246" y="100" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="266" y="82" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="284" y="100" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">A</text>
<rect x="190" y="120" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="208" y="138" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">#</text>
<rect x="228" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="246" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="266" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="284" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">D</text>
<rect x="187" y="117" width="42" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="190" y="172" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">(0,0) (1,0) 变成 #</text>
<text x="190" y="188" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central"># 个数 = len(path) = 2</text>
<text x="340" y="66" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">t7: pop B 之后</text>
<rect x="340" y="82" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="358" y="100" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">#</text>
<rect x="378" y="82" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="396" y="100" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="416" y="82" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="434" y="100" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">A</text>
<rect x="340" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="358" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="378" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="396" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="416" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="434" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">D</text>
<rect x="340" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="358" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="337" y="117" width="42" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="340" y="172" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">(1,0) 变回 B</text>
<text x="340" y="188" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">(0,0) 仍是 #</text>
<text x="490" y="66" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">t13: 找到 ABAD</text>
<rect x="490" y="82" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="508" y="100" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">#</text>
<rect x="528" y="82" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="546" y="100" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">#</text>
<rect x="566" y="82" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="584" y="100" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">#</text>
<rect x="490" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="508" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="528" y="120" width="36" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="546" y="138" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="566" y="120" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="584" y="138" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">#</text>
<rect x="563" y="117" width="42" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="490" y="172" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">4 个 # = ABAD</text>
<text x="490" y="188" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">return True 之前</text>
<text x="40" y="224" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">三步写法 (一定成对出现)</text>
<text x="40" y="248" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">1. board[r][c] = "#"        做选择: 当前格子标记为已用</text>
<text x="40" y="268" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">2. found = dfs(上) or dfs(下) or dfs(左) or dfs(右)        递归: 往 4 个方向走</text>
<text x="40" y="288" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">3. board[r][c] = word[k]    撤销: 改回原字母 (找到了也要改回, 否则调用者的 board 被破坏)</text>
<text x="40" y="316" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">忘了第 3 步: (1,0) 永远是 #, 之后从别的起点或别的路线都经过不了它, 会漏掉答案</text>
<rect x="40" y="341" width="18" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="64" y="348" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central"># = 在 path 里 (已用)</text>
<rect x="206" y="341" width="18" height="14" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="230" y="348" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">原字母</text>
<rect x="330" y="341" width="16" height="14" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="352" y="348" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">当前 / 刚恢复的格子</text>
</svg>
