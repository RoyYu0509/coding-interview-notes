<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>N-Queens: 三个 set 把 "是否冲突" 变成 O(1)</title><desc>n=4, 前两行已放皇后, 第 2 行每一列的检查过程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">n = 4 · 已放: (0,1) 和 (1,3) · 现在要放第 r = 2 行 · 每行恰好一个皇后, 所以 path[r] = 列</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">同一列: c 相同 · 同一条 \ 对角线: r - c 相同 · 同一条 / 对角线: r + c 相同</text>
<rect x="40" y="62" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="84" y="62" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="128" y="62" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="172" y="62" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="40" y="106" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="84" y="106" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="128" y="106" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="172" y="106" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="40" y="150" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="84" y="150" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="128" y="150" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="172" y="150" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="40" y="194" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="84" y="194" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="128" y="194" width="44" height="44" rx="0" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<rect x="172" y="194" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<line x1="106" y1="84" x2="106" y2="216" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="106" y1="84" x2="194" y2="172" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="106" y1="84" x2="62" y2="128" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="194" y1="84" x2="194" y2="216" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="150" y1="84" x2="194" y2="128" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="194" y1="128" x2="106" y2="216" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="106" cy="84" r="15" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="106" y="84" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Q</text>
<circle cx="194" cy="128" r="15" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="194" y="128" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Q</text>
<rect x="40" y="150" width="44" height="44" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="62" y="172" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">OK</text>
<rect x="89" y="155" width="34" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="106" y="172" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">x</text>
<rect x="133" y="155" width="34" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="150" y="172" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">x</text>
<rect x="177" y="155" width="34" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="194" y="172" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">x</text>
<text x="62" y="54" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">c=0</text>
<text x="106" y="54" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">c=1</text>
<text x="150" y="54" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">c=2</text>
<text x="194" y="54" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">c=3</text>
<text x="34" y="84" font-size="12" fill="#52514E" font-weight="400" text-anchor="end" dominant-baseline="central">r=0</text>
<text x="34" y="128" font-size="12" fill="#52514E" font-weight="400" text-anchor="end" dominant-baseline="central">r=1</text>
<text x="34" y="172" font-size="12" fill="#52514E" font-weight="400" text-anchor="end" dominant-baseline="central">r=2</text>
<text x="34" y="216" font-size="12" fill="#52514E" font-weight="400" text-anchor="end" dominant-baseline="central">r=3</text>
<text x="262" y="66" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">三个 set (已放 (0,1) 和 (1,3))</text>
<text x="262" y="90" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">cols = {1, 3}</text>
<text x="392" y="90" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">= 已占用的列</text>
<text x="262" y="112" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">diag = {-1, -2}</text>
<text x="392" y="112" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">= r - c: 0-1, 1-3</text>
<text x="262" y="134" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">anti = {1, 4}</text>
<text x="392" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">= r + c: 0+1, 1+3</text>
<line x1="262" y1="148" x2="640" y2="148" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="262" y="164" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">第 r = 2 行, 逐列检查 (只查 3 次 set, O(1))</text>
<rect x="262" y="181" width="14" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="284" y="190" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">c=0: 0 不在 cols, 2-0=2 不在 diag, 2+0=2 不在 anti</text>
<rect x="262" y="205" width="14" height="14" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="284" y="214" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">c=1: 1 在 cols =&gt; 剪枝</text>
<rect x="262" y="229" width="14" height="14" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="284" y="238" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">c=2: 2+2=4 在 anti =&gt; 剪枝</text>
<rect x="262" y="253" width="14" height="14" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="284" y="262" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">c=3: 3 在 cols =&gt; 剪枝</text>
<text x="262" y="296" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">做选择: 三个 set 各 add 一个值 + path.append(c)</text>
<text x="262" y="316" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">撤销: 三个 set 各 remove 同一个值 + path.pop()</text>
<text x="262" y="336" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">漏掉一个 remove =&gt; 后面的分支会被 "幽灵皇后" 误剪</text>
<text x="40" y="262" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">红色虚线 = 已有皇后的</text>
<text x="40" y="280" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">攻击线 (列 / 两条对角线)</text>
<text x="40" y="302" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">第 2 行只有 c=0 安全</text>
<text x="40" y="320" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">=&gt; 只剩一个选择</text>
<text x="40" y="380" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">没有 set 的话: 每放一个皇后要扫已有皇后 O(n) 次 =&gt; 总共 O(n) × 节点数</text>
<text x="40" y="404" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">有了 set: 每次检查 O(1), 同一个 decision tree 少一个 n 的因子</text>
<rect x="40" y="429" width="18" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="64" y="436" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">皇后 / 可以放</text>
<rect x="161.6" y="429" width="18" height="14" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="185.6" y="436" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">被攻击 =&gt; 剪枝</text>
</svg>
