<svg width="100%" viewBox="0 0 680 572" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Backtracking = decision tree 上的 DFS</title><desc>nums=[1,2] 的 decision tree, 以及 DFS 过程中 path 这个共用 list 的 push/pop 时间线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">nums = [1, 2] · 节点 = 一个 path 状态 · 边 = 一次选择 · DFS 往下走 = push, 往回走 = pop</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">左: decision tree (绿箭头 push, 红虚线 pop) · 右: 同一个 path list 随时间 t 的变化</text>
<line x1="145" y1="113" x2="79" y2="163" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowG)"/>
<line x1="89" y1="163" x2="155" y2="113" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
<line x1="145" y1="113" x2="211" y2="163" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowG)"/>
<line x1="221" y1="163" x2="155" y2="113" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
<line x1="79" y1="189" x2="79" y2="239" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowG)"/>
<line x1="89" y1="239" x2="89" y2="189" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
<rect x="128" y="87" width="44" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="150" y="100" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[]</text>
<rect x="62" y="163" width="44" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="84" y="176" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[1]</text>
<rect x="194" y="163" width="44" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="216" y="176" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[2]</text>
<rect x="57" y="239" width="54" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="84" y="252" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">[1,2]</text>
<text x="104" y="128" font-size="12" fill="#085041" font-weight="500" text-anchor="end" dominant-baseline="central">t1 push 1</text>
<text x="122" y="150" font-size="12" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">t4 pop 1</text>
<text x="206" y="128" font-size="12" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">t5 push 2</text>
<text x="196" y="150" font-size="12" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">t6 pop 2</text>
<text x="98" y="202" font-size="12" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">t2 push 2</text>
<text x="98" y="224" font-size="12" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">t3 pop 2</text>
<text x="40" y="296" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">path 上每个节点都已是答案 (绿): 节点数 = 4 = 2^2</text>
<text x="340" y="62" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t</text>
<text x="366" y="62" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">动作</text>
<text x="430" y="62" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">被撤销</text>
<text x="486" y="62" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">path (同一个 list)</text>
<line x1="340" y1="72" x2="640" y2="72" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="97" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t0</text>
<text x="366" y="97" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">开始</text>
<text x="486" y="97" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">[ ] 空</text>
<line x1="340" y1="114" x2="640" y2="114" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="133" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t1</text>
<text x="366" y="133" font-size="14" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">push 1</text>
<rect x="486" y="119" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="501" y="133" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="483" y="116" width="36" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="340" y1="150" x2="640" y2="150" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="169" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t2</text>
<text x="366" y="169" font-size="14" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">push 2</text>
<rect x="486" y="155" width="30" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="501" y="169" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="518" y="155" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="533" y="169" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="515" y="152" width="36" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="340" y1="186" x2="640" y2="186" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="205" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t3</text>
<text x="366" y="205" font-size="14" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">pop 2</text>
<rect x="486" y="191" width="30" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="501" y="205" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="483" y="188" width="36" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="430" y="191" width="30" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="445" y="205" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M533 191 L533 187 L445 187 L445 190" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
<line x1="340" y1="222" x2="640" y2="222" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="241" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t4</text>
<text x="366" y="241" font-size="14" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">pop 1</text>
<text x="486" y="241" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">[ ] 空</text>
<rect x="430" y="227" width="30" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="445" y="241" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<path d="M501 227 L501 223 L445 223 L445 226" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
<line x1="340" y1="258" x2="640" y2="258" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="277" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t5</text>
<text x="366" y="277" font-size="14" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">push 2</text>
<rect x="486" y="263" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="501" y="277" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="483" y="260" width="36" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="340" y1="294" x2="640" y2="294" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="313" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">t6</text>
<text x="366" y="313" font-size="14" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">pop 2</text>
<text x="486" y="313" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">[ ] 空</text>
<rect x="430" y="299" width="30" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="445" y="313" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M501 299 L501 295 L445 295 L445 298" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
<line x1="340" y1="330" x2="640" y2="330" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="352" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">backtracking 的三件事</text>
<text x="40" y="376" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">path = 已做的选择 (从 root 走到当前节点的路), 一个共用的 list · 此刻 t2: path = [1, 2]</text>
<text x="40" y="396" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">choices = 还能选什么 (nums[start:]), 每个选择是一条往下的边 · t2: start = 2, 没有可选 =&gt; 往回走</text>
<text x="40" y="416" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">结束条件 = 什么时候收集答案 / 不能再往下 · 这里: 进入每个节点就收集 path[:]</text>
<text x="40" y="442" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">为什么必须 pop</text>
<text x="40" y="466" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">path 只有一个 list。t3、t4 如果不 pop, t5 push 2 之后 path = [1, 2, 2], 而不是 [2]。</text>
<text x="40" y="486" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">收集时也要 copy: res.append(path) 存的是同一个 list, 最后 res 里全是 [] (t6 之后 path 为空)。</text>
<text x="40" y="512" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">complexity = decision tree 的节点数 × 每个节点的工作: 4 个节点 × copy path</text>
<rect x="40" y="537" width="18" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="64" y="544" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">push / 新选择 / 答案</text>
<rect x="205.04" y="537" width="18" height="14" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="229.04" y="544" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">pop 撤销</text>
<rect x="330" y="537" width="16" height="14" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="352" y="544" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">path 栈顶</text>
</svg>
