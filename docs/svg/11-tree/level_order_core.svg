<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>BFS 分层: for _ in range(len(q))</title><desc>len(q) 在每轮开始时只算一次</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="20" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">tree [1, 2, 3, 4, 5]: 第 2 轮开始时 q = [2, 3]</text>
<text x="40" y="42" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">range(len(q)) 的 len(q) 只在循环开始时算一次 = 2, 之后 q 变长也不影响</text>
<text x="40" y="100" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">① 每轮开始, n = 2</text>
<text x="40" y="170" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">② popleft 2, push 4, 5</text>
<text x="40" y="240" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">③ popleft 3, 没有孩子</text>
<rect x="280" y="86" width="36" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="298.0" y="100.0" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">2</text>
<rect x="320" y="86" width="36" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="338.0" y="100.0" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">3</text>
<text x="370" y="100" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">← 这 2 个 = 这一层</text>
<rect x="210" y="156" width="36" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="228.0" y="170.0" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">2</text>
<line x1="274" y1="170" x2="252" y2="170" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowO)"/>
<text x="210" y="198" font-size="12" text-anchor="start" fill="#712B13" dominant-baseline="central">popleft</text>
<rect x="280" y="156" width="36" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="298.0" y="170.0" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">3</text>
<line x1="318" y1="150" x2="318" y2="190" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="324" y="156" width="36" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="342.0" y="170.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">4</text>
<rect x="364" y="156" width="36" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="382.0" y="170.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">5</text>
<text x="414" y="170" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">← 4、5 是下一层, 排在队尾</text>
<rect x="210" y="226" width="36" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="228.0" y="240.0" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">3</text>
<line x1="274" y1="240" x2="252" y2="240" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowO)"/>
<text x="210" y="268" font-size="12" text-anchor="start" fill="#712B13" dominant-baseline="central">popleft</text>
<line x1="278" y1="220" x2="278" y2="260" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="284" y="226" width="36" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="302.0" y="240.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">4</text>
<rect x="324" y="226" width="36" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="342.0" y="240.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">5</text>
<text x="374" y="240" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">← 本层弹完 2 次, for 结束; level = [2, 3]</text>
<circle cx="48" cy="288" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="48" y="288" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central"></text>
<text x="64" y="288" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">本层</text>
<circle cx="108" cy="288" r="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="108" y="288" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central"></text>
<text x="124" y="288" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">下一层</text>
<circle cx="181" cy="288" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="181" y="288" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central"></text>
<text x="197" y="288" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">弹出</text>
</svg>
