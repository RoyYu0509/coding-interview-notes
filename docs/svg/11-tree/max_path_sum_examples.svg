<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Max Path Sum examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">path = 沿着边走的一串 node, 每个 node 最多经过一次, 可以拐弯, 不必经过 root。求 node 值之和最大</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">的 path</text>
<line x1="40" y1="62" x2="640" y2="62" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="82" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 1:  root = [1,2,3]  →  6</text>
<line x1="190.0" y1="116" x2="115.0" y2="168" stroke="#0F6E56" stroke-width="2.5"/>
<line x1="190.0" y1="116" x2="265.0" y2="168" stroke="#0F6E56" stroke-width="2.5"/>
<circle cx="190.0" cy="116" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="117" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">1</text>
<circle cx="115.0" cy="168" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115.0" y="169" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2</text>
<circle cx="265.0" cy="168" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="265.0" y="169" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">3</text>
<text x="370" y="108" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">2 → 1 → 3</text>
<text x="370" y="130" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 2 + 1 + 3 = 6</text>
<line x1="40" y1="208" x2="640" y2="208" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="228" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 2:  root = [-10,9,20,null,null,15,7]  →  42</text>
<line x1="190.0" y1="262" x2="115.0" y2="314" stroke="#898781" stroke-width="1.2"/>
<line x1="190.0" y1="262" x2="265.0" y2="314" stroke="#898781" stroke-width="1.2"/>
<line x1="265.0" y1="314" x2="227.5" y2="366" stroke="#0F6E56" stroke-width="2.5"/>
<line x1="265.0" y1="314" x2="302.5" y2="366" stroke="#0F6E56" stroke-width="2.5"/>
<circle cx="190.0" cy="262" r="17" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="190.0" y="263" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">-10</text>
<circle cx="115.0" cy="314" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="115.0" y="315" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">9</text>
<circle cx="265.0" cy="314" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="265.0" y="315" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">20</text>
<circle cx="227.5" cy="366" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="227.5" y="367" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">15</text>
<circle cx="302.5" cy="366" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="302.5" y="367" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">7</text>
<text x="370" y="254" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">15 → 20 → 7</text>
<text x="370" y="276" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 15 + 20 + 7 = 42</text>
<text x="370" y="298" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre"></text>
<text x="370" y="320" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">经过 root 反而更小:</text>
<text x="370" y="342" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">9 + (-10) + 20 + 15 = 34</text>
<line x1="40" y1="406" x2="640" y2="406" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<circle cx="40" cy="428" r="7" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="54" y="428" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">最大的 path</text>
<circle cx="149.0" cy="428" r="7" fill="#FAECE7" stroke="#993C1D"/>
<text x="163.0" y="428" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">负数, 不值得经过</text></svg>
