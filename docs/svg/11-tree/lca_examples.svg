<svg width="100%" viewBox="0 0 680 586" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>LCA examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">LCA (最近公共祖先) = 同时是 p 和 q 的祖先的 node 里, 最深的那个。一个 node 也算自己的祖先</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 1:  p = 5, q = 1  →  3</text>
<line x1="210.0" y1="96" x2="125.0" y2="148" stroke="#898781" stroke-width="1.2"/>
<line x1="210.0" y1="96" x2="295.0" y2="148" stroke="#898781" stroke-width="1.2"/>
<line x1="125.0" y1="148" x2="82.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<line x1="125.0" y1="148" x2="167.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<line x1="295.0" y1="148" x2="252.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<line x1="295.0" y1="148" x2="337.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<line x1="167.5" y1="200" x2="146.25" y2="252" stroke="#898781" stroke-width="1.2"/>
<line x1="167.5" y1="200" x2="188.75" y2="252" stroke="#898781" stroke-width="1.2"/>
<circle cx="210.0" cy="96" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="210.0" cy="96" r="21" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="210.0" y="97" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">3</text>
<circle cx="125.0" cy="148" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="125.0" y="149" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">5</text>
<circle cx="295.0" cy="148" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="295.0" y="149" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">1</text>
<circle cx="82.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="82.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">6</text>
<circle cx="167.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="167.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2</text>
<circle cx="252.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="252.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">0</text>
<circle cx="337.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="337.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">8</text>
<circle cx="146.25" cy="252" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="146.25" y="253" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">7</text>
<circle cx="188.75" cy="252" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="188.75" y="253" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">4</text>
<text x="410" y="88" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">5 和 1 分别在 3 的左右两边</text>
<text x="410" y="110" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 3</text>
<line x1="40" y1="292" x2="640" y2="292" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="312" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 2:  p = 5, q = 4  →  5</text>
<line x1="210.0" y1="346" x2="125.0" y2="398" stroke="#898781" stroke-width="1.2"/>
<line x1="210.0" y1="346" x2="295.0" y2="398" stroke="#898781" stroke-width="1.2"/>
<line x1="125.0" y1="398" x2="82.5" y2="450" stroke="#898781" stroke-width="1.2"/>
<line x1="125.0" y1="398" x2="167.5" y2="450" stroke="#898781" stroke-width="1.2"/>
<line x1="295.0" y1="398" x2="252.5" y2="450" stroke="#898781" stroke-width="1.2"/>
<line x1="295.0" y1="398" x2="337.5" y2="450" stroke="#898781" stroke-width="1.2"/>
<line x1="167.5" y1="450" x2="146.25" y2="502" stroke="#898781" stroke-width="1.2"/>
<line x1="167.5" y1="450" x2="188.75" y2="502" stroke="#898781" stroke-width="1.2"/>
<circle cx="210.0" cy="346" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="210.0" y="347" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">3</text>
<circle cx="125.0" cy="398" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="125.0" cy="398" r="21" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="125.0" y="399" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">5</text>
<circle cx="295.0" cy="398" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="295.0" y="399" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">1</text>
<circle cx="82.5" cy="450" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="82.5" y="451" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">6</text>
<circle cx="167.5" cy="450" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="167.5" y="451" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2</text>
<circle cx="252.5" cy="450" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="252.5" y="451" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">0</text>
<circle cx="337.5" cy="450" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="337.5" y="451" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">8</text>
<circle cx="146.25" cy="502" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="146.25" y="503" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">7</text>
<circle cx="188.75" cy="502" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="188.75" y="503" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">4</text>
<text x="410" y="338" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">4 在 5 的子树里</text>
<text x="410" y="360" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">5 是自己的祖先</text>
<text x="410" y="382" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 5</text>
<line x1="40" y1="542" x2="640" y2="542" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<circle cx="40" cy="564" r="7" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="54" y="564" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">p 和 q</text>
<circle cx="118.4" cy="564" r="7" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="132.4" y="564" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">LCA</text></svg>
