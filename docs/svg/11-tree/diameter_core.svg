<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Diameter: 暴力重算 height vs 一次 post-order</title><desc>每个 node 被走过的次数</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="20" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">同一棵树, 数一数每个 node 被 height() 走过几次 (×k)</text>
<text x="40" y="44" font-size="14" text-anchor="start" fill="#712B13" font-weight="600" dominant-baseline="central">暴力: 每个 node 重新调 height()</text>
<text x="370" y="44" font-size="14" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">一次 post-order: height 顺手更新 best</text>
<line x1="106" y1="176" x2="70" y2="214" stroke="#898781" stroke-width="1.2"/>
<line x1="142" y1="138" x2="106" y2="176" stroke="#898781" stroke-width="1.2"/>
<line x1="250" y1="100" x2="142" y2="138" stroke="#898781" stroke-width="1.2"/>
<line x1="142" y1="138" x2="178" y2="176" stroke="#898781" stroke-width="1.2"/>
<line x1="178" y1="176" x2="214" y2="214" stroke="#898781" stroke-width="1.2"/>
<line x1="250" y1="100" x2="286" y2="138" stroke="#898781" stroke-width="1.2"/>
<circle cx="70" cy="214" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="70" y="214" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">6</text>
<text x="54" y="202" font-size="12" text-anchor="end" fill="#712B13" font-weight="600" dominant-baseline="central">×4</text>
<circle cx="106" cy="176" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="106" y="176" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">4</text>
<text x="90" y="164" font-size="12" text-anchor="end" fill="#712B13" font-weight="600" dominant-baseline="central">×3</text>
<circle cx="142" cy="138" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="142" y="138" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">2</text>
<text x="126" y="126" font-size="12" text-anchor="end" fill="#712B13" font-weight="600" dominant-baseline="central">×2</text>
<circle cx="178" cy="176" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="178" y="176" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">5</text>
<text x="194" y="164" font-size="12" text-anchor="start" fill="#712B13" font-weight="600" dominant-baseline="central">×3</text>
<circle cx="214" cy="214" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="214" y="214" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">7</text>
<text x="230" y="202" font-size="12" text-anchor="start" fill="#712B13" font-weight="600" dominant-baseline="central">×4</text>
<circle cx="250" cy="100" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="250" y="100" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">1</text>
<text x="266" y="88" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<circle cx="286" cy="138" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="286" y="138" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">3</text>
<text x="302" y="126" font-size="12" text-anchor="start" fill="#712B13" font-weight="600" dominant-baseline="central">×2</text>
<line x1="436" y1="176" x2="400" y2="214" stroke="#898781" stroke-width="1.2"/>
<line x1="472" y1="138" x2="436" y2="176" stroke="#898781" stroke-width="1.2"/>
<line x1="580" y1="100" x2="472" y2="138" stroke="#898781" stroke-width="1.2"/>
<line x1="472" y1="138" x2="508" y2="176" stroke="#898781" stroke-width="1.2"/>
<line x1="508" y1="176" x2="544" y2="214" stroke="#898781" stroke-width="1.2"/>
<line x1="580" y1="100" x2="616" y2="138" stroke="#898781" stroke-width="1.2"/>
<circle cx="400" cy="214" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="400" y="214" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">6</text>
<text x="384" y="202" font-size="12" text-anchor="end" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<circle cx="436" cy="176" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="436" y="176" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">4</text>
<text x="420" y="164" font-size="12" text-anchor="end" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<circle cx="472" cy="138" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="472" y="138" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">2</text>
<text x="456" y="126" font-size="12" text-anchor="end" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<circle cx="508" cy="176" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="508" y="176" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">5</text>
<text x="524" y="164" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<circle cx="544" cy="214" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="544" y="214" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">7</text>
<text x="560" y="202" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<circle cx="580" cy="100" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="580" y="100" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">1</text>
<text x="596" y="88" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<circle cx="616" cy="138" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="616" y="138" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">3</text>
<text x="632" y="126" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">×1</text>
<text x="40" y="236" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">×k = 这个 node 被 height() 走过的次数 = 深度 + 1</text>
<text x="40" y="258" font-size="14" text-anchor="start" fill="#712B13" font-weight="600" dominant-baseline="central">总数 = 1 + 2 + 2 + 3 + 3 + 4 + 4 = 19 (n = 7)</text>
<text x="40" y="280" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">链状 (skewed) 的树: 1 + 2 + … + n → O(n²)</text>
<text x="370" y="236" font-size="14" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">每个 node 只走 ×1: 总数 = 7 = n</text>
<text x="370" y="258" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">子树的 height 作为返回值被直接复用</text>
<text x="370" y="280" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">不再重新往下数 → O(n)</text>
<line x1="40" y1="298" x2="640" y2="298" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="320" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">浪费的是: 父亲算过的 height, 子节点又从头数一遍. 返回值把它带上来, 就不用再数</text>
</svg>
