<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Serialize: pre-order + None 标记</title><desc>token 序列 = 递归结构的拍平</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="20" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">tree [1, 2, 3, None, None, 4, 5] → 11 个 token. 每棵子树都是一段连续的 token</text>
<rect x="54" y="44" width="46" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="77.0" y="59.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">1</text>
<rect x="106" y="44" width="46" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="129.0" y="59.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">2</text>
<rect x="158" y="44" width="46" height="30" rx="4" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="181.0" y="59.0" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">#</text>
<rect x="210" y="44" width="46" height="30" rx="4" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="233.0" y="59.0" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">#</text>
<rect x="262" y="44" width="46" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="285.0" y="59.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">3</text>
<rect x="314" y="44" width="46" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="337.0" y="59.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">4</text>
<rect x="366" y="44" width="46" height="30" rx="4" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="389.0" y="59.0" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">#</text>
<rect x="418" y="44" width="46" height="30" rx="4" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="441.0" y="59.0" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">#</text>
<rect x="470" y="44" width="46" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="493.0" y="59.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">5</text>
<rect x="522" y="44" width="46" height="30" rx="4" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="545.0" y="59.0" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">#</text>
<rect x="574" y="44" width="46" height="30" rx="4" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="597.0" y="59.0" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">#</text>
<rect x="54" y="92" width="46" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="77.0" y="105" font-size="12" text-anchor="middle" fill="#085041" dominant-baseline="central">根 1</text>
<rect x="106" y="92" width="150" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="181.0" y="105" font-size="12" text-anchor="middle" fill="#444441" dominant-baseline="central">左子树: 2 # #</text>
<rect x="262" y="92" width="358" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="441.0" y="105" font-size="12" text-anchor="middle" fill="#444441" dominant-baseline="central">右子树: 3 4 # # 5 # #</text>
<rect x="262" y="134" width="46" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="285.0" y="147" font-size="12" text-anchor="middle" fill="#085041" dominant-baseline="central">根 3</text>
<rect x="314" y="134" width="150" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="389.0" y="147" font-size="12" text-anchor="middle" fill="#444441" dominant-baseline="central">左: 4 # #</text>
<rect x="470" y="134" width="150" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="545.0" y="147" font-size="12" text-anchor="middle" fill="#444441" dominant-baseline="central">右: 5 # #</text>
<line x1="40" y1="180" x2="640" y2="180" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="202" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">serialize: dfs(node) = 写 node, dfs(左), dfs(右); None 写 "#"</text>
<text x="40" y="226" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">deserialize: build() 读一个 token; "#" → None, 否则建 node</text>
<text x="40" y="248" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">left = build() 会吃掉左子树的全部 token, 剩下的正好是右子树的</text>
<text x="40" y="268" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">为什么要 "#": 没有它, "1,2,3" 对应多种形状; 有了它, 每棵子树的长度由 token 自己决定</text>
<text x="40" y="288" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">为什么用 iterator: 两次 build() 共享同一个读指针, 谁先调用谁先吃</text>
<text x="40" y="308" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">对比: 层序 + 下标 (2i+1, 2i+2) 要为每个空位置留格子, 链状 tree 需要 O(2^h) 空间</text>
</svg>
