<line x1="238" y1="142" x2="272" y2="174" stroke="#898781" stroke-width="1.2"/>
<circle cx="136" cy="142" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="136" cy="142" r="17" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="136" y="142" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">-5</text>
<text x="120" y="130" font-size="12" text-anchor="end" fill="#085041" font-weight="600" dominant-baseline="central">→-5</text>
<circle cx="170" cy="110" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="170" y="110" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">-10</text>
<circle cx="204" cy="174" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="204" y="174" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">15</text>
<circle cx="238" cy="142" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="238" y="142" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">20</text>
<circle cx="272" cy="174" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="272" y="174" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">7</text>
<text x="364" y="119.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">L = max(None, 0) = 0, R = max(None, 0) = 0</text>
<text x="364" y="139.0" font-size="14" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">best = max(-inf, -5 + 0 + 0) = -5</text>
<text x="364" y="159.0" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">return -5 + max(0, 0) = -5</text>
<line x1="40" y1="192" x2="640" y2="192" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="240.0" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">step 2</text>
<text x="40" y="258.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">node 15</text>
<line x1="170" y1="220" x2="136" y2="252" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="252" x2="204" y2="284" stroke="#898781" stroke-width="1.2"/>
<line x1="170" y1="220" x2="238" y2="252" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="252" x2="272" y2="284" stroke="#898781" stroke-width="1.2"/>
<circle cx="136" cy="252" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="136" y="252" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">-5</text>
<text x="120" y="240" font-size="12" text-anchor="end" fill="#6B6A65" dominant-baseline="central">→-5</text>
<circle cx="170" cy="220" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="170" y="220" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">-10</text>
<circle cx="204" cy="284" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="204" cy="284" r="17" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="204" y="284" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">15</text>
<text x="188" y="272" font-size="12" text-anchor="end" fill="#085041" font-weight="600" dominant-baseline="central">→15</text>
<circle cx="238" cy="252" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="238" y="252" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">20</text>
<circle cx="272" cy="284" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="272" y="284" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">7</text>
<text x="364" y="229.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">L = max(None, 0) = 0, R = max(None, 0) = 0</text>
<text x="364" y="249.0" font-size="14" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">best = max(-5, 15 + 0 + 0) = 15</text>
<text x="364" y="269.0" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">return 15 + max(0, 0) = 15</text>
<line x1="40" y1="302" x2="640" y2="302" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="350.0" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">step 3</text>
<text x="40" y="368.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">node 7</text>
<line x1="170" y1="330" x2="136" y2="362" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="362" x2="204" y2="394" stroke="#898781" stroke-width="1.2"/>
<line x1="170" y1="330" x2="238" y2="362" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="362" x2="272" y2="394" stroke="#898781" stroke-width="1.2"/>
<circle cx="136" cy="362" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="136" y="362" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">-5</text>
<text x="120" y="350" font-size="12" text-anchor="end" fill="#6B6A65" dominant-baseline="central">→-5</text>
<circle cx="170" cy="330" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="170" y="330" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">-10</text>
<circle cx="204" cy="394" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="204" y="394" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">15</text>
<text x="188" y="382" font-size="12" text-anchor="end" fill="#6B6A65" dominant-baseline="central">→15</text>
<circle cx="238" cy="362" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="238" y="362" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">20</text>
<circle cx="272" cy="394" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="272" cy="394" r="17" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="272" y="394" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">7</text>
<text x="288" y="382" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">→7</text>
<text x="364" y="339.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">L = max(None, 0) = 0, R = max(None, 0) = 0</text>
<text x="364" y="359.0" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">best = max(15, 7 + 0 + 0) = 15</text>
<text x="364" y="379.0" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">return 7 + max(0, 0) = 7</text>
<line x1="40" y1="412" x2="640" y2="412" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="460.0" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">step 4</text>
<text x="40" y="478.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">node 20</text>
<line x1="170" y1="440" x2="136" y2="472" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="472" x2="204" y2="504" stroke="#898781" stroke-width="1.2"/>
<line x1="170" y1="440" x2="238" y2="472" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="472" x2="272" y2="504" stroke="#898781" stroke-width="1.2"/>
<circle cx="136" cy="472" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="136" y="472" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">-5</text>
<text x="120" y="460" font-size="12" text-anchor="end" fill="#6B6A65" dominant-baseline="central">→-5</text>
<circle cx="170" cy="440" r="13" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="170" y="440" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">-10</text>
<circle cx="204" cy="504" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="204" y="504" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">15</text>
<text x="188" y="492" font-size="12" text-anchor="end" fill="#6B6A65" dominant-baseline="central">→15</text>
<circle cx="238" cy="472" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="238" cy="472" r="17" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="238" y="472" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">20</text>
<text x="254" y="460" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">→35</text>
<circle cx="272" cy="504" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="272" y="504" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">7</text>
<text x="288" y="492" font-size="12" text-anchor="start" fill="#6B6A65" dominant-baseline="central">→7</text>
<text x="364" y="449.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">L = max(15, 0) = 15, R = max(7, 0) = 7</text>
<text x="364" y="469.0" font-size="14" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">best = max(15, 20 + 15 + 7) = 42</text>
<text x="364" y="489.0" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">return 20 + max(15, 7) = 35</text>
<line x1="40" y1="522" x2="640" y2="522" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="570.0" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">step 5</text>
<text x="40" y="588.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">node -10</text>
<line x1="170" y1="550" x2="136" y2="582" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="582" x2="204" y2="614" stroke="#898781" stroke-width="1.2"/>
<line x1="170" y1="550" x2="238" y2="582" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="582" x2="272" y2="614" stroke="#898781" stroke-width="1.2"/>
<circle cx="136" cy="582" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="136" y="582" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">-5</text>
<text x="120" y="570" font-size="12" text-anchor="end" fill="#6B6A65" dominant-baseline="central">→-5</text>
<circle cx="170" cy="550" r="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="170" cy="550" r="17" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="170" y="550" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">-10</text>
<text x="186" y="538" font-size="12" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">→25</text>
<circle cx="204" cy="614" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="204" y="614" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">15</text>
<text x="188" y="602" font-size="12" text-anchor="end" fill="#6B6A65" dominant-baseline="central">→15</text>
<circle cx="238" cy="582" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="238" y="582" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">20</text>
<text x="254" y="570" font-size="12" text-anchor="start" fill="#6B6A65" dominant-baseline="central">→35</text>
<circle cx="272" cy="614" r="13" fill="#D3D1C7" stroke="#A9A79E" stroke-width="1"/>
<text x="272" y="614" font-size="14" text-anchor="middle" fill="#6B6A65" dominant-baseline="central">7</text>
<text x="288" y="602" font-size="12" text-anchor="start" fill="#6B6A65" dominant-baseline="central">→7</text>
<text x="364" y="559.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">L = max(-5, 0) = 0, R = max(35, 0) = 35</text>
<text x="364" y="579.0" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">best = max(42, -10 + 0 + 35) = 42</text>
<text x="364" y="599.0" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">return -10 + max(0, 35) = 25</text>
<line x1="40" y1="632" x2="640" y2="632" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="648" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">答案 = best = 42 (step 4 的 node 20: 20 + 15 + 7)</text>
<text x="40" y="670" font-size="14" text-anchor="start" fill="#52514E" dominant-baseline="central">返回值 35 / 25 只是"能带给父亲的单链", 都不是答案</text>
