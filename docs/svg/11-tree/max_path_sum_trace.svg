<svg width="100%" viewBox="0 0 680 722" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Binary Tree Maximum Path Sum 的 post-order trace</title><desc>tree [-10, -5, 20, None, None, 15, 7]; 答案 42 = 15 + 20 + 7, 拐点在 node 20</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">gain(node) = 以 node 为顶、只往下走一条链的最大和 (返回值) · best = 答案 (初值 -inf)</text>
<text x="40" y="38" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">L、R = 左右 gain, 负的取 0 · best 看 node.val + L + R (两边都用) · return 只带一边</text>
<text x="40" y="64" font-size="14" text-anchor="start" fill="#52514E" dominant-baseline="central">step</text>
<text x="100" y="64" font-size="14" text-anchor="start" fill="#52514E" dominant-baseline="central">tree (灰 = 已返回, 橙圈 = 当前)</text>
<text x="364" y="64" font-size="14" text-anchor="start" fill="#52514E" dominant-baseline="central">当前 node 的合并</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="130.0" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">step 1</text>
<text x="40" y="148.0" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">node -5</text>
<line x1="170" y1="110" x2="136" y2="142" stroke="#898781" stroke-width="1.2"/>
<line x1="238" y1="142" x2="204" y2="174" stroke="#898781" stroke-width="1.2"/>
