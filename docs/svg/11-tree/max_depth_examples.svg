<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Maximum Depth examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">depth = 从 root 走到最远的叶子, 一路经过几个 node</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 1:  root = [3,9,20,null,null,15,7]  →  3</text>
<line x1="190.0" y1="96" x2="115.0" y2="148" stroke="#898781" stroke-width="1.2"/>
<line x1="190.0" y1="96" x2="265.0" y2="148" stroke="#0F6E56" stroke-width="2.5"/>
<line x1="265.0" y1="148" x2="227.5" y2="200" stroke="#0F6E56" stroke-width="2.5"/>
<line x1="265.0" y1="148" x2="302.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<circle cx="190.0" cy="96" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="97" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">3</text>
<circle cx="115.0" cy="148" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="115.0" y="149" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">9</text>
<circle cx="265.0" cy="148" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="265.0" y="149" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">20</text>
<circle cx="227.5" cy="200" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="227.5" y="201" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">15</text>
<circle cx="302.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="302.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">7</text>
<text x="370" y="88" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">最长的一条: 3 → 20 → 15</text>
<text x="370" y="110" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">(3 → 20 → 7 也一样长)</text>
<text x="370" y="132" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 经过 3 个 node</text>
<line x1="40" y1="240" x2="640" y2="240" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="260" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 2:  root = [1,null,2]  →  2</text>
<line x1="190.0" y1="294" x2="265.0" y2="346" stroke="#0F6E56" stroke-width="2.5"/>
<circle cx="190.0" cy="294" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="295" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">1</text>
<circle cx="265.0" cy="346" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="265.0" y="347" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2</text>
<text x="370" y="286" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">只有右孩子: 1 → 2</text>
<text x="370" y="308" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 2</text>
<line x1="40" y1="386" x2="640" y2="386" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<circle cx="40" cy="408" r="7" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="54" y="408" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">最长的路径</text></svg>
