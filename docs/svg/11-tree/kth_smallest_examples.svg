<svg width="100%" viewBox="0 0 680 336" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Kth Smallest examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">给一个 BST, 返回第 k 小的值 (k 从 1 开始)</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example:  root = [5,3,6,2,4,null,null,1], k = 3  →  3</text>
<line x1="190.0" y1="96" x2="115.0" y2="148" stroke="#898781" stroke-width="1.2"/>
<line x1="190.0" y1="96" x2="265.0" y2="148" stroke="#898781" stroke-width="1.2"/>
<line x1="115.0" y1="148" x2="77.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<line x1="115.0" y1="148" x2="152.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<line x1="77.5" y1="200" x2="58.75" y2="252" stroke="#898781" stroke-width="1.2"/>
<circle cx="190.0" cy="96" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="190.0" y="97" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">5</text>
<circle cx="115.0" cy="148" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="115.0" cy="148" r="21" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="115.0" y="149" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">3</text>
<circle cx="265.0" cy="148" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="265.0" y="149" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">6</text>
<circle cx="77.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="77.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2</text>
<circle cx="152.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="152.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">4</text>
<circle cx="58.75" cy="252" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="58.75" y="253" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">1</text>
<text x="370" y="88" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">从小到大: 1, 2, 3, 4, 5, 6</text>
<text x="370" y="110" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 第 3 个是 3</text>
<line x1="40" y1="292" x2="640" y2="292" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<circle cx="40" cy="314" r="7" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="54" y="314" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">答案</text></svg>
