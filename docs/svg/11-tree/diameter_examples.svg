<svg width="100%" viewBox="0 0 680 302" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Diameter examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">diameter = 任意两个 node 之间最长的路径, 有几条边。这条路径不一定经过 root</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example:  root = [1,2,3,4,5]  →  3</text>
<line x1="190.0" y1="96" x2="115.0" y2="148" stroke="#0F6E56" stroke-width="2.5"/>
<line x1="190.0" y1="96" x2="265.0" y2="148" stroke="#0F6E56" stroke-width="2.5"/>
<line x1="115.0" y1="148" x2="77.5" y2="200" stroke="#0F6E56" stroke-width="2.5"/>
<line x1="115.0" y1="148" x2="152.5" y2="200" stroke="#898781" stroke-width="1.2"/>
<circle cx="190.0" cy="96" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="97" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">1</text>
<circle cx="115.0" cy="148" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="115.0" y="149" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2</text>
<circle cx="265.0" cy="148" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="265.0" y="149" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">3</text>
<circle cx="77.5" cy="200" r="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="77.5" y="201" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">4</text>
<circle cx="152.5" cy="200" r="17" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="152.5" y="201" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">5</text>
<text x="370" y="88" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">最长: 4 → 2 → 1 → 3</text>
<text x="370" y="110" font-size="13" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">(5 → 2 → 1 → 3 也一样)</text>
<text x="370" y="132" font-size="13" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">→ 3 条边</text>
<text x="40" y="234" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">路径可以&quot;拐弯&quot;: 从左子树上来, 经过某个 node, 再下到右子树</text>
<line x1="40" y1="258" x2="640" y2="258" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<circle cx="40" cy="280" r="7" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="54" y="280" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">最长的路径</text></svg>
