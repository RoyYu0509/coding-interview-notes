<text x="40" y="20" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">同一棵树 [3, 9, 20, None, None, 15, 7], 信息有两种流向: 看 node 需要谁告诉它</text>
<text x="40" y="44" font-size="14" text-anchor="start" fill="#085041" font-weight="600" dominant-baseline="central">左: 自顶向下 (pre-order)</text>
<text x="370" y="44" font-size="14" text-anchor="start" fill="#712B13" font-weight="600" dominant-baseline="central">右: 自底向上 (post-order)</text>
<text x="40" y="64" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">箭头 = 祖先 → 孩子, 传的是参数</text>
<text x="370" y="64" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">箭头 = 孩子 → 父亲, 传的是返回值 (此处 = height)</text>
<line x1="40" y1="236" x2="640" y2="236" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="256" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">node 需要祖先告诉它什么? → 写成参数</text>
<text x="40" y="278" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">例: depth、(low, high)、path 上的和</text>
<text x="40" y="296" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">流程: 先检查自己 → 再把更新后的参数传给孩子</text>
<text x="370" y="256" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">node 需要子树告诉它什么? → 写成返回值</text>
<text x="370" y="278" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">例: height、gain、"找到的 p 或 q"</text>
<text x="370" y="296" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">流程: 假设 L、R 已经算好 → 当前 node 只做合并</text>
<line x1="40" y1="314" x2="640" y2="314" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="334" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">两者可以同时用: 参数往下传约束, 返回值往上传摘要 (本文每题只用其中一种, 最清楚)</text>
</svg>
