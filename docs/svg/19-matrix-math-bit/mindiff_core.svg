<text x="40" y="270" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">相邻距离: 4, 3, 1, 1, 2 · 最小 = 1 (绿色), 有两对</text>
<line x1="40" y1="288" x2="640" y2="288" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="310" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">通用思想: sort 作为预处理 · 花 O(n log n) 把「谁和谁最近 / 谁和谁冲突」变成「看相邻」</text>
<text x="40" y="334" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">Meeting Rooms: 按 start 排序, 只检查 intervals[i].start &lt; intervals[i-1].end</text>
<text x="40" y="352" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">Merge Intervals / Closest pair / Valid Triangle: 都是先 sort, 再只看相邻 (或双指针)</text>
<rect x="40" y="375" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="60" y="382" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">sort 后的元素</text>
</svg>
