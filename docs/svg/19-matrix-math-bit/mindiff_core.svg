<svg width="100%" viewBox="0 0 680 406" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>排序后只看相邻</title><desc>sort 之后任何非相邻的 pair 距离都不小于夹在中间的相邻距离,所以只比较 n-1 对</desc><defs><marker id="f16-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f16-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f16-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f16-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="406" fill="#fff"/>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">暴力: 所有 pair 两两比较 = C(6,2) = 15 对, O(n^2)</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">sort 之后: a &lt; b &lt; c 时 c - a = (b - a) + (c - b) &gt;= b - a, 跨过 b 的 pair 永远不比相邻的更近</text>
<line x1="40" y1="190" x2="640" y2="190" stroke="#B4B2A9" stroke-width="1"/>
<path d="M60.0 174 Q238.1818181818182 94 416.3636363636364 174" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f16-r)"/>
<text x="238.1818181818182" y="78" font-size="12" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1 → 8:  8 - 1 = 7 = 4 + 3</text>
<text x="238.1818181818182" y="96" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">跨过 5, 一定比 1→5 和 5→8 都长</text>
