<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Pow(x, n) 运行流程</title><desc>x=2, n=10:每轮看 n 的最低位,是 1 就乘进 res,然后 x 平方、n 右移</desc><defs><marker id="f9-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f9-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f9-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f9-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="540" fill="#fff"/>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">x = 2, n = 10 · 每一轮: 看 n 的最低位 → 是 1 才 res *= x → x 平方 → n 右移一位</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">res 从 1 开始 · 每轮开始时 x = 2^(2^k) (k = 第几轮, 从 0 数)</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">这一轮开始时的 n</text>
<text x="190" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">最低位 n &amp; 1</text>
<text x="320" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">res</text>
<text x="480" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">x 平方 · n 右移</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="92" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52.0" y="106.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="66" y="92" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="78.0" y="106.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="92" y="92" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="104.0" y="106.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="118" y="92" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<rect x="115" y="89" width="30" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="130.0" y="106.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="40" y="138" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n = 10 = 1010 (二进制)</text>
<text x="190" y="106" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">n &amp; 1 = 0</text>
<text x="190" y="126" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">是 0: 跳过</text>
<text x="320" y="106" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">res = 1 (不变)</text>
<text x="320" y="126" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">x = 2 是 2^1, 不用</text>
<text x="480" y="106" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">x = 2 × 2 = 4</text>
<text x="480" y="126" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n &gt;&gt;= 1  →  n = 5</text>
<line x1="40" y1="170" x2="640" y2="170" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="184" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52.0" y="198.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="66" y="184" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="78.0" y="198.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="92" y="184" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="104.0" y="198.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="118" y="184" width="24" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="115" y="181" width="30" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="130.0" y="198.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="40" y="230" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n = 5 = 101 (二进制)</text>
<text x="190" y="198" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">n &amp; 1 = 1</text>
<text x="190" y="218" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">是 1: res *= x</text>
<text x="320" y="198" font-size="14" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">res = 1 × 4 = 4</text>
<text x="320" y="218" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">x = 4 是 2^2</text>
<text x="480" y="198" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">x = 4 × 4 = 16</text>
<text x="480" y="218" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n &gt;&gt;= 1  →  n = 2</text>
<line x1="40" y1="262" x2="640" y2="262" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="276" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52.0" y="290.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="66" y="276" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="78.0" y="290.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="92" y="276" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="104.0" y="290.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="118" y="276" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<rect x="115" y="273" width="30" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="130.0" y="290.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="40" y="322" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n = 2 = 10 (二进制)</text>
<text x="190" y="290" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">n &amp; 1 = 0</text>
<text x="190" y="310" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">是 0: 跳过</text>
<text x="320" y="290" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">res = 4 (不变)</text>
<text x="320" y="310" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">x = 16 是 2^4, 不用</text>
<text x="480" y="290" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">x = 16 × 16 = 256</text>
<text x="480" y="310" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n &gt;&gt;= 1  →  n = 1</text>
<line x1="40" y1="354" x2="640" y2="354" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="368" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52.0" y="382.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="66" y="368" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="78.0" y="382.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="92" y="368" width="24" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="104.0" y="382.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="118" y="368" width="24" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="115" y="365" width="30" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="130.0" y="382.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="40" y="414" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n = 1 = 1 (二进制)</text>
<text x="190" y="382" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">n &amp; 1 = 1</text>
<text x="190" y="402" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">是 1: res *= x</text>
<text x="320" y="382" font-size="14" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">res = 4 × 256 = 1024</text>
<text x="320" y="402" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">x = 256 是 2^8</text>
<text x="480" y="382" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">x = 256 × 256 = 65536</text>
<text x="480" y="402" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n &gt;&gt;= 1  →  n = 0</text>
<line x1="40" y1="446" x2="640" y2="446" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="464" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">n = 0, 循环结束 · res = 1 × 4 × 256 = 1024 = 2^2 × 2^8 = 2^10 ✓</text>
<text x="40" y="488" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">只循环 4 轮 (10 的二进制有 4 位), 暴力要 10 次乘法 · n = 10^9 时是 30 轮 vs 10^9 次</text>
<rect x="40" y="511" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="60" y="518" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">最低位 = 1, 乘进 res</text>
<rect x="208.0" y="511" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="228.0" y="518" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">n 的其他 bit</text>
<rect x="325.6" y="511" width="14" height="14" rx="3" fill="#fff" stroke="#EF9F27" stroke-width="2.5"/>
<text x="345.6" y="518" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">当前看的最低位</text>
</svg>
