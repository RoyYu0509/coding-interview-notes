<text x="253.0" y="125.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="266" y="112" width="22" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="277.0" y="125.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="320" y="112" width="22" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="331.0" y="125.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="40" y="118" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">12321 &gt; 0 ✓ 进入</text>
<text x="40" y="136" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">还没转到一半</text>
<text x="440" y="112" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">d = 12321 % 10 = 1</text>
<text x="440" y="128" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">rev = 0 × 10 + 1 = 1</text>
<text x="440" y="144" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">x = 12321 // 10 = 1232</text>
