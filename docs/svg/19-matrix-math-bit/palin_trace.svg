<text x="40" y="252" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">还没转到一半</text>
<text x="440" y="228" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">d = 123 % 10 = 3</text>
<text x="440" y="244" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">rev = 12 × 10 + 3 = 123</text>
<text x="440" y="260" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">x = 123 // 10 = 12</text>
<line x1="40" y1="272" x2="640" y2="272" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="292" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">12 &gt; 123 ? 否 → 停</text>
