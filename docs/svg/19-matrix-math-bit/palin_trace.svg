<text x="205.0" y="125.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="218" y="112" width="22" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="229.0" y="125.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
