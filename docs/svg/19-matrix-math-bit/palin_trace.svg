<text x="440" y="286" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">x == rev ? 12 ≠ 123</text>
<text x="440" y="304" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">x == rev // 10 ? 12 == 12 ✓</text>
<text x="440" y="322" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">奇数位 · 返回 True</text>
