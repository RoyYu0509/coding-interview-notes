<text x="355.0" y="183.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<text x="40" y="176" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">1232 &gt; 1 ✓ 进入</text>
<text x="40" y="194" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">还没转到一半</text>
<text x="440" y="170" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">d = 1232 % 10 = 2</text>
<text x="440" y="186" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">rev = 1 × 10 + 2 = 12</text>
<text x="440" y="202" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">x = 1232 // 10 = 123</text>
