<rect x="355" y="100" width="30" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="370.0" y="113.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">7</text>
<rect x="295" y="126" width="30" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="310.0" y="139.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
