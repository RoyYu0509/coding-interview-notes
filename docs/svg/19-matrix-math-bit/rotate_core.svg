<text x="585.0" y="165.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<rect x="600" y="152" width="30" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="597" y="149" width="36" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="615.0" y="165.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="585" y="84" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">每行 reverse 之后</text>
<text x="95" y="196" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">3 在 (0, 2)</text>
<text x="95" y="214" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2 在 (0, 1)</text>
<text x="340" y="196" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">3 在 (2, 0)</text>
<text x="340" y="214" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2 在 (1, 0)</text>
<text x="585" y="196" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">3 在 (2, 2)</text>
<text x="585" y="214" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2 在 (1, 2)</text>
<line x1="148" y1="139" x2="287" y2="139" stroke="#52514E" stroke-width="1.5" marker-end="url(#f4-g)"/>
<line x1="393" y1="139" x2="532" y2="139" stroke="#52514E" stroke-width="1.5" marker-end="url(#f4-g)"/>
<text x="217.5" y="122" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">(i,j)→(j,i)</text>
<text x="462.5" y="122" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">(j,i)→(j,2-i)</text>
<line x1="40" y1="234" x2="640" y2="234" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="254" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">代入验证: 3 在 (0, 2) → transpose → (2, 0) → reverse → (2, 3-1-0) = (2, 2) ✓ 对应 (j, n-1-i) = (2, 2)</text>
<text x="40" y="276" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">直觉: 原来的第 i 行 → transpose 变成第 i 列 → reverse 把第 i 列挪到第 n-1-i 列</text>
<text x="40" y="294" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">所以最上面一行 [1, 2, 3] 变成最右边一列 (从上往下读 1, 2, 3)</text>
<rect x="40" y="331" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="60" y="338" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">跟踪的元素 3 / 2</text>
<rect x="181.6" y="331" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="201.6" y="338" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">其他</text>
