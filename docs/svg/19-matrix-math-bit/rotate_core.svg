<rect x="540" y="126" width="30" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="555.0" y="139.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">8</text>
<rect x="570" y="126" width="30" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="585.0" y="139.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="600" y="126" width="30" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="615.0" y="139.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="540" y="152" width="30" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="555.0" y="165.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">9</text>
