<svg width="100%" viewBox="0 0 680 390" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>杂项题的共同点</title><desc>四类题,暴力解各自浪费什么,以及用题目自身结构消掉浪费后 complexity 的变化</desc><defs><marker id="f1-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f1-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f1-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f1-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="390" fill="#fff"/>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">这个 doc 的题没有统一的数据结构 · 共同点: 暴力解在重复做或多存一份东西,</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">而题目自身的结构 (边界 / 二进制 / 配对 / 有序) 可以把它消掉</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">暴力解浪费什么</text>
<text x="370" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">利用什么结构消掉</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="92" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">矩阵 Spiral / Set Zeroes</text>
<rect x="40" y="106" width="270" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52" y="119" font-size="12" fill="#444441" text-anchor="start" font-weight="400" dominant-baseline="central">visited[m][n] 或复制一份矩阵</text>
<text x="52" y="136" font-size="12" fill="#444441" text-anchor="start" font-weight="500" dominant-baseline="central">space O(mn)</text>
<line x1="314" y1="126" x2="360" y2="126" stroke="#52514E" stroke-width="1.5" marker-end="url(#f1-g)"/>
<rect x="370" y="106" width="270" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="382" y="119" font-size="12" fill="#085041" text-anchor="start" font-weight="400" dominant-baseline="central">4 个边界整数 / 矩阵自己的第一行第一列</text>
<text x="382" y="136" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">space O(1)</text>
<line x1="40" y1="150" x2="640" y2="150" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="162" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Pow(x, n)</text>
<rect x="40" y="176" width="270" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52" y="189" font-size="12" fill="#444441" text-anchor="start" font-weight="400" dominant-baseline="central">n 个 x 连乘, 每个 x 都乘一次</text>
<text x="52" y="206" font-size="12" fill="#444441" text-anchor="start" font-weight="500" dominant-baseline="central">time O(n)</text>
<line x1="314" y1="196" x2="360" y2="196" stroke="#52514E" stroke-width="1.5" marker-end="url(#f1-g)"/>
<rect x="370" y="176" width="270" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="382" y="189" font-size="12" fill="#085041" text-anchor="start" font-weight="400" dominant-baseline="central">n 的二进制拆分: 平方 + 按 bit 选择</text>
<text x="382" y="206" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">time O(log n)</text>
<line x1="40" y1="220" x2="640" y2="220" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="232" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Single Number</text>
<rect x="40" y="246" width="270" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52" y="259" font-size="12" fill="#444441" text-anchor="start" font-weight="400" dominant-baseline="central">Hash Table 给每个数计数</text>
<text x="52" y="276" font-size="12" fill="#444441" text-anchor="start" font-weight="500" dominant-baseline="central">space O(n)</text>
<line x1="314" y1="266" x2="360" y2="266" stroke="#52514E" stroke-width="1.5" marker-end="url(#f1-g)"/>
<rect x="370" y="246" width="270" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="382" y="259" font-size="12" fill="#085041" text-anchor="start" font-weight="400" dominant-baseline="central">XOR: a^a = 0, 成对的自己抵消</text>
<text x="382" y="276" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">space O(1)</text>
<line x1="40" y1="290" x2="640" y2="290" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="302" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Min Absolute Difference</text>
<rect x="40" y="316" width="270" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="52" y="329" font-size="12" fill="#444441" text-anchor="start" font-weight="400" dominant-baseline="central">所有 pair 两两比较</text>
<text x="52" y="346" font-size="12" fill="#444441" text-anchor="start" font-weight="500" dominant-baseline="central">time O(n^2)</text>
<line x1="314" y1="336" x2="360" y2="336" stroke="#52514E" stroke-width="1.5" marker-end="url(#f1-g)"/>
<rect x="370" y="316" width="270" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="382" y="329" font-size="12" fill="#085041" text-anchor="start" font-weight="400" dominant-baseline="central">先 sort, 最近的一定是相邻的</text>
<text x="382" y="346" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">time O(n log n)</text>
<rect x="40" y="361" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="60" y="368" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">暴力解 / 浪费</text>
<rect x="161.8" y="361" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="181.8" y="368" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">利用结构后</text>
</svg>
