<svg width="100%" viewBox="0 0 680 436" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>XOR 核心</title><desc>a^a=0 让成对出现的数抵消,Single Number 与 Missing Number 都是配对后落单</desc><defs><marker id="f12-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f12-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f12-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f12-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="436" fill="#fff"/>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">XOR 三条性质:  a ^ a = 0  ·  a ^ 0 = a  ·  a ^ b = b ^ a (顺序无所谓, 也满足结合律)</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">所以一串数 XOR 起来, 出现两次的互相抵消成 0, 只剩落单的</text>
<text x="40" y="70" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Single Number: nums = [4, 1, 2, 1, 2]</text>
<rect x="90" y="90" width="44" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="87" y="87" width="50" height="40" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="112.0" y="107.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="142" y="90" width="44" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="164.0" y="107.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="194" y="90" width="44" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="216.0" y="107.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="246" y="90" width="44" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="268.0" y="107.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="298" y="90" width="44" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="320.0" y="107.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<path d="M164.0 124 Q216.0 140 268.0 124" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M216.0 124 Q268.0 180 320.0 124" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="360" y="100" font-size="12" fill="#712B13" text-anchor="start" font-weight="500" dominant-baseline="central">1 ^ 1 = 0</text>
<text x="360" y="118" font-size="12" fill="#712B13" text-anchor="start" font-weight="500" dominant-baseline="central">2 ^ 2 = 0</text>
<text x="360" y="140" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">4 落单 → 答案</text>
<text x="40" y="170" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">4 ^ 1 ^ 2 ^ 1 ^ 2  =  4 ^ (1 ^ 1) ^ (2 ^ 2)  =  4 ^ 0 ^ 0  =  4</text>
<line x1="40" y1="196" x2="640" y2="196" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="216" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Missing Number: nums = [3, 0, 1] (应该是 0..3, 缺一个) · res = n ^ (0^3) ^ (1^0) ^ (2^1)</text>
<text x="222" y="242" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">数值 0</text>
<text x="278" y="242" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">数值 1</text>
<text x="334" y="242" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">数值 2</text>
<text x="390" y="242" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">数值 3</text>
<text x="40" y="271" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">n = len(nums) = 3</text>
<rect x="368" y="256" width="44" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="390.0" y="271.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="40" y="309" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">下标 i = 0..n-1</text>
<rect x="200" y="294" width="44" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="222.0" y="309.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="256" y="294" width="44" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="278.0" y="309.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="312" y="294" width="44" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="309" y="291" width="50" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="334.0" y="309.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<text x="40" y="347" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">nums 里的值 x</text>
<rect x="368" y="332" width="44" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="390.0" y="347.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="200" y="332" width="44" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="222.0" y="347.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="256" y="332" width="44" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="278.0" y="347.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="438" y="294" font-size="12" fill="#712B13" text-anchor="start" font-weight="500" dominant-baseline="central">0, 1, 3 各出现两次 → 抵消</text>
<text x="438" y="312" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">2 只出现一次 → 剩下 = 缺的数</text>
<text x="40" y="384" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">同样思路的另一种写法: n*(n+1)//2 - sum(nums) · 差别: XOR 不会溢出 (别的语言), 且「落单」的思路可迁移</text>
<rect x="40" y="407" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="60" y="414" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">成对 → 抵消成 0</text>
<rect x="180.4" y="407" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="200.4" y="414" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">落单 = 答案</text>
</svg>
