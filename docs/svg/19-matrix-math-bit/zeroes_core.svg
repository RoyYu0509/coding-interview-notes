<svg width="100%" viewBox="0 0 680 386" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Set Matrix Zeroes 核心</title><desc>第一行当列 flag,第一列当行 flag,三个阶段的顺序</desc><defs><marker id="f6-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f6-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f6-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f6-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="386" fill="#fff"/>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">要记「哪些行 / 列要清零」: 开 rows[m] + cols[n] 要 O(m + n) 空间</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">借用矩阵自己的第一行 / 第一列当 flag → O(1)</text>
<rect x="50" y="100" width="52" height="38" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<rect x="47" y="97" width="58" height="44" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="76.0" y="119.0" font-size="14" fill="#52514E" text-anchor="middle" font-weight="500" dominant-baseline="central">★</text>
<rect x="102" y="100" width="52" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="128.0" y="119.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">col 1</text>
<rect x="154" y="100" width="52" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="180.0" y="119.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">col 2</text>
<rect x="206" y="100" width="52" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="232.0" y="119.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">col 3</text>
<rect x="50" y="138" width="52" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="76.0" y="157.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">row 1</text>
<rect x="102" y="138" width="52" height="38" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="128.0" y="157.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">内部</text>
<rect x="154" y="138" width="52" height="38" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="180.0" y="157.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">内部</text>
<rect x="206" y="138" width="52" height="38" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="232.0" y="157.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">内部</text>
<rect x="50" y="176" width="52" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="76.0" y="195.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">row 2</text>
<rect x="102" y="176" width="52" height="38" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="128.0" y="195.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">内部</text>
<rect x="154" y="176" width="52" height="38" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="180.0" y="195.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">内部</text>
<rect x="206" y="176" width="52" height="38" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="232.0" y="195.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">内部</text>
<text x="50" y="82" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">matrix[0][j] = 第 j 列要不要清零</text>
<text x="50" y="230" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">matrix[i][0] = 第 i 行要不要清零 (最左一列)</text>
<text x="300" y="98" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">① 先记 row0 / col0</text>
<text x="300" y="118" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">第一行 / 第一列自己原本有没有 0, 因为马上会被当 flag 覆盖</text>
<text x="300" y="148" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">② pass 1: 扫内部 (i ≥ 1, j ≥ 1)</text>
<text x="300" y="168" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">遇到 0 → matrix[i][0] = 0 和 matrix[0][j] = 0 (留言)</text>
<text x="300" y="198" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">③ pass 2: 内部按留言清零</text>
<text x="300" y="218" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">matrix[i][0] == 0 或 matrix[0][j] == 0 → 这格清零</text>
<text x="300" y="248" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">④ 最后才处理第一行 / 第一列</text>
<text x="300" y="268" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">row0 为真 → 整个第一行清零; col0 为真 → 整个第一列清零</text>
<line x1="40" y1="298" x2="640" y2="298" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="318" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">顺序不能错: 留言区 (第一行 / 第一列) 在 pass 2 里还要被读, 所以必须最后才清零;</text>
<text x="40" y="336" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">★ matrix[0][0] 在 pass 1 里不会被写 (循环从 1 开始); 第一行 / 第一列「原本有没有 0」由 row0 / col0 单独记</text>
<rect x="40" y="357" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="60" y="364" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">flag 区 (留言)</text>
<rect x="170.8" y="357" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="190.8" y="364" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">内部</text>
<rect x="236.8" y="357" width="14" height="14" rx="3" fill="#fff" stroke="#EF9F27" stroke-width="2.5"/>
<text x="256.8" y="364" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">matrix[0][0]</text>
</svg>
