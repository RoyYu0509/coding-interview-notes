<text x="198.5" y="236.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">12</text>
<text x="40" y="264" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">a = 8, b = 9</text>
<text x="240" y="236" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">9 - 8 = 1</text>
<text x="340" y="228" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">1 &lt; best = 3</text>
<text x="340" y="248" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">→ 重置  best = 1, res = [[8, 9]]</text>
