<text x="140.5" y="236.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">9</text>
<rect x="156" y="222" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="169.5" y="236.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
