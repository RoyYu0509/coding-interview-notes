<text x="40" y="198" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">a = 5, b = 8</text>
<text x="240" y="170" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">8 - 5 = 3</text>
<text x="340" y="162" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">3 &lt; best = 4</text>
<text x="340" y="182" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">→ 重置  best = 3, res = [[5, 8]]</text>
