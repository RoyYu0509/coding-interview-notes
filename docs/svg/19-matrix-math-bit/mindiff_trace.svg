<svg width="100%" viewBox="0 0 680 496" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Minimum Absolute Difference 运行流程</title><desc>arr=[8,1,12,5,10,9] 排序后扫 5 对相邻,best 和 res 的变化</desc><defs><marker id="f17-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f17-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f17-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f17-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="496" fill="#fff"/>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">arr = [8, 1, 12, 5, 10, 9]  →  arr.sort()  →  [1, 5, 8, 9, 10, 12]</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">每一行 = 看一对相邻 (a, b) · diff = b - a · 绿色 = 当前这一对</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">当前这一对 (a, b)</text>
<text x="240" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">diff = b - a</text>
<text x="340" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">和 best 比较</text>
