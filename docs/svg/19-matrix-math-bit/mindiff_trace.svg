<text x="40" y="422" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">返回 res = [[8, 9], [9, 10]] · 最小差 = 1</text>
<text x="40" y="446" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">只比较 5 对 (n - 1), 暴力要 15 对 · 总 time 由 sort 决定: O(n log n)</text>
