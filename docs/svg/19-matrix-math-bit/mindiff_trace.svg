<text x="40" y="330" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">a = 9, b = 10</text>
<text x="240" y="302" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">10 - 9 = 1</text>
<text x="340" y="294" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">1 == best = 1</text>
<text x="340" y="314" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">→ 追加  res = [[8, 9], [9, 10]]</text>
