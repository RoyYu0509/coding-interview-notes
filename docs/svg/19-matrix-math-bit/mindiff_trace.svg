<text x="111.5" y="104.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">8</text>
<rect x="127" y="90" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="140.5" y="104.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">9</text>
<rect x="156" y="90" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="169.5" y="104.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
<rect x="185" y="90" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="198.5" y="104.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">12</text>
<text x="40" y="132" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">a = 1, b = 5</text>
<text x="240" y="104" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">5 - 1 = 4</text>
<text x="340" y="96" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">4 &lt; best = inf</text>
<text x="340" y="116" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">→ 重置  best = 4, res = [[1, 5]]</text>
