<svg width="100%" viewBox="0 0 680 512" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Roman to Integer 运行流程</title><desc>MCMXCIV 逐字符,和右邻比较决定加减,total 的变化</desc><defs><marker id="f19-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f19-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f19-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f19-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="512" fill="#fff"/>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">s = "MCMXCIV" · 每一行 = 一个字符 · 和右邻比: val[ch] &lt; val[右邻] ? 减 : 加</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total 从 0 开始, 每一步把「当前字符的值 (加或减)」写成具体算式</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">字符 s[i]</text>
<text x="130" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">和右邻比较</text>
<text x="360" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">符号</text>
<text x="440" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="90" width="40" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="37" y="87" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="60.0" y="106.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">M</text>
<text x="88" y="106" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">i=0</text>
<text x="130" y="98" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">M=1000  vs  右邻 C=100</text>
<text x="130" y="116" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">1000 &gt;= 100 → 加</text>
<rect x="360" y="92" width="62" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="391.0" y="106.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">+1000</text>
<text x="440" y="98" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 0 + 1000</text>
<text x="440" y="116" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 1000</text>
<line x1="40" y1="130" x2="640" y2="130" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="142" width="40" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<rect x="37" y="139" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="60.0" y="158.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">C</text>
<text x="88" y="158" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">i=1</text>
<text x="130" y="150" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">C=100  vs  右邻 M=1000</text>
<text x="130" y="168" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">100 &lt; 1000 左小右大 → 减</text>
<rect x="360" y="144" width="62" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="391.0" y="158.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">-100</text>
<text x="440" y="150" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 1000 - 100</text>
<text x="440" y="168" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 900</text>
<line x1="40" y1="182" x2="640" y2="182" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="194" width="40" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="37" y="191" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="60.0" y="210.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">M</text>
<text x="88" y="210" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">i=2</text>
<text x="130" y="202" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">M=1000  vs  右邻 X=10</text>
<text x="130" y="220" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">1000 &gt;= 10 → 加</text>
<rect x="360" y="196" width="62" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="391.0" y="210.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">+1000</text>
<text x="440" y="202" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 900 + 1000</text>
<text x="440" y="220" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 1900</text>
<line x1="40" y1="234" x2="640" y2="234" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="246" width="40" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<rect x="37" y="243" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="60.0" y="262.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">X</text>
<text x="88" y="262" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">i=3</text>
<text x="130" y="254" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">X=10  vs  右邻 C=100</text>
<text x="130" y="272" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">10 &lt; 100 左小右大 → 减</text>
<rect x="360" y="248" width="62" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="391.0" y="262.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">-10</text>
<text x="440" y="254" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 1900 - 10</text>
<text x="440" y="272" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 1890</text>
<line x1="40" y1="286" x2="640" y2="286" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="298" width="40" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="37" y="295" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="60.0" y="314.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">C</text>
<text x="88" y="314" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">i=4</text>
<text x="130" y="306" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">C=100  vs  右邻 I=1</text>
<text x="130" y="324" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">100 &gt;= 1 → 加</text>
<rect x="360" y="300" width="62" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="391.0" y="314.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">+100</text>
<text x="440" y="306" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 1890 + 100</text>
<text x="440" y="324" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 1990</text>
<line x1="40" y1="338" x2="640" y2="338" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="350" width="40" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<rect x="37" y="347" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="60.0" y="366.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">I</text>
<text x="88" y="366" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">i=5</text>
<text x="130" y="358" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">I=1  vs  右邻 V=5</text>
<text x="130" y="376" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">1 &lt; 5 左小右大 → 减</text>
<rect x="360" y="352" width="62" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="391.0" y="366.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">-1</text>
<text x="440" y="358" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 1990 - 1</text>
<text x="440" y="376" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 1989</text>
<line x1="40" y1="390" x2="640" y2="390" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="402" width="40" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<rect x="37" y="399" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="60.0" y="418.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">V</text>
<text x="88" y="418" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">i=6</text>
<text x="130" y="410" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">没有右邻 (最后一个)</text>
<text x="130" y="428" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">→ 加</text>
<rect x="360" y="404" width="62" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="391.0" y="418.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">+5</text>
<text x="440" y="410" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 1989 + 5</text>
<text x="440" y="428" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 1994</text>
<line x1="40" y1="442" x2="640" y2="442" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="460" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">返回 1994 = 1000 + 900 + 90 + 4  (CM = -100 + 1000, XC = -10 + 100, IV = -1 + 5)</text>
<rect x="40" y="483" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text x="60" y="490" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">加</text>
<rect x="94" y="483" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.0"/>
<text x="114" y="490" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">减</text>
<rect x="148" y="483" width="14" height="14" rx="3" fill="#fff" stroke="#EF9F27" stroke-width="2.5"/>
<text x="168" y="490" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">当前字符</text>
</svg>
