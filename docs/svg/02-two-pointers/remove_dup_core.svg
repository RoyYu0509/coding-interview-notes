<text x="91.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">[0, w)</text>
<line x1="144" y1="172" x2="246" y2="172" stroke="#712B13" stroke-width="2"/>
<line x1="144" y1="167" x2="144" y2="172" stroke="#712B13" stroke-width="2"/>
<line x1="246" y1="167" x2="246" y2="172" stroke="#712B13" stroke-width="2"/>
<text x="195.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">[w, r)</text>
<line x1="248" y1="172" x2="402" y2="172" stroke="#52514E" stroke-width="2"/>
<line x1="248" y1="167" x2="248" y2="172" stroke="#52514E" stroke-width="2"/>
<line x1="402" y1="167" x2="402" y2="172" stroke="#52514E" stroke-width="2"/>
<text x="325.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">[r, n)</text>
<text x="40" y="212" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">nums[r] = 2 != nums[w-1] = 1  -&gt;  新值: nums[w] = 2, w += 1</text>
<text x="40" y="234" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">nums[r] == nums[w-1]  -&gt;  重复, 什么都不做。</text>
<text x="40" y="256" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">Remove Duplicates II (每个值最多 2 个): 只改比较的位置, 改成和 nums[w-2] 比。</text>
<rect x="40" y="281" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="288" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">[0, w) 去重后的结果</text>
<rect x="249" y="281" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="271" y="288" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">[w, r) 残留 (没用)</text>
<rect x="471" y="281" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="493" y="288" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">[r, n) 没读</text>
<rect x="628" y="281" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="625" y="278" width="20" height="20" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="650" y="288" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">r</text>
</svg>
