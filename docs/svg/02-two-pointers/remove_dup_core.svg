<svg width="100%" viewBox="0 0 680 312" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Remove Duplicates 核心</title><desc>去重区</desc><defs><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">sorted -&gt; 重复的值一定挨在一起, 所以只要和"最后一个保留的" nums[w-1] 比</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">某一刻 (示意): w = 2, r = 4  -&gt;  nums[:2] = [0, 1] 是 "已读部分去重后的结果"</text>
<path d="M273.0 88 C 273.0 52, 117.0 52, 117.0 88" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arG)"/>
<text x="195.0" y="52" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">nums[r] 和 nums[w-1] 比</text>
<text x="66.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
