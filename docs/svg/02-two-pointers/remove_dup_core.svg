<text x="117.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">1</text>
<text x="170.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="144" y="106" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="169.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">1</text>
<text x="222.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="196" y="106" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="221.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">1</text>
<text x="274.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="248" y="106" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="273.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">2</text>
<rect x="245" y="103" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="326.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="300" y="106" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="325.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">2</text>
<text x="378.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">6</text>
<rect x="352" y="106" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="377.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">3</text>
<path d="M169.0 139 L164.0 147 L174.0 147 Z" fill="#0B0B0B"/>
<text x="169.0" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">w</text>
<path d="M273.0 139 L268.0 147 L278.0 147 Z" fill="#0B0B0B"/>
<text x="273.0" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">r</text>
<line x1="40" y1="172" x2="142" y2="172" stroke="#085041" stroke-width="2"/>
<line x1="40" y1="167" x2="40" y2="172" stroke="#085041" stroke-width="2"/>
