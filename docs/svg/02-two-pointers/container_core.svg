<svg width="100%" viewBox="0 0 680 392" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Container 核心</title><desc>为什么丢较矮的墙</desc><defs><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">height = [1, 8, 6, 2, 5, 4, 8, 3, 7] · 当前 l = 1 (高 8), r = 8 (高 7) · 面积 = min(8, 7) x (8 - 1) = 49</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">矮的是 r (高 7)。问: 保留 r, 把 l 换成更靠里的墙 i, 能比 49 大吗?</text>
<rect x="118" y="89" width="236" height="105" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="50" y="179" width="30" height="15" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="65.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">1</text>
<text x="65.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
<rect x="88" y="74" width="30" height="120" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="103.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">8</text>
<text x="103.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">1</text>
<rect x="126" y="104" width="30" height="90" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="141.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">6</text>
<text x="141.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="164" y="164" width="30" height="30" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="179.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">2</text>
<text x="179.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="202" y="119" width="30" height="75" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="217.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">5</text>
<text x="217.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="240" y="134" width="30" height="60" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="255.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">4</text>
<text x="255.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="278" y="74" width="30" height="120" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="293.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">8</text>
<text x="293.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">6</text>
<rect x="316" y="149" width="30" height="45" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="331.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">3</text>
<text x="331.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">7</text>
<rect x="354" y="89" width="30" height="105" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="369.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">7</text>
<text x="369.0" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">8</text>
<text x="236.0" y="111.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">面积 = 7 x 7 = 49</text>
<line x1="44" y1="89" x2="392" y2="89" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="40" y="60" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">换掉 l 之后, 高度最多 = height[r] = 7 (红色虚线, 再高也被 r 挡住)</text>
<rect x="85" y="71" width="36" height="126" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="351" y="86" width="36" height="111" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M103.0 228 L98.0 236 L108.0 236 Z" fill="#0B0B0B"/>
<path d="M369.0 228 L364.0 236 L374.0 236 Z" fill="#0B0B0B"/>
<text x="103.0" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">l</text>
<text x="369.0" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">r</text>
<text x="40" y="270" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">新的 l' &gt; l  -&gt;  宽度 = r - l' &lt;= 6 &lt; 7</text>
<text x="40" y="292" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">高度 &lt;= 7  -&gt;  面积 &lt;= 7 x 6 = 42 &lt; 49</text>
<text x="40" y="320" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">所以 "保留矮墙 r, 换 l" 的所有候选都不可能超过当前面积, r 可以放心丢掉。</text>
<text x="40" y="342" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">(矮的是 l 时对称: 丢 l。一样高时丢哪个都行。)</text>
<rect x="40" y="363" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="370" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">当前容器</text>
<rect x="132" y="363" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="154" y="370" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">墙</text>
<rect x="185" y="363" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="182" y="360" width="20" height="20" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="207" y="370" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">当前 l, r</text>
</svg>
