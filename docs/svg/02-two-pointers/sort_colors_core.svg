<text x="169.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">1</text>
<text x="222.0" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
