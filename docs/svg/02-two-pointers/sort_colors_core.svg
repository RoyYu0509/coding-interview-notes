<text x="326.0" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="300" y="64" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="325.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">0</text>
<text x="378.0" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">6</text>
<rect x="352" y="64" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="377.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">1</text>
<text x="430.0" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">7</text>
<rect x="404" y="64" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="429.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">2</text>
<text x="482.0" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">8</text>
<rect x="456" y="64" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="481.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">2</text>
<path d="M169.0 97 L164.0 105 L174.0 105 Z" fill="#0B0B0B"/>
<text x="169.0" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">lo</text>
<path d="M273.0 97 L268.0 105 L278.0 105 Z" fill="#0B0B0B"/>
<text x="273.0" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">i</text>
<path d="M377.0 97 L372.0 105 L382.0 105 Z" fill="#0B0B0B"/>
<text x="377.0" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">hi</text>
<line x1="40" y1="130" x2="142" y2="130" stroke="#085041" stroke-width="2"/>
<line x1="40" y1="125" x2="40" y2="130" stroke="#085041" stroke-width="2"/>
<line x1="142" y1="125" x2="142" y2="130" stroke="#085041" stroke-width="2"/>
<text x="91.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">[0, lo): 全是 0</text>
<line x1="144" y1="130" x2="246" y2="130" stroke="#52514E" stroke-width="2"/>
<line x1="144" y1="125" x2="144" y2="130" stroke="#52514E" stroke-width="2"/>
<line x1="246" y1="125" x2="246" y2="130" stroke="#52514E" stroke-width="2"/>
<text x="195.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">[lo, i): 全是 1</text>
<line x1="248" y1="130" x2="402" y2="130" stroke="#52514E" stroke-width="2"/>
<line x1="248" y1="125" x2="248" y2="130" stroke="#52514E" stroke-width="2"/>
<line x1="402" y1="125" x2="402" y2="130" stroke="#52514E" stroke-width="2"/>
<text x="325.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">[i, hi]: 未知</text>
<line x1="404" y1="130" x2="506" y2="130" stroke="#712B13" stroke-width="2"/>
<line x1="404" y1="125" x2="404" y2="130" stroke="#712B13" stroke-width="2"/>
<line x1="506" y1="125" x2="506" y2="130" stroke="#712B13" stroke-width="2"/>
<text x="455.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">(hi, n): 全是 2</text>
<text x="40" y="174" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">看 nums[i], 三种情况都要保持上面四个区不被破坏:</text>
<text x="40" y="200" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">== 0: 和 nums[lo] 交换。换过来的是 [lo, i) 里的 1 (或 lo == i), 所以 lo += 1, i += 1</text>
<text x="40" y="220" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">== 2: 和 nums[hi] 交换。换过来的是未知区的数, 还没看过, 所以只 hi -= 1, i 不动</text>
<text x="40" y="240" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">== 1: 它本来就该在 1 区的末尾, i += 1</text>
<text x="40" y="270" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">每一步 i 前进或 hi 后退, 未知区缩小 1 格 -&gt; n 步, 一遍扫描</text>
<rect x="40" y="293" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="300" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">0 区</text>
<rect x="119" y="293" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="141" y="300" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">1 区</text>
<rect x="198" y="293" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="220" y="300" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">未知区</text>
<rect x="277" y="293" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="299" y="300" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">2 区</text>
<rect x="356" y="293" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="353" y="290" width="20" height="20" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="378" y="300" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">i</text>
</svg>
