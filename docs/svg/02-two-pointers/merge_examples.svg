<svg width="100%" viewBox="0 0 680 342" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Merge Sorted Array examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums1 前 m 个是有效的数, 后面 n 格是空位; nums2 有 n 个数。两个都已排序, 合并进 nums1, 结果也要有序</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">Example:  nums1 = [1,2,3,_,_,_], m = 3, nums2 = [2,5,6], n = 3</text>
<text x="40" y="103" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums1</text>
<rect x="104" y="88" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="121.0" y="104.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="121.0" y="130" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">0</text>
<rect x="138" y="88" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="155.0" y="104.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<text x="155.0" y="130" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">1</text>
<rect x="172" y="88" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="189.0" y="104.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="189.0" y="130" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2</text>
<rect x="206" y="88" width="34" height="30" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="223.0" y="104.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">_</text>
<text x="223.0" y="130" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">3</text>
<rect x="240" y="88" width="34" height="30" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="257.0" y="104.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">_</text>
<text x="257.0" y="130" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">4</text>
<rect x="274" y="88" width="34" height="30" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="291.0" y="104.0" font-size="15" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">_</text>
<text x="291.0" y="130" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">5</text>
<text x="40" y="165" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums2</text>
<rect x="104" y="150" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="121.0" y="166.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<text x="121.0" y="192" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">0</text>
<rect x="138" y="150" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="155.0" y="166.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<text x="155.0" y="192" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">1</text>
<rect x="172" y="150" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="189.0" y="166.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="189.0" y="192" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2</text>
<text x="40" y="227" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">结果</text>
<rect x="104" y="212" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="121.0" y="228.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="121.0" y="254" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">0</text>
<rect x="138" y="212" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="155.0" y="228.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<text x="155.0" y="254" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">1</text>
<rect x="172" y="212" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="189.0" y="228.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<text x="189.0" y="254" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2</text>
<rect x="206" y="212" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="223.0" y="228.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="223.0" y="254" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">3</text>
<rect x="240" y="212" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="257.0" y="228.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<text x="257.0" y="254" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">4</text>
<rect x="274" y="212" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="291.0" y="228.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="291.0" y="254" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">5</text>
<text x="40" y="274" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">结果直接写在 nums1 里, 不能另开数组返回</text>
<line x1="40" y1="298" x2="640" y2="298" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<rect x="33" y="313" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="54" y="320" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">来自 nums1</text>
<rect x="136.6" y="313" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="157.6" y="320" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">来自 nums2</text>
<rect x="240.2" y="313" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="3 2"/>
<text x="261.2" y="320" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">空位</text></svg>
