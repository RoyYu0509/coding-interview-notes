<text x="325.0" y="192" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">6</text>
<rect x="342" y="150" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="359.0" y="166.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">_</text>
<text x="359.0" y="192" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">7</text>
<text x="40" y="212" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">前 4 格是 [0, 1, 2, 3], 返回 4。后面的 _ 是什么都可以</text>
<line x1="40" y1="236" x2="640" y2="236" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<rect x="33" y="251" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="54" y="258" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">留下</text>
<rect x="97" y="251" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="3 2"/>
<text x="118" y="258" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">重复的</text>
<rect x="173" y="251" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="194" y="258" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">不关心</text></svg>
