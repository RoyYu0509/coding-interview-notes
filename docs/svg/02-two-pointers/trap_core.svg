<text x="40" y="364" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">O(n) 空间: 先扫两遍把 lmax[], rmax[] 存下来。双指针把这两个数组换成两个变量:</text>
