<svg width="100%" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Merge 核心</title><desc>为什么要从后往前写</desc><defs><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">nums1 = [4, 5, 6, _, _, _] (m = 3, 后 3 格是空位) · nums2 = [1, 2, 3] · 从哪头开始写?</text>
<text x="40" y="50" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">从前往后: 第一个最小值 1 要写到 k = 0</text>
<text x="66.0" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
<rect x="40" y="74" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="65.0" y="89.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">4</text>
<rect x="37" y="71" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="118.0" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">1</text>
<rect x="92" y="74" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="117.0" y="89.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">5</text>
<text x="170.0" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="144" y="74" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="169.0" y="89.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">6</text>
<text x="222.0" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="196" y="74" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="221.0" y="89.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">_</text>
<text x="274.0" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="248" y="74" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="273.0" y="89.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">_</text>
<text x="326.0" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="300" y="74" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="325.0" y="89.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">_</text>
<path d="M65.0 107 L60.0 115 L70.0 115 Z" fill="#0B0B0B"/>
<text x="65.0" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">k</text>
<text x="40" y="138" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">nums1[0] = 4 还没读就被盖掉了 -&gt; 只能先把 4, 5, 6 往后挪, 又变成 O(m·n)</text>
<line x1="40" y1="164" x2="640" y2="164" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="190" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">从后往前: 最大值要写到 k = 5, 那里是空位</text>
<text x="66.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
<rect x="40" y="214" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="65.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">4</text>
<text x="118.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">1</text>
<rect x="92" y="214" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="117.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">5</text>
<text x="170.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="144" y="214" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="169.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">6</text>
<rect x="141" y="211" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="222.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="196" y="214" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="221.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">_</text>
<text x="274.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="248" y="214" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="273.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">_</text>
<text x="326.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="300" y="214" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="325.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">_</text>
<path d="M169.0 247 L164.0 255 L174.0 255 Z" fill="#0B0B0B"/>
<text x="169.0" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">i</text>
<path d="M325.0 247 L320.0 255 L330.0 255 Z" fill="#0B0B0B"/>
<text x="325.0" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">k</text>
<text x="40" y="278" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">k = i + (j + 1) &gt;= i: 写入位置永远在 i 的右边或等于 i,</text>
<text x="40" y="300" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">写进去的格子要么是空位, 要么是 nums1 已经读过 (搬走) 的格子, 不会盖掉没读的数。</text>
<rect x="40" y="325" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="62" y="332" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">还没读的 nums1</text>
<rect x="210" y="325" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="232" y="332" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">被误盖掉的</text>
<rect x="315" y="325" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="337" y="332" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">空位</text>
<rect x="381" y="325" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="403" y="332" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">写入</text>
</svg>
