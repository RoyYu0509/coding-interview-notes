<svg width="100%" viewBox="0 0 680 398" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Valid Palindrome 核心</title><desc>向中间配对, II 只有两个分支</desc><defs><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">s = "A,bxB;a" · 回文 = 从两端向中间一对一对配, 每对必须相等 · l, r 向中间走</text>
<text x="40" y="48" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">Valid Palindrome: 只比字母/数字, 非字母数字先跳过</text>
<text x="66.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
<rect x="40" y="76" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="65.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">A</text>
<text x="118.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">1</text>
<rect x="92" y="76" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="117.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">,</text>
<text x="170.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="144" y="76" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="169.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">b</text>
<rect x="141" y="73" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="222.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="196" y="76" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="221.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">x</text>
<text x="274.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="248" y="76" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="273.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">B</text>
<rect x="245" y="73" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="326.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="300" y="76" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="325.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">;</text>
<text x="378.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">6</text>
<rect x="352" y="76" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="377.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">a</text>
<path d="M169.0 109 L164.0 117 L174.0 117 Z" fill="#0B0B0B"/>
<text x="169.0" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">l</text>
<path d="M273.0 109 L268.0 117 L278.0 117 Z" fill="#0B0B0B"/>
<text x="273.0" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">r</text>
<text x="40" y="150" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">invariant: s[0..l) 和 s(r..n) 去掉标点后已经一一配对相等, 现在配 s[l] 和 s[r]</text>
<line x1="40" y1="172" x2="640" y2="172" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="198" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">Valid Palindrome II (最多删 1 个): 第一次失配时, 只有 2 种删法</text>
<text x="66.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
<rect x="40" y="226" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="65.0" y="241.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">c</text>
<text x="118.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">1</text>
<rect x="92" y="226" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="117.0" y="241.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">b</text>
<rect x="89" y="223" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="170.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="144" y="226" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="169.0" y="241.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">b</text>
<text x="222.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="196" y="226" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="221.0" y="241.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">c</text>
<rect x="193" y="223" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="274.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="248" y="226" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="273.0" y="241.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">c</text>
<path d="M117.0 259 L112.0 267 L122.0 267 Z" fill="#0B0B0B"/>
<text x="117.0" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">l</text>
<path d="M221.0 259 L216.0 267 L226.0 267 Z" fill="#0B0B0B"/>
<text x="221.0" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">r</text>
<text x="40" y="298" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">s[1] = b != s[3] = c: 要让它们配上, 必须删掉 s[1] 或 s[3] (删别的位置, 这对还是 b, c)</text>
<text x="40" y="318" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">删 s[l]: 检查 s[l+1..r];  删 s[r]: 检查 s[l..r-1]。每个检查是一次 O(n) 的普通回文判断</text>
<text x="40" y="342" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">只有 2 个分支, 不会指数爆炸: 总共 O(n) + 2 次 O(n) 检查 = O(n)</text>
<rect x="40" y="367" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="374" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">已配对</text>
<rect x="119" y="367" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="141" y="374" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">跳过</text>
<rect x="185" y="367" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="207" y="374" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">待配</text>
<rect x="251" y="367" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="248" y="364" width="20" height="20" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="273" y="374" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">当前 l, r</text>
</svg>
