<svg width="100%" viewBox="0 0 680 436" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>3Sum 去重</title><desc>两处去重规则</desc><defs><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">nums = [-2, -2, 0, 0, 2, 2] (已排序) · 同值的数一定挨在一起 -&gt; 去重 = 跳过 "和前一个相同" 的位置</text>
<text x="40" y="52" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">去重 1: i 只在每组同值的第一个位置当 "第一个数"</text>
<text x="68.0" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
<rect x="40" y="80" width="54" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="67.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">-2</text>
<text x="124.0" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">1</text>
<rect x="96" y="80" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="123.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">-2</text>
<text x="180.0" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="152" y="80" width="54" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="179.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">0</text>
<text x="236.0" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="208" y="80" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="235.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">0</text>
<text x="292.0" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="264" y="80" width="54" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="291.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">2</text>
<text x="348.0" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="320" y="80" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="347.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">2</text>
<text x="67.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">试</text>
<text x="123.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">continue</text>
<text x="179.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">试</text>
<text x="235.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">continue</text>
<text x="291.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">试</text>
<text x="347.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">continue</text>
<text x="40" y="176" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">nums[i] == nums[i-1] 说明这个值已经当过 "第一个数", 它能凑出的三元组上一次全找过了</text>
<text x="40" y="214" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">去重 2: 找到答案后, l 和 r 各自跳过同值</text>
<text x="40" y="240" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">例: i = 0 (值 -2), l = 2, r = 5 时找到 -2 + 0 + 2 = 0:</text>
<text x="68.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">0</text>
<rect x="40" y="266" width="54" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="67.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">-2</text>
<text x="124.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">1</text>
<rect x="96" y="266" width="54" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="123.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">-2</text>
<text x="180.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">2</text>
<rect x="152" y="266" width="54" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="179.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">0</text>
<rect x="149" y="263" width="60" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="236.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">3</text>
<rect x="208" y="266" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="235.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">0</text>
<text x="292.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">4</text>
<rect x="264" y="266" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="291.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">2</text>
<text x="348.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#898781">5</text>
<rect x="320" y="266" width="54" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="347.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">2</text>
<rect x="317" y="263" width="60" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M67.0 299 L62.0 307 L72.0 307 Z" fill="#0B0B0B"/>
<text x="67.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">i</text>
<path d="M179.0 299 L174.0 307 L184.0 307 Z" fill="#0B0B0B"/>
<text x="179.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">l</text>
<path d="M347.0 299 L342.0 307 L352.0 307 Z" fill="#0B0B0B"/>
<text x="347.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">r</text>
<text x="40" y="336" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">如果只做 l += 1, r -= 1, 会落到 nums[3] = 0 和 nums[4] = 2 (红色), 又得到一模一样的 [-2, 0, 2]。</text>
<text x="40" y="356" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">所以找到之后要继续跳过和刚用过的值相同的位置:</text>
<text x="40" y="380" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">while nums[l] == nums[l-1]: l += 1</text>
<text x="360" y="380" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">while nums[r] == nums[r+1]: r -= 1</text>
<rect x="40" y="405" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="412" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">这次用到的数 / 每组第一个</text>
<rect x="262" y="405" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="284" y="412" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">同值, 跳过</text>
<rect x="380" y="405" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<rect x="377" y="402" width="20" height="20" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="402" y="412" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">当前 l, r</text>
</svg>
