<text x="396" y="288" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">第 2 步 3+14 = 17 &gt; 16</text>
<text x="396" y="308" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">-&gt; 整列 j=6 都 &gt;= 17, 全排除</text>
<text x="396" y="328" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">第 3 步同理排除整行 i=1</text>
