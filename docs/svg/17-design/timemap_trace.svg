<svg width="100%" viewBox="0 0 680 712" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>TimeMap trace, key = &#x27;k&#x27;</title><desc>每次 set 之后 list 的内容; 每次 get 用 bisect_right 找到的 idx。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">key = 'k' · times[k] 和 vals[k] 同一个 idx · 每个格子: 上 = value, 下 = timestamp</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">set: 两个 list 各 append 一个 (时间递增 -&gt; 仍然有序) · get: bisect_right(times, t) - 1</text>
<text x="40" y="62" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">操作</text>
<text x="200" y="62" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">times[k] / vals[k] (这一步之后)</text>
<text x="430" y="62" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">计算</text>
<line x1="40" y1="72" x2="640" y2="72" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="102" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">set('k','a',1)</text>
<rect x="200" y="88" width="54" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="227.0" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">a</text>
<text x="227.0" y="117.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">t=1</text>
<text x="227" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 0</text>
<text x="430" y="102" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">times.append(1) · vals.append('a')</text>
<text x="430" y="122" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">第一条记录</text>
<line x1="40" y1="152" x2="640" y2="152" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="178" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">set('k','b',4)</text>
<rect x="200" y="164" width="54" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
