<text x="227.0" y="193.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">t=1</text>
<text x="227" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 0</text>
<rect x="260" y="164" width="54" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="287.0" y="176.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">b</text>
<text x="287.0" y="193.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">t=4</text>
<text x="287" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 1</text>
<text x="430" y="178" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">times.append(4) · vals.append('b')</text>
<text x="430" y="198" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">4 比前面都大 -&gt; 仍然有序</text>
