<svg width="100%" viewBox="0 0 680 456" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>Snapshot Array: 只记录变化, 用 bisect 回溯</title><desc>暴力每次 snap 复制整个数组; 只记录 set 的变化, 再用 bisect 找到最近的一次变化。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">例子: length = 3 · set(0,5) · snap() · set(0,6) · set(2,8) · snap() · 每格 = index i 在 snap s 时的值</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">snap() 要 O(1): 不能复制数组 · get(i, s) 要 O(log): 在 i 自己的变化记录里 bisect</text>
<text x="40" y="70" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">暴力: 每次 snap 复制全部</text>
<text x="141" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">snap 0</text>
<text x="211" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">snap 1</text>
<text x="40" y="127" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 0</text>
<rect x="110" y="110" width="62" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="141.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">5</text>
<rect x="180" y="110" width="62" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="211.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">6</text>
<text x="40" y="169" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 1</text>
<rect x="110" y="152" width="62" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="141.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">0</text>
<rect x="180" y="152" width="62" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="211.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">0</text>
<text x="40" y="211" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 2</text>
<rect x="110" y="194" width="62" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="141.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">0</text>
<rect x="180" y="194" width="62" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="211.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">8</text>
<text x="350" y="70" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">只存变化 hist[i]</text>
<text x="451" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">snap 0</text>
<text x="521" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">snap 1</text>
<text x="350" y="127" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 0</text>
<rect x="420" y="110" width="62" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="451.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">5</text>
<rect x="490" y="110" width="62" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="521.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">6</text>
<text x="350" y="169" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 1</text>
<rect x="420" y="152" width="62" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="451.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">0</text>
<rect x="490" y="152" width="62" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="521.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#52514E">同左</text>
<text x="350" y="211" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 2</text>
<rect x="420" y="194" width="62" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="451.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">0</text>
<rect x="490" y="194" width="62" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="521.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">8</text>
<text x="40" y="250" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">存 6 格 (= n x 次数)</text>
<text x="350" y="250" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">存 5 格 (每 index 一个初值 (0,0) + 每次 set 一条)</text>
<text x="40" y="270" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">snap() = O(n) 复制</text>
<text x="350" y="270" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">snap() = O(1) 只 snap_id += 1</text>
<line x1="40" y1="292" x2="640" y2="292" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="312" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">hist[i] = [(snap_id, val), ...] · snap_id 只增 -&gt; 每个 hist[i] 天然有序</text>
<text x="40" y="340" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">hist[0]</text>
<rect x="110" y="330" width="80" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="150.0" y="341.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">(0, 5)</text>
<rect x="200" y="330" width="80" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="240.0" y="341.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">(1, 6)</text>
<text x="40" y="368" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">hist[1]</text>
<rect x="110" y="358" width="80" height="22" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="150.0" y="369.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#444441">(0, 0)</text>
<text x="40" y="396" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">hist[2]</text>
<rect x="110" y="386" width="80" height="22" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="150.0" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#444441">(0, 0)</text>
<rect x="200" y="386" width="80" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="240.0" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">(1, 8)</text>
<text x="310" y="344" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">get(0, 1): bisect_right(hist[0], (1, inf)) - 1 = 2 - 1 = 1 -&gt; val 6</text>
<text x="310" y="372" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">get(2, 0): bisect_right(hist[2], (0, inf)) - 1 = 1 - 1 = 0 -&gt; val 0</text>
<text x="310" y="400" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">(snap_id, inf): 让 snap_id 相同的记录排在它左边</text>
<rect x="40" y="434" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="62" y="440" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">有记录</text>
<rect x="114" y="434" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="136" y="440" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">没记录, 沿用左边</text>
<rect x="249.44" y="434" width="16" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="271.44" y="440" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">初值 / 复制出来的</text>
</svg>
