<text x="290.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">1:10</text>
<rect x="370" y="80" width="80" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">3:30</text>
<rect x="490" y="80" width="50" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="515.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">tail</text>
<rect x="40" y="80" width="50" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="65.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#52514E">head</text>
<rect x="490" y="80" width="50" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="515.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#52514E">tail</text>
<line x1="92" y1="97.0" x2="128" y2="97.0" stroke="#52514E" stroke-width="1.3" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
<line x1="212" y1="97.0" x2="248" y2="97.0" stroke="#52514E" stroke-width="1.3" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
<line x1="332" y1="97.0" x2="368" y2="97.0" stroke="#52514E" stroke-width="1.3" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
<line x1="452" y1="97.0" x2="488" y2="97.0" stroke="#52514E" stroke-width="1.3" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
<rect x="127" y="77" width="86" height="40" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="128" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">dummy</text>
<text x="490" y="128" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">dummy</text>
<text x="40" y="187" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">dict</text>
<rect x="130" y="170" width="80" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="170.0" y="187.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">2</text>
<line x1="170" y1="169" x2="170" y2="116" stroke="#52514E" stroke-width="1.5" marker-end="url(#ar-g)"/>
<rect x="250" y="170" width="80" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="290.0" y="187.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">1</text>
<line x1="290" y1="169" x2="290" y2="116" stroke="#52514E" stroke-width="1.5" marker-end="url(#ar-g)"/>
<rect x="370" y="170" width="80" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410.0" y="187.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">3</text>
<line x1="410" y1="169" x2="410" y2="116" stroke="#52514E" stroke-width="1.5" marker-end="url(#ar-g)"/>
<text x="560" y="187" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">dict 无序, 这里只是</text>
<text x="560" y="205" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">对齐 node 来画</text>
<line x1="40" y1="232" x2="640" y2="232" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="254" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">get(k)</text>
<text x="150" y="254" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">dict[k] 拿到 node (O(1)) -&gt; 从 list 摘下 (O(1)) -&gt; 接到 tail 前 (O(1))</text>
<text x="40" y="276" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">满了</text>
<text x="150" y="276" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">list 的 head.next 就是 LRU (O(1)) -&gt; 摘掉, 再 del dict[node.key] (O(1))</text>
<text x="40" y="298" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">为什么 doubly</text>
<text x="150" y="298" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">摘 node 要改 node.prev.next · singly 找前驱要从头扫 O(n)</text>
<text x="40" y="320" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">为什么存 key</text>
<text x="150" y="320" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">踢 head.next 时手里只有 node, 要靠 node.key 去 del dict[key]</text>
<text x="40" y="342" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">为什么 dummy</text>
<text x="150" y="342" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">head / tail 永远在, 摘和插都不用判断 None 或 first / last</text>
<line x1="40" y1="372" x2="640" y2="372" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="392" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">_remove(node): 2 条赋值就把 node 从 list 里摘走, 不扫描</text>
<rect x="200" y="403" width="60" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="230.0" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">a</text>
<rect x="320" y="403" width="80" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="360.0" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">node</text>
<rect x="460" y="403" width="60" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="490.0" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">b</text>
<line x1="262" y1="420" x2="318" y2="420" stroke="#52514E" stroke-width="1.3" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
<line x1="402" y1="420" x2="458" y2="420" stroke="#52514E" stroke-width="1.3" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
<text x="40" y="420" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">before</text>
<text x="40" y="494" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">after</text>
<rect x="200" y="477" width="60" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="230.0" y="494.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">a</text>
<rect x="460" y="477" width="60" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="490.0" y="494.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">b</text>
<line x1="262" y1="494" x2="458" y2="494" stroke="#52514E" stroke-width="1.3" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
<text x="360" y="466" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">a.next = b   (即 node.prev.next = node.next)</text>
<text x="360" y="528" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">b.prev = a   (即 node.next.prev = node.prev)</text>
<rect x="40" y="556" width="16" height="12" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="62" y="562" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">LRU 端 = 下一个被踢</text>
<rect x="197.04" y="556" width="16" height="12" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="219.04" y="562" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">要摘下的 node</text>
</svg>
