<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>LRU Cache: dict 加 doubly linked list</title><desc>dict 负责按 key 找到 node, doubly linked list 负责顺序; 两者通过 node 指针连在一起。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">get 需要: 按 key 找到 + 移到最新 · put 满了需要: 找到最旧并删掉 · 三件事都要 O(1)</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">dict 擅长第一件, list 擅长后两件 -&gt; 两个结构存同一批 node, dict 的 value 就是 node 指针</text>
<text x="130" y="66" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">LRU 端 (最久没用, 要踢的)</text>
<text x="450" y="66" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">MRU 端 (刚用过)</text>
<rect x="40" y="80" width="50" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="65.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">head</text>
