<svg width="100%" viewBox="0 0 680 698" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>HitCounter trace, window = 300</title><desc>deque 里的时间戳每步的变化; 过期的从左边 popleft, 虚线扔到左边。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">窗口 (now - 300, now] · q 左 = 最旧 · hit: 从右边 append · getHits: 从左边 popleft 过期的</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">过期规则: q[0] &lt;= cutoff, cutoff = now - 300</text>
