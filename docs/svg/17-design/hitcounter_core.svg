<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>Hit Counter: 过期的一定在 deque 最左边</title><desc>时间戳只增不减, 所以 deque 左边最旧; 过期时从左边 popleft, 每个时间戳最多出队一次。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">getHits(now) 只数 (now - 300, now] 内的 hit · 时间戳按到达顺序入队 -&gt; deque 本身有序</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">过期的 = 最旧的 = 一定连续地排在最左边 -&gt; 从左边一个个 popleft 到不过期为止</text>
<text x="40" y="66" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">getHits(301): cutoff = 301 - 300 = 1 · 规则: q[0] &lt;= cutoff 就过期</text>
<text x="40" y="120" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">q (左 = 最旧)</text>
<rect x="150" y="100" width="60" height="40" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="180.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">1</text>
<rect x="220" y="100" width="60" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="250.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">2</text>
<rect x="290" y="100" width="60" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">3</text>
<rect x="360" y="100" width="60" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="390.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">300</text>
<line x1="215" y1="86" x2="215" y2="156" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="221" y="92" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">cutoff = 1</text>
<text x="150" y="168" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">1 &lt;= 1 过期</text>
<text x="220" y="168" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">2 &gt; 1 之后全部有效</text>
<line x1="40" y1="190" x2="640" y2="190" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="214" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">popleft 后</text>
<rect x="40" y="230" width="70" height="40" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="75.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">1</text>
<line x1="146" y1="250" x2="114" y2="250" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar-r)"/>
<rect x="150" y="230" width="60" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="180.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">2</text>
<rect x="220" y="230" width="60" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="250.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">3</text>
<rect x="290" y="230" width="60" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">300</text>
<text x="366" y="250" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">len(q) = 3 = 答案</text>
<line x1="40" y1="292" x2="640" y2="292" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="312" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">为什么是 O(1) amortized: 每个时间戳 append 一次、popleft 最多一次 -&gt; n 次操作总共 O(n)</text>
<text x="40" y="330" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">不用 sorted / heap: 到达顺序 = 时间顺序, 数据本来就有序</text>
<rect x="40" y="358" width="16" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="3 2"/>
<text x="62" y="364" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">过期, 出队</text>
<rect x="139.44" y="358" width="16" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="161.44" y="364" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">窗口内的 hit</text>
</svg>
