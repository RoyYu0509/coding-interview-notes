<rect x="212" y="330" width="54" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="239.0" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">7</text>
<text x="239.0" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 1</text>
<rect x="274" y="330" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="301.0" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">9</text>
<text x="301.0" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 2</text>
<rect x="336" y="330" width="54" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="363.0" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">4</text>
<text x="363.0" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 3</text>
<text x="40" y="347" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">before</text>
<path d="M 363.0 328 L 363.0 308 L 239.0 308 L 239.0 326" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#ar-g)"/>
<text x="301.0" y="297" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">① nums[1] = last = 4</text>
<rect x="150" y="410" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="177.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">5</text>
<rect x="212" y="410" width="54" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="239.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">4</text>
<rect x="274" y="410" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="301.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">9</text>
<rect x="336" y="410" width="54" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="363.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">4</text>
<rect x="336" y="410" width="54" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="363.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">4</text>
<text x="40" y="427" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">after</text>
<text x="406" y="420" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">② nums.pop() 去掉尾巴</text>
<text x="406" y="440" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">③ pos[4] = 1 · del pos[7]</text>
