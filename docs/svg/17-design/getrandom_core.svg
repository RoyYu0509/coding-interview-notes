<svg width="100%" viewBox="0 0 680 486" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>swap-pop: 把要删的换到末尾再 pop</title><desc>list 只有删末尾是 O(1); 所以先把末尾元素搬到要删的位置, 再 pop 尾巴。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">要求: insert / remove / getRandom 全 O(1) · getRandom 要 list 按 index 取 · 找 val 要 dict</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">list 的软肋是删中间。但 set 本来就没有顺序 -&gt; 允许把顺序打乱 -&gt; 删中间变成删末尾</text>
<text x="40" y="70" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">暴力: 删 7 = pop(1)</text>
<text x="40" y="90" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">后面的全部左移一格 -&gt; O(n)</text>
<rect x="150" y="110" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="177.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">5</text>
<text x="177.0" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 0</text>
<rect x="212" y="110" width="54" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="239.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">7</text>
<text x="239.0" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 1</text>
<rect x="274" y="110" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="301.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">9</text>
<text x="301.0" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 2</text>
<rect x="336" y="110" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="363.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">4</text>
<text x="363.0" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">idx 3</text>
<text x="40" y="127" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">before</text>
<rect x="150" y="190" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="177.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">5</text>
<rect x="212" y="190" width="54" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="239.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">9</text>
<rect x="274" y="190" width="54" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="301.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">4</text>
<text x="40" y="207" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">after</text>
<line x1="291.0" y1="146" x2="229.0" y2="188" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar-r)"/>
<line x1="353.0" y1="146" x2="291.0" y2="188" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar-r)"/>
<text x="406" y="170" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">9, 4 各左移一格: 最坏搬 n - 1 个</text>
<line x1="40" y1="246" x2="640" y2="246" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="270" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">swap-pop: 删 7</text>
<text x="40" y="290" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">末尾 4 搬到 idx 1, pop 尾巴 -&gt; O(1)</text>
<rect x="150" y="330" width="54" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="177.0" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">5</text>
