<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>Time Based KV: append 天然有序, 用 bisect 找 &lt;= t</title><desc>每个 key 一条按时间递增的记录; get(t) 返回最后一个 timestamp &lt;= t 的记录。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">set 的 timestamp 严格递增 -&gt; 每个 key 的 list 本来就是有序的 -&gt; 不用 sort, 不用 heap</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">get(key, t) = 在有序 list 里找 '最后一个 &lt;= t' = bisect_right(times, t) - 1</text>
<line x1="50" y1="150" x2="630" y2="150" stroke="#52514E" stroke-width="1.5" marker-end="url(#ar-g)"/>
<text x="40" y="106" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">times</text>
<rect x="99" y="88" width="50" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="124.0" y="98.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">a</text>
<text x="124.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">t=1</text>
<line x1="124" y1="124" x2="124" y2="150" stroke="#52514E" stroke-width="1"/>
<rect x="261" y="88" width="50" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="286.0" y="98.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">b</text>
<text x="286.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">t=4</text>
<line x1="286" y1="124" x2="286" y2="150" stroke="#52514E" stroke-width="1"/>
<rect x="423" y="88" width="50" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="448.0" y="98.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">c</text>
<text x="448.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">t=7</text>
<line x1="448" y1="124" x2="448" y2="150" stroke="#52514E" stroke-width="1"/>
<line x1="70" y1="146" x2="70" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="70" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">0</text>
<line x1="124" y1="146" x2="124" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="124" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">1</text>
<line x1="178" y1="146" x2="178" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="178" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">2</text>
<line x1="232" y1="146" x2="232" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="232" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">3</text>
<line x1="286" y1="146" x2="286" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="286" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">4</text>
<line x1="340" y1="146" x2="340" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">5</text>
<line x1="394" y1="146" x2="394" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="394" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">6</text>
<line x1="448" y1="146" x2="448" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="448" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">7</text>
<line x1="502" y1="146" x2="502" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="502" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">8</text>
<line x1="556" y1="146" x2="556" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="556" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">9</text>
<line x1="610" y1="146" x2="610" y2="154" stroke="#B4B2A9" stroke-width="1"/>
<text x="610" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">10</text>
<text x="640" y="166" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">t</text>
<rect x="70" y="200" width="51" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="95.5" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">''</text>
<rect x="124" y="200" width="159" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="203.5" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">a</text>
<rect x="286" y="200" width="159" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="365.5" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">b</text>
<rect x="448" y="200" width="180.60000000000002" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="538.3" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">c</text>
<text x="40" y="216" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">返回</text>
<text x="40" y="252" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">t 落在哪一段 -&gt; 返回这一段左端点那条记录的 value (t=4 正好踩在 b 的左端点 -&gt; b)</text>
<line x1="40" y1="284" x2="640" y2="284" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="304" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">get(k, t)</text>
<text x="150" y="304" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">bisect_right(times, t)</text>
<text x="350" y="304" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">- 1 = idx</text>
<text x="470" y="304" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0B0B0B">返回</text>
<text x="40" y="330" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">t = 0</text>
<text x="150" y="330" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">bisect_right([1, 4, 7], 0) = 0</text>
<text x="350" y="330" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">0 - 1 = -1</text>
<text x="470" y="330" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">idx = -1 -&gt; ''</text>
<text x="40" y="356" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">t = 3</text>
<text x="150" y="356" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">bisect_right([1, 4, 7], 3) = 1</text>
<text x="350" y="356" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">1 - 1 = 0</text>
<text x="470" y="356" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">vals[0] = a</text>
<text x="40" y="382" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">t = 4</text>
<text x="150" y="382" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">bisect_right([1, 4, 7], 4) = 2</text>
<text x="350" y="382" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">2 - 1 = 1</text>
<text x="470" y="382" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">vals[1] = b</text>
<text x="40" y="408" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">t = 9</text>
<text x="150" y="408" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">bisect_right([1, 4, 7], 9) = 3</text>
<text x="350" y="408" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">3 - 1 = 2</text>
<text x="470" y="408" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">vals[2] = c</text>
<rect x="40" y="450" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="62" y="456" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">该段返回的记录</text>
<rect x="162" y="450" width="16" height="12" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="184" y="456" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">还没有记录</text>
<rect x="260" y="450" width="16" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="282" y="456" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">已 set 的记录</text>
</svg>
