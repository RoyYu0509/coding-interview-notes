<text x="40" y="326" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">组合 (A + B = 两个结构存同一批元素的两个视图, 每次 mutate 两边一起改):</text>
<text x="40" y="344" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">LRU Cache</text>
<text x="170" y="344" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">按 key 查 + 删中间 + 删最旧</text>
<text x="400" y="344" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">= dict + doubly linked list</text>
<text x="40" y="374" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">GetRandom O(1)</text>
<text x="170" y="374" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">按 key 查 + 按 index 取 + 删</text>
<text x="400" y="374" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">= dict + list  (交换到末尾再 pop)</text>
<text x="40" y="404" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">Time Based KV</text>
<text x="170" y="404" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">按 key 查 + 找 &lt;= t</text>
<text x="400" y="404" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">= dict + sorted list  (append 天然有序)</text>
<text x="40" y="434" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#0B0B0B">Hit Counter</text>
<text x="170" y="434" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">按序追加 + 删最旧</text>
<text x="400" y="434" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">= 只要 deque</text>
<rect x="40" y="472" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="62" y="478" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">这个结构能 O(1) / O(log n) 做</text>
<rect x="264.24" y="472" width="16" height="12" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="286.24" y="478" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">只能 O(n)</text>
