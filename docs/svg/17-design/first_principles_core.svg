<svg width="100%" viewBox="0 0 680 496" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif"><title>操作 x 数据结构 能力对照</title><desc>每个单一数据结构只擅长一两个操作; design 题把擅长不同操作的结构组合起来。</desc><defs><marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">design 题: 先列出每个操作要求的 complexity, 再看哪个结构能 O(1) / O(log n) 做它</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">单个结构总有弱项 -&gt; 组合两个, 每个操作交给擅长它的那个, 并让两者同步</text>
<text x="234.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">按 key 查</text>
<text x="322.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">按 index 取</text>
<text x="410.0" y="70.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">删中间</text>
<text x="410.0" y="85.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">(已知位置)</text>
<text x="498.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">删最旧</text>
<text x="586.0" y="70.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">找 &lt;= t</text>
<text x="586.0" y="85.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0B0B0B">最近的</text>
