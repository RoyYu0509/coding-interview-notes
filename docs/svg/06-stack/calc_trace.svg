<text x="68" y="804.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">)</text>
<text x="414" y="785.0" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">括号内并入 num: result = 4 + (-1)×0 = 4</text>
<text x="414" y="804.0" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">pop (prev_result, prev_sign) = (1, -1)</text>
<text x="414" y="823.0" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">result = 1 + (-1)×4 = -3</text>
