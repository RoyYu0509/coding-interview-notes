<text x="414" y="132.0" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">sign = -1</text>
<text x="414" y="151.0" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">stack 不动</text>
