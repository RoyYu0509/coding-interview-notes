<text x="414" y="857.0" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">pop 出 { == pair['}'] = {</text>
<text x="414" y="876.0" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈里还剩 0 个没闭合的</text>
