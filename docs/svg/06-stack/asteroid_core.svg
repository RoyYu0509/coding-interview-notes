<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>asteroid_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">正数向右飞, 负数向左飞 · 只有 '栈顶向右 + 新来的向左' 才会相撞</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">stack 里是 '目前活着、且互相不会再撞' 的 asteroid</text>
<text x="40" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈顶 3, 新来 5</text>
<circle cx="60" cy="112" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="60" y="112" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M48 80 L72 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="130" cy="112" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="130" y="112" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">5</text>
<path d="M118 80 L142 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="40" y="150" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">都向右, 不撞</text>
<text x="200" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈顶 -3, 新来 -5</text>
<circle cx="220" cy="112" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="220" y="112" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">-3</text>
<path d="M232 80 L208 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="290" cy="112" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="290" y="112" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">-5</text>
<path d="M302 80 L278 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="200" y="150" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">都向左, 不撞</text>
<text x="360" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈顶 -3, 新来 5</text>
<circle cx="380" cy="112" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="380" y="112" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">-3</text>
<path d="M392 80 L368 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="450" cy="112" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="450" y="112" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">5</text>
<path d="M438 80 L462 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="360" y="150" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">背离, 不撞</text>
<text x="520" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈顶 3, 新来 -5</text>
<circle cx="540" cy="112" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="540" y="112" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M528 80 L552 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="610" cy="112" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="610" y="112" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">-5</text>
<path d="M622 80 L598 80" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="520" y="150" font-size="14" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">相向 → 撞</text>
<line x1="40" y1="176" x2="640" y2="176" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="200" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">相撞时 (栈顶 t &gt; 0, 新来 x &lt; 0), 比较 t 和 |x|:</text>
<rect x="40" y="220" width="78" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="79.0" y="235.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">t &lt; |x|</text>
<text x="40" y="272" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">栈顶炸掉 → pop</text>
<text x="40" y="292" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">x 继续撞下一个 (while)</text>
<rect x="250" y="220" width="78" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="289.0" y="235.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">t == |x|</text>
<text x="250" y="272" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">同归于尽 → pop</text>
<text x="250" y="292" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">x 也消失, 不 push</text>
<rect x="460" y="220" width="78" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="499.0" y="235.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">t &gt; |x|</text>
<text x="460" y="272" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">x 被炸掉</text>
<text x="460" y="292" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">不 push, stack 不变</text>
<text x="40" y="326" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">while 的条件: alive and x &lt; 0 and stack and stack[-1] &gt; 0</text>
<text x="40" y="350" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">x 之所以能反复和新的栈顶比, 是因为栈顶炸掉后, 露出来的就是 '下一个最近的'</text></svg>
