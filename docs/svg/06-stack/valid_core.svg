<svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>valid_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">invariant: stack 从底到顶 = 还没闭合的开括号, 栈顶是最内层的</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">读到闭括号时, 它只能和栈顶配对 · 四种情况:</text>
<text x="40" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">① 开括号</text>
<rect x="40" y="88" width="40" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="60.0" y="105.0" font-size="16" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">{</text>
<text x="88" y="105" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">读到</text>
<path d="M44 124 L44 220 L144 220 L144 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="52" y="192" width="84" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="94.0" y="205.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">(</text>
<rect x="52" y="162" width="84" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="94.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">[</text>
<rect x="52" y="132" width="84" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="49" y="129" width="90" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="94.0" y="145.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">{</text>
<text x="40" y="246" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">push {</text>
<text x="40" y="266" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">等后面的来找它</text>
<text x="200" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">② 闭括号, 栈顶配对</text>
<rect x="200" y="88" width="40" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="220.0" y="105.0" font-size="16" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">]</text>
<text x="248" y="105" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">读到</text>
<path d="M204 124 L204 220 L304 220 L304 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="212" y="192" width="84" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="209" y="189" width="90" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="254.0" y="205.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">(</text>
<rect x="318" y="162" width="36" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="336.0" y="175.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">[</text>
<path d="M308 175 L316 175" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
<text x="200" y="246" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">pop [ == pair[']']</text>
<text x="200" y="266" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">配对成功, 继续</text>
<text x="360" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">③ 闭括号, 栈顶不配</text>
<rect x="360" y="88" width="40" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="380.0" y="105.0" font-size="16" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">)</text>
<text x="408" y="105" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">读到</text>
<path d="M364 124 L364 220 L464 220 L464 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="372" y="192" width="84" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="414.0" y="205.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">(</text>
<rect x="372" y="162" width="84" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="369" y="159" width="90" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="414.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">[</text>
<text x="360" y="246" font-size="12" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">pop [ ≠ pair[')'] = (</text>
<text x="360" y="266" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">交叉 ([)] → False</text>
<text x="520" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">④ 闭括号, 栈空</text>
<rect x="520" y="88" width="40" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="540.0" y="105.0" font-size="16" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">]</text>
<text x="568" y="105" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">读到</text>
<path d="M524 124 L524 220 L624 220 L624 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<text x="574.0" y="206" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">空</text>
<text x="520" y="246" font-size="12" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">not stack</text>
<text x="520" y="266" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">多余闭括号 → False</text>
<text x="40" y="304" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">走完以后: stack 非空 → 有开括号一直没被闭合 → False · 空 → True</text></svg>
