<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>rpn_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">后缀表达式: 运算符出现时, 它的两个操作数 = 左边最近算好的两个 = 栈顶两个</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">tokens = [2, 1, +, 3, *] · 先看 '+':</text>
<text x="60" y="82" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">读到 '+' 之前</text>
<path d="M60 144 L60 240 L164 240 L164 144" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="68" y="212" width="88" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="112.0" y="225.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="68" y="182" width="88" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="65" y="179" width="94" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="112.0" y="195.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="240" y="146" width="72" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="276.0" y="159.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">b = 1</text>
<rect x="240" y="176" width="72" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="276.0" y="189.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">a = 2</text>
<path d="M172 159 L236 159" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
<path d="M172 189 L236 189" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
<text x="204" y="100" font-size="12" fill="#712B13" font-weight="400" text-anchor="middle" dominant-baseline="central">先 pop 的是 b (右)</text>
<text x="204" y="120" font-size="12" fill="#712B13" font-weight="400" text-anchor="middle" dominant-baseline="central">再 pop 的是 a (左)</text>
<path d="M318 188 L400 188 L400 214" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="330" y="170" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">a + b = 2 + 1 = 3</text>
<path d="M430 144 L430 240 L534 240 L534 144" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="438" y="212" width="88" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="435" y="209" width="94" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="482.0" y="225.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<text x="482" y="258" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">push 回去</text>
<text x="40" y="292" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">为什么是栈: 括号让表达式嵌套, 后缀式把嵌套摊平 —— 最近算好的结果马上被下一个运算符消耗</text>
<text x="40" y="314" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">顺序: b 先 pop, a 后 pop, 算 a - b / a ÷ b (减法除法不能交换)</text>
<text x="40" y="338" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">除法: int(a / b) 向 0 取整, 不能写 a // b (-7 // 2 = -4, 但要 -3)</text></svg>
