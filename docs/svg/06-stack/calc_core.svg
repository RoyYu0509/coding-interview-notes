<svg width="100%" viewBox="0 0 680 364" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>calc_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">s = 1 - (2 + 3) · 括号 = 一个新的子问题: 进括号时 push 外层现场, 出括号时 pop 回来</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">现场 = (result, sign): 外层累加到哪, 以及 '(' 前面的符号</text>
<text x="40" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">① 读完 '1 -', 还没读 '('</text>
<text x="250" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">② 读到 '('</text>
<text x="460" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">③ 括号内算完, 读到 ')'</text>
<path d="M50 154 L50 220 L150 220 L150 154" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<text x="100.0" y="206" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">空</text>
<text x="170" y="120" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">result = 1</text>
<text x="170" y="144" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">sign = -1</text>
<text x="170" y="168" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">(要减的是整个括号)</text>
<path d="M260 154 L260 220 L360 220 L360 154" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="268" y="192" width="84" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="265" y="189" width="90" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="310.0" y="205.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">(1, -1)</text>
<text x="380" y="120" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">result = 0</text>
<text x="380" y="144" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">sign = +1</text>
<text x="380" y="168" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">括号内重新算</text>
<text x="260" y="244" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">括号内: 2 + 3 → result = 5</text>
<path d="M470 154 L470 220 L570 220 L570 154" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<text x="520.0" y="206" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">空</text>
<rect x="586" y="156" width="54" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="613.0" y="169.0" font-size="12" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">(1, -1)</text>
<path d="M574 169 L584 169" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
<text x="470" y="244" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">result = 5 (括号内)</text>
<text x="40" y="290" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">pop (prev_result, prev_sign) = (1, -1)</text>
<text x="40" y="316" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">result = prev_result + prev_sign × result = 1 + (-1) × 5 = -4</text>
<text x="40" y="342" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">整个括号 = 一个数, 带上 '(' 前面的符号 · 嵌套多深, 栈就有多深</text></svg>
