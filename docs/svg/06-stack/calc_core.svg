<svg width="100%" viewBox="0 0 680 345" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>calc_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">s = 1 - (2 + 3) · 括号 = 一个新的子问题: 进括号时 push 外层现场, 出括号时 pop 回来</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">现场 = (result, sign): 外层累加到哪, 以及 '(' 前面的符号</text>
<text x="40" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">① 读完 '1 -', 还没读 '('</text>
<text x="250" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">② 读到 '('</text>
<text x="460" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">③ 括号内算完, 读到 ')'</text>
<text x="40" y="100" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">result = 1 · sign = -1</text>
<path d="M40 139 L40 205 L140 205 L140 139" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<text x="90.0" y="191" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">空</text>
<text x="40" y="229" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">stack 空 · 要减的是整个括号</text>
<text x="250" y="100" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">result = 0 · sign = +1</text>
<path d="M250 139 L250 205 L350 205 L350 139" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="258" y="177" width="84" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="255" y="174" width="90" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="300.0" y="190.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">(1, -1)</text>
<text x="250" y="229" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">push 现场, 括号内重新算</text>
<text x="460" y="100" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">result = 5 (括号内)</text>
<path d="M460 139 L460 205 L560 205 L560 139" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<text x="510.0" y="191" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">空</text>
<rect x="578" y="141" width="60" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="608.0" y="154.0" font-size="12" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">(1, -1)</text>
<path d="M568 154 L576 154" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
<text x="460" y="229" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">pop 回外层现场</text>
<text x="40" y="271" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">pop (prev_result, prev_sign) = (1, -1)</text>
<text x="40" y="297" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">result = prev_result + prev_sign × result = 1 + (-1) × 5 = -4</text>
<text x="40" y="323" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">整个括号 = 一个数, 带上 '(' 前面的符号 · 嵌套多深, 栈就有多深</text></svg>
