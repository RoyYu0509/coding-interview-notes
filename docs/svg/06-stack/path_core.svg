<svg width="100%" viewBox="0 0 680 304" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>path_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">path = /a/./b/../../c/ · split('/') 之后每个 part 只有三种</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">parts = ['', 'a', '.', 'b', '..', '..', 'c', ''] · stack = 当前目录的每一层</text>
<text x="40" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">目录名 (a, b, c)</text>
<path d="M40 124 L40 190 L110 190 L110 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="48" y="162" width="54" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="45" y="159" width="60" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="75.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">a</text>
<path d="M118 150 L144 150" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="131" y="132" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">push</text>
<path d="M150 124 L150 190 L220 190 L220 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="158" y="162" width="54" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="185.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="158" y="132" width="54" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="155" y="129" width="60" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="185.0" y="145.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">b</text>
<text x="40" y="214" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">进入下一层</text>
<text x="250" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">'..'</text>
<path d="M250 124 L250 190 L320 190 L320 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="258" y="162" width="54" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="285.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="258" y="132" width="54" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="255" y="129" width="60" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="285.0" y="145.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">b</text>
<path d="M328 150 L354 150" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="341" y="132" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">pop</text>
<path d="M360 124 L360 190 L430 190 L430 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="368" y="162" width="54" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="365" y="159" width="60" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="395.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">a</text>
<text x="250" y="214" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">回上一层; 栈空则忽略</text>
<text x="460" y="70" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">'' 或 '.'</text>
<path d="M460 124 L460 190 L530 190 L530 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="468" y="162" width="54" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="465" y="159" width="60" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="495.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">a</text>
<path d="M538 150 L564 150" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="551" y="132" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">不动</text>
<path d="M570 124 L570 190 L640 190 L640 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="578" y="162" width="54" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="575" y="159" width="60" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="605.0" y="175.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">a</text>
<text x="460" y="214" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">'//' 切出空串; '.' = 当前目录</text>
<text x="40" y="258" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">返回 '/' + '/'.join(stack) · stack 为空时就是 '/'</text>
<text x="40" y="282" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">Unix 路径 = 目录栈: 进目录 push, '..' pop · 和 '最近没处理的' 是同一个结构</text></svg>
