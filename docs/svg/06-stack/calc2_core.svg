<svg width="100%" viewBox="0 0 680 408" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>calc2_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">s = 2 - 3 * 2 · 乘除优先级更高 → '+ -' 不能边读边算, 要等后面有没有 '* /'</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">做法: 每一项带符号 push 进 stack; '* /' 立刻和栈顶这一项合并; 最后 sum(stack)</text>
<text x="40" y="70" font-size="14" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">边读边算 (错)</text>
<rect x="40" y="84" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="59.0" y="100.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="84" y="84" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="103.0" y="100.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">-</text>
<rect x="128" y="84" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="147.0" y="100.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="172" y="84" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="191.0" y="100.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">*</text>
<rect x="216" y="84" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="235.0" y="100.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<text x="40" y="138" font-size="14" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">(2 - 3) × 2 = -1 × 2 = -2 ✗</text>
<line x1="40" y1="158" x2="640" y2="158" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="182" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">按 '项' 切开 (对)</text>
<rect x="40" y="196" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="59.0" y="212.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="84" y="196" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="103.0" y="212.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">-</text>
<rect x="128" y="196" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="147.0" y="212.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="172" y="196" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="191.0" y="212.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">*</text>
<rect x="216" y="196" width="38" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="235.0" y="212.0" font-size="16" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M40 238 L40 244 L78 244 L78 238" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text x="59" y="258" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">项1</text>
<path d="M84 238 L84 244 L254 244 L254 238" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text x="169" y="258" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">项2 = -(3 × 2)</text>
<text x="40" y="292" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">项1 = +2 → push 2</text>
<text x="40" y="312" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">项2: '-' 先 push -3 · 读到 '*' → pop -3, -3 × 2 = -6 → push -6</text>
<text x="40" y="340" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">最后 sum(stack) = 2 + (-6) = -4 ✓</text>
<path d="M430 234 L430 330 L540 330 L540 234" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="438" y="302" width="94" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="485.0" y="315.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="438" y="272" width="94" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="435" y="269" width="100" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="485.0" y="285.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">-6</text>
<text x="485" y="348" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">stack = 项</text>
<text x="40" y="366" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">延迟处理 '+ -' = 先把项存进栈, 等整项算完</text>
<text x="40" y="386" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">立即处理 '* /' = 栈顶那一项就是它的左操作数</text></svg>
