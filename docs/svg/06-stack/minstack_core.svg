<svg width="100%" viewBox="0 0 680 336" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>minstack_core</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">要求: push / pop / top / get_min 全部 O(1)</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">pop 掉当前最小值之后, 新的最小值是谁? —— 必须在 push 的时候就记下来</text>
<text x="40" y="70" font-size="14" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">只存一个 min 变量 (错)</text>
<path d="M50 104 L50 200 L140 200 L140 104" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="58" y="172" width="74" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="95.0" y="185.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">5</text>
<rect x="58" y="142" width="74" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="55" y="139" width="80" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="95.0" y="155.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<text x="95" y="218" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="middle" dominant-baseline="central">min = 3</text>
<path d="M150 150 L200 150" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="175" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">pop</text>
<path d="M210 104 L210 200 L300 200 L300 104" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="218" y="172" width="74" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="215" y="169" width="80" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="255.0" y="185.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">5</text>
<text x="255" y="218" font-size="14" fill="#993C1D" font-weight="500" text-anchor="middle" dominant-baseline="central">min 还是 3 ✗</text>
<text x="40" y="246" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">实际最小值是 5, 变量不知道 → 只能重新扫整个栈 O(n)</text>
<line x1="335" y1="62" x2="335" y2="262" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="358" y="70" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">每个元素带 (val, min_so_far) (对)</text>
<path d="M368 104 L368 200 L478 200 L478 104" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="376" y="172" width="94" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="423.0" y="185.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">(5, 5)</text>
<rect x="376" y="142" width="94" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="373" y="139" width="100" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="423.0" y="155.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">(3, 3)</text>
<text x="423" y="218" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="middle" dominant-baseline="central">get_min = 3</text>
<path d="M486 150 L524 150" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="505" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">pop</text>
<path d="M530 104 L530 200 L640 200 L640 104" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="538" y="172" width="94" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="535" y="169" width="100" height="32" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="585.0" y="185.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">(5, 5)</text>
<text x="585" y="218" font-size="14" fill="#0F6E56" font-weight="500" text-anchor="middle" dominant-baseline="central">get_min = 5 ✓</text>
<text x="358" y="246" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">min_so_far 只取决于它下面的元素 → 写入后不再变</text>
<text x="40" y="292" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">栈的每个元素都是一个 '快照': 记着 '栈只有到它为止这么高时' 的答案</text>
<text x="40" y="314" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">pop 掉它, 快照一起走, 下面元素的快照原封不动 —— 这就是 '每个元素带额外状态'</text></svg>
