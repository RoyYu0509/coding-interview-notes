<svg width="100%" viewBox="0 0 680 482" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Asteroid Collision examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">每个数是一颗小行星: 绝对值是大小, 正号向右飞, 负号向左飞。迎面相撞时小的爆炸, 一样大就都爆炸。求最后剩下的</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 1:  [5,10,-5]  →  [5,10]</text>
<rect x="40" y="104" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="57.0" y="120.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">5</text>
<text x="57.0" y="146" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">0</text>
<rect x="74" y="104" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="91.0" y="120.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">10</text>
<text x="91.0" y="146" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">1</text>
<rect x="108" y="104" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="125.0" y="120.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">-5</text>
<text x="125.0" y="146" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">2</text>
<path d="M111 96 L111 88 L139 88 L139 96" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="166" y="90" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">-5 撞上 10, 5 &lt; 10, -5 爆炸</text>
<line x1="40" y1="166" x2="640" y2="166" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="186" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 2:  [8,-8]  →  []</text>
<rect x="40" y="228" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="57.0" y="244.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">8</text>
<text x="57.0" y="270" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">0</text>
<rect x="74" y="228" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="91.0" y="244.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">-8</text>
<text x="91.0" y="270" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">1</text>
<path d="M43 220 L43 212 L105 212 L105 220" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="132" y="214" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">一样大, 一起爆炸</text>
<line x1="40" y1="290" x2="640" y2="290" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="310" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example 3:  [10,2,-5]  →  [10]</text>
<rect x="40" y="352" width="34" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="57.0" y="368.0" font-size="15" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">10</text>
<text x="57.0" y="394" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">0</text>
<rect x="74" y="352" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="91.0" y="368.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2</text>
<text x="91.0" y="394" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">1</text>
<rect x="108" y="352" width="34" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="125.0" y="368.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">-5</text>
<text x="125.0" y="394" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">2</text>
<path d="M77 344 L77 336 L139 336 L139 344" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="166" y="338" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">-5 先撞掉 2, 再撞 10 时自己爆炸</text>
<text x="40" y="414" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">一颗向左飞的可以连续撞掉好几颗。而 [-2, 3] 这种 (左边的向左、右边的向右) 永远不会相撞</text>
<line x1="40" y1="438" x2="640" y2="438" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<rect x="33" y="453" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="54" y="460" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">最后剩下的</text>
<rect x="133" y="453" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="3 2"/>
<text x="154" y="460" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">相撞</text></svg>
