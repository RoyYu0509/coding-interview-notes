<text x="414" y="122.5" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">读数字: num = 0×10 + 3 = 3</text>
<text x="414" y="141.5" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">num = 3 · cur = ''</text>
