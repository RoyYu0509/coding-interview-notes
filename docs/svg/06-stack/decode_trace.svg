<svg width="100%" viewBox="0 0 680 858" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>decode_trace</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">s = "3[a2[c]]" · '[' 把 (cur, num) push 进 stack, 然后重新开始; ']' pop 回来</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">cur = 当前这层拼出的字符串 · num = 正在读的数字 · stack 元素 = (prev_str, k)</text>
<text x="44" y="64" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">输入</text>
<text x="112" y="64" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">pop 掉的</text>
