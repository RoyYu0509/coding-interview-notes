<svg width="100%" viewBox="0 0 680 204" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Remove All Adjacent Duplicates II examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">只要有 k 个相同的字符连在一起, 就把它们删掉。删完以后左右两边接起来, 可能又凑成 k 个, 继续删, 直到删不动</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example:  s = &quot;deeedbbcccbdaa&quot;, k = 3  →  &quot;aa&quot;</text>
