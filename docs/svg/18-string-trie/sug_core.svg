<text x="120" y="316" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">e</text>
<circle cx="240" cy="360" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="240" y="360" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">e</text>
<circle cx="60" cy="306" r="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="60" y="306" font-size="14" fill="#898781" font-weight="500" text-anchor="middle" dominant-baseline="central">…</text>
<line x1="60" y1="283" x2="60" y2="295" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="120" cy="350" r="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="120" y="350" font-size="14" fill="#898781" font-weight="500" text-anchor="middle" dominant-baseline="central">…</text>
<line x1="120" y1="327" x2="120" y2="339" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="180" cy="350" r="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
