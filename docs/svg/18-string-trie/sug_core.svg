<text x="150" y="228" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">o</text>
<circle cx="240" cy="272" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="240" y="272" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">u</text>
