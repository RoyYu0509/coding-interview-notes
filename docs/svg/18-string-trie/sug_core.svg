<text x="150" y="272" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">n</text>
<circle cx="180" cy="316" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="180" y="316" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">i</text>
<circle cx="240" cy="316" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="240" y="316" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">s</text>
