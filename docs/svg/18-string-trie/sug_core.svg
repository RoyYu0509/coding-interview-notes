<svg width="100%" viewBox="0 0 680 476" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Search Suggestions: 每个 node 存 top 3</title><desc>先排序再 insert, 每个 node 的 top3 就是经过它的前 3 个 product</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">products 先 sorted, 再依次 insert · 沿路每个 node: 不足 3 个就 append (后来的更大, 不用比较)</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">这样每个 node 里存的 top3, 就是 '以这个前缀开头' 的答案, 查询时不用再搜</text>
<text x="40" y="64" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">sorted:</text>
<rect x="96" y="52" width="58" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="125.0" y="64.0" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">mobile</text>
<rect x="162" y="52" width="72" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="198.0" y="64.0" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">moneypot</text>
<rect x="242" y="52" width="65" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="274.5" y="64.0" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">monitor</text>
<rect x="315" y="52" width="51" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.5" y="64.0" font-size="12" fill="#444441" font-weight="400" text-anchor="middle" dominant-baseline="central">mouse</text>
<rect x="374" y="52" width="72" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410.0" y="64.0" font-size="12" fill="#444441" font-weight="400" text-anchor="middle" dominant-baseline="central">mousepad</text>
<text x="96" y="96" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">前 3 个先到, 把 m, o 的 top3 填满 -&gt; mouse, mousepad 到 m, o 时已满, 被忽略</text>
<line x1="150" y1="140" x2="150" y2="184" stroke="#898781" stroke-width="1"/>
<line x1="150" y1="184" x2="150" y2="228" stroke="#898781" stroke-width="1"/>
<line x1="150" y1="228" x2="240" y2="272" stroke="#898781" stroke-width="1"/>
