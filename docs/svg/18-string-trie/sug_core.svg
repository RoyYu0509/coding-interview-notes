<text x="150" y="140" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">root</text>
<circle cx="150" cy="184" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="150" y="184" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">m</text>
