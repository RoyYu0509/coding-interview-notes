<line x1="180" y1="327" x2="180" y2="339" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="240" cy="394" r="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="240" y="394" font-size="14" fill="#898781" font-weight="500" text-anchor="middle" dominant-baseline="central">…</text>
<line x1="240" y1="371" x2="240" y2="383" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="40" y="424" font-size="12" fill="#898781" font-weight="400" text-anchor="start" dominant-baseline="central">(只画到 depth 5, … = 后面还有字符)</text>
<text x="330" y="140" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">node (路径) 里存的 top3</text>
<text x="330" y="176" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">m, o</text>
<rect x="330" y="188" width="300" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480.0" y="201.0" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">mobile, moneypot, monitor</text>
<text x="330" y="232" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">m → o → b</text>
<rect x="330" y="244" width="300" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480.0" y="257.0" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">mobile</text>
<text x="330" y="288" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">m → o → n</text>
<rect x="330" y="300" width="300" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480.0" y="313.0" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">moneypot, monitor</text>
<text x="330" y="344" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">m → o → u (→ s → e)</text>
<rect x="330" y="356" width="300" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480.0" y="369.0" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">mouse, mousepad</text>
<text x="330" y="404" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">查询 O(L): 走 L 步, 每步直接读 node.top3</text>
<rect x="40" y="449" width="14" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="60" y="456" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">先到的 3 个 / 存的 top3</text>
<rect x="226.6" y="449" width="14" height="14" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="246.6" y="456" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">后到的 (被忽略)</text>
<rect x="360.4" y="449" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="380.4" y="456" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">后面还有</text>
</svg>
