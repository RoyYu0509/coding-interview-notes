<svg width="100%" viewBox="0 0 680 328" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>atoi: parse 指针 i 的三个阶段</title><desc>指针 i 只向右走, 依次跳空格 -&gt; 符号 -&gt; 数字, 遇到非数字停</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">s = '  -42x' · i 是一根只向右走的 parse 指针, 每个字符只看一次</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">每个阶段 = 一个 while / if, 条件不满足就把 i 留给下一个阶段</text>
<text x="172.0" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=0</text>
<rect x="150" y="84" width="44" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="172.0" y="101.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">␣</text>
<text x="218.0" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=1</text>
<rect x="196" y="84" width="44" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="218.0" y="101.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">␣</text>
<text x="264.0" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=2</text>
<rect x="242" y="84" width="44" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="239" y="81" width="50" height="40" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="264.0" y="101.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">-</text>
<text x="310.0" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=3</text>
<rect x="288" y="84" width="44" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="310.0" y="101.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">4</text>
<text x="356.0" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=4</text>
<rect x="334" y="84" width="44" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="356.0" y="101.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<text x="402.0" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=5</text>
<rect x="380" y="84" width="44" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="402.0" y="101.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">x</text>
<path d="M150 132 L240 132" fill="none" stroke="#52514E" stroke-width="1.5"/>
<path d="M242 132 L286 132" fill="none" stroke="#52514E" stroke-width="1.5"/>
<path d="M288 132 L378 132" fill="none" stroke="#52514E" stroke-width="1.5"/>
<path d="M380 132 L424 132" fill="none" stroke="#52514E" stroke-width="1.5"/>
<rect x="40" y="151" width="100" height="20" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="90" y="161" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">阶段 1 跳空格</text>
<text x="152" y="161" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">while s[i] == ' ': i += 1</text>
<text x="420" y="161" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">i: 0 -&gt; 2   (s[0:2] = '␣␣')</text>
<rect x="40" y="177" width="100" height="20" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="90" y="187" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">阶段 2 符号</text>
<text x="152" y="187" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">sign = -1, i += 1</text>
<text x="420" y="187" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">i: 2 -&gt; 3   (s[2:3] = '-')</text>
<rect x="40" y="203" width="100" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="90" y="213" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">阶段 3 数字</text>
<text x="152" y="213" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">num = num*10 + d</text>
<text x="420" y="213" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">i: 3 -&gt; 5   (s[3:5] = '42')</text>
<rect x="40" y="229" width="100" height="20" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="90" y="239" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">停</text>
<text x="152" y="239" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" dominant-baseline="central">return sign * num</text>
<text x="420" y="239" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">i = 5   (s[5:6] = 'x')</text>
<text x="40" y="276" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">总共 O(n) 时间, O(1) 空间: 指针不回头, 也不 slice 出子串</text>
<circle cx="48" cy="308" r="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="48" cy="308" r="9.5" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="64" y="308" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">当前 i (符号)</text>
<rect x="167.0" y="301" width="14" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="187.0" y="308" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">吃进 num 的数字</text>
<rect x="302.0" y="301" width="14" height="14" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="322.0" y="308" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">停下的字符</text>
<rect x="404.0" y="301" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="424.0" y="308" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">被跳过的空格</text>
</svg>
