<svg width="100%" viewBox="0 0 680 192" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Implement Trie examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">实现 Trie (前缀树): insert(word)、search(word) (完整的 word 在不在)、startsWith(prefix) (有没</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">有 word 以它开头)</text>
<line x1="40" y1="62" x2="640" y2="62" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="82" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example:  insert(&quot;apple&quot;)</text>
<text x="40" y="102" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">search(&quot;apple&quot;) → True</text>
<text x="40" y="120" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">search(&quot;app&quot;) → False: 存过的是 apple, app 只是它的前缀, 不是一个完整的 word</text>
<text x="40" y="138" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">startsWith(&quot;app&quot;) → True</text>
<text x="40" y="156" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">insert(&quot;app&quot;) 之后, search(&quot;app&quot;) → True</text>
<line x1="40" y1="180" x2="640" y2="180" stroke="#B4B2A9" stroke-dasharray="4 4"/></svg>
