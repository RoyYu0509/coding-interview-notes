<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">str 不可变: s += c 要新建 string, 把旧内容全部复制过去; list.append 不动旧元素</text>
<text x="40" y="64" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">res += c</text>
<text x="360" y="64" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">parts.append(c), 最后 ''.join(parts)</text>
