<svg width="100%" viewBox="0 0 680 434" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Add and Search Words: '.' 通配 = DFS 分叉</title><desc>普通字符只有一条路, '.' 对所有 child 都试一次</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">同一棵 trie, 只有 search 不同: 普通字符沿 1 条边走, '.' 要把所有 child 都试一遍</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">分叉 = 递归 (DFS), 只要有 1 条分支返回 True, 整体就是 True</text>
<text x="40" y="64" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">普通字符 c</text>
<text x="360" y="64" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">通配 '.'</text>
<line x1="40" y1="76" x2="640" y2="76" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="122" y="96" width="44" height="22" rx="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="144" y="107" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">node</text>
<line x1="144" y1="120" x2="144" y2="160" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="154" y="140" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">c</text>
<circle cx="144" cy="176" r="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="144" y="176" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">c</text>
<text x="40" y="214" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" dominant-baseline="central">ch = node.children.get(c)</text>
<text x="40" y="236" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">只有 1 条路, O(1), 不分叉</text>
<rect x="478" y="96" width="44" height="22" rx="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="500" y="107" font-size="12" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">node</text>
<line x1="500" y1="120" x2="420" y2="160" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="420" cy="176" r="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="420" y="176" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">b</text>
<line x1="500" y1="120" x2="500" y2="160" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="500" cy="176" r="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="500" y="176" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">d</text>
<line x1="500" y1="120" x2="580" y2="160" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="580" cy="176" r="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="580" y="176" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">m</text>
<text x="536" y="140" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">'.'</text>
<text x="360" y="214" font-size="12" fill="#0B0B0B" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" dominant-baseline="central">any(dfs(ch, i+1) for ch in node.children.values())</text>
<text x="360" y="236" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">每个 child 都可能匹配, 最多 26 条路</text>
<line x1="40" y1="256" x2="640" y2="256" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="276" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">pattern = 'b.d' 逐字符对应:</text>
<rect x="280" y="262" width="40" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="300.0" y="276.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">b</text>
<text x="300" y="306" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">1 条路</text>
<rect x="368" y="262" width="40" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="365" y="259" width="46" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="388.0" y="276.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">.</text>
<text x="388" y="306" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">分叉</text>
<rect x="456" y="262" width="40" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="476.0" y="276.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">d</text>
<text x="476" y="306" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">1 条路</text>
<text x="40" y="338" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">没有 '.': 和普通 Trie.search 一样 O(L)</text>
<text x="40" y="362" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">有 '.': 最坏会遍历整棵 trie, 上界 = trie 的 node 数 (≤ 所有 word 的总字符数)</text>
<text x="40" y="386" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">暴力对照: 把所有 word 放 list, 每次 search 逐个比 -&gt; O(N · L), 跟有没有 '.' 无关</text>
<rect x="40" y="407" width="14" height="14" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="60" y="414" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">node</text>
<rect x="108.4" y="407" width="14" height="14" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="128.4" y="414" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">往下走的 child</text>
<circle cx="246.0" cy="414" r="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="246.0" cy="414" r="9.5" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="262.0" y="414" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">'.' 通配符</text>
</svg>
