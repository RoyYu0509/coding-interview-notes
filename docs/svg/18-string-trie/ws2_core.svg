<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">DFS 每走一格, trie 也往下走一层: 这一格的字符不在 node.children 里 -&gt; 这条路不可能是任何 word -&gt; 剪枝</text>
