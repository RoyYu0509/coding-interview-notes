<text x="40" y="278" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">剪枝 1: board[nr][nc] not in node.children -&gt; 不进 dfs</text>
<text x="40" y="302" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">例: (0,1) 'a' 起头, root.children = {o, p, e, r}, 没有 'a' -&gt; 整棵 DFS 子树直接不要</text>
<text x="40" y="330" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">剪枝 2: 找到 word 后 node.word = None, 叶子变空就 del -&gt; 同一个 word 不会重复搜</text>
<text x="40" y="354" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">oath 摘掉后 trie 14 -&gt; 10 个 node, eat 摘掉后 10 -&gt; 7 个 node</text>
<text x="40" y="382" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">暴力 (每个 word 跑一遍 Word Search I): 4 次完整搜索, 'o' 'e' 等共享前缀被重复走</text>
<text x="40" y="402" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">trie 版: 1 次搜索, 所有 word 共享前缀一起走</text>
