<svg width="100%" viewBox="0 0 680 374" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>rotated 数组里的单调 predicate</title><desc>和最后一个元素比, 得到 False...False True...True</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">旋转前 sorted [1,2,3,4,5,6,7,8,9] 被转成下面这样: 左段大 (4..9), 右段小 (1..3)</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">last = nums[-1] = 3 · pred(i) = nums[i] &lt;= last</text><text x="20" y="82" font-size="12" fill="#52514E" text-anchor="start">idx</text><text x="20" y="108" font-size="12" fill="#52514E" text-anchor="start">nums</text><text x="20" y="144" font-size="12" fill="#52514E" text-anchor="start">pred</text><text x="111.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">0</text><rect x="84" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="110.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">4</text><rect x="84" y="126" width="52" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="110.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="165.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">1</text><rect x="138" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="164.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="138" y="126" width="52" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="164.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="219.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">2</text><rect x="192" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="218.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">6</text><rect x="192" y="126" width="52" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="218.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="273.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">3</text><rect x="246" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="272.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">7</text><rect x="246" y="126" width="52" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="272.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="327.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">4</text><rect x="300" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="326.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">8</text><rect x="300" y="126" width="52" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="326.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="381.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">5</text><rect x="354" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="380.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">9</text><rect x="354" y="126" width="52" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="380.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="435.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">6</text><rect x="408" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="434.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">1</text><rect x="408" y="126" width="52" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="405" y="123" width="58" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="434.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="489.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">7</text><rect x="462" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="488.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">2</text><rect x="462" y="126" width="52" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="488.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="543.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">8</text><rect x="516" y="88" width="52" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="542.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">3</text><rect x="516" y="126" width="52" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="542.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><line x1="84" y1="172" x2="404" y2="172" stroke="#52514E" stroke-width="1.5"/><text x="246" y="192" font-size="12" fill="#52514E" text-anchor="middle">左段: 全 &gt; last = 3</text><line x1="408" y1="172" x2="566" y2="172" stroke="#52514E" stroke-width="1.5"/><text x="489.0" y="192" font-size="12" fill="#52514E" text-anchor="middle">右段: 全 &lt;= last</text><line x1="20" y1="206" x2="660" y2="206" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="230" font-size="14" fill="#0B0B0B" text-anchor="start">第一个 True 的下标 = 6, nums[6] = 1 就是最小值。</text><text x="20" y="254" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">为什么和 last 比, 不和 nums[lo] 比?</text><text x="20" y="276" font-size="12" fill="#52514E" text-anchor="start">和 last 比: 左段 (4..9) 一定都比 3 大, 右段 (1, 2, 3) 一定都 &lt;= 3, 所以是单调的。</text><text x="20" y="296" font-size="12" fill="#52514E" text-anchor="start">和 nums[lo] 比: lo 落在哪一段不确定, 同一个比较在不同位置含义不同, 不单调。</text><text x="20" y="316" font-size="12" fill="#52514E" text-anchor="start">(数组没被旋转时 last 是最大值, pred 全是 True, 分界点 = 0, 也对。)</text><rect x="24" y="338" width="18" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="52" y="352" font-size="12" fill="#52514E" text-anchor="start">nums[i] &lt;= last (True)</text><rect x="236" y="338" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="264" y="352" font-size="12" fill="#52514E" text-anchor="start">nums[i] &gt; last (False)</text><rect x="445" y="335" width="24" height="24" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="476" y="352" font-size="12" fill="#52514E" text-anchor="start">分界点</text></svg>
