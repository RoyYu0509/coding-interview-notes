<svg width="100%" viewBox="0 0 680 334" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Koko 的 feasible 单调</title><desc>速度越大, 吃完需要的小时越少</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">piles = [3, 6, 7, 11], h = 8 · hours(k) = ceil(3/k) + ceil(6/k) + ceil(7/k) + ceil(11/k)</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">feasible(k) = hours(k) &lt;= h = 8 · k 越大 hours 只会变小, 所以 feasible 是 False...False True...True</text><text x="20" y="82" font-size="12" fill="#52514E" text-anchor="start">k</text><text x="20" y="108" font-size="12" fill="#52514E" text-anchor="start">hours</text><text x="20" y="144" font-size="12" fill="#52514E" text-anchor="start">&lt;= 8 ?</text><text x="110.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">1</text><rect x="84" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="109.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">27</text><rect x="84" y="126" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="109.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="162.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">2</text><rect x="136" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="161.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">15</text><rect x="136" y="126" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="161.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="214.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">3</text><rect x="188" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="213.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">10</text><rect x="188" y="126" width="50" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="213.0" y="145.32" font-size="12" fill="#712B13" text-anchor="middle">False</text><text x="266.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">4</text><rect x="240" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="265.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">8</text><rect x="240" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="237" y="123" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="265.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="318.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">5</text><rect x="292" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="317.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">8</text><rect x="292" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="317.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="370.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">6</text><rect x="344" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="369.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">6</text><rect x="344" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="369.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="422.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">7</text><rect x="396" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="421.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="396" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="421.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="474.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">8</text><rect x="448" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="473.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="448" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="473.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="526.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">9</text><rect x="500" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="525.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="500" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="525.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="578.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">10</text><rect x="552" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="577.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="552" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="577.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><text x="630.0" y="76" font-size="12" fill="#52514E" text-anchor="middle">11</text><rect x="604" y="88" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="629.0" y="108.76" font-size="16" fill="#444441" text-anchor="middle">4</text><rect x="604" y="126" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="629.0" y="145.32" font-size="12" fill="#085041" text-anchor="middle">True</text><line x1="20" y1="174" x2="660" y2="174" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="198" font-size="14" fill="#0B0B0B" text-anchor="start">k = 3: hours = ceil(3/3) + ceil(6/3) + ceil(7/3) + ceil(11/3) = 1 + 2 + 3 + 4 = 10 &gt; 8 → False</text><text x="20" y="222" font-size="14" fill="#0B0B0B" text-anchor="start">k = 4: hours = ceil(3/4) + ceil(6/4) + ceil(7/4) + ceil(11/4) = 1 + 2 + 2 + 3 = 8 &lt;= 8 → True</text><text x="20" y="252" font-size="14" fill="#0B0B0B" text-anchor="start">答案 = 第一个 True = 4。不需要 piles sorted: 单调的是 k 和 hours 的关系, 不是输入数组。</text><text x="20" y="276" font-size="12" fill="#52514E" text-anchor="start">k 的范围: 最小 1; 最大 max(piles) = 11 (再快也是一小时吃一堆), 所以搜 [1, 11]。</text><rect x="24" y="298" width="18" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="52" y="312" font-size="12" fill="#52514E" text-anchor="start">feasible = True</text><rect x="187" y="298" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="215" y="312" font-size="12" fill="#52514E" text-anchor="start">feasible = False</text><rect x="354" y="295" width="24" height="24" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="385" y="312" font-size="12" fill="#52514E" text-anchor="start">答案</text></svg>
