<svg width="100%" viewBox="0 0 680 442" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>peak 的局部单调</title><desc>mid 上坡则右边必有 peak, 下坡则 mid 或左边必有 peak</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">nums 不 sorted, 但相邻元素不相等, 且 nums[-1] = nums[n] = -inf (两端都当作掉下悬崖)</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">pred(i) = nums[i] &gt; nums[i+1] (i 处是下坡): 只要看 mid 往哪边走, 就知道哪一侧一定藏着 peak</text><path d="M50 254 L104 238 L158 222 L212 190 L266 206 L320 174 L374 158 L428 126 L482 142 L536 222 L590 254" fill="none" stroke="#5F5E5A" stroke-width="2"/><circle cx="50" cy="254" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="50" y="290" font-size="12" fill="#52514E" text-anchor="middle">0</text><text x="50" y="242" font-size="12" fill="#52514E" text-anchor="middle">1</text><circle cx="104" cy="238" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="104" y="290" font-size="12" fill="#52514E" text-anchor="middle">1</text><text x="104" y="226" font-size="12" fill="#52514E" text-anchor="middle">2</text><circle cx="158" cy="222" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="158" y="290" font-size="12" fill="#52514E" text-anchor="middle">2</text><text x="158" y="210" font-size="12" fill="#52514E" text-anchor="middle">3</text><circle cx="212" cy="190" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="212" y="290" font-size="12" fill="#52514E" text-anchor="middle">3</text><text x="212" y="178" font-size="12" fill="#52514E" text-anchor="middle">5</text><circle cx="266" cy="206" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="266" y="290" font-size="12" fill="#52514E" text-anchor="middle">4</text><text x="266" y="194" font-size="12" fill="#52514E" text-anchor="middle">4</text><circle cx="320" cy="174" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="320" y="290" font-size="12" fill="#52514E" text-anchor="middle">5</text><text x="320" y="162" font-size="12" fill="#52514E" text-anchor="middle">6</text><circle cx="374" cy="158" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="374" y="290" font-size="12" fill="#52514E" text-anchor="middle">6</text><text x="374" y="146" font-size="12" fill="#52514E" text-anchor="middle">7</text><circle cx="428" cy="126" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="428" y="290" font-size="12" fill="#52514E" text-anchor="middle">7</text><text x="428" y="114" font-size="12" fill="#52514E" text-anchor="middle">9</text><circle cx="482" cy="142" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="482" y="290" font-size="12" fill="#52514E" text-anchor="middle">8</text><text x="482" y="130" font-size="12" fill="#52514E" text-anchor="middle">8</text><circle cx="536" cy="222" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="536" y="290" font-size="12" fill="#52514E" text-anchor="middle">9</text><text x="536" y="210" font-size="12" fill="#52514E" text-anchor="middle">3</text><circle cx="590" cy="254" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="590" y="290" font-size="12" fill="#52514E" text-anchor="middle">10</text><text x="590" y="242" font-size="12" fill="#52514E" text-anchor="middle">1</text><text x="20" y="290" font-size="12" fill="#52514E" text-anchor="start">idx</text><circle cx="320" cy="174" r="9" fill="none" stroke="#EF9F27" stroke-width="2.5"/><path d="M322 198 L390 198" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#agr)"/><text x="322" y="216" font-size="12" fill="#085041" text-anchor="start">mid=5</text><circle cx="482" cy="142" r="9" fill="none" stroke="#EF9F27" stroke-width="2.5"/><path d="M484 166 L416 166" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#agr)"/><text x="416" y="184" font-size="12" fill="#085041" text-anchor="start">mid=8</text><text x="20" y="322" font-size="14" fill="#0B0B0B" text-anchor="start">mid=5: nums[5]=6 &lt; nums[6]=7, 上坡 → 往右走</text><text x="20" y="342" font-size="12" fill="#712B13" text-anchor="start">右边一定有 peak → lo = mid + 1</text><text x="350" y="322" font-size="14" fill="#0B0B0B" text-anchor="start">mid=8: nums[8]=8 &gt; nums[9]=3, 下坡 → 往左走</text><text x="350" y="342" font-size="12" fill="#712B13" text-anchor="start">mid 自己或左边一定有 peak → hi = mid</text><line x1="20" y1="354" x2="660" y2="354" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="380" font-size="12" fill="#52514E" text-anchor="start">为什么: 往上坡方向一直走, 要么遇到下坡 (那里就是 peak), 要么走到尽头 (尽头外是 -inf, 最后一个就是 peak)。</text><text x="20" y="400" font-size="12" fill="#52514E" text-anchor="start">整个数组不单调, 但每一步都能丢掉一半且保证 "peak 还在剩下的里面", 二分只需要这个。</text><text x="20" y="426" font-size="12" fill="#52514E" text-anchor="start">(图里 idx 3 的 5 和 idx 7 的 9 都是 peak, 题目允许返回任意一个。)</text></svg>
