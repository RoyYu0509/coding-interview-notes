<svg width="100%" viewBox="0 0 680 370" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>median 的分割点</title><desc>在较短数组上二分 A 里取几个放左半</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">A = [1, 3, 8, 9, 15], B = [7, 11, 18, 19, 21, 25] · m + n = 11 · 左半放 half = (11 + 1) // 2 = 6 个</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">二分的是分割点 i (A 里放 i 个进左半), B 里放 j = half - i 个进左半</text><text x="20" y="84" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">A</text><rect x="60" y="68" width="48" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="84.0" y="88.76" font-size="16" fill="#085041" text-anchor="middle">1</text><rect x="112" y="68" width="48" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="136.0" y="88.76" font-size="16" fill="#085041" text-anchor="middle">3</text><rect x="164" y="68" width="48" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="188.0" y="88.76" font-size="16" fill="#085041" text-anchor="middle">8</text><rect x="216" y="68" width="48" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="213" y="65" width="54" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="240.0" y="88.76" font-size="16" fill="#085041" text-anchor="middle">9</text><rect x="274" y="68" width="48" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="271" y="65" width="54" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="298.0" y="88.76" font-size="16" fill="#444441" text-anchor="middle">15</text><line x1="269" y1="60" x2="269" y2="106" stroke="#993C1D" stroke-width="2" stroke-dasharray="5 3"/><text x="20" y="148" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">B</text><rect x="60" y="132" width="48" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="84.0" y="152.76" font-size="16" fill="#085041" text-anchor="middle">7</text><rect x="112" y="132" width="48" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><rect x="109" y="129" width="54" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="136.0" y="152.76" font-size="16" fill="#085041" text-anchor="middle">11</text><rect x="170" y="132" width="48" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="167" y="129" width="54" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="194.0" y="152.76" font-size="16" fill="#444441" text-anchor="middle">18</text><rect x="222" y="132" width="48" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="246.0" y="152.76" font-size="16" fill="#444441" text-anchor="middle">19</text><rect x="274" y="132" width="48" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="298.0" y="152.76" font-size="16" fill="#444441" text-anchor="middle">21</text><rect x="326" y="132" width="48" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="350.0" y="152.76" font-size="16" fill="#444441" text-anchor="middle">25</text><line x1="165" y1="124" x2="165" y2="170" stroke="#993C1D" stroke-width="2" stroke-dasharray="5 3"/><text x="60" y="188" font-size="12" fill="#52514E" text-anchor="start">绿色 = 左半 (A 取 i = 4 个, B 取 j = 6 - 4 = 2 个, 共 6 个) · 虚线 = 分割线</text><line x1="20" y1="202" x2="660" y2="202" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="228" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">分割对不对, 只看分割线两侧紧挨着的 4 个数 (圈出来的):</text><text x="20" y="254" font-size="14" fill="#0B0B0B" text-anchor="start">A[i-1] = 9 &lt;= B[j] = 18   且   B[j-1] = 11 &lt;= A[i] = 15</text><text x="20" y="276" font-size="12" fill="#52514E" text-anchor="start">两个数组各自本来就 sorted, 所以只要交叉的两个比较成立, 左半的每个数 &lt;= 右半的每个数。</text><text x="20" y="302" font-size="14" fill="#0B0B0B" text-anchor="start">对了就结束: 11 个数, 奇数个 → 中位数 = 左半最大 = max(A[i-1], B[j-1]) = max(9, 11) = 11。</text><text x="20" y="324" font-size="12" fill="#52514E" text-anchor="start">偶数个则 = (左半最大 + 右半最小) / 2。</text><text x="20" y="352" font-size="12" fill="#52514E" text-anchor="start">i 切小了 (A[i] &lt; B[j-1]) → 把 i 调大; 切大了 → 调小。这是对 i 的二分, 范围 [0, m]。</text></svg>
