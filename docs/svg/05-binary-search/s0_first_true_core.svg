="48" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="281.0" y="155.32" font-size="12" fill="#085041" text-anchor="middle">True</text><rect x="304" y="94" width="42" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="325.0" y="114.76" font-size="16" fill="#444441" text-anchor="middle">11</text><rect x="304" y="136" width="42" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="325.0" y="155.32" font-size="12" fill="#085041" text-anchor="middle">True</text><rect x="348" y="94" width="42" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="369.0" y="114.76" font-size="16" fill="#444441" text-anchor="middle">13</text><rect x="348" y="136" width="42" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="369.0" y="155.32" font-size="12" fill="#085041" text-anchor="middle">True</text><rect x="392" y="136" width="42" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/><text x="413.0" y="155.32" font-size="12" fill="#52514E" text-anchor="middle">True</text><text x="413.0" y="184" font-size="12" fill="#52514E" text-anchor="middle">虚拟的 True</text><text x="282.0" y="184" font-size="12" fill="#52514E" text-anchor="middle">分界点 = 4</text><line x1="20" y1="194" x2="660" y2="194" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="216" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">二分: 每问一次 pred(mid), 就能确定 mid 一侧的全部</text><text x="20" y="252" font-size="12" fill="#52514E" text-anchor="start">lo=0 hi=7</text><rect x="84" y="234" width="42" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="253.76" font-size="16" fill="#444441" text-anchor="middle"></text><rect x="128" y="234" width="42" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="149.0" y="253.76" font-size="16" fill="#444441" text-anchor="middle"></text><rect x="172" y="234" width="42" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="193.0" y="253.76" font-size="16" fill="#444441" text-anchor="middle"></text><rect x="216" y="234" width="42" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="213" y="231" width="48" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="237.0" y="253.76" font-size="16" fill="#444441" text-anchor="middle"></text><rect x="260" y="234" width="42" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="281.0" y="253.76" font-size="16" fill="#444441" text-anchor="middle"></text><rect x="304" y="234" width="42" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="325.0" y="253.76" font-size="16" fill="#444441" text-anchor="middle"></text><rect x="348" y="234" width="42" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="369.0" y="253.76" font-size="16" fill="#444441" text-anchor="middle"></text><rect x="392" y="234" width="42" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 3"/><text x="413.0" y="253.76" font-size="16" fill="#085041" text-anchor="middle"></text><text x="444" y="246" font-size="12" fill="#0B0B0B" text-anchor="start">pred(3) = nums[3] = 7 &gt;= 8 → False</text><text x="444" y="262" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 4: 3 及左边全是 False</text><text x="20" y="304" font-size="12" fill="#52514E" text-anchor="start">lo=4 hi=7</text><rect x="84" y="286" width="42" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="105.0" y="305.76" font-size="16" fill="#712B13" text-anchor="middle"></text><rect x="128" y="286" width="42" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="149.0" y="305.76" font-size="16" fill="#712B13" text-anchor="middle"></text><rect x="172" y="286" width="42" height="28" rx="4" fill="#FAECE7