<svg width="100%" viewBox="0 0 680 502" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>first_true 的 invariant</title><desc>pred 单调, lo 左边全是 False, hi 及右边全是 True</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">nums = [1, 3, 5, 7, 9, 11, 13] · pred(i) = nums[i] &gt;= 8 · 答案 = 第一个 True 的下标</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">invariant: 下标 &lt; lo 的已知 False (红), 下标 &gt;= hi 的已知 True (绿), [lo, hi) 里还不知道 (灰)</text><text x="20" y="88" font-size="12" fill="#52514E" text-anchor="start">idx</text><text x="20" y="114" font-size="12" fill="#52514E" text-anchor="start">nums</text><text x="20" y="156" font-size="12" fill="#52514E" text-anchor="start">pred</text><text x="106.0" y="82" font-size="12" fill="#52514E" text-anchor="middle">0</text><text x="150.0" y="82" font-size="12" fill="#52514E" text-anchor="middle">1</text><text x="194.0" y="82" font-size="12" fill="#52514E" text-anchor="middle">2</text><text x="238.0" y="82" font-size="12" fill="#52514E" text-anchor="middle">3</text><text x="282.0" y="82" font-size="12" fill="#52514E" text-anchor="middle">4</text><text x="326.0" y="82" font-size="12" fill="#52514E" text-anchor="middle">5</t