<svg width="100%" viewBox="0 0 680 486" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>哪一半有序</title><desc>把 [lo, hi) 从 mid 切开, 总有一半是有序的</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">旋转点 (9 → 1 那个下降) 只可能在 mid 的一侧, 所以另一侧一定有序</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">有序的那一半可以用两个端点 O(1) 判断 target 在不在里面</text><text x="20" y="72" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">step 1: lo=0 hi=9 mid=4, target = 3</text><text x="88.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">0</text><rect x="60" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="87.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">4</text><text x="144.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">1</text><rect x="116" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="143.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">5</text><text x="200.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">2</text><rect x="172" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="199.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">6</text><text x="256.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">3</text><rect x="228" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="255.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">7</text><text x="312.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">4</text><rect x="284" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="281" y="95" width="60" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="311.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">8</text><text x="368.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">5</text><rect x="340" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="367.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">9</text><text x="424.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">6</text><rect x="396" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="423.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">1</text><text x="480.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">7</text><rect x="452" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="479.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">2</text><text x="536.0" y="90" font-size="12" fill="#52514E" text-anchor="middle">8</text><rect x="508" y="98" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="535.0" y="118.76" font-size="16" fill="#444441" text-anchor="middle">3</text><line x1="60" y1="144" x2="336" y2="144" stroke="#0F6E56" stroke-width="3"/><text x="200.0" y="164" font-size="12" fill="#085041" text-anchor="middle">左半有序: nums[lo]=4 &lt;= nums[mid]=8</text><text x="20" y="190" font-size="14" fill="#0B0B0B" text-anchor="start">target 在里面吗? nums[lo] &lt;= target &lt; nums[mid] → 4 &lt;= 3 &lt; 8 → False</text><text x="20" y="212" font-size="14" fill="#712B13" text-anchor="start">不在 → 丢掉有序的左半: lo = mid + 1 = 5</text><line x1="20" y1="228" x2="660" y2="228" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="254" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">step 2: lo=5 hi=9 mid=7, target = 3</text><text x="88.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">0</text><rect x="60" y="280" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="87.0" y="300.76" font-size="16" fill="#712B13" text-anchor="middle">4</text><text x="144.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">1</text><rect x="116" y="280" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="143.0" y="300.76" font-size="16" fill="#712B13" text-anchor="middle">5</text><text x="200.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">2</text><rect x="172" y="280" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="199.0" y="300.76" font-size="16" fill="#712B13" text-anchor="middle">6</text><text x="256.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">3</text><rect x="228" y="280" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="255.0" y="300.76" font-size="16" fill="#712B13" text-anchor="middle">7</text><text x="312.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">4</text><rect x="284" y="280" width="54" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="311.0" y="300.76" font-size="16" fill="#712B13" text-anchor="middle">8</text><text x="368.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">5</text><rect x="340" y="280" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="367.0" y="300.76" font-size="16" fill="#444441" text-anchor="middle">9</text><text x="424.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">6</text><rect x="396" y="280" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="423.0" y="300.76" font-size="16" fill="#444441" text-anchor="middle">1</text><text x="480.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">7</text><rect x="452" y="280" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="449" y="277" width="60" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="479.0" y="300.76" font-size="16" fill="#444441" text-anchor="middle">2</text><text x="536.0" y="272" font-size="12" fill="#52514E" text-anchor="middle">8</text><rect x="508" y="280" width="54" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="535.0" y="300.76" font-size="16" fill="#444441" text-anchor="middle">3</text><line x1="452" y1="326" x2="560" y2="326" stroke="#0F6E56" stroke-width="3"/><text x="508.0" y="346" font-size="12" fill="#085041" text-anchor="middle">右半有序: nums[mid]=2 &lt;= nums[hi-1]=3</text><text x="20" y="372" font-size="14" fill="#0B0B0B" text-anchor="start">target 在里面吗? nums[mid] &lt; target &lt;= nums[hi-1] → 2 &lt; 3 &lt;= 3 → True</text><text x="20" y="394" font-size="14" fill="#712B13" text-anchor="start">在 → 去有序的右半找: lo = mid + 1 = 8</text><line x1="20" y1="410" x2="660" y2="410" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="432" font-size="12" fill="#52514E" text-anchor="start">判断 "哪半有序": 左半有序 ⇔ nums[lo] &lt;= nums[mid] (元素不重复)。target 在有序那半就进去, 否则去另一半。</text><rect x="24" y="450" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="52" y="464" font-size="12" fill="#52514E" text-anchor="start">仍在 [lo, hi) 里</text><rect x="232" y="450" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="260" y="464" font-size="12" fill="#52514E" text-anchor="start">已排除</text><rect x="317" y="447" width="24" height="24" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="348" y="464" font-size="12" fill="#52514E" text-anchor="start">mid</text></svg>
