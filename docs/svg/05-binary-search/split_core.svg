<svg width="100%" viewBox="0 0 680 426" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>split array 的 feasible</title><desc>和 Capacity 同一个 feasible</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">nums = [7, 2, 5, 10, 8], k = 2 · 切成 k 段, 让 "最大的那段和" 尽量小 (最小的最大值)</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">反过来问: 每段和 &lt;= x 的话, 最少要切几段? 如果 &lt;= k 段, x 就是 feasible</text><text x="20" y="74" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">x = 17: 切成 3 段 &gt; k = 2 → False</text><rect x="60" y="86" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="107.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">7</text><rect x="160" y="86" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="207.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">2</text><rect x="260" y="86" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="307.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="360" y="86" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="407.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">10</text><rect x="460" y="86" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="507.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">8</text><rect x="60" y="122" width="294" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="207.0" y="140" font-size="12" fill="#085041" text-anchor="middle">7 + 2 + 5 = 14</text><text x="207.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 1 段</text><rect x="360" y="122" width="94" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="407.0" y="140" font-size="12" fill="#085041" text-anchor="middle">10</text><text x="407.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 2 段</text><rect x="460" y="122" width="94" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="507.0" y="140" font-size="12" fill="#085041" text-anchor="middle">8</text><text x="507.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 3 段</text><line x1="20" y1="182" x2="660" y2="182" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="206" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">x = 18: 切成 2 段 &lt;= k = 2 → True</text><rect x="60" y="218" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="107.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">7</text><rect x="160" y="218" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="207.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">2</text><rect x="260" y="218" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="307.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="360" y="218" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="407.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">10</text><rect x="460" y="218" width="94" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="507.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">8</text><rect x="60" y="254" width="294" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="207.0" y="272" font-size="12" fill="#085041" text-anchor="middle">7 + 2 + 5 = 14</text><text x="207.0" y="296" font-size="12" fill="#52514E" text-anchor="middle">第 1 段</text><rect x="360" y="254" width="194" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="457.0" y="272" font-size="12" fill="#085041" text-anchor="middle">10 + 8 = 18</text><text x="457.0" y="296" font-size="12" fill="#52514E" text-anchor="middle">第 2 段</text><line x1="20" y1="314" x2="660" y2="314" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="342" font-size="12" fill="#52514E" text-anchor="start">x = 17: 7 + 2 + 5 = 14, 再加 10 = 24 &gt; 17, 另起一段; 10 + 8 = 18 &gt; 17, 再起一段 → 3 段 → False。</text><text x="20" y="362" font-size="12" fill="#52514E" text-anchor="start">x = 18: 7 + 2 + 5 = 14, 10 + 8 = 18 &lt;= 18 → 2 段 → True。</text><text x="20" y="388" font-size="14" fill="#0B0B0B" text-anchor="start">x 越大, 每段能装更多, 段数不会变多: 单调。答案 = 18。</text><text x="20" y="410" font-size="12" fill="#52514E" text-anchor="start">x 范围: 下限 max(nums) = 10, 上限 sum = 32。feasible 的写法和 Capacity 逐行相同 (days → k, cap → x)。</text></svg>
