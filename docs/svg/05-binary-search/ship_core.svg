<svg width="100%" viewBox="0 0 680 426" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>capacity 的贪心 feasible</title><desc>从左到右装, 装不下就另起一天, 数天数</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">weights = [1..10] (必须按顺序装), days = 5 · feasible(cap) = 贪心装完用的天数 &lt;= days</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">贪心: 今天装得下就装, 装不下才开新的一天 (对固定 cap 这样天数最少)</text><text x="20" y="74" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">cap = 14: 装 6 天 &gt; days = 5 → False</text><rect x="40" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="68.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">1</text><rect x="100" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="128.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">2</text><rect x="160" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="188.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">3</text><rect x="220" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="248.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">4</text><rect x="280" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="308.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="340" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="368.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">6</text><rect x="400" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="428.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">7</text><rect x="460" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="488.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">8</text><rect x="520" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="548.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">9</text><rect x="580" y="86" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="608.0" y="105.76" font-size="16" fill="#444441" text-anchor="middle">10</text><rect x="40" y="122" width="236" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="158.0" y="140" font-size="12" fill="#085041" text-anchor="middle">1 + 2 + 3 + 4 = 10</text><text x="158.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 1 天</text><rect x="280" y="122" width="116" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="338.0" y="140" font-size="12" fill="#085041" text-anchor="middle">5 + 6 = 11</text><text x="338.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 2 天</text><rect x="400" y="122" width="56" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="428.0" y="140" font-size="12" fill="#085041" text-anchor="middle">7</text><text x="428.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 3 天</text><rect x="460" y="122" width="56" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="488.0" y="140" font-size="12" fill="#085041" text-anchor="middle">8</text><text x="488.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 4 天</text><rect x="520" y="122" width="56" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="548.0" y="140" font-size="12" fill="#085041" text-anchor="middle">9</text><text x="548.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 5 天</text><rect x="580" y="122" width="56" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="608.0" y="140" font-size="12" fill="#085041" text-anchor="middle">10</text><text x="608.0" y="164" font-size="12" fill="#52514E" text-anchor="middle">第 6 天</text><line x1="20" y1="182" x2="660" y2="182" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="206" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">cap = 15: 装 5 天 &lt;= days = 5 → True</text><rect x="40" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="68.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">1</text><rect x="100" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="128.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">2</text><rect x="160" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="188.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">3</text><rect x="220" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="248.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">4</text><rect x="280" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="308.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">5</text><rect x="340" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="368.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">6</text><rect x="400" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="428.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">7</text><rect x="460" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="488.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">8</text><rect x="520" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="548.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">9</text><rect x="580" y="218" width="56" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="608.0" y="237.76" font-size="16" fill="#444441" text-anchor="middle">10</text><rect x="40" y="254" width="296" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="188.0" y="272" font-size="12" fill="#085041" text-anchor="middle">1 + 2 + 3 + 4 + 5 = 15</text><text x="188.0" y="296" font-size="12" fill="#52514E" text-anchor="middle">第 1 天</text><rect x="340" y="254" width="116" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="398.0" y="272" font-size="12" fill="#085041" text-anchor="middle">6 + 7 = 13</text><text x="398.0" y="296" font-size="12" fill="#52514E" text-anchor="middle">第 2 天</text><rect x="460" y="254" width="56" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="488.0" y="272" font-size="12" fill="#085041" text-anchor="middle">8</text><text x="488.0" y="296" font-size="12" fill="#52514E" text-anchor="middle">第 3 天</text><rect x="520" y="254" width="56" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="548.0" y="272" font-size="12" fill="#085041" text-anchor="middle">9</text><text x="548.0" y="296" font-size="12" fill="#52514E" text-anchor="middle">第 4 天</text><rect x="580" y="254" width="56" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="608.0" y="272" font-size="12" fill="#085041" text-anchor="middle">10</text><text x="608.0" y="296" font-size="12" fill="#52514E" text-anchor="middle">第 5 天</text><line x1="20" y1="314" x2="660" y2="314" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="342" font-size="12" fill="#52514E" text-anchor="start">cap = 14: 1+2+3+4 = 10, 再装 5 = 15 &gt; 14, 另起一天; 最后被迫装成 6 天 → False。</text><text x="20" y="362" font-size="12" fill="#52514E" text-anchor="start">cap = 15: 1+2+3+4+5 = 15 刚好装满, 后面 6+7, 8, 9, 10 共 5 天 → True。</text><text x="20" y="388" font-size="14" fill="#0B0B0B" text-anchor="start">cap 变大, 每天只会装得更多, 天数不会变多: feasible 单调, 答案 = 15。</text><text x="20" y="410" font-size="12" fill="#52514E" text-anchor="start">cap 范围: 下限 max(weights) = 10 (最重的包裹必须装得下), 上限 sum = 55 (一天全装)。</text></svg>
