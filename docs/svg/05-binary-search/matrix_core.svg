"#52514E" text-anchor="middle">4</text><rect x="450" y="82" width="28" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="447" y="79" width="34" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="464.0" y="101.32" font-size="12" fill="#444441" text-anchor="middle">11</text><text x="464.0" y="128" font-size="12" fill="#52514E" text-anchor="middle">5</text><rect x="480" y="82" width="28" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="494.0" y="101.32" font-size="12" fill="#444441" text-anchor="middle">16</text><text x="494.0" y="128" font-size="12" fill="#52514E" text-anchor="middle">6</text><rect x="510" y="82" width="28" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="524.0" y="101.32" font-size="12" fill="#444441" text-anchor="middle">20</text><text x="524.0" y="128" font-size="12" fill="#52514E" text-anchor="middle">7</text><rect x="540" y="82" width="28" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="554.0" y="101.32" font-size="12" fill="#444441" text-anchor="middle">23</text><text x="554.0" y="128" font-size="12" fill="#52514E" text-anchor="middle">8</text><rect x="570" y="82" width="28" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="584.0" y="101.32" font-size="12" fill="#444441" text-anchor="middle">30</text><text x="584.0" y="128" font-size="12" fill="#52514E" text-anchor="middle">9</text><rect x="600" y="82" width="28" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="614.0" y="101.32" font-size="12" fill="#444441" text-anchor="middle">34</text><text x="614.0" y="128" font-size="12" fill="#52514E" text-anchor="middle">10</text><rect x="630" y="82" width="28" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="644.0" y="101.32" font-size="12" fill="#444441" text-anchor="middle">60</text><text x="644.0" y="128" font-size="12" fill="#52514E" text-anchor="middle">11</text><text x="300" y="150" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">mid = 5 的例子:</text><text x="300" y="172" font-size="14" fill="#0B0B0B" text-anchor="start">row = 5 // 4 = 1</text><text x="300" y="194" font-size="14" fill="#0B0B0B" text-anchor="start">col = 5 % 4 = 1</text><text x="300" y="216" font-size="14" fill="#0B0B0B" text-anchor="start">matrix[1][1] = 11 = flat[5]</text><line x1="20" y1="244" x2="660" y2="244" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="270" font-size="14" fill="#0B0B0B" text-anchor="start">二分的对象从 "数组" 换成 "下标 0..m*n-1", 其余和 first_true 完全一样。</text><text x="20" y="292" font-size="12" fill="#52514E" text-anchor="start">pred(i) = matrix[i // n][i % n] &gt;= target, 仍是 False...False True...True。</text></svg>
