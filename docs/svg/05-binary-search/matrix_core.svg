<svg width="100%" viewBox="0 0 680 314" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>2D 当 1D</title><desc>行优先拼接后是 sorted 数组, 下标 i 对应 (i // n, i % n)</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">每行 sorted, 且每行第一个数 &gt; 上一行最后一个数 → 按行拼起来就是一个 sorted 的长数组</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">不用真的拼: 下标 i 对应 matrix[i // n][i % n], n = 列数 = 4</text><rect x="40" y="66" width="54" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="46" y="80" font-size="12" fill="#52514E" text-anchor="start">i=0</text><text x="67.0" y="101" font-size="16" fill="#444441" text-anchor="middle">1</text><rect x="96" y="66" width="54" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="102" y="80" font-size="12" fill="#52514E" text-anchor="start">i=1</text><text x="123.0" y="101" font-size="16" fill="#444441" text-anchor="middle">3</text><rect x="152" y="66" width="54" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="158" y="80" font-size="12" fill="#52514E" text-anchor="start">i=2</text><text x="179.0" y="101" font-size="16" fill="#444441" text-anchor="middle">5</text><rect 