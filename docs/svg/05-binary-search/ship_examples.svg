<text x="363.0" y="150" font-size="11" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central" style="white-space:pre">9</text>
<text x="40" y="170" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">cap = 15: [1,2,3,4,5]=15 | [6,7]=13 | [8]=8 | [9]=9 | [10]=10 → 5 天 ✓</text>
<text x="40" y="188" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">cap = 14: [1..4]=10 | [5,6]=11 | [7]=7 | [8]=8 | [9]=9 | [10]=10 → 6 天 ✗</text>
<line x1="40" y1="212" x2="640" y2="212" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<rect x="33" y="227" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="54" y="234" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">包裹重量</text></svg>
