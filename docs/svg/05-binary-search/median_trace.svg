<svg width="100%" viewBox="0 0 680 492" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>median trace</title><desc>pred(i) = A[i] &gt;= B[j-1] (j = half - i): 切小了是 False, 够了是 True</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">A = [1, 3, 8, 9, 15], B = [7, 11, 18, 19, 21, 25] · half = 6 · 搜 i ∈ [0, 5] (i = 5 当作 True)</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">pred(i) = A[i] &gt;= B[j-1] (j = half - i): 切小了是 False, 够了是 True</text><text x="20" y="72" font-size="12" fill="#52514E" text-anchor="start">lo / hi / mid</text><text x="140" y="72" font-size="12" fill="#52514E" text-anchor="start">答案范围 [0, 6) 里还剩哪段</text><text x="352" y="72" font-size="12" fill="#52514E" text-anchor="start">feasible(mid) → 动作</text><line x1="20" y1="82" x2="660" y2="82" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="104" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="104" width="190.0" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="250.83333333333334" y1="98" x2="250.83333333333334" y2="132" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="146" font-size="12" fill="#52514E" text-anchor="start">0</text><text x="330" y="146" font-size="12" fill="#52514E" text-anchor="end">6</text><text x="20" y="114" font-size="14" fill="#0B0B0B" text-anchor="start">lo=0  hi=6</text><text x="20" y="134" font-size="12" fill="#52514E" text-anchor="start">mid=(0+6)//2=3</text><text x="352" y="108" font-size="12" fill="#52514E" text-anchor="start">i = 3, j = 6 - 3 = 3</text><text x="352" y="127" font-size="14" fill="#0B0B0B" text-anchor="start">A[3] = 9 &gt;= B[2] = 18 → False</text><text x="352" y="146" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 4 (A 取少了)</text><line x1="20" y1="166" x2="660" y2="166" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="188" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="266.66666666666663" y="188" width="63.33333333333337" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="314.16666666666663" y1="182" x2="314.16666666666663" y2="216" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="230" font-size="12" fill="#52514E" text-anchor="start">0</text><text x="330" y="230" font-size="12" fill="#52514E" text-anchor="end">6</text><text x="20" y="198" font-size="14" fill="#0B0B0B" text-anchor="start">lo=4  hi=6</text><text x="20" y="218" font-size="12" fill="#52514E" text-anchor="start">mid=(4+6)//2=5</text><text x="352" y="192" font-size="12" fill="#52514E" text-anchor="start">i = 5 = m, j = 6 - 5 = 1</text><text x="352" y="211" font-size="14" fill="#0B0B0B" text-anchor="start">A 全部进左半, 不用比 → True</text><text x="352" y="230" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 5</text><line x1="20" y1="250" x2="660" y2="250" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="272" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="266.66666666666663" y="272" width="31.666666666666742" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="282.5" y1="266" x2="282.5" y2="300" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="314" font-size="12" fill="#52514E" text-anchor="start">0</text><text x="330" y="314" font-size="12" fill="#52514E" text-anchor="end">6</text><text x="20" y="282" font-size="14" fill="#0B0B0B" text-anchor="start">lo=4  hi=5</text><text x="20" y="302" font-size="12" fill="#52514E" text-anchor="start">mid=(4+5)//2=4</text><text x="352" y="276" font-size="12" fill="#52514E" text-anchor="start">i = 4, j = 6 - 4 = 2</text><text x="352" y="295" font-size="14" fill="#0B0B0B" text-anchor="start">A[4] = 15 &gt;= B[1] = 11 → True</text><text x="352" y="314" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 4</text><line x1="20" y1="334" x2="660" y2="334" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="356" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="266.66666666666663" y="356" width="1.5" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="140" y="398" font-size="12" fill="#52514E" text-anchor="start">0</text><text x="330" y="398" font-size="12" fill="#52514E" text-anchor="end">6</text><text x="20" y="366" font-size="14" fill="#0B0B0B" text-anchor="start">lo=4  hi=4</text><text x="352" y="360" font-size="14" fill="#085041" text-anchor="start">i = 4, j = 2</text><text x="352" y="379" font-size="12" fill="#085041" text-anchor="start">左半 = 1, 3, 8, 9 + 7, 11 (6 个)</text><text x="352" y="398" font-size="14" fill="#085041" text-anchor="start">max(9, 11) = 11</text><line x1="20" y1="410" x2="660" y2="410" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="440" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="600">median = 11</text><rect x="24" y="458" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="52" y="472" font-size="12" fill="#52514E" text-anchor="start">仍在 [lo, hi) 里</text><rect x="232" y="458" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="260" y="472" font-size="12" fill="#52514E" text-anchor="start">已排除</text><rect x="317" y="455" width="24" height="24" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="348" y="472" font-size="12" fill="#52514E" text-anchor="start">mid = i</text></svg>
