<svg width="100%" viewBox="0 0 680 576" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>koko trace</title><desc>hours 里每一项 = ceil(pile / mid), 灰色 = 还在 [lo, hi) 里, 红色 = 已排除</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">piles = [3, 6, 7, 11], h = 8 · 搜 k ∈ [1, 11], 每步: 算 hours(mid) 和 h 比</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">hours 里每一项 = ceil(pile / mid), 灰色 = 还在 [lo, hi) 里, 红色 = 已排除</text><text x="20" y="72" font-size="12" fill="#52514E" text-anchor="start">lo / hi / mid</text><text x="140" y="72" font-size="12" fill="#52514E" text-anchor="start">答案范围 [1, 12) 里还剩哪段</text><text x="352" y="72" font-size="12" fill="#52514E" text-anchor="start">feasible(mid) → 动作</text><line x1="20" y1="82" x2="660" y2="82" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="104" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="104" width="190.0" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="235.0" y1="98" x2="235.0" y2="132" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="146" font-size="12" fill="#52514E" text-anchor="start">1</text><text x="330" y="146" font-size="12" fill="#52514E" text-anchor="end">12</text><text x="20" y="114" font-size="14" fill="#0B0B0B" text-anchor="start">lo=1  hi=12</text><text x="20" y="134" font-size="12" fill="#52514E" text-anchor="start">mid=(1+12)//2=6</text><text x="352" y="108" font-size="14" fill="#0B0B0B" text-anchor="start">k = 6: hours = 1 + 1 + 2 + 2 = 6</text><text x="352" y="127" font-size="14" fill="#0B0B0B" text-anchor="start">6 &lt;= h = 8 → True</text><text x="352" y="146" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 6 (答案 &lt;= 6)</text><line x1="20" y1="166" x2="660" y2="166" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="188" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="188" width="86.36363636363637" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="183.1818181818182" y1="182" x2="183.1818181818182" y2="216" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="230" font-size="12" fill="#52514E" text-anchor="start">1</text><text x="330" y="230" font-size="12" fill="#52514E" text-anchor="end">12</text><text x="20" y="198" font-size="14" fill="#0B0B0B" text-anchor="start">lo=1  hi=6</text><text x="20" y="218" font-size="12" fill="#52514E" text-anchor="start">mid=(1+6)//2=3</text><text x="352" y="192" font-size="14" fill="#0B0B0B" text-anchor="start">k = 3: hours = 1 + 2 + 3 + 4 = 10</text><text x="352" y="211" font-size="14" fill="#0B0B0B" text-anchor="start">10 &gt; h = 8 → False</text><text x="352" y="230" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 4 (答案 &gt; 3)</text><line x1="20" y1="250" x2="660" y2="250" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="272" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="191.8181818181818" y="272" width="34.54545454545456" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="217.72727272727275" y1="266" x2="217.72727272727275" y2="300" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="314" font-size="12" fill="#52514E" text-anchor="start">1</text><text x="330" y="314" font-size="12" fill="#52514E" text-anchor="end">12</text><text x="20" y="282" font-size="14" fill="#0B0B0B" text-anchor="start">lo=4  hi=6</text><text x="20" y="302" font-size="12" fill="#52514E" text-anchor="start">mid=(4+6)//2=5</text><text x="352" y="276" font-size="14" fill="#0B0B0B" text-anchor="start">k = 5: hours = 1 + 2 + 2 + 3 = 8</text><text x="352" y="295" font-size="14" fill="#0B0B0B" text-anchor="start">8 &lt;= h = 8 → True</text><text x="352" y="314" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 5 (答案 &lt;= 5)</text><line x1="20" y1="334" x2="660" y2="334" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="356" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="191.8181818181818" y="356" width="17.27272727272728" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="200.45454545454544" y1="350" x2="200.45454545454544" y2="384" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="398" font-size="12" fill="#52514E" text-anchor="start">1</text><text x="330" y="398" font-size="12" fill="#52514E" text-anchor="end">12</text><text x="20" y="366" font-size="14" fill="#0B0B0B" text-anchor="start">lo=4  hi=5</text><text x="20" y="386" font-size="12" fill="#52514E" text-anchor="start">mid=(4+5)//2=4</text><text x="352" y="360" font-size="14" fill="#0B0B0B" text-anchor="start">k = 4: hours = 1 + 2 + 2 + 3 = 8</text><text x="352" y="379" font-size="14" fill="#0B0B0B" text-anchor="start">8 &lt;= h = 8 → True</text><text x="352" y="398" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 4 (答案 &lt;= 4)</text><line x1="20" y1="418" x2="660" y2="418" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="440" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="191.8181818181818" y="440" width="1.5" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="140" y="482" font-size="12" fill="#52514E" text-anchor="start">1</text><text x="330" y="482" font-size="12" fill="#52514E" text-anchor="end">12</text><text x="20" y="450" font-size="14" fill="#0B0B0B" text-anchor="start">lo=4  hi=4</text><text x="352" y="444" font-size="14" fill="#085041" text-anchor="start">lo == hi == 4</text><text x="352" y="463" font-size="14" fill="#085041" text-anchor="start">最小速度 = 4</text><rect x="191.8181818181818" y="440" width="17.272727272727273" height="22" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><line x1="20" y1="494" x2="660" y2="494" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="524" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="600">min speed = 4</text><rect x="24" y="542" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="52" y="556" font-size="12" fill="#52514E" text-anchor="start">仍在 [lo, hi) 里</text><rect x="232" y="542" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="260" y="556" font-size="12" fill="#52514E" text-anchor="start">已排除</text><rect x="317" y="539" width="24" height="24" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="348" y="556" font-size="12" fill="#52514E" text-anchor="start">mid</text></svg>
