x="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="378.0" y="133.04" font-size="14" fill="#444441" text-anchor="middle">3</text><text x="20" y="132" font-size="14" fill="#0B0B0B" text-anchor="start">lo=0  hi=9</text><text x="20" y="152" font-size="12" fill="#52514E" text-anchor="start">mid=(0+9)//2=4</text><text x="410" y="126" font-size="12" fill="#52514E" text-anchor="start">nums[lo]=4 &lt;= nums[mid]=8: 左半有序</text><text x="410" y="145" font-size="14" fill="#0B0B0B" text-anchor="start">4 &lt;= 3 &lt; 8 ? False</text><text x="410" y="164" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 5 (丢左半)</text><line x1="20" y1="170" x2="660" y2="170" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="124" y="182" width="28" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="138.0" y="203.04" font-size="14" fill="#712B13" text-anchor="middle">4</text><rect x="154" y="182" width="28" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="168.0" y="203.04" font-size="14" fill="#712B13" text-anchor="middle">5</text><rect x="184" y="182" width="28" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="198.0" y="203.04" font-size="14" fill="#712B13" text-anchor="middle">6</text><rect x="214" y="182" width="28" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="228.0" y="203.04" font-size="14" fill="#712B13" text-anchor="middle">7</text><rect x="244" y="182" width="28" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="258.0" y="203.04" font-size="14" fill="#712B13" text-anchor="middle">8</text><rect x="274" y="182" width="28" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="288.0" y="203.04" font-size="14" fill="#444441" text-anchor="middle">9</text><rect x="304" y="182" width="28" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="318.0" y="203.04" font-