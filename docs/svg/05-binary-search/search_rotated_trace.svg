<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>rotated search trace</title><desc>invariant: target 如果存在, 一定在 [lo, hi) 里 (红色格子已经排除)</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">target = 3 · 每步先看 nums[lo] &lt;= nums[mid] 判断哪半有序, 再看 target 在不在有序那半</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">invariant: target 如果存在, 一定在 [lo, hi) 里 (红色格子已经排除)</text><text x="20" y="72" font-size="12" fill="#52514E" text-anchor="start">lo / hi / mid</text><text x="124" y="72" font-size="12" fill="#52514E" text-anchor="start">数组 (上面是下标)</text><text x="410" y="72" font-size="12" fill="#52514E" text-anchor="start">哪半有序 → target 在不在 → 动作</text><line x1="20" y1="82" x2="660" y2="82" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="139.0" y="98" font-size="12" fill="#52514E" text-anchor="middle">0</text><text x="169.0" y="98" font-size="12" fill="#52514E" text-anchor="middle">1</text><text x="199.0" y="98" font-size="12" fill="#52514E" text-anchor="middle">2</text><text x="229.0" y="98" font-size="12" fill="#52514E" text-anchor="middle">3</text><text x="259.0" y="98" font-size="12" fill="#52514E" text-anc