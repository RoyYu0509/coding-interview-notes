" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="328" width="45.434782608695656" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="162.7173913043478" y1="322" x2="162.7173913043478" y2="356" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="370" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="370" font-size="12" fill="#52514E" text-anchor="end">56</text><text x="20" y="338" font-size="14" fill="#0B0B0B" text-anchor="start">lo=10  hi=21</text><text x="20" y="358" font-size="12" fill="#52514E" text-anchor="start">mid=(10+21)//2=15</text><text x="352" y="332" font-size="12" fill="#52514E" text-anchor="start">cap = 15: 1 + 2 + 3 + 4 + 5 = 15 | 6 + 7 = 13 | 8</text><text x="352" y="351" font-size="12" fill="#52514E" text-anchor="start">9 | 10</text><text x="352" y="370" font-size="14" fill="#0B0B0B" text-anchor="start">5 天 &lt;= days = 5 → True</text><text x="352" y="389" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 15</text><line x1="20" y1="418" x2="660" y2="418" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="440" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="440" width="20.65217391304347" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="150.32608695652175" y1="434" x2="150.32608695652175" y2="468" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="482" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="482" font-size="12" fill="#52514E" text-anchor="end">56</text><text x="20" y="450" font-size="14" fill="#0B0B0B" text-anchor="start">lo=10  hi=15</text><text x="20" y="470" font-size="12" fill="#52514E" text-anchor="start">mid=(10+15)//2=12</text><text x="352" y="444" font-size="12" fill="#52514E" text-anchor="start">cap = 12: 1 + 2 + 3 + 4 = 10 | 5 + 6 = 11 | 7 | 8</text><text x="352" y="463" font-size="12" fill="#52514E" text-anchor="start">9 | 10</text><text x="352" y="482" font-size="14" fill="#0B0B0B" text-anchor="start">6 天 &gt; days = 5 → False</text><text x="352" y="501" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 13</text><line x1="20" y1="530" x2="660" y2="530" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="552" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="152.3913043478261" y="552" width="8.260869565217376" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="158.58695652173913" y1="546" x2="158.58695652173913" y2="580" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="594" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="594" font-size="12" fill="#52514E" text-anchor="end">56</text><text x="20" y="562" font-size="14" fill="#0B0B0B" text-anchor="start">lo=13  hi=15</text><text x="20" y="582" font-size="12" fill="#52514E" text-anchor="start">mid=(13+15)//2=14</text><text x="352" y="556" font-size="12" fill="#52514E" text-anchor="start">cap = 14: 1 + 2 + 3 + 4 = 10 | 5 + 6 = 11 | 7 | 8</text><text x="352" y="575" font-size="12" fill="#52514E" text-anchor="start">9 | 10</text><text x="352" y="594" font-size="14" fill="#0B0B0B" text-anchor="start">6 天 &gt; days = 5 → False</text><text x="352" y="613" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 15</text><line x1="20" y1="642" x2="660" y2="642" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="664" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="160.65217391304347" y="664" width="1.5" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="140" y="706" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="706" font-size="12" fill="#52514E" text-anchor="end">56</text><text x="20" y="674" font-size="14" fill="#0B0B0B" text-anchor="start">lo=15  hi=15</text><text x="352" y="668" font-size="14" fill="#085041" text-anchor="start">lo == hi == 15</text><text x="352" y="687" font-size="14" fill="#085041" text-anchor="start">最小载重 = 15</text><rect x="160.65217391304347" y="664" width="4.130434782608695" height="22" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><line x1="20" y1="718" x2="660" y2="718" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="748" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="600">min capacity = 15</text><rect x="24" y="766" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="52" y="780" font-size="12" fill="#52514E" text-anchor="start">仍在 [lo, hi) 里</text><rect x="232" y="766" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="260" y="780" font-size="12" fill="#52514E" text-anchor="start">已排除</text><rect x="317" y="763" width="24" height="24" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="348" y="780" font-size="12" fill="#52514E" text-anchor="start">mid</text></svg>
