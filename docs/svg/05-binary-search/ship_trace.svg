<svg width="100%" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>ship trace</title><desc>每组写出具体的相加: 1 + 2 + 3 = 6 表示这一天装了 1, 2, 3 三个包裹, 共 6</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">weights = [1..10], days = 5 · 搜 cap ∈ [10, 55] · 每步: 贪心分组, 数天数 (一个 | 是一天)</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">每组写出具体的相加: 1 + 2 + 3 = 6 表示这一天装了 1, 2, 3 三个包裹, 共 6</text><text x="20" y="72" font-size="12" fill="#52514E" text-anchor="start">lo / hi / mid</text><text x="140" y="72" font-size="12" fill="#52514E" text-anchor="start">答案范围 [10, 56) 里还剩哪段</text><text x="352" y="72" font-size="12" fill="#52514E" text-anchor="start">feasible(mid) → 动作</text><line x1="20" y1="82" x2="660" y2="82" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="104" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="104" width="190.0" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="237.06521739130437" y1="98" x2="237.06521739130437" y2="132" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="146" font-size="12" fill="#52514E" text-anchor="star