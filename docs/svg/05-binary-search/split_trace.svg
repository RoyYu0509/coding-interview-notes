<svg width="100%" viewBox="0 0 680 564" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>split trace</title><desc>每段写出具体的相加: 7 + 2 + 5 = 14 表示这一段是 7, 2, 5, 和为 14</desc><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="20" y="22" font-size="12" fill="#52514E" text-anchor="start">nums = [7, 2, 5, 10, 8], k = 2 · 搜 x ∈ [10, 32] · 每步: 贪心切段, 一个 | 是一段</text><text x="20" y="42" font-size="12" fill="#52514E" text-anchor="start">每段写出具体的相加: 7 + 2 + 5 = 14 表示这一段是 7, 2, 5, 和为 14</text><text x="20" y="72" font-size="12" fill="#52514E" text-anchor="start">lo / hi / mid</text><text x="140" y="72" font-size="12" fill="#52514E" text-anchor="start">答案范围 [10, 33) 里还剩哪段</text><text x="352" y="72" font-size="12" fill="#52514E" text-anchor="start">feasible(mid) → 动作</text><line x1="20" y1="82" x2="660" y2="82" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="104" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="104" width="190.0" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="235.0" y1="98" x2="235.0" y2="132" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="146" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="146" font-size="12" fill="#52514E" text-anchor="end">33</text><text x="20" y="114" font-size="14" fill="#0B0B0B" text-anchor="start">lo=10  hi=33</text><text x="20" y="134" font-size="12" fill="#52514E" text-anchor="start">mid=(10+33)//2=21</text><text x="352" y="108" font-size="12" fill="#52514E" text-anchor="start">x = 21: 7 + 2 + 5 = 14 | 10 + 8 = 18</text><text x="352" y="127" font-size="14" fill="#0B0B0B" text-anchor="start">2 段 &lt;= k = 2 → True</text><text x="352" y="146" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 21</text><line x1="20" y1="166" x2="660" y2="166" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="188" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="140.0" y="188" width="90.86956521739131" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="185.43478260869566" y1="182" x2="185.43478260869566" y2="216" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="230" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="230" font-size="12" fill="#52514E" text-anchor="end">33</text><text x="20" y="198" font-size="14" fill="#0B0B0B" text-anchor="start">lo=10  hi=21</text><text x="20" y="218" font-size="12" fill="#52514E" text-anchor="start">mid=(10+21)//2=15</text><text x="352" y="192" font-size="12" fill="#52514E" text-anchor="start">x = 15: 7 + 2 + 5 = 14 | 10 | 8</text><text x="352" y="211" font-size="14" fill="#0B0B0B" text-anchor="start">3 段 &gt; k = 2 → False</text><text x="352" y="230" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 16</text><line x1="20" y1="250" x2="660" y2="250" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="272" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="189.56521739130434" y="272" width="41.30434782608697" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="210.2173913043478" y1="266" x2="210.2173913043478" y2="300" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="314" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="314" font-size="12" fill="#52514E" text-anchor="end">33</text><text x="20" y="282" font-size="14" fill="#0B0B0B" text-anchor="start">lo=16  hi=21</text><text x="20" y="302" font-size="12" fill="#52514E" text-anchor="start">mid=(16+21)//2=18</text><text x="352" y="276" font-size="12" fill="#52514E" text-anchor="start">x = 18: 7 + 2 + 5 = 14 | 10 + 8 = 18</text><text x="352" y="295" font-size="14" fill="#0B0B0B" text-anchor="start">2 段 &lt;= k = 2 → True</text><text x="352" y="314" font-size="12" fill="#712B13" text-anchor="start">hi = mid = 18</text><line x1="20" y1="334" x2="660" y2="334" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="356" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="189.56521739130434" y="356" width="16.52173913043478" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><line x1="201.95652173913044" y1="350" x2="201.95652173913044" y2="384" stroke="#EF9F27" stroke-width="2.5"/><text x="140" y="398" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="398" font-size="12" fill="#52514E" text-anchor="end">33</text><text x="20" y="366" font-size="14" fill="#0B0B0B" text-anchor="start">lo=16  hi=18</text><text x="20" y="386" font-size="12" fill="#52514E" text-anchor="start">mid=(16+18)//2=17</text><text x="352" y="360" font-size="12" fill="#52514E" text-anchor="start">x = 17: 7 + 2 + 5 = 14 | 10 | 8</text><text x="352" y="379" font-size="14" fill="#0B0B0B" text-anchor="start">3 段 &gt; k = 2 → False</text><text x="352" y="398" font-size="12" fill="#712B13" text-anchor="start">lo = mid + 1 = 18</text><line x1="20" y1="418" x2="660" y2="418" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><rect x="140" y="440" width="190" height="22" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><rect x="206.08695652173913" y="440" width="1.5" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="140" y="482" font-size="12" fill="#52514E" text-anchor="start">10</text><text x="330" y="482" font-size="12" fill="#52514E" text-anchor="end">33</text><text x="20" y="450" font-size="14" fill="#0B0B0B" text-anchor="start">lo=18  hi=18</text><text x="352" y="444" font-size="14" fill="#085041" text-anchor="start">lo == hi == 18</text><text x="352" y="463" font-size="14" fill="#085041" text-anchor="start">最小的最大段和 = 18</text><line x1="20" y1="482" x2="660" y2="482" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="512" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="600">min largest sum = 18</text><rect x="24" y="530" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="52" y="544" font-size="12" fill="#52514E" text-anchor="start">仍在 [lo, hi) 里</text><rect x="232" y="530" width="18" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="260" y="544" font-size="12" fill="#52514E" text-anchor="start">已排除</text><rect x="317" y="527" width="24" height="24" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="348" y="544" font-size="12" fill="#52514E" text-anchor="start">mid</text></svg>
