<svg width="100%" viewBox="0 0 680 410" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Why drop smaller tail elements</title><desc>Elements smaller than a newcomer and older than it can never be the window maximum again.</desc><defs><marker id="c5-arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c5-arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">nums = [1, 3, −1, −3, 5, 3, 6, 7], k = 3 · 看 i = 4 (x = 5) 到来的这一刻</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">idx j 在窗口里的时间 = i ∈ [j, j + 2] (窗口 [i − 2, i] 里有 j)</text>
<text x="180" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i = 1</text>
<text x="250" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i = 2</text>
<text x="320" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i = 3</text>
<text x="390" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i = 4</text>
<text x="460" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i = 5</text>
<text x="530" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i = 6</text>
<text x="600" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i = 7</text>
<text x="40" y="96" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">idx 1 · 值 3</text>
<rect x="150" y="84" width="60" height="24" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="220" y="84" width="60" height="24" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="290" y="84" width="60" height="24" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="40" y="134" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">idx 2 · 值 −1</text>
<rect x="220" y="122" width="60" height="24" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="290" y="122" width="60" height="24" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="360" y="122" width="60" height="24" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="40" y="172" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">idx 3 · 值 −3</text>
<rect x="290" y="160" width="60" height="24" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="360" y="160" width="60" height="24" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="430" y="160" width="60" height="24" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="40" y="210" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">idx 4 · 值 5</text>
<rect x="360" y="198" width="60" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="430" y="198" width="60" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="500" y="198" width="60" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<line x1="355" y1="76" x2="355" y2="240" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="355" y="252" font-size="12" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">i = 4: 5 进来</text>
<text x="362" y="96" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">idx 1 已滑出窗口 [2, 4] → 队头过期</text>
<text x="504" y="134" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">← −1 &lt; 5</text>
<text x="504" y="172" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">← −3 &lt; 5</text>
<line x1="40" y1="270" x2="640" y2="270" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="284" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">红色段: −1、−3 比 5 小, 又比 5 先过期 → 它们还活着的每一刻 5 都在窗口里且更大</text>
<text x="40" y="304" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">→ 永远当不了最大 → 队尾比 x 小的直接丢 (从尾部 pop)</text>
<text x="40" y="330" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">留下的 deque 从头到尾递减 → 队头 = 窗口最大 → 取最大 O(1)</text>
<text x="40" y="350" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">队头最老, 最先过期 → 过期的从头部 popleft · 每个元素最多进出一次 → O(n)</text>
<rect x="40" y="376" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="70" y="384" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">还在窗口里</text><rect x="160" y="376" width="22" height="16" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="190" y="384" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">被 5 压住 (永远不是最大)</text><rect x="366.4" y="376" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="396.4" y="384" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">新来的最大</text>
</svg>
