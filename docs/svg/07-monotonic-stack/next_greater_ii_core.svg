<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Circular array doubled</title><desc>Walk 2n indices with i % n; wrap-around gives elements at the end a second chance.</desc><defs><marker id="c2-arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c2-arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">nums = [2, 3, 1] · 循环数组: 最后一个元素的 "右边" 要绕回开头</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">把数组虚拟地拼成两份, 取值用 nums[i % n], 不真的拷贝</text>
<text x="88" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=0</text>
<rect x="60" y="84" width="56" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="88.0" y="101.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<text x="88" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">idx 0</text>
<text x="178" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=1</text>
<rect x="150" y="84" width="56" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="178.0" y="101.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<text x="178" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">idx 1</text>
<text x="268" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=2</text>
<rect x="240" y="84" width="56" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="268.0" y="101.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<text x="268" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">idx 2</text>
<text x="358" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=3</text>
<rect x="330" y="84" width="56" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2"/><text x="358.0" y="101.0" font-size="14" fill="#52514E" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<text x="358" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">idx 0</text>
<text x="448" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=4</text>
<rect x="420" y="84" width="56" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2"/><text x="448.0" y="101.0" font-size="14" fill="#52514E" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<text x="448" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">idx 1</text>
<text x="538" y="70" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=5</text>
<rect x="510" y="84" width="56" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2"/><text x="538.0" y="101.0" font-size="14" fill="#52514E" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<text x="538" y="134" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">idx 2</text>
<text x="60" y="160" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">第 1 圈: 真实数组, 要 push</text>
<text x="330" y="160" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">第 2 圈: 虚拟拷贝, 不 push</text>
<line x1="313" y1="62" x2="313" y2="170" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M268 176 C268 216 358 216 358 178" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#c2-arrG)"/>
<text x="313.0" y="222" font-size="12" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">idx 2 (值 1): 第 1 圈右边没有更大的, 绕回去遇到 2</text>
<text x="313.0" y="240" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">ans[2] = 2</text>
<text x="40" y="282" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">idx 1 (值 3): 第 2 圈遇到 3 (不 &gt; 3), 绕一圈也没有更大的 → ans[1] = −1</text>
<line x1="40" y1="302" x2="640" y2="302" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="326" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">做法: 还是同一个递减栈, i 从 0 走到 2n − 1, x = nums[i % n]</text>
<text x="40" y="346" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">只在 i &lt; n 时 push: 第 2 圈只是给栈里还没答案的元素 "再找一次"</text>
<text x="40" y="370" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">2n 次循环, 每个元素最多 push 1 次 / pop 1 次 → 仍是 O(n)</text>
<rect x="40" y="396" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="70" y="404" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">第 1 圈 (真实)</text><rect x="186.4" y="396" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="216.4" y="404" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">答案</text>
</svg>
