<svg width="100%" viewBox="0 0 680 396" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Daily Temperatures invariant</title><desc>Stack holds days still waiting for a warmer day, temperatures decreasing; pop settles the answer.</desc><defs><marker id="c1-arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c1-arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">T = [73, 74, 75, 71, 69, 72, 76, 73] · 走到 i = 5 (T = 72) 这一刻</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">invariant: 栈里 = 还没等到更高温的那些天 · 从底到顶温度递减</text>
<text x="62" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=0</text>
<rect x="40" y="78" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text x="62.0" y="93.0" font-size="14" fill="#52514E" font-weight="500" text-anchor="middle" dominant-baseline="central">73</text>
<text x="114" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=1</text>
<rect x="92" y="78" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text x="114.0" y="93.0" font-size="14" fill="#52514E" font-weight="500" text-anchor="middle" dominant-baseline="central">74</text>
<text x="166" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=2</text>
<rect x="144" y="78" width="44" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="166.0" y="93.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">75</text>
<text x="218" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=3</text>
<rect x="196" y="78" width="44" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="218.0" y="93.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">71</text>
<text x="270" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=4</text>
<rect x="248" y="78" width="44" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="270.0" y="93.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">69</text>
<text x="322" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=5</text>
<rect x="300" y="78" width="44" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="322.0" y="93.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">72</text><rect x="297" y="75" width="50" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="374" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=6</text>
<rect x="352" y="78" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2"/><text x="374.0" y="93.0" font-size="14" fill="#52514E" font-weight="500" text-anchor="middle" dominant-baseline="central">76</text>
<text x="426" y="66" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">i=7</text>
<rect x="404" y="78" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2"/><text x="426.0" y="93.0" font-size="14" fill="#52514E" font-weight="500" text-anchor="middle" dominant-baseline="central">73</text>
<text x="40" y="128" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">已结算</text>
<text x="144" y="128" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">在栈里 (还在等)</text>
<text x="296" y="128" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">当前</text>
<text x="352" y="128" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">还没看到</text>
<line x1="40" y1="146" x2="640" y2="146" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M70 214 L70 330 L154 330 L154 214" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/><rect x="76" y="302.0" width="72" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="112.0" y="314.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2·75</text><rect x="76" y="274.0" width="72" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="112.0" y="286.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3·71</text><rect x="76" y="246.0" width="72" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="112.0" y="258.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">4·69</text><rect x="73" y="243.0" width="78" height="30" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="112.0" y="344" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">底</text>
<text x="112.0" y="164" font-size="12" fill="#52514E" font-weight="400" text-anchor="middle" dominant-baseline="central">栈 (T 递减: 75 ≥ 71 ≥ 69)</text>
<rect x="76" y="184" width="72" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="112.0" y="196.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">5·72</text>
<text x="230" y="176" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">T = 72 来了: while T[栈顶] &lt; 72</text>
<text x="230" y="206" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">69 &lt; 72 → pop 4·69, 它等到了: ans[4] = 5 − 4 = 1</text>
<text x="230" y="230" font-size="12" fill="#712B13" font-weight="400" text-anchor="start" dominant-baseline="central">71 &lt; 72 → pop 3·71, 它等到了: ans[3] = 5 − 3 = 2</text>
<text x="230" y="254" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">75 ≥ 72 → 停. 75 还在等更高温</text>
<text x="230" y="288" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">然后 push 5·72 → 栈 = [2·75, 5·72], 仍然递减</text>
<text x="230" y="312" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">为什么停在 75: 栈递减, 75 往下全是 ≥ 75 &gt; 72, 不用再看</text>
<text x="230" y="336" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">pop 的那一刻就是答案出现的那一刻 → 在 pop 里结算 ans</text>
<rect x="40" y="364" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="70" y="372" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">当前输入</text><rect x="148" y="364" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="178" y="372" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈里其他</text><rect x="256" y="364" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="253" y="361" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="286" y="372" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈顶 / 当前</text>
</svg>
