<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">pop 的那一刻: 高 = 被 pop 的 h · 右边界 = i · 左边界 = pop 后的新栈顶 (空则 −1) · w = i − 左 − 1</text>
