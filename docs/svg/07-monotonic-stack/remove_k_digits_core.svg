<svg width="100%" viewBox="0 0 680 388" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Why delete the first bigger digit</title><desc>Deleting the first digit that is larger than its successor gives the smallest number.</desc><defs><marker id="c4-arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c4-arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">num = "1432", 删 1 位 · 4 种删法, 哪个最小?</text>
<text x="40" y="38" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">位数相同 → 先比最高位, 高位越小越好</text>
<text x="40" y="81" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">删 idx 0</text>
<rect x="140" y="66" width="34" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/><text x="157.0" y="81.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="180" y="66" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="197.0" y="81.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="220" y="66" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="237.0" y="81.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="260" y="66" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="277.0" y="81.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M310 81 L350 81" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#c4-arrG)"/>
<rect x="360" y="66" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="392.0" y="81.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">432</text>
<text x="40" y="125" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">删 idx 1</text>
<rect x="140" y="110" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="157.0" y="125.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="180" y="110" width="34" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/><text x="197.0" y="125.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="220" y="110" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="237.0" y="125.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="260" y="110" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="277.0" y="125.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M310 125 L350 125" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#c4-arrG)"/>
<rect x="360" y="110" width="64" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="392.0" y="125.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">132</text><rect x="357" y="107" width="70" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="169" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">删 idx 2</text>
<rect x="140" y="154" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="157.0" y="169.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="180" y="154" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="197.0" y="169.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="220" y="154" width="34" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/><text x="237.0" y="169.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="260" y="154" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="277.0" y="169.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M310 169 L350 169" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#c4-arrG)"/>
<rect x="360" y="154" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="392.0" y="169.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">142</text>
<text x="40" y="213" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">删 idx 3</text>
<rect x="140" y="198" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="157.0" y="213.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="180" y="198" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="197.0" y="213.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="220" y="198" width="34" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="237.0" y="213.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="260" y="198" width="34" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2"/><text x="277.0" y="213.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M310 213 L350 213" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#c4-arrG)"/>
<rect x="360" y="198" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="392.0" y="213.0" font-size="14" fill="#444441" font-weight="500" text-anchor="middle" dominant-baseline="central">143</text>
<text x="440" y="125" font-size="14" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">← 最小: 删掉 4</text>
<line x1="40" y1="248" x2="640" y2="248" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="262" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">删 4: 第 2 位从 4 变成 3, 变小了; 删 3: 第 2 位还是 4, 没变小</text>
<text x="40" y="284" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">从左往右第一个 "比后一位大" 的数字 (4 &gt; 3) 删掉最划算</text>
<text x="40" y="306" font-size="14" fill="#0B0B0B" font-weight="500" text-anchor="start" dominant-baseline="central">= 栈顶 &gt; 当前数字时 pop 栈顶 (k 次这样的操作, 一次扫描完成)</text>
<text x="40" y="330" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">栈从底到顶非递减 = 高位尽量小 · 如果整个数字都是递增的, 就删最末尾的 k 位</text>
<rect x="40" y="354" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="70" y="362" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">保留的数字</text><rect x="160" y="354" width="22" height="16" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="190" y="362" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">删掉的数字</text><rect x="280" y="354" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="310" y="362" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">结果最小</text><rect x="388" y="354" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="385" y="351" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/><text x="418" y="362" font-size="12" fill="#52514E" font-weight="400" text-anchor="start" dominant-baseline="central">答案</text>
</svg>
