<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">目标: 保留尽量多的互不重叠 interval (= 删最少) · A=[1,11] B=[2,4] C=[4,6] D=[6,8]</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">贪心: 每次选 end 最小的 → 它占用的时间最短, 给后面留的空间最大 (start 小不代表占得少)</text>
