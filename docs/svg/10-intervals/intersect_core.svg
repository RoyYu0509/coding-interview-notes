<text x="458" y="149" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">hi = min(10, 12) = 10</text>
<text x="458" y="168" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">lo ≤ hi → 交集 [8,10]</text>
<text x="458" y="187" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">a.end 10 &lt; b.end 12 → i += 1</text>
<text x="458" y="206" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">a 够不到 b 后 (15 &gt; 10)</text>
