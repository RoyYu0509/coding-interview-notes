<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">按 start 排序 · 相邻两个 intervals[i-1], intervals[i] 只看 intervals[i].start &lt; intervals[i-1].end</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">有重叠 → 总会在某个相邻对暴露 · 没有一个相邻对重叠 → 链条一路向右, 全部不重叠</text>
