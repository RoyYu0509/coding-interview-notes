<svg width="100%" viewBox="0 0 680 688" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif'><title>Meeting Rooms II 的 min-heap 运行流程</title><desc>按 start 排序后逐个会议: 最早结束的房间已空出来就 pop, 然后 push 这场会议的 end, heap 大小即房间数</desc><defs><marker id="f14-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f14-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f14-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#C07A0A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f14-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">ends = min-heap, 存每个正在使用的房间里当前会议的 end · 画成 tree, 最上面的是最小的 (ring)</text>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">每一步: ends[0] ≤ s → 最早结束的房间空出来了, 先 pop → 再 push 这场会议的 end → rooms = len(ends)</text>
<text x="40" y="72" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#52514E">当前会议</text>
