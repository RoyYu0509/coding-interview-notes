<svg width="100%" viewBox="0 0 680 450" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>K Closest: keep-largest uses min-heap, keep-smallest uses max-heap</title><desc>rule: heap top is the element to evict</desc><defs><marker id="cc0-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="cc0-ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="450" fill="#FFFFFF"/>
<text x="40" y="18" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">规则: heap 里放 "留下的 k 个", top 放 "最该被踢掉的"</text>
<rect x="40" y="36" width="290" height="196" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<rect x="350" y="36" width="290" height="196" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="185" y="56" font-size="14" text-anchor="middle" fill="#0B0B0B" font-weight="600" dominant-baseline="central">Kth Largest</text>
<text x="185" y="76" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">留下最大的 k 个 → 踢最小的</text>
<line x1="185" y1="118" x2="151" y2="164" stroke="#898781" stroke-width="1.2"/>
<circle cx="185" cy="118" r="19" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="185" y="118" font-size="16" text-anchor="middle" fill="#444441" dominant-baseline="central">5</text>
<circle cx="185" cy="118" r="23" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<circle cx="151" cy="164" r="19" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="151" y="164" font-size="16" text-anchor="middle" fill="#444441" dominant-baseline="central">6</text>
<text x="185" y="208" font-size="14" text-anchor="middle" fill="#0B0B0B" dominant-baseline="central">top = 最小 → min-heap</text>
<text x="495" y="56" font-size="14" text-anchor="middle" fill="#0B0B0B" font-weight="600" dominant-baseline="central">K Closest Points</text>
<text x="495" y="76" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">留下 d 最小的 k 个 → 踢 d 最大的</text>
<line x1="495" y1="118" x2="461" y2="164" stroke="#898781" stroke-width="1.2"/>
<circle cx="495" cy="118" r="19" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="495" y="118" font-size="16" text-anchor="middle" fill="#444441" dominant-baseline="central">4</text>
<circle cx="495" cy="118" r="23" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<circle cx="461" cy="164" r="19" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="461" y="164" font-size="16" text-anchor="middle" fill="#444441" dominant-baseline="central">2</text>
<text x="495" y="208" font-size="14" text-anchor="middle" fill="#0B0B0B" dominant-baseline="central">top = 最大 → max-heap</text>
<line x1="40" y1="252" x2="640" y2="252" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="276" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">heapq 只有 min-heap, max-heap 的写法是存负数:</text>
<text x="40" y="300" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">heappush(h, (-d, x, y))   # 存 -d, 所以 top 是 -d 最小 = d 最大</text>
<text x="40" y="320" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">heappop(h)                 # 弹出 d 最大的</text>
<text x="40" y="340" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">图里一律画正数 d, 右边那棵 top = 4 就是 -4 最小</text>
<line x1="40" y1="376" x2="640" y2="376" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="398" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">d = x² + y², 不用开根号 (比大小等价)</text>
<text x="40" y="420" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">sort 全部: O(n log n) · size-k heap: O(n log k)</text>
</svg>
