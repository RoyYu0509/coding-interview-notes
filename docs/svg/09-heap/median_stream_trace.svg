<svg width="100%" viewBox="0 0 680 928" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Find Median from Data Stream: two heaps trace</title><desc>stream 5,2,8,3,9,1</desc><defs><marker id="md-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="md-ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="928" fill="#FFFFFF"/>
<text x="40" y="18" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">lo = max-heap (较小的一半, top = 最大) · hi = min-heap (较大的一半, top = 最小)</text>
<text x="40" y="38" font-size="14" text-anchor="start" fill="#52514E" dominant-baseline="central">每个 num: 先 push 进 lo → lo 的 top 移到 hi → hi 比 lo 多就把 hi 的 top 移回 lo</text>
<text x="40" y="64" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">num</text>
<text x="130" y="64" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">lo (max-heap)</text>
<text x="270" y="64" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">hi (min-heap)</text>
<text x="400" y="64" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">这一步发生了什么</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
