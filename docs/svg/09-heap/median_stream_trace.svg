<text x="330" y="264" font-size="16" text-anchor="middle" fill="#085041" dominant-baseline="central">5</text>
<circle cx="330" cy="264" r="23" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="400" y="232" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">push 2 → lo, lo 最大的 5 → hi</text>
<text x="400" y="252" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">len(hi) ≤ len(lo), 不用再移</text>
<text x="400" y="282" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">median = (2 + 5) / 2 = 3.5</text>
