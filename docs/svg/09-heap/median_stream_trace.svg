<text x="72" y="229" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">num</text>
<text x="72" y="246" font-size="16" text-anchor="middle" fill="#0B0B0B" dominant-baseline="central">2</text>
<circle cx="190" cy="264" r="19" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190" y="264" font-size="16" text-anchor="middle" fill="#085041" dominant-baseline="central">2</text>
<circle cx="190" cy="264" r="23" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M104 237 L190 237 L190 240" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#md-ag)"/>
