<text x="72" y="99" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">num</text>
<text x="72" y="116" font-size="16" text-anchor="middle" fill="#0B0B0B" dominant-baseline="central">5</text>
<circle cx="190" cy="134" r="19" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190" y="134" font-size="16" text-anchor="middle" fill="#085041" dominant-baseline="central">5</text>
<circle cx="190" cy="134" r="23" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M104 107 L190 107 L190 110" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#md-ag)"/>
<text x="330" y="134" font-size="14" text-anchor="middle" fill="#52514E" dominant-baseline="central">空</text>
<text x="400" y="102" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">push 5 → lo, lo 最大的 5 → hi</text>
<text x="400" y="122" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">len(hi) &gt; len(lo) → hi 最小的 5 → lo</text>
<text x="400" y="152" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">median = lo.top = 5</text>
<line x1="40" y1="204" x2="640" y2="204" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
