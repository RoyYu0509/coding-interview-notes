<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Hire K Workers: sort by rate, heap drops the biggest q</title><desc>worker D is current, B has the biggest q and is dropped</desc><defs><marker id="hc0-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hc0-ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/>
<text x="40" y="18" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">rate = wage / q · 每人 wage = rate × q · k = 3 · 现在处理到 D</text>
<text x="40" y="38" font-size="12" text-anchor="start" fill="#52514E" dominant-baseline="central">先按 rate 升序排好, 从左往右处理 (rate 越来越大)</text>
<rect x="40" y="60" width="66" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="73.0" y="71.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">A</text>
<text x="73.0" y="87.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">q = 10</text>
<text x="73.0" y="103.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">rate = 2</text>
<rect x="120" y="60" width="66" height="54" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="153.0" y="71.0" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">B</text>
<text x="153.0" y="87.0" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">q = 20</text>
<text x="153.0" y="103.0" font-size="14" text-anchor="middle" fill="#712B13" dominant-baseline="central">rate = 3</text>
<rect x="200" y="60" width="66" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="233.0" y="71.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">C</text>
<text x="233.0" y="87.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">q = 5</text>
<text x="233.0" y="103.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">rate = 4</text>
<rect x="280" y="60" width="66" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="276" y="56" width="74" height="62" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="313.0" y="71.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">D</text>
<text x="313.0" y="87.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">q = 8</text>
<text x="313.0" y="103.0" font-size="14" text-anchor="middle" fill="#444441" dominant-baseline="central">rate = 5</text>
<rect x="360" y="60" width="66" height="54" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="393.0" y="71.0" font-size="14" text-anchor="middle" fill="#52514E" dominant-baseline="central">E</text>
<text x="393.0" y="87.0" font-size="14" text-anchor="middle" fill="#52514E" dominant-baseline="central">q = 9</text>
<text x="393.0" y="103.0" font-size="14" text-anchor="middle" fill="#52514E" dominant-baseline="central">rate = 7</text>
<text x="393" y="130" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">还没处理</text>
<text x="153" y="130" font-size="12" text-anchor="middle" fill="#712B13" dominant-baseline="central">q 最大, 被踢</text>
<line x1="560" y1="78" x2="522" y2="118" stroke="#898781" stroke-width="1.2"/>
<line x1="560" y1="78" x2="598" y2="118" stroke="#898781" stroke-width="1.2"/>
<circle cx="560" cy="78" r="19" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="560" y="78" font-size="16" text-anchor="middle" fill="#444441" dominant-baseline="central">10</text>
<circle cx="560" cy="78" r="23" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<circle cx="522" cy="118" r="19" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="522" y="118" font-size="16" text-anchor="middle" fill="#444441" dominant-baseline="central">8</text>
<circle cx="598" cy="118" r="19" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="598" y="118" font-size="16" text-anchor="middle" fill="#444441" dominant-baseline="central">5</text>
<text x="560" y="152" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">max-heap: group 的 q</text>
<line x1="40" y1="172" x2="640" y2="172" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="194" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">1. 为什么 rate 取当前这个 (D 的 rate = 5)</text>
<text x="40" y="216" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">group 里每个人 wage = 5 × q, 而其他人的 rate ≤ 5 → 5 × q ≥ 他们的最低 wage, 都合法</text>
<text x="40" y="234" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">rate 取当前这个就是 group 里最大的 rate, 不能再小 (D 自己的最低 wage 就要 rate = 5)</text>
<text x="40" y="270" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">2. rate 固定后, 只能压 total_q</text>
<text x="40" y="292" font-size="12" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">cost = rate × total_q → 从 A, B, C, D 里选 k = 3 个 q 最小的 → 踢 q 最大的 B (20)</text>
<text x="40" y="328" font-size="14" text-anchor="start" fill="#0B0B0B" font-weight="600" dominant-baseline="central">3. 具体数字</text>
<text x="40" y="350" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">total_q = 10 + 8 + 5 = 23</text>
<text x="40" y="372" font-size="14" text-anchor="start" fill="#0B0B0B" dominant-baseline="central">cost = rate × total_q = 5 × 23 = 115</text>
<line x1="40" y1="406" x2="640" y2="406" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="428" font-size="14" text-anchor="start" fill="#52514E" dominant-baseline="central">brute force: 枚举 C(n, k) 个 group · 排序一维 (rate) + heap 管另一维 (q): O(n log n)</text>
</svg>
