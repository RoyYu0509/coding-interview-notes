<svg width="100%" viewBox="0 0 680 292" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>indegree 的含义</title><desc>indegree 的含义</desc><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">indegree[v] = v 还有几门前置课没上完。= 0 ⇔ 前置课全上完 ⇔ v 可以入队</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">只看 v = 2 (前置课 0 和 1)</text>
<text x="40" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">开始</text>
<line x1="80.2" y1="124.9" x2="155.9" y2="148.9" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="80.2" y1="185.1" x2="155.9" y2="161.1" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="65" cy="120" r="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="65" y="120" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">0</text>
<circle cx="65" cy="190" r="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="65" y="190" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="175" cy="155" r="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="175" y="155" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="80" y="222" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="145.0" y="237.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">indegree[2] = 2</text>
<text x="250" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">pop 0: indegree[2] -= 1</text>
<line x1="290.2" y1="124.9" x2="365.9" y2="148.9" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar-red)"/>
<line x1="290.2" y1="185.1" x2="365.9" y2="161.1" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="275" cy="120" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="275" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<circle cx="275" cy="190" r="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="275" y="190" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="385" cy="155" r="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="385" y="155" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="290" y="222" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="355.0" y="237.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">indegree[2] = 1</text>
<text x="460" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">pop 1: indegree[2] -= 1</text>
<line x1="500.2" y1="124.9" x2="575.9" y2="148.9" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar-red)"/>
<line x1="500.2" y1="185.1" x2="575.9" y2="161.1" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar-red)"/>
<circle cx="485" cy="120" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="485" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<circle cx="485" cy="190" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="485" y="190" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="595" cy="155" r="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="595" y="155" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="595" cy="155" r="19" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="500" y="222" width="130" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="565.0" y="237.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">indegree[2] = 0</text>
<text x="40" y="178" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central"></text>
<text x="40" y="276" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">红虚线 = 这条边已经"用掉"。每条边恰好被减一次 → 整个过程 O(V + E)。</text></svg>
