<svg width="100%" viewBox="0 0 680 208" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Network Delay Time examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">n 个节点, times[i] = (u, v, w): 信号从 u 传到 v 要 w 时间。从 k 发出信号, 多久之后所有节点都收</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">到? 有收不到的返回 -1</text>
<line x1="40" y1="62" x2="640" y2="62" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="82" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example:  times = [[2,1,1],[2,3,1],[3,4,1]], n = 4, k = 2  →  2</text>
<rect x="40" y="108" width="80" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="80.0" y="124.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2→1: 1</text>
<rect x="120" y="108" width="80" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="160.0" y="124.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">2→3: 1</text>
<rect x="200" y="108" width="80" height="30" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="240.0" y="124.0" font-size="15" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central" style="white-space:pre">3→4: 1</text>
<text x="40" y="154" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">节点 1 在时刻 1 收到, 3 在时刻 1, 4 在时刻 1 + 1 = 2。最后一个收到的是 4 → 2</text>
<text x="40" y="172" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">也就是: 从 k 到每个节点的最短路径, 取其中最大的</text>
<line x1="40" y1="196" x2="640" y2="196" stroke="#B4B2A9" stroke-dasharray="4 4"/></svg>
