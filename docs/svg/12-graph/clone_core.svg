<svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Clone Graph: 先登记再递归</title><desc>Clone Graph: 先登记再递归</desc><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">图里有环: 1 → 2 → 3 → 4 → 1。old2new 记录"谁已经复制过", 一定要在递归 neighbor 之前写入</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">这和 visited 是同一件事, 只是顺便存了 副本 是谁</text>
<text x="40" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">先递归, 后登记 (错)</text>
<text x="370" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">先登记 old2new[old] = copy, 再递归 (对)</text>
<line x1="106.0" y1="120.0" x2="190.0" y2="120.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="210.0" y1="136.0" x2="210.0" y2="195.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="194.0" y1="215.0" x2="110.0" y2="215.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="90.0" y1="199.0" x2="90.0" y2="140.0" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar-red)"/>
<circle cx="90" cy="120" r="16" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="90" y="120" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="210" cy="120" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="210" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="210" cy="215" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="210" y="215" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
<circle cx="90" cy="215" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="90" y="215" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">4</text>
<line x1="436.0" y1="120.0" x2="520.0" y2="120.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="540.0" y1="136.0" x2="540.0" y2="195.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="524.0" y1="215.0" x2="440.0" y2="215.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="420.0" y1="199.0" x2="420.0" y2="140.0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar-red)"/>
<circle cx="420" cy="120" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="420" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="540" cy="120" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="540" y="120" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="540" cy="215" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="540" y="215" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
<circle cx="420" cy="215" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="420" y="215" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">4</text>
<text x="155" y="255" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">走到 4 → 又看到 1: dict 里还没有 1'</text>
<text x="155" y="275" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">→ 又 Node(1), 再走 2, 3, 4 ... 无限递归</text>
<text x="485" y="255" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">走到 4 → 又看到 1: 已在 old2new</text>
<text x="485" y="275" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">→ 直接返回 1', 环在这里被切断</text>
<text x="40" y="306" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">副本的 neighbor 必须也是副本: copy.neighbors.append(dfs(nb)) 返回的是 old2new[nb], 不是 nb 本身。</text>
<line x1="340" y1="56" x2="340" y2="290" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/></svg>
