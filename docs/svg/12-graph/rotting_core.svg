<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>multi-source BFS: 所有初始烂橘子同时入队</title><desc>multi-source BFS: 所有初始烂橘子同时入队</desc><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">单源 BFS: 一个起点 → 层数 = 距离。多源: 加一个虚拟起点 S* 连到所有烂橘子 (距离 0)</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">S* 不用真建, 直接把所有源点一起放进 queue 当作第 0 层</text>
<circle cx="70" cy="150" r="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="70" y="150" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">S*</text>
<rect x="114" y="128.0" width="72" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="150" y="146.0" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">(0,0)</text>
<text x="150" y="168.0" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">(2,4)</text>
<text x="150" y="68" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">第 0 层</text>
<text x="150" y="86" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">2 个 cell</text>
<rect x="242" y="106.0" width="72" height="100" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="278" y="124.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(1,0)</text>
<text x="278" y="146.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(0,1)</text>
<text x="278" y="168.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(1,4)</text>
<text x="278" y="190.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(2,3)</text>
<text x="278" y="68" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">第 1 层</text>
<text x="278" y="86" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">4 个 cell</text>
<rect x="370" y="95.0" width="72" height="122" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="406" y="113.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(1,1)</text>
<text x="406" y="135.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(0,2)</text>
<text x="406" y="157.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(0,4)</text>
<text x="406" y="179.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(1,3)</text>
<text x="406" y="201.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(2,2)</text>
<text x="406" y="68" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">第 2 层</text>
<text x="406" y="86" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">5 个 cell</text>
<rect x="498" y="128.0" width="72" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="534" y="146.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(2,1)</text>
<text x="534" y="168.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(0,3)</text>
<text x="534" y="68" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">第 3 层</text>
<text x="534" y="86" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">2 个 cell</text>
<line x1="89.8" y1="152.7" x2="110.0" y2="155.5" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar-gray)"/>
<line x1="188" y1="156" x2="240" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="316" y1="156" x2="368" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="444" y1="156" x2="496" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<text x="70" y="186" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">距离 0</text>
<text x="40" y="262" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">层数 = 最近的烂橘子要几分钟烂到这里。BFS 同时从所有源点往外扩, 每层 +1 分钟。</text>
<text x="40" y="282" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">最后一个新烂的橘子所在的层 = 答案; 烂不到的 (被空格隔开) 在 fresh 里剩下 → -1。</text></svg>
