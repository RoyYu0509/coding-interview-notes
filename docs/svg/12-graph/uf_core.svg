<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Union-Find 两个优化</title><desc>Union-Find 两个优化</desc><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">find(x) = 顺着 parent 走到 root。root 相同 = 同一个集合。不优化时 find 可以退化成 O(n)</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">两个优化让 find / union 几乎 O(1) (摊还 O(α(n)), α 是反 Ackermann, 实际 ≤ 4)</text>
<text x="40" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">无优化: 总是 find(a) 挂到 find(b)</text>
<text x="40" y="85" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">union(1,0), union(2,1), union(3,2), union(4,3)</text>
<circle cx="60" cy="135" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="60" y="135" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<circle cx="114" cy="135" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="114" y="135" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="99.0" y1="135.0" x2="79.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="168" cy="135" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="168" y="135" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="153.0" y1="135.0" x2="133.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="222" cy="135" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="222" y="135" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="207.0" y1="135.0" x2="187.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="276" cy="135" r="15" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="276" y="135" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">4</text>
<line x1="261.0" y1="135.0" x2="241.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<text x="40" y="175" font-size="12" font-weight="500" fill="#712B13" text-anchor="start" dominant-baseline="central">退化成一条链 · find(4) 要走 4 步</text>
<text x="40" y="195" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">n 个点 → find 要 O(n)</text>
<text x="370" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">优化 1: union by size</text>
<text x="370" y="85" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">小树挂到大树的 root 下 → 高度 ≤ log₂ n</text>
<circle cx="480" cy="120" r="15" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480" y="120" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="420" cy="170" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="420" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<line x1="431.5" y1="160.4" x2="465.4" y2="132.2" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="460" cy="170" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="460" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="465.6" y1="156.1" x2="472.9" y2="137.6" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="500" cy="170" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="500" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="494.4" y1="156.1" x2="487.1" y2="137.6" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="540" cy="170" r="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="540" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">4</text>
<line x1="528.5" y1="160.4" x2="494.6" y2="132.2" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<text x="370" y="205" font-size="12" font-weight="500" fill="#085041" text-anchor="start" dominant-baseline="central">同样的 union 序列 → 高度 1 (root 是 1)</text>
<line x1="40" y1="222" x2="640" y2="222" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="244" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">优化 2: path compression — find 的时候顺手把路径上的点直接挂到 root 上</text>
<circle cx="70" cy="288" r="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="288" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">0</text>
<circle cx="114" cy="288" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="114" y="288" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="100.0" y1="288.0" x2="88.0" y2="288.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="158" cy="288" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="158" y="288" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="144.0" y1="288.0" x2="132.0" y2="288.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="202" cy="288" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="202" y="288" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="188.0" y1="288.0" x2="176.0" y2="288.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<text x="40" y="322" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">find(3) 前: 3 → 2 → 1 → 0, 走 3 步</text>
<text x="250" y="288" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">find(3) 之后 →</text>
<circle cx="470" cy="272" r="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="470" y="272" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">0</text>
<circle cx="410" cy="318" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410" y="318" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="421.1" y1="309.5" x2="455.7" y2="283.0" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar-green)"/>
<circle cx="470" cy="318" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="470" y="318" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="470.0" y1="304.0" x2="470.0" y2="290.0" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar-green)"/>
<circle cx="530" cy="318" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="530" y="318" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="518.9" y1="309.5" x2="484.3" y2="283.0" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar-green)"/>
<text x="370" y="346" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">1, 2, 3 都直接指向 0 · 下次 find 一步到位</text></svg>
