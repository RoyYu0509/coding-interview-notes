<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Dijkstra 的 invariant</title><desc>Dijkstra 的 invariant</desc><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">heap 的 top = 所有"候选距离"里最小的。它一弹出, dist 就是最终答案 (前提: 所有边权 ≥ 0)</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">例: 起点 1 · 已确定 {1, 3} · 待确定的候选在 heap 里</text>
<rect x="40" y="70" width="230" height="190" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="56" y="88" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">已确定 (popped): dist 不会再变</text>
<line x1="116.0" y1="170.0" x2="180.0" y2="170.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<circle cx="100" cy="170" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="100" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="200" cy="170" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="200" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3</text>
<text x="100" y="196" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">dist = 0</text>
<text x="200" y="196" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">dist = 1</text>
<rect x="141.0" y="150.0" width="18" height="16" rx="3" fill="#fff"/>
<text x="150.0" y="158.0" font-size="12" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="400" cy="130" r="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="400" y="130" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="400" cy="130" r="19" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<circle cx="400" cy="230" r="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="400" y="230" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">4</text>
<path d="M115.1 164.8 Q246.0 120.3 380.0 128.7" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="215.7" y1="166.9" x2="380.4" y2="133.9" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar-green)"/>
<line x1="215.3" y1="174.6" x2="380.8" y2="224.3" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<text x="290" y="108" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">0 + 4 = 4</text>
<text x="330" y="166" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">1 + 2 = 3</text>
<text x="318" y="222" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">1 + 5 = 6</text>
<text x="500" y="78" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">heap (候选)</text>
<rect x="500" y="92" width="100" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="550.0" y="106.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">(3, 2)</text>
<rect x="497" y="89" width="106" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="500" y="128" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="550.0" y="142.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(4, 2)</text>
<rect x="500" y="164" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="550.0" y="178.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">(6, 4)</text>
<text x="500" y="210" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">(dist, node) · 最小的 (3, 2)</text>
<text x="500" y="228" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">先弹出</text>
<text x="40" y="286" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">为什么 dist[2] = 3 已经是最短: 要到 2 就必须从"已确定"区域走出来, 出来的第一步候选 ≥ 3 (heap 最小),</text>
<text x="40" y="306" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">之后每条边权 ≥ 0, 只会更长。所以不可能有比 3 更短的路。</text>
<text x="40" y="328" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">有负边: 先花 6 走到 4, 再走一条 -5 的边到 2 → 1 &lt; 3, 这个论证就破了 → 改用 Bellman-Ford。</text></svg>
