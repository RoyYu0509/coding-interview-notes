<svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Word Ladder: 隐式图 + 按层 BFS</title><desc>Word Ladder: 隐式图 + 按层 BFS</desc><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">点 = 单词, 边 = 只差一个字母。graph 没有存起来: 邻居现算 (把某一位换成 a-z, 看在不在词典里)</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">beginWord = hit → endWord = cog · 层数 = 最短路径上的单词个数</text>
<text x="80" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">level 1</text>
<text x="210" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">level 2</text>
<text x="340" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">level 3</text>
<text x="470" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">level 4</text>
<text x="600" y="66" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">level 5</text>
<line x1="104.0" y1="175.0" x2="182.0" y2="175.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="232.9" y1="167.9" x2="313.2" y2="143.2" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="232.9" y1="182.1" x2="313.2" y2="206.8" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="364.0" y1="135.0" x2="442.0" y2="135.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="364.0" y1="215.0" x2="442.0" y2="215.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="492.9" y1="142.1" x2="573.2" y2="166.8" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="492.9" y1="207.9" x2="573.2" y2="183.2" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<line x1="340" y1="151" x2="340" y2="199" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="470" y1="151" x2="470" y2="199" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="56" y="159" width="48" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="80.0" y="175.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">hit</text>
<rect x="53" y="156" width="54" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="186" y="159" width="48" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="210.0" y="175.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">hot</text>
<rect x="316" y="119" width="48" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="135.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">dot</text>
<rect x="316" y="199" width="48" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="215.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">lot</text>
<rect x="446" y="119" width="48" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="470.0" y="135.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">dog</text>
<rect x="446" y="199" width="48" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="470.0" y="215.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">log</text>
<rect x="576" y="159" width="48" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="600.0" y="175.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">cog</text>
<text x="40" y="252" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">灰虚线: 同层之间也差一个字母, 但两端都已 visited, BFS 不会走它。</text>
<text x="40" y="274" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">为什么是最短: 层 k 的词离 hit 恰好 k-1 步; 一层一层扩, 第一次碰到 cog 就是最少步。</text>
<text x="40" y="296" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">不要先 O(N²·L) 两两比较建 graph: 每个词直接枚举 L 位 × 26 字母 = 26L 个候选, 查 set O(1)。</text></svg>
