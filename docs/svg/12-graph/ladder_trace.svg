<svg width="100%" viewBox="0 0 680 578" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Word Ladder 运行流程</title><desc>Word Ladder 运行流程</desc><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">words = set(wordList) = 还没访问的词 · 每层: popleft → 枚举改一位 → 在 words 里就 remove 并入队</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">beginWord = hit, endWord = cog, wordList = [hot, dot, dog, lot, log, cog]</text>
<text x="40" y="62" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">level</text>
<text x="100" y="62" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">popleft → 找到的新词 (remove)</text>
<text x="430" y="62" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">queue (下一层) · words 剩余</text>
<line x1="40" y1="72" x2="640" y2="72" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="104" font-size="16" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">1</text>
<rect x="100" y="82" width="44" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="122.0" y="94.0" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">hit</text>
<text x="156" y="94" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">→ hot  (remove)</text>
<rect x="430" y="82" width="44" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="452.0" y="94.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">hot</text>
<text x="430" y="122" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">words 剩余 5: {cog,dog,dot,log,lot}</text>
<line x1="40" y1="152" x2="640" y2="152" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="188" font-size="16" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">2</text>
<rect x="100" y="166" width="44" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="122.0" y="178.0" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">hot</text>
<text x="156" y="178" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">→ dot, lot  (remove)</text>
<rect x="430" y="166" width="44" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="452.0" y="178.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">dot</text>
<rect x="478" y="166" width="44" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="500.0" y="178.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">lot</text>
<text x="430" y="206" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">words 剩余 3: {cog,dog,log}</text>
<line x1="40" y1="236" x2="640" y2="236" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="272" font-size="16" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">3</text>
<rect x="100" y="250" width="44" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="122.0" y="262.0" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">dot</text>
<text x="156" y="262" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">→ dog  (remove)</text>
<rect x="100" y="280" width="44" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="122.0" y="292.0" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">lot</text>
<text x="156" y="292" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">→ log  (remove)</text>
<rect x="430" y="250" width="44" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="452.0" y="262.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">dog</text>
<rect x="478" y="250" width="44" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="500.0" y="262.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">log</text>
<text x="430" y="290" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">words 剩余 1: {cog}</text>
<line x1="40" y1="320" x2="640" y2="320" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="356" font-size="16" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">4</text>
<rect x="100" y="334" width="44" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="122.0" y="346.0" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">dog</text>
<text x="156" y="346" font-size="12" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">→ cog  (remove)</text>
<rect x="100" y="364" width="44" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="122.0" y="376.0" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">log</text>
<text x="156" y="376" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">→ 没有新词 (邻居都已 remove)</text>
<rect x="430" y="334" width="44" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="452.0" y="346.0" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">cog</text>
<text x="430" y="374" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">words 剩余 0: {}</text>
<line x1="40" y1="404" x2="640" y2="404" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="440" font-size="16" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">5</text>
<rect x="100" y="418" width="44" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="122.0" y="430.0" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">cog</text>
<text x="156" y="430" font-size="14" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">w == endWord → return level = 5</text>
<text x="430" y="430" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">queue 为空, 已 return</text>
<text x="430" y="458" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">words 剩余 0: {}</text>
<line x1="40" y1="488" x2="640" y2="488" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="40" y="510" font-size="16" font-weight="500" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">答案: cog 在 level 5 → ladderLength = 5 (hit → hot → dot → dog → cog)</text>
<text x="40" y="532" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">level 4 里 log 取出时, cog 已被 dog 抢先 remove: 同一个词不会入队两次</text>
<rect x="40" y="553" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="60" y="560" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">popleft 取出</text>
<rect x="158.8" y="553" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="178.8" y="560" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">新入队 (已从 words remove)</text></svg>
