<text x="208.0" y="205.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">-2</text>
<rect x="230" y="190" width="36" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="150" y="236" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">total = 0 + (-2) = -2</text>
<text x="150" y="254" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">-2 ≠ k = 3, 不缩</text>
<text x="290" y="204" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">ans = 0</text>
<text x="370" y="194" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">prefix = 3, need = 3 - 3 = 0</text>
<text x="370" y="214" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">count[0] = 1 → 命中</text>
<text x="370" y="236" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">ans = 1</text>
<rect x="370" y="250" width="56" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="367" y="247" width="62" height="28" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
