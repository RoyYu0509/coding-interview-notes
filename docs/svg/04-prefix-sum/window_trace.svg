<text x="168.0" y="105.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="190" y="90" width="36" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<rect x="230" y="90" width="36" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="150" y="136" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">total = 0 + 5 = 5</text>
<text x="150" y="154" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">5 &gt; k = 3 → 扔掉 5</text>
<text x="150" y="170" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">total = 0 (窗口 空)</text>
<text x="290" y="104" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">ans = 0</text>
<text x="370" y="94" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">prefix = 5, need = 5 - 3 = 2</text>
<text x="370" y="114" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">count[2] 没有 → +0</text>
<text x="370" y="136" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">ans = 0</text>
<rect x="370" y="150" width="56" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="398.0" y="161.0" font-size="12" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0:1</text>
