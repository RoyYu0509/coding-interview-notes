<svg width="100%" viewBox="0 0 680 446" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>window 失败 vs prefix + hash 成功</title><desc>同一个输入, 两种做法逐步对比</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [5, -2, 0], k = 3 · 真实答案 2: [5, -2] 和 [5, -2, 0]</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">左: window (超过 k 就缩左边) · 右: prefix + hash</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums[right]</text>
<text x="150" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">window: left → right (错)</text>
<text x="370" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">prefix + hash (对)</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="352" y1="80" x2="352" y2="380" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
