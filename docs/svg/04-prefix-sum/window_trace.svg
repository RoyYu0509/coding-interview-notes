<text x="88.0" y="324.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">right = 2</text>
<rect x="150" y="290" width="36" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="168.0" y="305.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="190" y="290" width="36" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="208.0" y="305.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">-2</text>
<rect x="230" y="290" width="36" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="248.0" y="305.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="150" y="336" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">total = -2 + 0 = -2</text>
<text x="150" y="354" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">-2 ≠ k = 3, 不缩</text>
<text x="290" y="304" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">ans = 0</text>
<text x="370" y="294" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">prefix = 3, need = 3 - 3 = 0</text>
<text x="370" y="314" font-size="12" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">count[0] = 1 → 命中</text>
<text x="370" y="336" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">ans = 2</text>
<rect x="370" y="350" width="56" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
