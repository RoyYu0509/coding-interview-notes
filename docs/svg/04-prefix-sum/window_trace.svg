<text x="518.0" y="261.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">3:1</text>
<line x1="40" y1="282" x2="640" y2="282" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
