<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">first 初始 {0: -1} · 每一步: s += (1 或 -1) → s 见过就 best = max(best, i - first[s]) → 没见过就记 first[s] = i</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">first 里每个格子是 s: 第一次出现的下标</text>
