<text x="154" y="114" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">first[-1] 没有 → 记下 0</text>
<text x="318" y="94" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">不算长度</text>
<text x="318" y="114" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">best = 0</text>
