<text x="310" y="94" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">count[4] = 0</text>
<text x="310" y="114" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">ans = 0</text>
