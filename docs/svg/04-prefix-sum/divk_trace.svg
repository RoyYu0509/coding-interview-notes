<svg width="100%" viewBox="0 0 680 484" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Subarray Sums Divisible by K trace</title><desc>每步取余、查桶、放入桶</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">k = 5 · count 初始 {0: 1} · 每一步: prefix = (prefix + nums[i]) % 5 → ans += count[prefix] → count[prefix] += 1</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">count 里每个格子是 余数: 出现次数</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums[i]</text>
<text x="154" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">取余</text>
<text x="310" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">查桶 / ans</text>
<text x="430" y="64" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">count (后放)</text>
