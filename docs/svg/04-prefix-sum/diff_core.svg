<svg width="100%" viewBox="0 0 680 450" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>difference array 的核心</title><desc>区间加只改两个端点，最后一次 prefix sum 还原</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">区间加: 对 arr[l..r] 每个位置 +v · 只改 diff[l] += v 和 diff[r+1] -= v</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">最后对 diff 做一次 prefix sum, 就得到每个位置的值 (和 prefix sum 互为逆运算)</text>
<text x="40" y="66" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">一个 booking [1, 2, 10]: 航班 1..2 各 +10 (数组下标 0..1)</text>
<text x="40" y="137" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">diff</text>
<rect x="170" y="120" width="67" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="203.5" y="137.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
<text x="203.5" y="111" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[0]</text>
<rect x="240" y="120" width="67" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="273.5" y="137.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="273.5" y="111" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[1]</text>
<rect x="310" y="120" width="67" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="343.5" y="137.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">-10</text>
<text x="343.5" y="111" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[2]</text>
<rect x="380" y="120" width="67" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="413.5" y="137.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="413.5" y="111" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[3]</text>
<rect x="450" y="120" width="67" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="483.5" y="137.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="483.5" y="111" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[4]</text>
<rect x="520" y="120" width="67" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="553.5" y="137.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="553.5" y="111" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[5]</text>
<text x="203" y="170" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[0] += 10</text>
<text x="343" y="170" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">diff[2] -= 10</text>
<text x="40" y="217" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">prefix sum 后</text>
<rect x="170" y="200" width="67" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="203.5" y="217.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
<rect x="240" y="200" width="67" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="273.5" y="217.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
<rect x="310" y="200" width="67" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="343.5" y="217.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="380" y="200" width="67" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="413.5" y="217.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="450" y="200" width="67" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="483.5" y="217.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="40" y="262" font-size="12" fill="#085041" text-anchor="start" font-weight="400" dominant-baseline="central">cur 从 diff[0] 起一直带着 +10: arr[0] = 10, arr[1] = 10</text>
<text x="40" y="282" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">走到 diff[2] = -10: cur = 10 + (-10) = 0, 抵消, 之后一直是 0</text>
<line x1="40" y1="302" x2="640" y2="302" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="326" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">diff[last] 对应 arr[last+1]: 为 diff 多留 1 格 (n + 1 = 6 格), last = n 时不越界</text>
<rect x="40" y="346" width="290" height="62" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="185.0" y="369.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">brute force: 每个 booking 循环改区间</text>
<text x="185.0" y="385.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">m 个 booking × n → O(m · n)</text>
<rect x="350" y="346" width="290" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="495.0" y="369.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">diff: 每个 booking 只改 2 个格子</text>
<text x="495.0" y="385.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">m 次 O(1) + 一次 prefix sum → O(m + n)</text>
<rect x="40" y="425" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="60" y="432" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">+v 的位置 / 被抬高的区间</text>
<rect x="235.6" y="425" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="255.6" y="432" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">-v 的位置 (抵消)</text>
<rect x="383.2" y="425" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="403.2" y="432" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">其他</text>
</svg>
