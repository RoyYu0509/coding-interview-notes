<svg width="100%" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Find Pivot Index 的 invariant</title><desc>left == total - left - nums[i]</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [1, 7, 3, 6, 5, 6] · total = 1 + 7 + 3 + 6 + 5 + 6 = 28</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">pivot i: 左边所有数之和 == 右边所有数之和 (不含 nums[i])</text>
<rect x="70" y="80" width="67" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="103.5" y="98.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="103.5" y="71" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=0</text>
<rect x="140" y="80" width="67" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="173.5" y="98.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">7</text>
<text x="173.5" y="71" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=1</text>
<rect x="210" y="80" width="67" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="243.5" y="98.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="243.5" y="71" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=2</text>
<rect x="280" y="80" width="67" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="277" y="77" width="73" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="313.5" y="98.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="313.5" y="71" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=3</text>
<rect x="350" y="80" width="67" height="36" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="383.5" y="98.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<text x="383.5" y="71" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=4</text>
<rect x="420" y="80" width="67" height="36" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="453.5" y="98.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="453.5" y="71" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=5</text>
<line x1="70" y1="134" x2="277" y2="134" stroke="#5F5E5A" stroke-width="2"/>
<text x="70" y="152" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">left = prefix[3] = 1 + 7 + 3 = 11</text>
<line x1="350" y1="134" x2="487" y2="134" stroke="#5F5E5A" stroke-width="2"/>
<text x="350" y="152" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">right = 5 + 6 = 11</text>
<text x="312" y="138" font-size="12" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">x = 6</text>
<line x1="40" y1="176" x2="640" y2="176" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="204" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">right 不用再加一遍: right = total - left - nums[i] = 28 - 11 - 6 = 11</text>
<text x="40" y="228" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">所以判断条件是 left == total - left - nums[i]:  11 == 11 ✓</text>
<rect x="40" y="252" width="290" height="62" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="185.0" y="275.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">brute force: 每个 i 重新加左右两边</text>
<text x="185.0" y="291.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">每个 i 要 O(n) → 总共 O(n²)</text>
<rect x="350" y="252" width="290" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="495.0" y="275.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">prefix: left 边走边累加</text>
<text x="495.0" y="291.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">right 用 total 减出来 → O(n)</text>
<rect x="40" y="331" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="60" y="338" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">left 区域</text>
<rect x="145.0" y="331" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="165.0" y="338" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">当前 nums[i]</text>
<rect x="269.8" y="331" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="289.8" y="338" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">right 区域</text>
</svg>
