<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>sliding window 与 prefix + hash 的分界</title><desc>有负数时 prefix 不单调, 窗口失效</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">sliding window 成立的前提: 加元素 → 和变大, 去元素 → 和变小 (单调)</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">只要有负数, 这个单调性就没了 · prefix + hash 不依赖单调性</text>
<text x="40" y="66" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">全是正数: nums = [1, 2, 3, 4]</text>
<text x="40" y="86" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">prefix = [0, 1, 3, 6, 10] 一路往上</text>
<line x1="40" y1="250" x2="316" y2="250" stroke="#B4B2A9" stroke-width="1"/>
<polyline points="50,250 114,239 178,217 242,184 306,140" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="50" cy="250" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="50" y="250" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="50" y="228" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="50" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=0</text>
<circle cx="114" cy="239" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="114" y="239" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="114" y="217" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="114" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=1</text>
<circle cx="178" cy="217" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="178" y="217" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="178" y="195" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="178" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=2</text>
<circle cx="242" cy="184" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="242" y="184" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="242" y="162" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="242" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=3</text>
<circle cx="306" cy="140" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="306" y="140" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="306" y="118" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">10</text>
<text x="306" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=4</text>
<text x="370" y="66" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">有负数: nums = [5, -2, 0]</text>
<text x="370" y="86" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">prefix = [0, 5, 3, 3] 升了又降</text>
<line x1="370" y1="250" x2="582" y2="250" stroke="#B4B2A9" stroke-width="1"/>
<polyline points="380,250 444,195 508,217 572,217" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="380" cy="250" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="380" y="250" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="380" y="228" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="380" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=0</text>
<circle cx="444" cy="195" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="444" y="195" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="444" y="173" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<text x="444" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=1</text>
<circle cx="508" cy="217" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="508" y="217" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="508" y="195" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="508" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=2</text>
<circle cx="572" cy="217" r="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="572" y="217" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central"></text>
<text x="572" y="195" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="572" y="276" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=3</text>
<line x1="40" y1="290" x2="640" y2="290" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="314" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">正数: 固定右端点, 满足条件的左端点是一段连续区间, left 只用往右走 → window, O(n)</text>
<text x="40" y="336" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">负数: 5 &gt; k = 3 时把 5 丢掉, 但后面的 -2 会把和拉回 3 (5 + (-2) = 3) → 丢早了, 漏答案</text>
<rect x="40" y="356" width="290" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="185.0" y="379.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">全正数 → sliding window</text>
<text x="185.0" y="395.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">O(n) 时间, O(1) 空间</text>
<rect x="350" y="356" width="290" height="62" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="495.0" y="379.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">有负数 → prefix + hash</text>
<text x="495.0" y="395.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">O(n) 时间, O(n) 空间 (用空间换单调性)</text>
<rect x="40" y="435" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="60" y="442" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">prefix[t]</text>
</svg>
