<text x="40" y="338" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">每条 booking 是给一段连续的航班都加同一个数。答案 = 每一列加起来</text>
<line x1="40" y1="362" x2="640" y2="362" stroke="#B4B2A9" stroke-dasharray="4 4"/>
