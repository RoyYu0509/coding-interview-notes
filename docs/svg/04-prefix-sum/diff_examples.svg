<svg width="100%" viewBox="0 0 680 406" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Corporate Flight Bookings examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">航班编号 1..n。每条 booking [first, last, seats]: 航班 first 到 last 每一班都订了 seats 个座位</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">。求每班的总数</text>
