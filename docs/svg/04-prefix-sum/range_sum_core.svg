<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>sum(i..j) = prefix[j+1] - prefix[i]</title><desc>区间和等于两个前缀和之差，query 从 O(n) 变 O(1)</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [3, 1, 4, 1, 5] · query: sum(nums[1..3])</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">prefix[k] = 前 k 个数之和 = nums[0] + ... + nums[k-1] · prefix[0] = 0</text>
<text x="40" y="66" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">nums</text>
<rect x="70" y="80" width="41" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="90.5" y="95.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="90.5" y="72" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">0</text>
<rect x="114" y="80" width="41" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="134.5" y="95.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="134.5" y="72" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">1</text>
<rect x="158" y="80" width="41" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="178.5" y="95.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<text x="178.5" y="72" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2</text>
<rect x="202" y="80" width="41" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="222.5" y="95.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<text x="222.5" y="72" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">3</text>
<rect x="246" y="80" width="41" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="266.5" y="95.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<text x="266.5" y="72" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">4</text>
<line x1="70" y1="128" x2="243" y2="128" stroke="#0F6E56" stroke-width="2"/>
<text x="257" y="128" font-size="12" fill="#085041" text-anchor="start" font-weight="400" dominant-baseline="central">prefix[4] = 3 + 1 + 4 + 1 = 9</text>
<line x1="70" y1="150" x2="111" y2="150" stroke="#D85A30" stroke-width="2"/>
<text x="125" y="150" font-size="12" fill="#712B13" text-anchor="start" font-weight="400" dominant-baseline="central">prefix[1] = 3 (这一段要减掉)</text>
<text x="40" y="190" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">sum(nums[1..3]) = prefix[4] - prefix[1] = 9 - 3 = 6</text>
<text x="40" y="212" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">相同的开头 nums[0] = 3 被减掉了, 剩下的正好是 1 + 4 + 1 = 6</text>
<line x1="40" y1="232" x2="640" y2="232" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="262" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">prefix</text>
<rect x="70" y="276" width="41" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="90.5" y="291.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="90.5" y="268" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">0</text>
<rect x="114" y="276" width="41" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="134.5" y="291.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="134.5" y="268" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">1</text>
<rect x="158" y="276" width="41" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="178.5" y="291.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<text x="178.5" y="268" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">2</text>
<rect x="202" y="276" width="41" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="222.5" y="291.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">8</text>
<text x="222.5" y="268" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">3</text>
<rect x="246" y="276" width="41" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="243" y="273" width="47" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="266.5" y="291.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">9</text>
<text x="266.5" y="268" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">4</text>
<rect x="290" y="276" width="41" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="310.5" y="291.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">14</text>
<text x="310.5" y="268" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">5</text>
<rect x="40" y="322" width="290" height="66" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="185.0" y="339.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">brute force: 每次 query 从头加</text>
<text x="185.0" y="355.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">1 + 4 + 1 → O(n) 每次</text>
<text x="185.0" y="371.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">q 次 query: O(n · q)</text>
<rect x="350" y="322" width="290" height="66" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="495.0" y="339.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">prefix: 建表一次 O(n)</text>
<text x="495.0" y="355.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">每次 query 查两个格子 → O(1)</text>
<text x="495.0" y="371.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">q 次 query: O(n + q)</text>
<rect x="40" y="405" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="60" y="412" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">要的前缀 / 要的区间</text>
<rect x="203.8" y="405" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="223.8" y="412" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">要减掉的前缀</text>
<rect x="323.8" y="405" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="343.8" y="412" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">其他</text>
</svg>
