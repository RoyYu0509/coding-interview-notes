<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Product of Array Except Self 的核心</title><desc>out[i] = 左边所有数的积 × 右边所有数的积</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [1, 2, 3, 4] · 不能用除法 (有 0) · out[i] = nums[i] 左边所有数的积 × 右边所有数的积</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">prefix 不只能是加法: 前缀积 / 后缀积 同理</text>
<text x="40" y="89" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">nums</text>
<text x="40" y="145" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">L[i] = nums[0..i-1] 的积</text>
<text x="40" y="201" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">R[i] = nums[i+1..3] 的积</text>
<text x="40" y="257" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">out[i] = L[i] × R[i]</text>
<text x="236" y="62" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=0</text>
<rect x="200" y="74" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="236.0" y="89.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="200" y="130" width="72" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="236.0" y="145.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="200" y="186" width="72" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="236.0" y="201.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">24</text>
<rect x="200" y="242" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="236.0" y="257.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">24</text>
<text x="236" y="288" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">1 × 24</text>
<text x="332" y="62" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=1</text>
<rect x="296" y="74" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="332.0" y="89.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="296" y="130" width="72" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="332.0" y="145.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="296" y="186" width="72" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="332.0" y="201.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">12</text>
<rect x="296" y="242" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="332.0" y="257.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">12</text>
<text x="332" y="288" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">1 × 12</text>
<text x="428" y="62" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=2</text>
<rect x="392" y="74" width="72" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="428.0" y="89.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="392" y="130" width="72" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="428.0" y="145.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="392" y="186" width="72" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="428.0" y="201.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="392" y="242" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<rect x="389" y="239" width="78" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="428.0" y="257.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">8</text>
<text x="428" y="288" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">2 × 4</text>
<text x="524" y="62" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">i=3</text>
<rect x="488" y="74" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="524.0" y="89.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="488" y="130" width="72" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="524.0" y="145.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<rect x="488" y="186" width="72" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="524.0" y="201.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="488" y="242" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="524.0" y="257.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="524" y="288" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">6 × 1</text>
<text x="428" y="118" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">i=2 的 nums[2] = 3 被跳过</text>
<line x1="40" y1="308" x2="640" y2="308" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="332" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">i = 2: 左边 1 × 2 = 2, 右边 4 → out[2] = 2 × 4 = 8 (3 自己不参与)</text>
<text x="40" y="356" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">L[i] = L[i-1] × nums[i-1] 一个一个滚出来, R 从右往左同理, 每个元素只乘一次 → O(n)</text>
<rect x="40" y="376" width="290" height="62" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="185.0" y="399.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">brute force: 每个 i 乘其余 n-1 个数</text>
<text x="185.0" y="415.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">n × n → O(n²)</text>
<rect x="350" y="376" width="290" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="495.0" y="399.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">L 存进 out, R 用一个变量 r 滚</text>
<text x="495.0" y="415.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">时间 O(n), 额外空间 O(1)</text>
<rect x="40" y="455" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="60" y="462" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">L (左边的积)</text>
<rect x="162.4" y="455" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="182.4" y="462" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">R (右边的积)</text>
<rect x="284.8" y="455" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="304.8" y="462" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">被跳过的 nums[i]</text>
</svg>
