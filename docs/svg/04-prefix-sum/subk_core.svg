<svg width="100%" viewBox="0 0 680 498" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Subarray Sum Equals K 的核心</title><desc>以 j 结尾、和为 k 的 subarray 个数 = 之前有多少个 prefix == prefix_j - k</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [3, 4, 7, 2, -3, 1, 4, 2], k = 7 · prefix[t] = 前 t 个数之和</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums[i..j-1] 的和 = prefix[j] - prefix[i] · 要它 == k  ⟺  prefix[i] == prefix[j] - k</text>
<text x="40" y="66" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">prefix (下标 t = 0..8)</text>
<rect x="42.0" y="100" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="70.0" y="116.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="70.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=0</text>
<rect x="108.0" y="100" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="136.0" y="116.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<text x="136.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=1</text>
<rect x="174.0" y="100" width="56" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="202.0" y="116.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">7</text>
<text x="202.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=2</text>
<rect x="240.0" y="100" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="268.0" y="116.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">14</text>
<text x="268.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=3</text>
<rect x="306.0" y="100" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="334.0" y="116.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">16</text>
<text x="334.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=4</text>
<rect x="372.0" y="100" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="400.0" y="116.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">13</text>
<text x="400.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=5</text>
<rect x="438.0" y="100" width="56" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="435.0" y="97" width="62" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="466.0" y="116.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">14</text>
<text x="466.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=6</text>
<rect x="504.0" y="100" width="56" height="32" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="532.0" y="116.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">18</text>
<text x="532.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=7</text>
<rect x="570.0" y="100" width="56" height="32" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="598.0" y="116.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">20</text>
<text x="598.0" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">t=8</text>
<rect x="81.0" y="176" width="44" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="103.0" y="190.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="147.0" y="176" width="44" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="169.0" y="190.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="213.0" y="176" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="235.0" y="190.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">7</text>
<rect x="279.0" y="176" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="301.0" y="190.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="345.0" y="176" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="367.0" y="190.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">-3</text>
<rect x="411.0" y="176" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="433.0" y="190.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="477.0" y="176" width="44" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="499.0" y="190.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">4</text>
<rect x="543.0" y="176" width="44" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="565.0" y="190.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<text x="40" y="160" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums (夹在两个 prefix 之间)</text>
<line x1="42.0" y1="232" x2="428.0" y2="232" stroke="#5F5E5A" stroke-width="2"/>
<text x="42.0" y="250" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">t = 0..5: 已经放进 count 的 prefix (j 之前的所有起点候选)</text>
<path d="M466.0 134 L466.0 150 L210.0 150 L210.0 134" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="338.0" y="144" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">找 prefix[i] = 14 - 7 = 7</text>
<line x1="40" y1="268" x2="640" y2="268" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="292" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">j = 6: prefix[6] = 14 · 要找 prefix[i] = 14 - 7 = 7 · count 里 7 出现 1 次 (t = 2)</text>
<text x="40" y="316" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">=&gt; 以 j 结尾有 1 个答案: nums[2..5] = 7 + 2 + (-3) + 1 = 7</text>
<text x="40" y="346" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">为什么先查再放: 起点 i 必须在 j 之前, 当前 prefix 还没放进 count, 不会自己和自己配对</text>
<rect x="40" y="366" width="290" height="62" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="185.0" y="389.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">brute force: 对每个 j 回头扫所有 i</text>
<text x="185.0" y="405.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">n 个 j × n 个 i → O(n²)</text>
<rect x="350" y="366" width="290" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="495.0" y="389.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">count: prefix → 出现次数</text>
<text x="495.0" y="405.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">查 count[prefix - k] 是 O(1) → O(n)</text>
<text x="40" y="452" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">{0: 1} 的作用: prefix[0] = 0 是空前缀。t = 2 时 prefix = 7, need = 7 - 7 = 0, 靠它数到 [3, 4]</text>
<rect x="40" y="473" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="60" y="480" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">当前 prefix[j]</text>
<rect x="178.0" y="473" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="198.0" y="480" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">要找的 prefix[i]</text>
<rect x="328.0" y="473" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="348.0" y="480" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">j 之前</text>
<rect x="413.2" y="473" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9"/>
<text x="433.2" y="480" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">还没到</text>
</svg>
