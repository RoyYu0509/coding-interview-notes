<text x="80.0" y="200.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">nums[i] = 7</text>
<rect x="134" y="178" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="147.5" y="192.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
