<svg width="100%" viewBox="0 0 680 426" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Find Pivot Index trace</title><desc>每个 i 算 left 和 right 并比较</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">total = 1 + 7 + 3 + 6 + 5 + 6 = 28</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">每一步: left = nums[0..i-1] 之和 → right = total - left - nums[i] → 比较</text>
<text x="40" y="76" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums[i]</text>
<text x="134" y="76" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">数组</text>
<text x="330" y="76" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">left / right</text>
<text x="540" y="76" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">比较</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="102" width="80" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="80.0" y="118.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">i = 0</text>
<text x="80.0" y="134.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">nums[i] = 1</text>
<rect x="134" y="112" width="27" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="131" y="109" width="33" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="147.5" y="126.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="164" y="112" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="177.5" y="126.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">7</text>
<rect x="194" y="112" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="207.5" y="126.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="224" y="112" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="237.5" y="126.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<rect x="254" y="112" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="267.5" y="126.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="284" y="112" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="297.5" y="126.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="330" y="102" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">left = 0 (左边没有数)</text>
<text x="330" y="124" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">right = 28 - 0 - 1 = 27</text>
<text x="330" y="146" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central"></text>
<text x="540" y="112" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">0 ≠ 27</text>
<text x="540" y="136" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">不是, left += 1</text>
<line x1="40" y1="156" x2="640" y2="156" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="168" width="80" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
