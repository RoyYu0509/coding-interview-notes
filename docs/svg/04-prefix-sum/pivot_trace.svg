<text x="177.5" y="192.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">7</text>
<rect x="194" y="178" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="207.5" y="192.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="224" y="178" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="237.5" y="192.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
