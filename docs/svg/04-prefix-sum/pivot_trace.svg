<rect x="194" y="310" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="207.5" y="324.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="224" y="310" width="27" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="221" y="307" width="33" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="237.5" y="324.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<rect x="254" y="310" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="267.5" y="324.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="284" y="310" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="297.5" y="324.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="330" y="300" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">left = 1 + 7 + 3 = 11</text>
<text x="330" y="322" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">right = 28 - 11 - 6 = 11</text>
<text x="330" y="344" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central"></text>
<text x="540" y="310" font-size="14" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">11 == 11</text>
<text x="540" y="334" font-size="14" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">pivot = 3</text>
<line x1="40" y1="354" x2="640" y2="354" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="376" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">答案: pivot = 3 (left = 1 + 7 + 3 = 11, right = 5 + 6 = 11)</text>
