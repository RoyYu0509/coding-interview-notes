<text x="267.5" y="192.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="284" y="178" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="297.5" y="192.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="330" y="168" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">left = 1</text>
<text x="330" y="190" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">right = 28 - 1 - 7 = 20</text>
<text x="330" y="212" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central"></text>
<text x="540" y="178" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">1 ≠ 20</text>
<text x="540" y="202" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">不是, left += 7</text>
<line x1="40" y1="222" x2="640" y2="222" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="234" width="80" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="80.0" y="250.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">i = 2</text>
<text x="80.0" y="266.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">nums[i] = 3</text>
<rect x="134" y="244" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="147.5" y="258.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="164" y="244" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="177.5" y="258.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">7</text>
<rect x="194" y="244" width="27" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="191" y="241" width="33" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="207.5" y="258.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="224" y="244" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="237.5" y="258.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<rect x="254" y="244" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="267.5" y="258.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="284" y="244" width="27" height="28" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="297.5" y="258.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<text x="330" y="234" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">left = 1 + 7 = 8</text>
<text x="330" y="256" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">right = 28 - 8 - 3 = 17</text>
<text x="330" y="278" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central"></text>
<text x="540" y="244" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">8 ≠ 17</text>
<text x="540" y="268" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">不是, left += 3</text>
<line x1="40" y1="288" x2="640" y2="288" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="40" y="300" width="80" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="80.0" y="316.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">i = 3</text>
<text x="80.0" y="332.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">nums[i] = 6</text>
<rect x="134" y="310" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="147.5" y="324.0" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="164" y="310" width="27" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
