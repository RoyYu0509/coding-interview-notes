<svg width="100%" viewBox="0 0 680 438" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>Range Sum Query 2D 的核心</title><desc>inclusion-exclusion: 全部 - 上面 - 左边 + 左上角</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">matrix 3×3 · 求 (r1,c1) = (1,1) 到 (r2,c2) = (2,2) 的和 · P[i][j] = 左上角 i 行 j 列的和</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">二维的 prefix: 减两次的部分要加回来 (inclusion-exclusion)</text>
<rect x="50" y="80" width="52" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="47" y="77" width="58" height="58" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="76.0" y="106.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="106" y="80" width="52" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="132.0" y="106.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<rect x="162" y="80" width="52" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="188.0" y="106.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="50" y="136" width="52" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="76.0" y="162.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">5</text>
<rect x="106" y="136" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="132.0" y="162.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">6</text>
<rect x="162" y="136" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="188.0" y="162.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">3</text>
<rect x="50" y="192" width="52" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="76.0" y="218.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">1</text>
<rect x="106" y="192" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="132.0" y="218.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">2</text>
<rect x="162" y="192" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="188.0" y="218.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">0</text>
<text x="76.0" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">col 0</text>
<text x="132.0" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">col 1</text>
<text x="188.0" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400" dominant-baseline="central">col 2</text>
<text x="42" y="106.0" font-size="12" fill="#52514E" text-anchor="end" font-weight="400" dominant-baseline="central">row 0</text>
<text x="42" y="162.0" font-size="12" fill="#52514E" text-anchor="end" font-weight="400" dominant-baseline="central">row 1</text>
<text x="42" y="218.0" font-size="12" fill="#52514E" text-anchor="end" font-weight="400" dominant-baseline="central">row 2</text>
<text x="300" y="92" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">全部 = P[3][3] = 21</text>
<text x="300" y="124" font-size="14" fill="#712B13" text-anchor="start" font-weight="500" dominant-baseline="central">- 上面 = P[1][3] = 第 0 行 = 3 + 0 + 1 = 4</text>
<text x="300" y="156" font-size="14" fill="#712B13" text-anchor="start" font-weight="500" dominant-baseline="central">- 左边 = P[3][1] = 第 0 列 = 3 + 5 + 1 = 9</text>
<text x="300" y="188" font-size="14" fill="#085041" text-anchor="start" font-weight="500" dominant-baseline="central">+ 左上角 = P[1][1] = 3</text>
<text x="314" y="206" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">(上面和左边都减了它, 减了两次, 要加回一次)</text>
<line x1="300" y1="220" x2="640" y2="220" stroke="#B4B2A9" stroke-width="1"/>
<text x="300" y="242" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">= 21 - 4 - 9 + 3 = 11</text>
<text x="300" y="266" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">直接加: 6 + 3 + 2 + 0 = 11 ✓</text>
<line x1="40" y1="292" x2="640" y2="292" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="316" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400" dominant-baseline="central">P[i][j] 自己也是这样递推建出来的: P[i+1][j+1] = M[i][j] + P[i][j+1] + P[i+1][j] - P[i][j]</text>
<rect x="40" y="334" width="290" height="62" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="185.0" y="357.0" font-size="14" fill="#712B13" text-anchor="middle" font-weight="500" dominant-baseline="central">brute force: 每个 query 双重循环加</text>
<text x="185.0" y="373.0" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">O(m · n) 每个 query</text>
<rect x="350" y="334" width="290" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="495.0" y="357.0" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">建 P 一次 O(m · n)</text>
<text x="495.0" y="373.0" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">每个 query 读 4 个格子 → O(1)</text>
<rect x="40" y="413" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="60" y="420" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">要的区域</text>
<rect x="136" y="413" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="156" y="420" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">要减掉的区域</text>
<rect x="256" y="413" width="14" height="14" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="276" y="420" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">被减了两次的格子</text>
</svg>
