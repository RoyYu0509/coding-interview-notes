<svg width="100%" viewBox="0 0 680 404" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'><title>余数相同的 prefix 两两配对</title><desc>prefix 对 k 取余后同桶的两个 prefix 之差是 k 的倍数</desc><defs><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">nums = [4, 5, 0, -2, -3, 1], k = 5 · prefix = [0, 4, 9, 9, 7, 4, 5] (P0..P6)</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">(P[j] - P[i]) % 5 == 0  ⟺  P[j] % 5 == P[i] % 5 · 把 P 按 % 5 的余数分桶</text>
<rect x="40" y="70" width="112" height="150" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="96.0" y="88" font-size="14" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">余数 r = 0</text>
<circle cx="72" cy="124" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="72" y="124" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">P0</text>
<circle cx="120" cy="124" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="120" y="124" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">P6</text>
<text x="96.0" y="236" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">2 个 → C(2,2) = 1 对</text>
<rect x="162" y="70" width="112" height="150" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="218.0" y="88" font-size="14" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">余数 r = 1</text>
<text x="218.0" y="236" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">空</text>
<rect x="284" y="70" width="112" height="150" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="88" font-size="14" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">余数 r = 2</text>
<circle cx="316" cy="124" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="316" y="124" font-size="14" fill="#444441" text-anchor="middle" font-weight="500" dominant-baseline="central">P4</text>
<text x="340.0" y="236" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">1 个 → C(1,2) = 0 对</text>
<rect x="406" y="70" width="112" height="150" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="462.0" y="88" font-size="14" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">余数 r = 3</text>
<text x="462.0" y="236" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">空</text>
<rect x="528" y="70" width="112" height="150" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="584.0" y="88" font-size="14" fill="#0B0B0B" text-anchor="middle" font-weight="500" dominant-baseline="central">余数 r = 4</text>
<circle cx="560" cy="124" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="560" y="124" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">P1</text>
<circle cx="608" cy="124" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="608" y="124" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">P2</text>
<circle cx="560" cy="168" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="560" y="168" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">P3</text>
<circle cx="608" cy="168" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="608" y="168" font-size="14" fill="#085041" text-anchor="middle" font-weight="500" dominant-baseline="central">P5</text>
<text x="584.0" y="236" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="400" dominant-baseline="central">4 个 → C(4,2) = 6 对</text>
<line x1="40" y1="256" x2="640" y2="256" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="282" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">每个 &#x27;同桶的一对&#x27; = 一个答案: ans = 1 + 6 + 0 = 7</text>
<text x="40" y="306" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central">边走边数: 新 prefix 放进桶之前, 桶里已有 c 个 → ans += c (c 就是 count[prefix])</text>
<text x="40" y="336" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">和 Subarray Sum Equals K 的区别: 不再找 &#x27;prefix - k&#x27;, 而是找 &#x27;同余数&#x27;; key 从 prefix 换成 prefix % k</text>
<text x="40" y="358" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">桶的个数只有 k 个, count 最多 k 项</text>
<rect x="40" y="379" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="60" y="386" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">同桶有配对</text>
<rect x="148" y="379" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="168" y="386" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central">桶里只有 1 个, 没有配对</text>
</svg>
