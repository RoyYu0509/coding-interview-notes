<svg width="100%" viewBox="0 0 680 348" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Regular Expression Matching: * 的两种选择</title><desc>匹配 0 次或匹配一个并保留 pattern</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">dp[i][j] = s[:i] 能不能被 p[:j] 完整匹配 · p[j-1] 是 '*' 时, 它和前一个字符 p[j-2] 是一个整体 (如 "a*")</text>
<text x="40" y="54" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">选择 1 · 匹配 0 次: 把 "a*" 整个当作不存在</text>
<text x="40" y="78" font-size="12" fill="#52514E" dominant-baseline="central">s[:i]  =</text>
<rect x="110" y="66" width="32" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="126.0" y="81.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="142" y="66" width="32" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="158.0" y="81.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<text x="40" y="112" font-size="12" fill="#52514E" dominant-baseline="central">p[:j]  =</text>
<rect x="110" y="100" width="32" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="126.0" y="115.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">c</text>
<rect x="142" y="100" width="32" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="158.0" y="115.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">*</text>
<rect x="174" y="100" width="32" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="190.0" y="115.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">a</text>
<rect x="206" y="100" width="32" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="222.0" y="115.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">*</text>
<text x="260" y="82" font-size="12" fill="#0B0B0B" dominant-baseline="central">p 末尾的 "a*" 一个字符也不吃 (红色被划掉)</text>
<text x="260" y="114" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">dp[i][j] = dp[i][j-2]   (往左跳 2 格)</text>
<line x1="40" y1="140" x2="640" y2="140" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="164" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">选择 2 · 匹配 1 次, 但 pattern 保留: 条件 p[j-2] == s[i-1] 或 p[j-2] == '.'</text>
<text x="40" y="188" font-size="12" fill="#52514E" dominant-baseline="central">s[:i]  =</text>
<rect x="110" y="176" width="32" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="126.0" y="191.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="142" y="176" width="32" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="158.0" y="191.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">a</text>
<text x="40" y="222" font-size="12" fill="#52514E" dominant-baseline="central">p[:j]  =</text>
<rect x="110" y="210" width="32" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="126.0" y="225.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">c</text>
<rect x="142" y="210" width="32" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="158.0" y="225.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">*</text>
<rect x="174" y="210" width="32" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190.0" y="225.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">a</text>
<rect x="206" y="210" width="32" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="222.0" y="225.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">*</text>
<text x="260" y="190" font-size="12" fill="#0B0B0B" dominant-baseline="central">s 的最后一个 a 被 "a*" 吃掉 (红), 但 "a*" 还留着</text>
<text x="260" y="208" font-size="12" fill="#0B0B0B" dominant-baseline="central">(因为它还可能继续吃前面的 a)</text>
<text x="260" y="234" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">dp[i][j] = dp[i-1][j]   (往上跳 1 格, j 不动)</text>
<line x1="40" y1="256" x2="640" y2="256" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="280" font-size="12" fill="#0B0B0B" dominant-baseline="central">两种选择只要有一个成立就行 → or。普通字符 / '.' : dp[i][j] = dp[i-1][j-1] (各吃一个)</text>
<text x="40" y="300" font-size="12" fill="#52514E" dominant-baseline="central">'*' 不能单独存在, 所以 dp[i][j-1] 这种 "只丢 * 不丢字符" 的转移是错的。</text>
<rect x="40" y="319" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="326" font-size="12" fill="#52514E" dominant-baseline="central">被 * 修饰的字符</text>
<rect x="190.6" y="319" width="18" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="216.6" y="326" font-size="12" fill="#52514E" dominant-baseline="central">被匹配掉 / 被去掉</text>
<rect x="352.6" y="319" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="378.6" y="326" font-size="12" fill="#52514E" dominant-baseline="central">其余</text>
</svg>
