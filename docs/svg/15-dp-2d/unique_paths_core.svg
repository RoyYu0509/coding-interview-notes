<text x="430" y="306" font-size="12" fill="#52514E" dominant-baseline="central">m*n = 12 格, 每格 O(1) → O(m*n)</text>
<text x="430" y="324" font-size="12" fill="#52514E" dominant-baseline="central">f(1,2) 在表里是 dp[1][2] = 3, 读两次</text>
