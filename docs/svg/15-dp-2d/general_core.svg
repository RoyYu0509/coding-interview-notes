<svg width="100%" viewBox="0 0 680 432" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>2D DP 的骨架</title><desc>state 需要两个 index,依赖上 左 左上,填表顺序,滚动数组</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">dp[i][j] = 前缀 A[:i] 和前缀 B[:j] 的答案  ·  两个 index 才能说清子问题 → 2D 表</text>
<text x="40" y="38" font-size="12" fill="#52514E" dominant-baseline="central">想 transition: 问 "最后一步做了什么", 每种做法 = 一个更小的 (i', j')</text>
<text x="108.0" y="78" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">j-2</text>
<text x="170.0" y="78" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">j-1</text>
<text x="232.0" y="78" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">j</text>
<text x="294.0" y="78" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">j+1</text>
<text x="70" y="108.0" font-size="12" text-anchor="end" fill="#52514E" dominant-baseline="central">i-2</text>
<text x="70" y="160.0" font-size="12" text-anchor="end" fill="#52514E" dominant-baseline="central">i-1</text>
<text x="70" y="212.0" font-size="12" text-anchor="end" fill="#52514E" dominant-baseline="central">i</text>
<rect x="84" y="90" width="48" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="108.0" y="109.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central"></text>
<rect x="146" y="90" width="48" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="170.0" y="109.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central"></text>
<rect x="208" y="90" width="48" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="232.0" y="109.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central"></text>
<rect x="270" y="90" width="48" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="294.0" y="109.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central"></text>
<rect x="84" y="142" width="48" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="108.0" y="161.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central"></text>
<rect x="146" y="142" width="48" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170.0" y="161.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central"></text>
<rect x="208" y="142" width="48" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="232.0" y="161.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central"></text>
<rect x="270" y="142" width="48" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="294.0" y="161.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central"></text>
<rect x="84" y="194" width="48" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="108.0" y="213.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central"></text>
<rect x="146" y="194" width="48" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170.0" y="213.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central"></text>
<rect x="208" y="194" width="48" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="232.0" y="213.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">?</text>
<rect x="270" y="194" width="48" height="36" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="294.0" y="213.0" font-size="14" font-weight="500" text-anchor="middle" fill="#B4B2A9" dominant-baseline="central"></text>
<rect x="143" y="139" width="54" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="205" y="139" width="54" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="143" y="191" width="54" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="196.0" y1="180.3" x2="206.0" y2="191.7" stroke="#8A6D1E" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="232.0" y1="181.0" x2="232.0" y2="191.0" stroke="#8A6D1E" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="197.0" y1="212.0" x2="205.0" y2="212.0" stroke="#8A6D1E" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="340" y="108" font-size="12" fill="#993C1D" dominant-baseline="central">更早的行: 不会再被读 → 可以丢</text>
<text x="340" y="160" font-size="12" fill="#0B0B0B" dominant-baseline="central">prev 行: 只需要保留这一行</text>
<text x="340" y="212" font-size="12" fill="#0B0B0B" dominant-baseline="central">cur 行: 从左到右边填边用</text>
<line x1="40" y1="244" x2="640" y2="244" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="264" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">① 填表顺序</text>
<text x="150" y="264" font-size="12" fill="#52514E" dominant-baseline="central">dp[i][j] 要读 上 / 左 / 左上 → 这三个必须已经填好</text>
<text x="150" y="282" font-size="12" fill="#52514E" dominant-baseline="central">→ i 从上到下, j 从左到右 (依赖指向的反方向)</text>
<text x="40" y="310" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">② 滚动数组</text>
<text x="150" y="310" font-size="12" fill="#52514E" dominant-baseline="central">dp[i][*] 只读 dp[i-1][*] 和同一行左边的格子</text>
<text x="150" y="328" font-size="12" fill="#52514E" dominant-baseline="central">→ 只留 prev, cur 两行, space O(m*n) → O(n)</text>
<text x="40" y="356" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">③ base case</text>
<text x="150" y="356" font-size="12" fill="#52514E" dominant-baseline="central">第 0 行 / 第 0 列 = 一边是空时的答案</text>
<text x="150" y="374" font-size="12" fill="#52514E" dominant-baseline="central">→ 先填好, 循环从 1 开始, 不用写 if i == 0</text>
<rect x="40" y="399" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="406" font-size="12" fill="#52514E" dominant-baseline="central">要填的 dp[i][j]</text>
<rect x="224.79999999999998" y="399" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250.79999999999998" y="406" font-size="12" fill="#52514E" dominant-baseline="central">已填好</text>
<rect x="307.0" y="399" width="18" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="333.0" y="406" font-size="12" fill="#52514E" dominant-baseline="central">不再需要</text>
<rect x="400.6" y="399" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#EF9F27" stroke-width="2.5"/>
<text x="426.6" y="406" font-size="12" fill="#52514E" dominant-baseline="central">依赖的格子</text>
<line x1="505.6" y1="406.0" x2="525.6" y2="406.0" stroke="#52514E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="535.6" y="406" font-size="12" fill="#52514E" dominant-baseline="central">依赖方向</text>
</svg>
