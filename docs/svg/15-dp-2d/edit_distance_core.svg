<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Edit Distance: 三种操作 = 三个方向</title><desc>replace 左上,delete 上,insert 左</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">dp[i][j] = word1[:i] 变成 word2[:j] 的最少操作数 · 看最后一步操作了什么</text>
<text x="124.0" y="66" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">j-1</text>
<text x="224.0" y="66" font-size="12" text-anchor="middle" fill="#52514E" dominant-baseline="central">j</text>
<text x="66" y="100.0" font-size="12" text-anchor="end" fill="#52514E" dominant-baseline="central">i-1</text>
<text x="66" y="180.0" font-size="12" text-anchor="end" fill="#52514E" dominant-baseline="central">i</text>
<rect x="80" y="78" width="88" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="124.0" y="101.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">dp[i-1][j-1]</text>
<rect x="180" y="78" width="88" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="224.0" y="101.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">dp[i-1][j]</text>
<rect x="80" y="158" width="88" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="124.0" y="181.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">dp[i][j-1]</text>
<rect x="180" y="158" width="88" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="224.0" y="181.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">?</text>
<rect x="77" y="75" width="94" height="50" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="177" y="75" width="94" height="50" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="77" y="155" width="94" height="50" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="168.9" y1="124.8" x2="179.1" y2="155.2" stroke="#8A6D1E" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="224.0" y1="125.0" x2="224.0" y2="155.0" stroke="#8A6D1E" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="171.0" y1="180.0" x2="177.0" y2="180.0" stroke="#8A6D1E" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="350" y="56" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">replace</text>
<text x="420" y="56" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">左上 dp[i-1][j-1] + 1</text>
<text x="350" y="76" font-size="12" fill="#52514E" dominant-baseline="central">word1[i-1] 改成 word2[j-1]; 两边各缩短 1 个字符</text>
<text x="350" y="108" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">delete</text>
<text x="420" y="108" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">上面 dp[i-1][j] + 1</text>
<text x="350" y="128" font-size="12" fill="#52514E" dominant-baseline="central">删掉 word1[i-1]; word1 缩短 1, word2 不变</text>
<text x="350" y="160" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">insert</text>
<text x="420" y="160" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">左边 dp[i][j-1] + 1</text>
<text x="350" y="180" font-size="12" fill="#52514E" dominant-baseline="central">在末尾补一个 word2[j-1]; word2 缩短 1, word1 不变</text>
<line x1="40" y1="228" x2="640" y2="228" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="250" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">最后一个字符已经相同 (word1[i-1] == word2[j-1])  →  不用任何操作: dp[i][j] = dp[i-1][j-1]</text>
<text x="40" y="274" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">不同  →  三种操作各试一次, 取最小: dp[i][j] = 1 + min(左上, 上, 左)</text>
<text x="40" y="298" font-size="12" fill="#993C1D" dominant-baseline="central">和 LCS 的区别: LCS 不同时是 max(上, 左) 且不加 1; 这里多了 "左上" 这个选项 (replace), 求最小所以加 1</text>
<rect x="40" y="319" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="326" font-size="12" fill="#52514E" dominant-baseline="central">要填的 dp[i][j]</text>
<rect x="224.79999999999998" y="319" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250.79999999999998" y="326" font-size="12" fill="#52514E" dominant-baseline="central">三个来路</text>
<rect x="318.4" y="319" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#EF9F27" stroke-width="2.5"/>
<text x="344.4" y="326" font-size="12" fill="#52514E" dominant-baseline="central">依赖</text>
<line x1="389.2" y1="326.0" x2="409.2" y2="326.0" stroke="#52514E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="419.2" y="326" font-size="12" fill="#52514E" dominant-baseline="central">依赖方向</text>
</svg>
