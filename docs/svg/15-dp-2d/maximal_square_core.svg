<text x="40" y="210" font-size="12" fill="#0B0B0B" dominant-baseline="central">为什么是 min: 要把当前格补成 (k+1)×(k+1) 的正方形, 上 / 左 / 左上三块都得至少是 k×k。</text>
<text x="40" y="230" font-size="12" fill="#0B0B0B" dominant-baseline="central">三块里最小的那块先 "撞墙" (这里左上角的 0 把 diag 限制成 1), 所以边长 = 最小 + 1。</text>
<text x="40" y="250" font-size="12" fill="#52514E" dominant-baseline="central">当前格是 0 时 dp = 0: 它不能当任何正方形的右下角。</text>
