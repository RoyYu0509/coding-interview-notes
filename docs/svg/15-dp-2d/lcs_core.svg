<svg width="100%" viewBox="0 0 680 366" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>LCS: 看最后一个字符</title><desc>相同则左上+1,不同则丢一个字符</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">dp[i][j] = text1[:i] 和 text2[:j] 的 LCS 长度 · 比较两个前缀的最后一个字符 text1[i-1], text2[j-1]</text>
<text x="40" y="60" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">case 1 · 最后一个字符相同</text>
<text x="40" y="84" font-size="12" fill="#52514E" dominant-baseline="central">text1[:i] =</text>
<rect x="120" y="70" width="30" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135.0" y="86.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="150" y="70" width="30" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="165.0" y="86.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="180" y="70" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="195.0" y="86.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">c</text>
<text x="40" y="124" font-size="12" fill="#52514E" dominant-baseline="central">text2[:j] =</text>
<rect x="120" y="110" width="30" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135.0" y="126.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="150" y="110" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="165.0" y="126.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">c</text>
<text x="240" y="85" font-size="12" fill="#0B0B0B" dominant-baseline="central">c == c → 这一对一定能配上</text>
<text x="240" y="125" font-size="12" fill="#0B0B0B" dominant-baseline="central">去掉这一对, 剩下 "ab" vs "a"</text>
<text x="240" y="155" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">dp[i][j] = dp[i-1][j-1] + 1</text>
<line x1="40" y1="172" x2="640" y2="172" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="196" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">case 2 · 最后一个字符不同</text>
<text x="40" y="220" font-size="12" fill="#52514E" dominant-baseline="central">text1[:i] =</text>
<rect x="120" y="206" width="30" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135.0" y="222.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="150" y="206" width="30" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="165.0" y="222.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="180" y="206" width="30" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="195.0" y="222.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">d</text>
<text x="40" y="260" font-size="12" fill="#52514E" dominant-baseline="central">text2[:j] =</text>
<rect x="120" y="246" width="30" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135.0" y="262.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="150" y="246" width="30" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="165.0" y="262.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">c</text>
<text x="240" y="215" font-size="12" fill="#0B0B0B" dominant-baseline="central">d != c → 它们不可能同时出现在 LCS 的末尾</text>
<text x="240" y="235" font-size="12" fill="#0B0B0B" dominant-baseline="central">要么丢掉 d:  "ab" vs "ac"  → dp[i-1][j]</text>
<text x="240" y="255" font-size="12" fill="#0B0B0B" dominant-baseline="central">要么丢掉 c:  "abd" vs "a"  → dp[i][j-1]</text>
<text x="240" y="285" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">dp[i][j] = max(dp[i-1][j], dp[i][j-1])</text>
<text x="40" y="320" font-size="12" fill="#52514E" dominant-baseline="central">两个 index 各自只会 "缩短一个字符" → 子问题永远是 (前缀, 前缀), 总共 (m+1)(n+1) 个</text>
<rect x="40" y="337" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="344" font-size="12" fill="#52514E" dominant-baseline="central">比较的最后字符 (相同)</text>
<rect x="224.79999999999998" y="337" width="18" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="250.79999999999998" y="344" font-size="12" fill="#52514E" dominant-baseline="central">被丢掉的字符</text>
<rect x="341.2" y="337" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="367.2" y="344" font-size="12" fill="#52514E" dominant-baseline="central">其余字符</text>
</svg>
