<svg width="100%" viewBox="0 0 680 154" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Edit Distance examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">把 word1 变成 word2, 每一步可以: 插入一个字符 / 删除一个字符 / 替换一个字符。最少几步</text>
<line x1="40" y1="42" x2="640" y2="42" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example:  word1 = &quot;horse&quot;, word2 = &quot;ros&quot;  →  3</text>
<text x="40" y="82" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">horse → rorse (把 h 换成 r)</text>
<text x="40" y="100" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">rorse → rose (删掉 r)</text>
<text x="40" y="118" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">rose → ros (删掉 e)</text>
<line x1="40" y1="142" x2="640" y2="142" stroke="#B4B2A9" stroke-dasharray="4 4"/></svg>
