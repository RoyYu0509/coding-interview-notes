<text x="235.0" y="335.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">a</text>
<text x="167.0" y="360" font-size="12" font-weight="500" text-anchor="middle" fill="#0B0B0B" dominant-baseline="central">l</text>
<text x="235.0" y="360" font-size="12" font-weight="500" text-anchor="middle" fill="#0B0B0B" dominant-baseline="central">r</text>
<text x="360" y="335" font-size="12" fill="#0B0B0B" dominant-baseline="central">s[0]=s[2]='a' ✓</text>
<text x="540" y="335" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">count = 3</text>
<rect x="150" y="376" width="34" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
