<text x="360" y="217" font-size="12" fill="#993C1D" dominant-baseline="central">s[0]='a' != s[1]='b' ✗ 停</text>
<text x="540" y="217" font-size="14" fill="#52514E" dominant-baseline="central">count = 1</text>
<line x1="40" y1="254" x2="640" y2="254" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
