<text x="235.0" y="391.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<text x="360" y="391" font-size="12" fill="#993C1D" dominant-baseline="central">l=-1 或 r=3 越界 → 停</text>
<text x="540" y="391" font-size="14" fill="#52514E" dominant-baseline="central">count = 3</text>
