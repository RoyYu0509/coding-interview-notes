<text x="235.0" y="99.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<text x="167.0" y="124" font-size="12" font-weight="500" text-anchor="middle" fill="#0B0B0B" dominant-baseline="central">l=r</text>
<text x="360" y="99" font-size="12" fill="#0B0B0B" dominant-baseline="central">s[0]=s[0]='a' ✓</text>
<text x="540" y="99" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">count = 1</text>
