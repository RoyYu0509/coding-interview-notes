<svg width="100%" viewBox="0 0 680 744" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Palindromic Substrings trace</title><desc>s = aba, 5 个中心逐个扩展</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">s = "aba" · 每个中心: l, r 从中心出发 → 两端相同就 count += 1 并向外扩一步, 不同 / 越界就停</text>
<text x="40" y="38" font-size="12" fill="#52514E" dominant-baseline="central">count = 目前为止发现的 palindrome 个数 · 方框里 l 和 r 标出当前比较的两个位置</text>
<text x="40" y="64" font-size="12" fill="#52514E" dominant-baseline="central">中心</text>
<text x="150" y="64" font-size="12" fill="#52514E" dominant-baseline="central">s 与 (l, r)</text>
<text x="360" y="64" font-size="12" fill="#52514E" dominant-baseline="central">比较</text>
<text x="540" y="64" font-size="12" fill="#52514E" dominant-baseline="central">count</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="99" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">奇数中心 s[0]</text>
