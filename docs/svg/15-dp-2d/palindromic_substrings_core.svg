<svg width="100%" viewBox="0 0 680 316" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Palindromic Substrings: 一个 palindrome 一个中心</title><desc>s = aba 的 4 个 palindrome</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">每个 palindrome 恰好有一个中心 → 按中心统计, 不重不漏。扩展时每成功一步 = 多一个 palindrome</text>
<text x="40" y="56" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">s = "aba"</text>
<rect x="150" y="40" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170.0" y="56.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="190" y="40" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="210.0" y="56.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="230" y="40" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250.0" y="56.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<text x="40" y="86" font-size="12" fill="#52514E" dominant-baseline="central">中心</text>
<text x="150" y="86" font-size="12" fill="#52514E" dominant-baseline="central">在这个中心发现的 palindrome</text>
<text x="420" y="86" font-size="12" fill="#52514E" dominant-baseline="central">count 增加</text>
<line x1="40" y1="96" x2="640" y2="96" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="114" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">中心 s[0]</text>
<text x="150" y="114" font-size="14" fill="#0B0B0B" dominant-baseline="central">"a"</text>
<text x="420" y="114" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">+1  (累计 1)</text>
<text x="40" y="144" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">缝 (0,1)</text>
<text x="150" y="144" font-size="14" fill="#0B0B0B" dominant-baseline="central">—  (a != b)</text>
<text x="420" y="144" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">+0  (累计 1)</text>
<text x="40" y="174" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">中心 s[1]</text>
<text x="150" y="174" font-size="14" fill="#0B0B0B" dominant-baseline="central">"b", "aba"</text>
<text x="420" y="174" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">+2  (累计 3)</text>
<text x="40" y="204" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">缝 (1,2)</text>
<text x="150" y="204" font-size="14" fill="#0B0B0B" dominant-baseline="central">—  (b != a)</text>
<text x="420" y="204" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">+0  (累计 3)</text>
<text x="40" y="234" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">中心 s[2]</text>
<text x="150" y="234" font-size="14" fill="#0B0B0B" dominant-baseline="central">"a"</text>
<text x="420" y="234" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">+1  (累计 4)</text>
<line x1="40" y1="254" x2="640" y2="254" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="276" font-size="12" fill="#0B0B0B" dominant-baseline="central">共 4 个。dp 版也能做: 数 dp 表里 True 的个数, 但要 O(n²) space; 中心扩展 O(1) space。</text>
<text x="40" y="296" font-size="12" fill="#993C1D" dominant-baseline="central">和上一题的区别: 不记最长的, 每扩一步 count += 1。</text>
</svg>
