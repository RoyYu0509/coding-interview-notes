<svg width="100%" viewBox="0 0 680 285" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Minimum Path Sum: 最后一步 + 前缀最优</title><desc>dp[1][1] 取上面和左边里小的</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">dp[i][j] = 从 (0,0) 走到 (i,j) 的最小路径和  ·  最后一步只能来自上面或左边</text>
<text x="40" y="38" font-size="12" fill="#52514E" dominant-baseline="central">为什么只看两个邻居的 dp 值就够: 走到 (i,j) 的最优路径, 它的前缀一定也是走到那个邻居的最优路径</text>
<rect x="150" y="80" width="90" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="155" y="88" font-size="12" fill="#444441" dominant-baseline="central">top (0,1)</text>
<text x="199.0" y="114" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">4</text>
<rect x="50" y="144" width="90" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="55" y="152" font-size="12" fill="#444441" dominant-baseline="central">left (1,0)</text>
<text x="99.0" y="178" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">2</text>
<rect x="150" y="144" width="90" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="155" y="152" font-size="12" fill="#085041" dominant-baseline="central">cur (1,1)</text>
<text x="199.0" y="178" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">?</text>
<rect x="147" y="77" width="96" height="50" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="47" y="141" width="96" height="50" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="195.0" y1="127.0" x2="195.0" y2="142.0" stroke="#8A6D1E" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="142.0" y1="166.0" x2="149.0" y2="166.0" stroke="#8A6D1E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300" y="88" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">top  = dp[0][1] = 4</text>
<text x="300" y="110" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">left = dp[1][0] = 2</text>
<text x="300" y="146" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">min(top, left) = min(4, 2) = 2  ← 选这条</text>
<text x="300" y="170" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">dp[1][1] = 2 + grid[1][1] = 2 + 5 = 7</text>
<text x="300" y="192" font-size="12" fill="#52514E" dominant-baseline="central">没选的那条 (4) 更大, 以后也不会翻身: 后面只加正数</text>
<text x="40" y="230" font-size="12" fill="#993C1D" dominant-baseline="central">和 Unique Paths 的区别只有一行: 相加 → 取 min, 并且多加自己这格的 grid 值</text>
<rect x="40" y="255" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="262" font-size="12" fill="#52514E" dominant-baseline="central">要填的格子</text>
<rect x="145.0" y="255" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="171.0" y="262" font-size="12" fill="#52514E" dominant-baseline="central">已经填好</text>
<rect x="238.6" y="255" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#EF9F27" stroke-width="2.5"/>
<text x="264.6" y="262" font-size="12" fill="#52514E" dominant-baseline="central">候选来路</text>
</svg>
