<svg width="100%" viewBox="0 0 680 376" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Longest Palindromic Substring: expand around center</title><desc>从中心往两边扩</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" dominant-baseline="central">palindrome 一定有一个中心。枚举 2n-1 个中心 (n 个字符 + n-1 个缝), 从中心往两边扩, 直到两端不同</text>
<text x="140" y="52" font-size="12" fill="#52514E" dominant-baseline="central">s = "babad"</text>
<text x="40" y="79" font-size="12" fill="#0B0B0B" dominant-baseline="central">中心 s[1]='a'</text>
<rect x="150" y="64" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170.0" y="80.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="190" y="64" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210.0" y="80.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">a</text>
<rect x="230" y="64" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250.0" y="80.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="270" y="64" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="290.0" y="80.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="310" y="64" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330.0" y="80.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">d</text>
<text x="366" y="79" font-size="12" fill="#0B0B0B" dominant-baseline="central">l=r=1 'a'=='a' ✓  长度 1</text>
<text x="40" y="119" font-size="12" fill="#0B0B0B" dominant-baseline="central">  扩一步</text>
<rect x="150" y="104" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="170.0" y="120.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">b</text>
<rect x="190" y="104" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210.0" y="120.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">a</text>
<rect x="230" y="104" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="250.0" y="120.0" font-size="14" font-weight="500" text-anchor="middle" fill="#085041" dominant-baseline="central">b</text>
<rect x="270" y="104" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="290.0" y="120.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="310" y="104" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330.0" y="120.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">d</text>
<text x="366" y="119" font-size="12" fill="#0B0B0B" dominant-baseline="central">l=0, r=2 'b'=='b' ✓  "bab" 长度 3</text>
<text x="40" y="159" font-size="12" fill="#0B0B0B" dominant-baseline="central">  再扩一步</text>
<rect x="150" y="144" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170.0" y="160.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="190" y="144" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="210.0" y="160.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="230" y="144" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250.0" y="160.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="270" y="144" width="40" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="290.0" y="160.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">a</text>
<rect x="310" y="144" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330.0" y="160.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">d</text>
<text x="366" y="159" font-size="12" fill="#0B0B0B" dominant-baseline="central">l=-1 越界 → 停, 结果 "bab"</text>
<line x1="40" y1="188" x2="640" y2="188" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="215" font-size="12" fill="#0B0B0B" dominant-baseline="central">缝 (0,1) b|a</text>
<rect x="150" y="200" width="40" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="170.0" y="216.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">b</text>
<rect x="190" y="200" width="40" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="210.0" y="216.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">a</text>
<rect x="230" y="200" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250.0" y="216.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="270" y="200" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="290.0" y="216.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="310" y="200" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330.0" y="216.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">d</text>
<text x="366" y="215" font-size="12" fill="#0B0B0B" dominant-baseline="central">'b' != 'a' ✗  偶数中心立刻停</text>
<text x="40" y="255" font-size="12" fill="#0B0B0B" dominant-baseline="central">缝 (3,4) a|d</text>
<rect x="150" y="240" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170.0" y="256.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="190" y="240" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="210.0" y="256.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">a</text>
<rect x="230" y="240" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250.0" y="256.0" font-size="14" font-weight="500" text-anchor="middle" fill="#444441" dominant-baseline="central">b</text>
<rect x="270" y="240" width="40" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="290.0" y="256.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">a</text>
<rect x="310" y="240" width="40" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="330.0" y="256.0" font-size="14" font-weight="500" text-anchor="middle" fill="#712B13" dominant-baseline="central">d</text>
<text x="366" y="255" font-size="12" fill="#0B0B0B" dominant-baseline="central">'a' != 'd' ✗  停</text>
<line x1="40" y1="284" x2="640" y2="284" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="40" y="306" font-size="14" font-weight="500" fill="#0B0B0B" dominant-baseline="central">每个中心最多扩 O(n) 步, 共 2n-1 个中心 → O(n²) time, O(1) space</text>
<text x="40" y="328" font-size="12" fill="#52514E" dominant-baseline="central">DP 版 dp[i][j] 也是 O(n²), 还要 O(n²) space; 它的价值是 "填表顺序" 这个思路, 下面的 trace 展示</text>
<rect x="40" y="347" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="354" font-size="12" fill="#52514E" dominant-baseline="central">还在匹配的区间</text>
<rect x="167.8" y="347" width="18" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="193.8" y="354" font-size="12" fill="#52514E" dominant-baseline="central">两端不同 → 停</text>
<rect x="307.0" y="347" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="333.0" y="354" font-size="12" fill="#52514E" dominant-baseline="central">没碰到</text>
</svg>
