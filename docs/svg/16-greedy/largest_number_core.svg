<svg width="100%" viewBox="0 0 680 336" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Largest Number 比较器</title><desc>a+b vs b+a</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">最大拼接数 = 把数字当字符串排序, 比较规则不是字典序, 而是: a 排前面 ⇔ a+b &gt; b+a (字符串拼接)</text>
<text x="20" y="46" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">为什么不能用普通字典序: 3 和 30</text>
<text x="20" y="80" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">例: a = &quot;3&quot;, b = &quot;30&quot;</text>
<text x="20" y="110" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">字典序: &quot;30&quot; &gt; &quot;3&quot; (多一位更大)  → 30 排前面</text>
<rect x="380" y="92" width="40" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="400.0" y="112.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">30</text>
<rect x="424" y="92" width="40" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="444.0" y="112.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">3</text>
<text x="476" y="112" font-size="16" fill="#712B13" text-anchor="start" font-weight="600">拼成 303</text>
<text x="20" y="156" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">a+b vs b+a: &quot;3&quot;+&quot;30&quot; = 330 &gt; &quot;30&quot;+&quot;3&quot; = 303</text>
<rect x="380" y="138" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="400.0" y="158.5" font-size="16" fill="#085041" text-anchor="middle" font-weight="400">3</text>
<rect x="424" y="138" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="444.0" y="158.5" font-size="16" fill="#085041" text-anchor="middle" font-weight="400">30</text>
<text x="476" y="158" font-size="16" fill="#085041" text-anchor="start" font-weight="600">拼成 330, 3 在前</text>
<line x1="20" y1="184" x2="660" y2="184" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="210" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">为什么对 (exchange argument):</text>
<text x="20" y="234" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">取最优答案里任意相邻的两段 x y。如果 y+x &gt; x+y, 把它们互换, 整个数里只有这两段的位置变了,</text>
<text x="20" y="254" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">前面和后面的部分完全不动, 数字变大 → 说明原来的不是最优。所以最优解里每对相邻的 x y 都满足 x+y ≥ y+x。</text>
<text x="20" y="274" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">这个关系是全序 (可传递), 所以按它排序出来的就是满足&#x27;所有相邻对都对&#x27;的唯一(并列)排列 → greedy 成立。</text>
<line x1="20" y1="294" x2="660" y2="294" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="318" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">代码里: sorted(strs, key=cmp_to_key(lambda a, b: -1 if a + b &gt; b + a else 1))</text>
</svg>
