<svg width="100%" viewBox="0 0 680 202" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, PingFang SC, sans-serif"><title>Partition Labels examples</title><text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">把字符串切成尽量多的段, 要求每个字母只出现在其中一段里。返回每段的长度</text>
