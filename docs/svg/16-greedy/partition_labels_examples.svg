<rect x="37" y="85" width="222" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="253" y="85" width="174" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="421" y="85" width="198" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="134" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">&quot;ababcbaca&quot; | &quot;defegde&quot; | &quot;hijhklij&quot;: a 只在第一段, d 和 e 只在第二段, ...</text>
<line x1="40" y1="158" x2="640" y2="158" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<rect x="33" y="173" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="54" y="180" font-size="12" fill="#52514E" text-anchor="start" font-weight="400" dominant-baseline="central" style="white-space:pre">每一段</text></svg>
