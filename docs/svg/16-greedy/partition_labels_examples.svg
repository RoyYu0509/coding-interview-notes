<text x="40" y="62" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="500" dominant-baseline="central" style="white-space:pre">Example:  s = &quot;ababcbacadefegdehijhklij&quot;  →  [9,7,8]</text>
