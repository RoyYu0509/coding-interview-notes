<svg width="100%" viewBox="0 0 680 504" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Greedy 的 exchange argument 与反例</title><desc>coins [1,5,10,25] 可以把最优解换成含 25 的解; coins [1,3,4] 换不了, greedy 失败。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">greedy = 每步取局部最优; 要证明 (exchange argument):</text>
<text x="20" y="46" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">任何最优解都能换成&#x27;含这步选择&#x27;的解, 且不变差</text>
<text x="20" y="78" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">A. coins = [1, 5, 10, 25], amount = 30。greedy 第一步拿最大的 25</text>
<text x="20" y="106" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">随便一个不含 25 的最优解:</text>
<rect x="260" y="88" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="277.0" y="109.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">10</text>
<rect x="294" y="88" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="311.0" y="109.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">10</text>
<rect x="328" y="88" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="345.0" y="109.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">5</text>
<rect x="362" y="88" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="379.0" y="109.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">5</text>
<text x="410" y="109" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">10+10+5+5 = 30, 共 4 枚</text>
<text x="20" y="156" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">取出 10+10+5 = 25, 换成一枚 25:</text>
<rect x="260" y="138" width="34" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="277.0" y="159.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">10</text>
<rect x="294" y="138" width="34" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="311.0" y="159.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">10</text>
<rect x="328" y="138" width="34" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="345.0" y="159.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">5</text>
<rect x="362" y="138" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="379.0" y="159.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">5</text>
<text x="410" y="150" font-size="12" fill="#D85A30" text-anchor="start" font-weight="400">10+10+5 = 25 被换掉</text>
<path d="M 291 172 L 291 190" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowo)"/>
<path d="M 360 172 L 330 190" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowo)"/>
<rect x="260" y="192" width="34" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="277.0" y="213.5" font-size="16" fill="#085041" text-anchor="middle" font-weight="400">25</text>
<rect x="294" y="192" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="311.0" y="213.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">5</text>
<text x="340" y="213" font-size="12" fill="#085041" text-anchor="start" font-weight="400">25+5 = 30, 共 2 枚 (4 → 2)</text>
<text x="20" y="252" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">换完没有变差 → &#x27;含 25&#x27; 的最优解一定存在 → greedy 拿 25 不会错过最优。往后对剩下的 5 重复同样论证。</text>
<line x1="20" y1="268" x2="660" y2="268" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="296" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">B. coins = [1, 3, 4], amount = 6。greedy 第一步拿 4</text>
<text x="20" y="330" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">greedy:</text>
<rect x="260" y="312" width="34" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="277.0" y="333.5" font-size="16" fill="#085041" text-anchor="middle" font-weight="400">4</text>
<rect x="294" y="312" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="311.0" y="333.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<rect x="328" y="312" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="345.0" y="333.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<text x="380" y="333" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">4+1+1 = 6, 共 3 枚</text>
<text x="20" y="380" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">真正的最优:</text>
<rect x="260" y="362" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="277.0" y="383.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<rect x="294" y="362" width="34" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="311.0" y="383.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<text x="340" y="383" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">3+3 = 6, 共 2 枚</text>
<text x="20" y="424" font-size="12" fill="#D85A30" text-anchor="start" font-weight="400">最优解 3+3 里找不到&#x27;加起来 = 4&#x27;的子集 (3 ≠ 4, 3+3 = 6 ≠ 4) → 换不进 4 → exchange 失败。</text>
<text x="20" y="444" font-size="12" fill="#D85A30" text-anchor="start" font-weight="400">greedy 的局部最优选择会丢掉全局最优 → 这种题要 DP: dp[6] = min(dp[5], dp[3], dp[2]) + 1 = 2。</text>
<line x1="20" y1="462" x2="660" y2="462" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="486" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">判断口诀: 能说清&#x27;最优解里一定可以含我这步选择&#x27;才用 greedy; 说不清、或者举得出反例 → DP。</text>
</svg>
