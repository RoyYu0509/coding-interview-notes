<svg width="100%" viewBox="0 0 680 468" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Gas Station 为什么从失败点的下一个开始</title><desc>起点 s 在 j 失败, 则 s..j 之间任何起点都失败</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">net[i] = gas[i] - cost[i] = [2, 1, -5, 3, 1] · 从 start 出发, 每站 tank += net[i], tank &lt; 0 就失败</text>
<text x="20" y="46" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">每个起点一行: 方框里是走到该站后的 tank</text>
<text x="20" y="80" font-size="14" fill="#52514E" text-anchor="start" font-weight="400">起点</text>
<text x="178" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">站 0</text>
<text x="178" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">net=+2</text>
<text x="248" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">站 1</text>
<text x="248" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">net=+1</text>
<text x="318" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">站 2</text>
<text x="318" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">net=-5</text>
<text x="388" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">站 3</text>
<text x="388" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">net=+3</text>
<text x="458" y="70" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">站 4</text>
<text x="458" y="86" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">net=+1</text>
<line x1="20" y1="94" x2="660" y2="94" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="126" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">start = 0</text>
<rect x="150" y="108" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="178.0" y="128.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">2</text>
<rect x="220" y="108" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="248.0" y="128.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<rect x="290" y="108" width="56" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="318.0" y="128.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">-2</text>
<text x="150" y="158" font-size="12" fill="#712B13" text-anchor="start" font-weight="400">走到站 1: tank = 2+1 = 3, 站 2: 3-5 = -2 ✗</text>
<line x1="20" y1="164" x2="660" y2="164" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="192" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">start = 1</text>
<rect x="220" y="174" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="248.0" y="194.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<rect x="290" y="174" width="56" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="318.0" y="194.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">-4</text>
<text x="150" y="224" font-size="12" fill="#712B13" text-anchor="start" font-weight="400">只有站 1 的 +1 当底: 1-5 = -4 ✗</text>
<line x1="20" y1="230" x2="660" y2="230" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="258" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">start = 2</text>
<rect x="290" y="240" width="56" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="318.0" y="260.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">-5</text>
<text x="150" y="290" font-size="12" fill="#712B13" text-anchor="start" font-weight="400">一上来 0-5 = -5 ✗</text>
<line x1="20" y1="296" x2="660" y2="296" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="324" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">start = 3</text>
<rect x="360" y="306" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="388.0" y="326.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<rect x="430" y="306" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="458.0" y="326.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">4</text>
<rect x="150" y="306" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="178.0" y="326.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">6</text>
<rect x="220" y="306" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="248.0" y="326.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">7</text>
<rect x="290" y="306" width="56" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="318.0" y="326.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">2</text>
<text x="150" y="356" font-size="12" fill="#085041" text-anchor="start" font-weight="400">站 3: 3, 站 4: 4, 回到站 0 (虚线): 6, 站 1: 7, 站 2: 7-5 = 2 ≥ 0 ✓</text>
<line x1="20" y1="362" x2="660" y2="362" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="382" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">start=0 在站 2 失败。到站 1 时 tank = 2 ≥ 0 (起点 0 给的&#x27;补贴&#x27;); start=1 没有这笔补贴, 到同一位置只会更差:</text>
<text x="20" y="402" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">tank(start=1, 站2) = tank(start=0, 站2) - tank(start=0, 站0) = -2 - 2 = -4 &lt; -2</text>
<text x="20" y="422" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">所以 start 到失败点之间的起点全部作废, 下一个候选 = 失败点 + 1。</text>
<text x="20" y="448" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">全局: total = sum(net) = 2+1-5+3+1 = 2 ≥ 0 → 一定有解, 且就是最后留下的 start。</text>
</svg>
