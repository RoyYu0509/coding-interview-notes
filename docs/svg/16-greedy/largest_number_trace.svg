<svg width="100%" viewBox="0 0 680 418" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Largest Number trace</title><desc>nums=[3,30,34,5,9] 逐个插入</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">nums = [3, 30, 34, 5, 9] · 逐个插入已排好的 list: 放到第一个满足 x+e &gt; e+x 的 e 前面</text>
<text x="20" y="46" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">x = 新数字, e = list 里的数字, 比较的是字符串拼接 (sorted 的结果和这个一样)</text>
<text x="20" y="76" font-size="14" fill="#52514E" text-anchor="start" font-weight="400">新数字 x</text>
<text x="110" y="76" font-size="14" fill="#52514E" text-anchor="start" font-weight="400">比较 (x+e vs e+x)</text>
<text x="430" y="76" font-size="14" fill="#52514E" text-anchor="start" font-weight="400">插入后的 list</text>
<line x1="20" y1="86" x2="660" y2="86" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="122" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="400">x = 3</text>
<text x="110" y="122" font-size="14" fill="#52514E" text-anchor="start" font-weight="400">list 为空, 直接放入</text>
<rect x="430" y="104" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="427" y="101" width="46" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="450.0" y="124.5" font-size="16" fill="#085041" text-anchor="middle" font-weight="400">3</text>
<line x1="20" y1="142" x2="660" y2="142" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="174" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="400">x = 30</text>
<text x="110" y="166" font-size="12" fill="#712B13" text-anchor="start" font-weight="400">30+3 = 303  &lt;  3+30 = 330 → 30 排在 3 后面, 看下一个</text>
<rect x="430" y="156" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="450.0" y="176.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
