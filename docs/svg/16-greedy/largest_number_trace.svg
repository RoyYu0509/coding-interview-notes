<text x="494.0" y="228.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<rect x="518" y="208" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="538.0" y="228.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">30</text>
<line x1="20" y1="246" x2="660" y2="246" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="278" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="400">x = 5</text>
<text x="110" y="270" font-size="12" fill="#085041" text-anchor="start" font-weight="400">5+34 = 534  &gt;  34+5 = 345 → 5 排在 34 前面</text>
