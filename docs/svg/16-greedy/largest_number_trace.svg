<text x="20" y="226" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="400">x = 34</text>
<text x="110" y="218" font-size="12" fill="#085041" text-anchor="start" font-weight="400">34+3 = 343  &gt;  3+34 = 334 → 34 排在 3 前面</text>
<rect x="430" y="208" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
