<rect x="518" y="312" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="538.0" y="332.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">34</text>
<rect x="562" y="312" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="582.0" y="332.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<rect x="606" y="312" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="626.0" y="332.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">30</text>
<line x1="20" y1="350" x2="660" y2="350" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="370" font-size="16" fill="#085041" text-anchor="start" font-weight="600">答案: &quot;&quot;.join(list) = &quot;9&quot; + &quot;5&quot; + &quot;34&quot; + &quot;3&quot; + &quot;30&quot; = &quot;9534330&quot;</text>
<rect x="20" y="389" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="42" y="402" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">刚插入的</text>
<rect x="120.96" y="389" width="16" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="142.95999999999998" y="402" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">list 里已有的</text>
