<text x="494.0" y="280.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">34</text>
<rect x="518" y="260" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="538.0" y="280.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<rect x="562" y="260" width="40" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="582.0" y="280.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">30</text>
<line x1="20" y1="298" x2="660" y2="298" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="330" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="400">x = 9</text>
<text x="110" y="322" font-size="12" fill="#085041" text-anchor="start" font-weight="400">9+5 = 95  &gt;  5+9 = 59 → 9 排在 5 前面</text>
<rect x="430" y="312" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="427" y="309" width="46" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
