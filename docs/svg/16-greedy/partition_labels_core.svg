<svg width="100%" viewBox="0 0 680 318" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Partition Labels invariant</title><desc>每段的右边界 = 段内字母 last occurrence 的最大值</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">每个字母只能出现在一段里 → 一段里出现了字母 c, 这段至少要延伸到 c 的最后一次出现 (last[c])</text>
<text x="20" y="46" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">s = &quot;abacbdefe&quot;</text>
<text x="118" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=0</text>
<rect x="100" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="118.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">a</text>
<text x="158" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=1</text>
<rect x="140" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="158.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">b</text>
<text x="198" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=2</text>
<rect x="180" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="198.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">a</text>
<text x="238" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=3</text>
<rect x="220" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="238.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">c</text>
<text x="278" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=4</text>
<rect x="260" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="278.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">b</text>
<text x="318" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=5</text>
<rect x="300" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="318.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">d</text>
<text x="358" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=6</text>
<rect x="340" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="358.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">e</text>
<text x="398" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=7</text>
<rect x="380" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="398.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">f</text>
<text x="438" y="76" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=8</text>
<rect x="420" y="82" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="438.0" y="103.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">e</text>
<text x="20" y="104" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">s</text>
<path d="M 100 124 L 100 132 L 296 132 L 296 124" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text x="198.0" y="152" font-size="12" fill="#085041" text-anchor="middle" font-weight="400">一段, 长度 5</text>
<path d="M 300 124 L 300 132 L 336 132 L 336 124" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text x="318.0" y="152" font-size="12" fill="#085041" text-anchor="middle" font-weight="400">一段, 长度 1</text>
<path d="M 340 124 L 340 132 L 456 132 L 456 124" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text x="398.0" y="152" font-size="12" fill="#085041" text-anchor="middle" font-weight="400">一段, 长度 3</text>
<text x="20" y="184" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">last = {a: 2, b: 4, c: 3, d: 5, e: 8, f: 7}</text>
<line x1="20" y1="200" x2="660" y2="200" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="224" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">a 最后出现在 2 → 包含 a 的段至少延伸到 i=2; 这段里的 b (last=4) 又把右边界推到 4; c (last=3) 没推远。</text>
<text x="20" y="244" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">end = max(扫过的字母的 last) 只会变大; 当 i == end 时, 段内所有字母都已经最后一次出现 → 可以安全切。</text>
<text x="20" y="264" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">切得越早越好 (greedy): 第一次满足 i == end 就切, 再往后拖只会把后面的字母拉进来、段更长, 段数不会更多。</text>
<text x="20" y="300" font-size="16" fill="#085041" text-anchor="start" font-weight="600">答案 = [5, 1, 3]</text>
</svg>
