<svg width="100%" viewBox="0 0 680 394" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Jump Game 的 invariant</title><desc>可达集合永远是前缀 [0, max_reach], 所以只需要维护 max_reach 一个数</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">invariant: 扫到 i 时, 下标 0..max_reach 全部可达 (中间没有&#x27;洞&#x27;),  max_reach = max(i + nums[i])</text>
<text x="20" y="46" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">因为从某个可达的格子起跳, 能落到它后面任意一格 (跳 1..nums[i] 步), 所以可达集合是连续的前缀</text>
<text x="20" y="82" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">例 1: nums = [3, 2, 1, 0, 4]</text>
<text x="318" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=0</text>
<rect x="300" y="110" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="318.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<text x="358" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=1</text>
<rect x="340" y="110" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="358.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">2</text>
<text x="398" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=2</text>
<rect x="380" y="110" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="398.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<text x="438" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=3</text>
<rect x="420" y="110" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="438.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">0</text>
<text x="478" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=4</text>
<rect x="460" y="110" width="36" height="32" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="457" y="107" width="42" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="478.0" y="131.5" font-size="16" fill="#712B13" text-anchor="middle" font-weight="400">4</text>
<text x="20" y="132" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">i=0: 0+3 = 3 · i=1: 1+2 = 3</text>
<text x="20" y="150" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">i=2: 2+1 = 3 · i=3: 3+0 = 3</text>
<path d="M 300 154 L 456 154" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="300" y="172" font-size="12" fill="#085041" text-anchor="start" font-weight="400">可达 = [0, 3]  (max_reach = 3)</text>
<text x="500" y="172" font-size="12" fill="#712B13" text-anchor="start" font-weight="400">i=4 &gt; max_reach=3 → 卡住</text>
<text x="20" y="194" font-size="14" fill="#712B13" text-anchor="start" font-weight="400">→ return False</text>
<line x1="20" y1="214" x2="660" y2="214" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="242" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">例 2: nums = [2, 3, 1, 1, 4]</text>
<text x="318" y="264" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=0</text>
<rect x="300" y="270" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="318.0" y="291.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">2</text>
<text x="358" y="264" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=1</text>
<rect x="340" y="270" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="358.0" y="291.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<text x="398" y="264" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=2</text>
<rect x="380" y="270" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="398.0" y="291.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<text x="438" y="264" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=3</text>
<rect x="420" y="270" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="438.0" y="291.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<text x="478" y="264" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=4</text>
<rect x="460" y="270" width="36" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="478.0" y="291.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">4</text>
<text x="20" y="292" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">i=0: 0+2 = 2 · i=1: 1+3 = 4</text>
<path d="M 300 314 L 494 314" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="300" y="332" font-size="12" fill="#085041" text-anchor="start" font-weight="400">max_reach = 4 ≥ 最后一格 4 → 可达</text>
<text x="20" y="332" font-size="14" fill="#085041" text-anchor="start" font-weight="400">→ return True</text>
<line x1="20" y1="352" x2="660" y2="352" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="376" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">greedy 选择 = &#x27;每个格子都尽量往远处记&#x27;: 只留最远的一个数, 比 DFS 记录每个可达位置省掉所有重复探索。</text>
</svg>
