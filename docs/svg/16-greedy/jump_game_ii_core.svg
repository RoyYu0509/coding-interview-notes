<svg width="100%" viewBox="0 0 680 382" role="img" xmlns="http://www.w3.org/2000/svg" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif'>
<title>Jump Game II BFS 分层</title><desc>每一层 = 跳 j 步能到的下标区间</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="400">把 Jump Game 看成 BFS: 第 j 层 = 跳 j 步能到的下标区间。不用 queue, 只用两个数标出层的边界</text>
<text x="20" y="46" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">cur_end = 当前层最右边的下标;  farthest = 扫过当前层所有格子后, 下一层最右能到哪</text>
<text x="20" y="78" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">nums = [2, 3, 1, 1, 4], 目标 = 下标 4</text>
<text x="66" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=0</text>
<rect x="40" y="110" width="52" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="66.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">2</text>
<text x="122" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=1</text>
<rect x="96" y="110" width="52" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="122.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">3</text>
<text x="178" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=2</text>
<rect x="152" y="110" width="52" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="178.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<text x="234" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=3</text>
<rect x="208" y="110" width="52" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="234.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">1</text>
<text x="290" y="104" font-size="12" fill="#52514E" text-anchor="middle" font-weight="400">i=4</text>
<rect x="264" y="110" width="52" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="290.0" y="131.5" font-size="16" fill="#444441" text-anchor="middle" font-weight="400">4</text>
<path d="M 40 158 L 40 166 L 92 166 L 92 158" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="66.0" y="184" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">层 0: {0}</text>
<path d="M 96 158 L 96 166 L 204 166 L 204 158" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="150.0" y="184" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">层 1: {1, 2}</text>
<path d="M 208 158 L 208 166 L 316 166 L 316 158" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="262.0" y="184" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400">层 2: {3, 4}</text>
<text x="340" y="200" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="400"></text>
<text x="20" y="218" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">从层 0 (只有 i=0) 出发: farthest = 0+2 = 2 → 层 1 的右边界 cur_end = 2</text>
<text x="20" y="238" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">扫层 1 (i=1,2): farthest = max(1+3, 2+1) = 4 → 层 2 的右边界 cur_end = 4</text>
<text x="20" y="258" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">4 ≥ 最后一格 4, 到达终点; 一共走了 2 层 = 跳 2 次</text>
<line x1="20" y1="274" x2="660" y2="274" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="300" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="600">为什么每层只要记 farthest 一个数就够:</text>
<text x="20" y="324" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">下一层 = 当前层所有格子能跳到的区间之并, 而每个区间的左端都紧贴当前层, 并起来仍是连续区间。</text>
<text x="20" y="344" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">所以下一层只由右端点 farthest 决定, 且层 j 的下标一定比层 j+1 靠前 → 第一次覆盖到终点的层数就是最少步数。</text>
<text x="20" y="364" font-size="12" fill="#52514E" text-anchor="start" font-weight="400">i == cur_end 表示当前层扫完了, 必须再跳一次 (jumps += 1), 并把边界推到 farthest。</text>
</svg>
