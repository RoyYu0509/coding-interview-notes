<svg width="100%" viewBox="0 0 680 334" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Best Time to Buy and Sell Stock 的 prefix min 与状态机</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">每个 j 天卖出, 最佳买入日 = j 之前价格最低的那天 → 只需维护 lo = 到目前为止的最低价</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">prices = [7, 1, 5, 3, 6, 4]</text>
<rect x="44" y="90" width="30" height="140" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="59.0" y="78" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">7</text>
<text x="59.0" y="244" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=0</text>
<rect x="84" y="210" width="30" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="99.0" y="198" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">1</text>
<text x="99.0" y="244" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=1</text>
<rect x="124" y="130" width="30" height="100" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="139.0" y="118" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">5</text>
<text x="139.0" y="244" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=2</text>
<rect x="164" y="170" width="30" height="60" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="179.0" y="158" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">3</text>
<text x="179.0" y="244" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=3</text>
<rect x="204" y="110" width="30" height="120" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="219.0" y="98" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">6</text>
<text x="219.0" y="244" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=4</text>
<rect x="244" y="150" width="30" height="80" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="259.0" y="138" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="middle" dominant-baseline="central">4</text>
<text x="259.0" y="244" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=5</text>
<rect x="201" y="107" width="36" height="126" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="114" y1="210" x2="280" y2="210" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="286" y="200" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">lo = 1</text>
<path d="M239 210 L239 112" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrG)"/>
<text x="253" y="92" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">profit = 6 - 1 = 5</text>
<text x="440" y="76" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">同一件事的状态机视角</text>
<rect x="440" y="110" width="100" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="490" y="132" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">cash</text>
<rect x="560" y="110" width="100" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="610" y="132" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">hold</text>
<path d="M542 122 L556 122" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M558 142 L544 142" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="550" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">buy: -p</text>
<text x="550" y="166" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">sell: +p</text>
<text x="440" y="196" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">hold = max(hold, -p)</text>
<text x="440" y="218" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">cash = max(cash, hold + p)</text>
<text x="440" y="244" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">只能买一次: hold = -lo</text>
<text x="40" y="280" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">brute force 对每个 j 重新往回扫一遍找最小值 → O(n²); 这个最小值是 prefix min, 一路带着走就是 O(n)。</text>
<rect x="40" y="302" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="310" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">lo 所在日 (买)</text>
<rect x="181.76" y="302" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="178.76" y="299" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="217.76" y="310" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">卖出日</text>
</svg>
