<text x="40" y="262" font-size="16" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">答案 = max(A, B) = max(11, 10) = 11</text>
<text x="40" y="292" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">所有合法方案 = 不偷尾 (A 覆盖) ∪ 不偷首 (B 覆盖); 首尾都不偷同时被 A、B 覆盖, 不影响取 max</text>
