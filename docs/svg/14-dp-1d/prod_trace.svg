<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">nums = [2, -3, -2, 4] · mx[i] / mn[i] = 以 nums[i] 结尾的最大 / 最小 product</text>
