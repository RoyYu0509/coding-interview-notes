<text x="288.0" y="289.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="309" y="274" width="38" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="328.0" y="289.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="226" y="271" width="44" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M248.0 306 C248.0 326 324.0 326 324.0 309" fill="none" stroke="#52514E" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="40" y="281.0" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">coin = 2</text>
<text x="40" y="298.0" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">处理完后</text>
<text x="360" y="283" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp[5] = dp[5] + dp[5-2]  (旧值 + 用 2 之后的)</text>
<text x="360" y="301" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[5] = 1 + 2 = 3</text>
<text x="360" y="319" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">组合: {1×5} {1×3,2} {1,2×2}</text>
<line x1="40" y1="342" x2="640" y2="342" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="109" y="356" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="128.0" y="371.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
