<text x="328.0" y="371.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="106" y="353" width="44" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M128.0 388 C128.0 416 324.0 416 324.0 391" fill="none" stroke="#52514E" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="40" y="363.0" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">coin = 5</text>
<text x="40" y="380.0" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">处理完后</text>
<text x="360" y="365" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp[5] = dp[5] + dp[5-5]  (旧值 + 用 5 之后的)</text>
<text x="360" y="383" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[5] = 3 + 1 = 4</text>
<text x="360" y="401" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">组合: 上面 3 种 + {5}</text>
<line x1="40" y1="424" x2="640" y2="424" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="444" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">答案 = dp[5] = 4</text>
