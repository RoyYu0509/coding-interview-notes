<text x="248.0" y="207.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="269" y="192" width="38" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="288.0" y="207.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="309" y="192" width="38" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="328.0" y="207.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="266" y="189" width="44" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M288.0 224 C288.0 238 324.0 238 324.0 227" fill="none" stroke="#52514E" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="40" y="199.0" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">coin = 1</text>
<text x="40" y="216.0" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">处理完后</text>
<text x="360" y="201" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp[5] = dp[5] + dp[5-1]  (旧值 + 用 1 之后的)</text>
<text x="360" y="219" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[5] = 0 + 1 = 1</text>
<text x="360" y="237" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">组合: {1×5}</text>
<line x1="40" y1="260" x2="640" y2="260" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="109" y="274" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="128.0" y="289.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="149" y="274" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="168.0" y="289.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="189" y="274" width="38" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="208.0" y="289.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="229" y="274" width="38" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="248.0" y="289.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
