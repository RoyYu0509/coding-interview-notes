<svg width="100%" viewBox="0 0 680 512" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>coins = [1, 2, 5], amount = 5 · dp[a] = 凑出金额 a 的组合数 · 外层 for coin, 内层 for a 正序</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">coins = [1, 2, 5], amount = 5 · dp[a] = 凑出金额 a 的组合数 · 外层 for coin, 内层 for a 正序</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">每一步: 一整轮处理一种 coin; 本轮改变的格子绿色; 以 dp[5] 为例看算式</text>
<text x="40" y="72" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">step</text>
<text x="108" y="72" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp 数组 (每轮结束后)</text>
<text x="360" y="72" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">计算</text>
<line x1="40" y1="84" x2="640" y2="84" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="40" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">a</text>
<text x="128.0" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">0</text>
<text x="168.0" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">1</text>
<text x="208.0" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">2</text>
<text x="248.0" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">3</text>
<text x="288.0" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">4</text>
<text x="328.0" y="100" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">5</text>
<line x1="40" y1="114" x2="640" y2="114" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="109" y="128" width="38" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="128.0" y="143.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="149" y="128" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="168.0" y="143.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="189" y="128" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="208.0" y="143.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="229" y="128" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="248.0" y="143.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="269" y="128" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="288.0" y="143.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="309" y="128" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="328.0" y="143.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<text x="40" y="135.0" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">base</text>
<text x="360" y="137" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[0] = 1</text>
<text x="360" y="155" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">什么都不拿: 算 1 种组合</text>
<line x1="40" y1="178" x2="640" y2="178" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="109" y="192" width="38" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="128.0" y="207.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="149" y="192" width="38" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="168.0" y="207.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">1</text>
