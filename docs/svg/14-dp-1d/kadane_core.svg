<svg width="100%" viewBox="0 0 680 358" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Kadane: 以 i 结尾的 state</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">cur[i] = 以 nums[i] 结尾 (必须包含 nums[i]) 的最大 subarray sum · 答案 = 所有 cur[i] 的最大值</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">为什么要 &quot;以 i 结尾&quot;: 一旦规定了结尾, 到 i 为止只剩两种形状, 状态才接得上</text>
<text x="153.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=0</text>
<rect x="131" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="153.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">-2</text>
<text x="199.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=1</text>
<rect x="177" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="199.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<text x="245.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=2</text>
<rect x="223" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="245.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">-3</text>
<text x="291.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=3</text>
<rect x="269" y="96" width="44" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="291.0" y="112.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">4</text>
<text x="337.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=4</text>
<rect x="315" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="337.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">-1</text>
<text x="383.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=5</text>
<rect x="361" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="383.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<text x="429.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=6</text>
<rect x="407" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="429.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<text x="475.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=7</text>
<rect x="453" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="475.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">-5</text>
<text x="521.0" y="82" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">i=8</text>
<rect x="499" y="96" width="44" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="521.0" y="112.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">4</text>
<text x="40" y="112" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">nums</text>
<rect x="266" y="93" width="50" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="179" y1="154" x2="311" y2="154" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="179" y1="149" x2="179" y2="154" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="311" y1="149" x2="311" y2="154" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="40" y="156" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">接在 cur[2] 后面</text>
<text x="324" y="156" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">[1, -3, 4] = cur[2] + 4 = -2 + 4 = 2</text>
<line x1="271" y1="194" x2="311" y2="194" stroke="#0F6E56" stroke-width="1.5"/>
<line x1="271" y1="189" x2="271" y2="194" stroke="#0F6E56" stroke-width="1.5"/>
<line x1="311" y1="189" x2="311" y2="194" stroke="#0F6E56" stroke-width="1.5"/>
<text x="40" y="196" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">重新开始</text>
<text x="324" y="196" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">[4] = 4  (更大)</text>
<text x="40" y="246" font-size="16" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">cur[3] = max(x, cur[2] + x) = max(4, -2 + 4) = 4</text>
<text x="40" y="276" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">cur[2] = -2 &lt; 0 → 带着前面的只会拖后腿 → 重开。cur[i-1] ≥ 0 才接着走。</text>
<text x="40" y="304" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">最优 subarray 一定在某个 i 结束 → 逐个 i 算出 cur[i], 取最大; 不是 cur[n-1]。</text>
<rect x="40" y="326" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="334" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">当前 i = 3</text>
<rect x="157.76" y="326" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="154.76" y="323" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="193.76" y="334" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">被依赖的 cur[2]</text>
</svg>
