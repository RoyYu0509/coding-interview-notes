<svg width="100%" viewBox="0 0 680 384" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Maximum Product Subarray 同时维护 max 和 min</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">mx / mn = 以 nums[i] 结尾的最大 / 最小 product · 乘负数会让最小变最大</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">新 mx, mn 都是从旧 (mx, mn) 乘 x 得到; 箭头表示 &quot;哪个旧值乘 x 得到哪个新值&quot;</text>
<text x="40" y="76" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">x = 3 &gt; 0: 平行</text>
<rect x="40" y="100" width="100" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="90" y="120" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">mx = 6</text>
<rect x="40" y="170" width="100" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="90" y="190" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">mn = -4</text>
<rect x="210" y="100" width="100" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="260" y="120" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">mx = 18</text>
<rect x="210" y="170" width="100" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="260" y="190" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">mn = -12</text>
<path d="M142 120 L206 120" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M142 190 L206 190" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="175" y="88" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">× 3</text>
<text x="40" y="236" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">mx × 3 = 18</text>
<text x="40" y="258" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">mn × 3 = -12</text>
<text x="370" y="76" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">x = -2 &lt; 0: 交叉</text>
<rect x="370" y="100" width="100" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="420" y="120" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">mx = 6</text>
<rect x="370" y="170" width="100" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="420" y="190" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">mn = -4</text>
<rect x="540" y="100" width="100" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="590" y="120" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">mx = 8</text>
<rect x="540" y="170" width="100" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="590" y="190" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">mn = -12</text>
<path d="M472 124 L536 186" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M472 186 L536 124" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="505" y="88" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">× -2</text>
<text x="370" y="236" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">mn × (-2) = 8 → 新 mx</text>
<text x="370" y="258" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">mx × (-2) = -12 → 新 mn</text>
<text x="40" y="304" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">只记 mx 不够: mx 一遇到负数就变成最小, 原来的 mn 才是下一个负数翻身的机会</text>
<text x="40" y="330" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">所以 state 要两个: 以 i 结尾的最大 和 最小。候选 = x (重开), mx × x, mn × x。</text>
<rect x="40" y="352" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="70" y="360" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">上一格的 (mx, mn)</text>
<rect x="202.64" y="352" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="232.64" y="360" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">这一格的 (mx, mn)</text>
</svg>
