<svg width="100%" viewBox="0 0 680 396" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Word Break: dp[i] = 前 i 个字符能否切分</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp[i] = s 的前 i 个字符 s[:i] 能不能切成词典里的词 · 最后一个词 s[j:i] 的起点 j 全部试一遍</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">s = &quot;catsand&quot;, words = {cat, cats, and, sand} · 求 dp[7]</text>
<rect x="101" y="92" width="58" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="130.0" y="109.0" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">c</text>
<rect x="161" y="92" width="58" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="190.0" y="109.0" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="221" y="92" width="58" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="250.0" y="109.0" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">t</text>
<rect x="281" y="92" width="58" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="310.0" y="109.0" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">s</text>
<rect x="341" y="92" width="58" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="370.0" y="109.0" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="401" y="92" width="58" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="430.0" y="109.0" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">n</text>
<rect x="461" y="92" width="58" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="490.0" y="109.0" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">d</text>
<text x="100" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">0</text>
<text x="160" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">1</text>
<text x="220" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">2</text>
<text x="280" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">3</text>
<text x="340" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">4</text>
<text x="400" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">5</text>
<text x="460" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">6</text>
<text x="520" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">7</text>
<text x="40" y="109" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">s</text>
<text x="40" y="142" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">切点</text>
<text x="40" y="185" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">j = 4</text>
<rect x="102" y="170" width="236" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="220.0" y="185" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">dp[4] = True  (cats)</text>
<rect x="342" y="170" width="176" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="430.0" y="185" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">&quot;and&quot; ∈ 词典</text>
<rect x="99" y="167" width="242" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="239" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">j = 3</text>
<rect x="102" y="224" width="176" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="239" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">dp[3] = True</text>
<rect x="282" y="224" width="236" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="400.0" y="239" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">&quot;sand&quot; ∈ 词典</text>
<rect x="99" y="221" width="182" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="290" font-size="16" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[7] = any(dp[j] and s[j:7] in words for j in range(7)) = True</text>
<text x="40" y="320" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">子问题是 &quot;前缀&quot; s[:j]: 前缀只有 n+1 个, 每个只判断一次。递归 brute force 会反复切同一段后缀。</text>
<text x="40" y="340" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">brute force 每个切点 切/不切 → O(2ⁿ); dp: n 个 i × n 个 j × 子串 hash O(n) → O(n³), 限制词长后更快。</text>
<rect x="40" y="364" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="372" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">前缀 s[:j] 能切</text>
<rect x="188.72" y="364" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="218.72" y="372" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">最后一块是词</text>
<rect x="312.72" y="364" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="309.72" y="361" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="348.72" y="372" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">被依赖的 dp[j]</text>
</svg>
