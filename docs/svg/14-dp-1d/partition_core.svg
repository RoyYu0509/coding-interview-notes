<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">nums = [2], target = 4 · dp[c] = 能不能凑出和 c · 正确答案: 只有一个 2, 凑不出 4 → dp[4] = F</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">同一个 x 一轮里只能用一次 (0/1)。顺序决定 dp[c - x] 读到的是旧值还是已用过 x 的新值</text>
