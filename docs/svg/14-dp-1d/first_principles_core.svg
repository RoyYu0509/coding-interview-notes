<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">f(n) = 走到第 n 阶的方法数 = f(n-1) + f(n-2) · f(0) = f(1) = 1</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">左: 朴素递归树里同一个 f(k) 被反复展开 (红 = 已经算过一次的重复子问题) · 右: 每个 f(k) 只算一次</text>
<text x="40" y="66" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">递归 brute force: 15 次调用 → O(2ⁿ)</text>
<text x="410" y="66" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">DP table: 6 个格子 → O(n)</text>
