<text x="420" y="216" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">① state</text>
<text x="420" y="233" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[i] = 走到第 i 阶的方法数</text>
<text x="420" y="252" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">② transition</text>
<text x="420" y="269" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[i] = dp[i-1] + dp[i-2]</text>
<text x="420" y="288" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">③ base case</text>
<text x="420" y="305" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[0] = dp[1] = 1</text>
<text x="420" y="324" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">④ 计算顺序</text>
<text x="420" y="341" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">i 从小到大, 依赖的格子已填好</text>
