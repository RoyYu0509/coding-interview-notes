<svg width="100%" viewBox="0 0 680 396" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>House Robber 选或不选</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp[i] = 只看 nums[0..i] 时的最大金额 · 对第 i 间房子只有两个选择</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">例: nums = [2, 3, 9] → dp[0] = 2, dp[1] = 3, 现在算 dp[2]</text>
<rect x="90" y="126" width="130" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="155" y="145" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">dp[0] = 2</text>
<text x="155" y="166" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">nums[0] = 2</text>
<rect x="270" y="126" width="130" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="335" y="145" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">dp[1] = 3</text>
<text x="335" y="166" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">nums[1] = 3</text>
<rect x="450" y="126" width="130" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="145" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">dp[2] = ?</text>
<text x="515" y="166" font-size="12" font-weight="400" fill="#085041" text-anchor="middle" dominant-baseline="central">nums[2] = 9</text>
<rect x="87" y="123" width="136" height="60" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="267" y="123" width="136" height="60" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M404 153 L444 153" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="428" y="137" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">不偷 9</text>
<path d="M155 122 C155 70 515 70 515 122" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="335" y="72" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">偷 9: 邻居 nums[1] 不能偷 → 跳过, 接在 dp[0] 后</text>
<text x="40" y="222" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">两个选择各自的值</text>
<text x="40" y="250" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">不偷 nums[2]: 最好就是前两间的最优 = dp[1] = 3</text>
<text x="40" y="276" font-size="14" font-weight="400" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">偷 nums[2]:  dp[0] + nums[2] = 2 + 9 = 11</text>
<text x="40" y="312" font-size="16" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[2] = max(dp[1], dp[0] + nums[2]) = max(3, 2 + 9) = 11</text>
<text x="40" y="342" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">不会漏掉最优: 最优方案要么没偷 i (子问题是 dp[i-1]), 要么偷了 i (子问题是 dp[i-2])</text>
<rect x="40" y="364" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="372" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">要算的 dp[i]</text>
<rect x="169.76" y="364" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="166.76" y="361" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="205.76" y="372" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">两个候选依赖的格子</text>
</svg>
