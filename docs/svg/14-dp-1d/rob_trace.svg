<text x="350" y="157" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[0] = nums[0] = 2</text>
<text x="350" y="175" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[1] = max(2, 3) = 3</text>
