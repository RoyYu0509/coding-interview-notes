<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Coin Change II: 为什么外层是 coin</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">coins = [1, 2], amount = 3 · 组合 (combination) 不分顺序: 1+2 和 2+1 是同一种</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">外层 for 谁, 决定了 &quot;同一个组合被数几次&quot;</text>
<text x="40" y="72" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">外层 amount → 数的是排列 (顺序不同算不同)</text>
<rect x="60" y="92" width="110" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="115" y="109" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1+1+1</text>
<rect x="190" y="92" width="110" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="245" y="109" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1+2</text>
<rect x="320" y="92" width="110" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="375" y="109" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">2+1</text>
<text x="450" y="109" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">= 3 种</text>
<text x="60" y="144" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">1+2 和 2+1 被数了两次 (红)。每个 a 都把所有 coin 当 &quot;最后一枚&quot; → 顺序都被区分</text>
<text x="40" y="192" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">外层 coin → 数的是组合 (coin 的使用顺序固定: 先 1 后 2)</text>
<text x="176.0" y="222" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[0]</text>
<text x="228.0" y="222" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[1]</text>
<text x="280.0" y="222" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[2]</text>
<text x="332.0" y="222" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[3]</text>
<text x="40" y="252" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">只用 coin 1</text>
<rect x="151" y="236" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="176.0" y="251.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="203" y="236" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="228.0" y="251.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="255" y="236" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="280.0" y="251.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="307" y="236" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="332.0" y="251.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="148" y="233" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="200" y="233" width="56" height="36" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="322" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">再加入 coin 2</text>
<rect x="151" y="306" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="176.0" y="321.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="203" y="306" width="50" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="228.0" y="321.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="255" y="306" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="280.0" y="321.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="307" y="306" width="50" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="332.0" y="321.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M176 268 L274 304" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M228 268 L326 304" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="390" y="252" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[2] = 1 + dp[0] = 2</text>
<text x="390" y="276" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[3] = 1 + dp[1] = 2</text>
<text x="390" y="322" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">答案 dp[3] = 2: {1,1,1} {1,2}</text>
<text x="40" y="366" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">coin 2 只会被加在 &quot;已经用完 coin 1&quot; 的方案后面, 不会出现 2+1 → 每个组合恰好数一次</text>
<rect x="40" y="388" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="70" y="396" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">旧值</text>
<rect x="116" y="388" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="146" y="396" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">加入 coin 2 后更新</text>
<rect x="283.68" y="388" width="22" height="16" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="313.68" y="396" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">重复数的排列</text>
</svg>
