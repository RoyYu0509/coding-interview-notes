<svg width="100%" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Coin Change: 贪心错在哪, dp 试遍最后一枚</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">coins = [1, 3, 4], amount = 6 · dp[a] = 凑出 a 最少要几枚 coin</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">为什么要 DP: 贪心 (每次拿最大的) 会错; 要把 &quot;最后一枚拿哪个&quot; 全部试一遍</text>
<text x="40" y="72" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">贪心 4 → 1 → 1: 3 枚</text>
<circle cx="70" cy="112" r="18" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="70" y="112" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">4</text>
<circle cx="120" cy="112" r="18" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="120" y="112" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="170" cy="112" r="18" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="170" y="112" font-size="14" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">1</text>
<text x="40" y="162" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">最优 3 → 3: 2 枚</text>
<circle cx="70" cy="202" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="202" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">3</text>
<circle cx="120" cy="202" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="120" y="202" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="224" y1="60" x2="224" y2="330" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="246" y="72" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[6] = 1 + min(dp[6-1], dp[6-3], dp[6-4])</text>
<text x="275.0" y="110" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[0]</text>
<rect x="247" y="124" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="275.0" y="140.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">0</text>
<text x="333.0" y="110" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[1]</text>
<rect x="305" y="124" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="333.0" y="140.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<text x="391.0" y="110" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[2]</text>
<rect x="363" y="124" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="391.0" y="140.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<text x="449.0" y="110" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[3]</text>
<rect x="421" y="124" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="449.0" y="140.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<text x="507.0" y="110" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[4]</text>
<rect x="479" y="124" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="507.0" y="140.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
<text x="565.0" y="110" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[5]</text>
<rect x="537" y="124" width="56" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="565.0" y="140.0" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">2</text>
<text x="623.0" y="110" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">dp[6]</text>
<rect x="595" y="124" width="56" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="623.0" y="140.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="534" y="121" width="62" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="418" y="121" width="62" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="360" y="121" width="62" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M565.0 158 C565.0 172 619.0 172 619.0 161" fill="none" stroke="#52514E" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M449.0 158 C449.0 184 619.0 184 619.0 161" fill="none" stroke="#52514E" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M391.0 158 C391.0 186 619.0 186 619.0 161" fill="none" stroke="#52514E" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="565.0" y="186" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">+1 (coin 1)</text>
<text x="460.6" y="202" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">+1 (coin 3)</text>
<text x="362.0" y="186" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">+1 (coin 4)</text>
<text x="246" y="238" font-size="16" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[6] = 1 + min(2, 1, 2) = 2</text>
<text x="246" y="268" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">每枚 coin 可以无限次用: dp[a-c] 里可能已经用过 c</text>
<text x="246" y="288" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">→ unbounded; 不用记 &quot;用过哪些&quot;, 只记 &quot;凑出 a 的最少枚数&quot;</text>
<rect x="40" y="324" width="22" height="16" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="70" y="332" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">贪心的选择</text>
<rect x="152" y="324" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="182" y="332" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">最优 / 要算的 dp[6]</text>
<rect x="326.64" y="324" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="323.64" y="321" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="362.64" y="332" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">候选依赖的格子</text>
</svg>
