<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">nums = [1, 2, 3, 4], total = 10, target = 5 · dp[c] = 处理过的数里能不能凑出和 c</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">每个 x: c 从 target 倒着走到 x; dp[c] |= dp[c - x]; 读的 dp[c-x] 都是处理 x 之前的旧值</text>
<text x="40" y="72" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">step</text>
<text x="108" y="72" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp 数组 (每个 x 处理完后)</text>
