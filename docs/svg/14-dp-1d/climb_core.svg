<svg width="100%" viewBox="0 0 680 386" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif"><title>Climbing Stairs 的 transition 与滚动变量</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#52514E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">到第 i 阶的最后一步只有两种, 互斥且穷尽 → 方法数直接相加</text>
<text x="40" y="38" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">dp[i] = 走到第 i 阶的方法数</text>
<rect x="90" y="112" width="130" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="155" y="134" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">dp[i-2]</text>
<rect x="270" y="112" width="130" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="335" y="134" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">dp[i-1]</text>
<rect x="450" y="112" width="130" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="134" font-size="16" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">dp[i]</text>
<rect x="87" y="109" width="136" height="50" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="267" y="109" width="136" height="50" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M155 108 C155 62 515 62 515 108" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="335.0" y="66" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">最后一步走 2 阶 (从 i-2 出发)</text>
<path d="M404 134 L444 134" fill="none" stroke="#52514E" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="428" y="118" font-size="12" font-weight="400" fill="#52514E" text-anchor="middle" dominant-baseline="central">走 1 阶</text>
<text x="40" y="190" font-size="14" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">dp[i] 只读前两格 → 更早的格子填完就再也用不到, 不用存整张表:</text>
<text x="40" y="232" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">i 时</text>
<text x="40" y="292" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">i+1 时</text>
<rect x="110" y="214" width="190" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="205" y="232" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">a = dp[i-2]</text>
<rect x="320" y="214" width="190" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="415" y="232" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">b = dp[i-1]</text>
<rect x="110" y="274" width="190" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="205" y="292" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">a = 旧 b = dp[i-1]</text>
<rect x="320" y="274" width="190" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="415" y="292" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">b = 旧 a + 旧 b = dp[i]</text>
<text x="110" y="332" font-size="16" font-weight="600" fill="#0B0B0B" text-anchor="start" dominant-baseline="central">a, b = b, a + b</text>
<text x="270" y="332" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">右边先算完整个表达式, 再同时赋值</text>
<rect x="40" y="354" width="22" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="70" y="362" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">新算的</text>
<rect x="128" y="354" width="22" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="125" y="351" width="28" height="22" rx="4" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="164" y="362" font-size="12" font-weight="400" fill="#52514E" text-anchor="start" dominant-baseline="central">被依赖的</text>
</svg>
