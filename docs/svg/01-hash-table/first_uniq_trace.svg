<svg width="100%" viewBox="0 0 680 588" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>First Unique Character 运行流程</title><desc>pass 1 逐字符计数, pass 2 按原顺序检查 cnt, 遇到第一个 cnt == 1 就返回下标。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">s = "aabc" · pass 1: 每个字符 cnt += 1 · pass 2: 按下标顺序看 cnt[ch] 是不是 1</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">cnt: 字符 → 出现次数</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">当前字符</text>
<text x="146" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">操作 / 判断</text>
<text x="380" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">cnt 现在是</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="84" width="90" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="85.0" y="98.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">pass 1</text>
<text x="85.0" y="114.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">'a'</text>
