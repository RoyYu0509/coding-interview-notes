<text x="152" y="98" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">cnt['a'] += 1</text>
<text x="152" y="118" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">0 → 1</text>
<rect x="380" y="92" width="54" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="407.0" y="106.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">a:1</text>
