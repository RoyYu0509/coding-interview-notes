<svg width="100%" viewBox="0 0 680 544" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>Contains Duplicate II 运行流程</title><desc>last 记录每个值最近一次的下标; 命中条件是 i − last[x] ≤ k; 旧值被覆盖。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">k = 2 · 每一步: 查 last[x] → 算 dist = i − last[x] → ≤ k 就返回 True, 否则覆盖成 i</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">last: 值 → 最近一次出现的下标</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">当前</text>
<text x="136" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">先查</text>
<text x="444" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">后存: last 现在有</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="88" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="104.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 0</text>
<text x="78.0" y="120.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 1</text>
<path d="M116 112 L134 112" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="100" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">last 里没有 1</text>
<text x="142" y="122" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">→ 存 1→0</text>
<rect x="444" y="98" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="466.0" y="112.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">1→0</text>
<line x1="40" y1="152" x2="640" y2="152" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="160" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="176.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 1</text>
<text x="78.0" y="192.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 2</text>
<path d="M116 184 L134 184" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="172" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">last 里没有 2</text>
<text x="142" y="194" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">→ 存 2→1</text>
<rect x="444" y="170" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="466.0" y="184.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">1→0</text>
<rect x="492" y="170" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="514.0" y="184.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">2→1</text>
<line x1="40" y1="224" x2="640" y2="224" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="232" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="248.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 2</text>
<text x="78.0" y="264.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 3</text>
<path d="M116 256 L134 256" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="244" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">last 里没有 3</text>
<text x="142" y="266" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">→ 存 3→2</text>
<rect x="444" y="242" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="466.0" y="256.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">1→0</text>
<rect x="492" y="242" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="514.0" y="256.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2→1</text>
<rect x="540" y="242" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="562.0" y="256.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">3→2</text>
<line x1="40" y1="296" x2="640" y2="296" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="304" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="320.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 3</text>
<text x="78.0" y="336.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 1</text>
<path d="M116 328 L134 328" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="312" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">last[1] = 0</text>
<text x="142" y="330" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">dist = 3 − 0 = 3 &gt; k = 2</text>
<text x="142" y="350" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">太远, 不算 → 覆盖 last[1] = 3</text>
<rect x="444" y="314" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="466.0" y="328.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">1→3</text>
<rect x="352" y="314" width="44" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="374.0" y="328.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">1→0</text>
<path d="M444 328 L402 328" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a_red)"/>
<text x="352" y="352" font-size="12" fill="#712B13" text-anchor="start" dominant-baseline="central" font-weight="400">旧值被覆盖</text>
<rect x="492" y="314" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="514.0" y="328.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2→1</text>
<rect x="540" y="314" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="562.0" y="328.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→2</text>
<line x1="40" y1="368" x2="640" y2="368" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="376" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="392.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 4</text>
<text x="78.0" y="408.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 3</text>
<path d="M116 400 L134 400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="384" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">last[3] = 2</text>
<text x="142" y="402" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">dist = 4 − 2 = 2 ≤ k = 2</text>
<text x="142" y="422" font-size="12" fill="#085041" text-anchor="start" dominant-baseline="central" font-weight="500">命中 → return True</text>
<rect x="444" y="386" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="466.0" y="400.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">1→3</text>
<rect x="492" y="386" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="514.0" y="400.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2→1</text>
<rect x="540" y="386" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="562.0" y="400.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→2</text>
<rect x="537" y="383" width="50" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="456" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">答案: return True    nums[2] = nums[4] = 3, 4 − 2 = 2 ≤ k = 2</text>
<text x="40" y="480" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">i = 3 的 1 距离太远没命中, 但 last[1] 仍然要更新成 3 (为以后的 1 服务)。</text>
<rect x="40" y="504" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="510" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">新写入 last</text>
<rect x="156.8" y="504" width="16" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="178.8" y="510" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">被覆盖的旧值</text>
<rect x="274.8" y="504" width="16" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="296.8" y="510" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">last 里已有的</text>
<rect x="403" y="504" width="16" height="12" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="425.6" y="510" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">命中</text>
</svg>
