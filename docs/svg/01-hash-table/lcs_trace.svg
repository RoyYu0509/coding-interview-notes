<svg width="100%" viewBox="0 0 680 616" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>Longest Consecutive Sequence 运行流程</title><desc>遍历 set; x−1 在 set 里就跳过, 否则从 x 往右数; best 记录最长长度。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">nums = [100, 4, 200, 1, 3, 2] · s = set(nums), 下面按 Python 遍历 s 的真实顺序</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">每一步: x − 1 in s? 在 → 跳过; 不在 → 是起点, 往右一直数到断开</text>
<text x="40" y="66" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">s =</text>
<rect x="70" y="52" width="44" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="92.0" y="65.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">1</text>
<rect x="118" y="52" width="44" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="140.0" y="65.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2</text>
<rect x="166" y="52" width="44" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="188.0" y="65.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3</text>
<rect x="214" y="52" width="44" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="236.0" y="65.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">100</text>
<rect x="262" y="52" width="44" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="284.0" y="65.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">4</text>
<rect x="310" y="52" width="44" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="332.0" y="65.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">200</text>
<text x="40" y="92" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">当前</text>
<text x="130" y="92" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">先问</text>
<text x="330" y="92" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">往右数 (在 s 里连续的数)</text>
<text x="590" y="92" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">best</text>
<line x1="40" y1="102" x2="640" y2="102" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="114" width="62" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="71.0" y="128.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">x</text>
<text x="71.0" y="144.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">1</text>
<path d="M102 136 L120 136" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="128" y="124" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">1 − 1 = 0</text>
<text x="128" y="146" font-size="12" fill="#085041" text-anchor="start" dominant-baseline="central" font-weight="500">0 in s? 否 → 起点</text>
<rect x="330" y="120" width="40" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="350.0" y="134.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">1</text>
<rect x="374" y="120" width="40" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="394.0" y="134.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">2</text>
<rect x="418" y="120" width="40" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="438.0" y="134.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">3</text>
<rect x="462" y="120" width="40" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="482.0" y="134.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">4</text>
<text x="330" y="162" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">len = 4  (从 1 数到 4)</text>
<rect x="327" y="117" width="46" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="590" y="136" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">4</text>
<line x1="40" y1="174" x2="640" y2="174" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="182" width="62" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="71.0" y="196.0" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="400">x</text>
<text x="71.0" y="212.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2</text>
<path d="M102 204 L120 204" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="128" y="192" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">2 − 1 = 1</text>
<text x="128" y="214" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">1 in s? 是 → 不是起点, 跳过</text>
<text x="330" y="204" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">不数</text>
<text x="590" y="204" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">4</text>
<line x1="40" y1="242" x2="640" y2="242" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="250" width="62" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="71.0" y="264.0" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="400">x</text>
<text x="71.0" y="280.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3</text>
<path d="M102 272 L120 272" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="128" y="260" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">3 − 1 = 2</text>
<text x="128" y="282" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">2 in s? 是 → 不是起点, 跳过</text>
<text x="330" y="272" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">不数</text>
<text x="590" y="272" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">4</text>
<line x1="40" y1="310" x2="640" y2="310" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="318" width="62" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="71.0" y="332.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">x</text>
<text x="71.0" y="348.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">100</text>
<path d="M102 340 L120 340" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="128" y="328" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">100 − 1 = 99</text>
<text x="128" y="350" font-size="12" fill="#085041" text-anchor="start" dominant-baseline="central" font-weight="500">99 in s? 否 → 起点</text>
<rect x="330" y="324" width="40" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="350.0" y="338.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">100</text>
<text x="330" y="366" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">len = 1  (从 100 数到 100)</text>
<text x="590" y="340" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">4</text>
<line x1="40" y1="378" x2="640" y2="378" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="386" width="62" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="71.0" y="400.0" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="400">x</text>
<text x="71.0" y="416.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">4</text>
<path d="M102 408 L120 408" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="128" y="396" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">4 − 1 = 3</text>
<text x="128" y="418" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">3 in s? 是 → 不是起点, 跳过</text>
<text x="330" y="408" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">不数</text>
<text x="590" y="408" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">4</text>
<line x1="40" y1="446" x2="640" y2="446" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="454" width="62" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="71.0" y="468.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">x</text>
<text x="71.0" y="484.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">200</text>
<path d="M102 476 L120 476" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="128" y="464" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">200 − 1 = 199</text>
<text x="128" y="486" font-size="12" fill="#085041" text-anchor="start" dominant-baseline="central" font-weight="500">199 in s? 否 → 起点</text>
<rect x="330" y="460" width="40" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="350.0" y="474.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">200</text>
<text x="330" y="502" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">len = 1  (从 200 数到 200)</text>
<text x="590" y="476" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">4</text>
<text x="40" y="530" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">答案: best = 4    序列 1, 2, 3, 4</text>
<text x="40" y="554" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">往右数的格子总数 = 4 + 1 + 1 = 6 = n: 每个数只被它所在序列的起点数过一次。</text>
<rect x="40" y="578" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="584" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">起点 / 往右数到的</text>
<rect x="190.88" y="578" width="16" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="212.88" y="584" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">set 里的数 / 被跳过</text>
<rect x="357" y="578" width="16" height="12" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="379.59999999999997" y="584" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">最长的一段</text>
</svg>
