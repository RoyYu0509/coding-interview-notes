<text x="40" y="270" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">下标 = ord(ch) − 97:   ord('a') − 97 = 0,   ord('r') − 97 = 17,   ord('t') − 97 = 19</text>
<line x1="40" y1="288" x2="640" y2="288" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="310" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">sorted(s) == sorted(t)</text>
<text x="300" y="310" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="400">O(n log n) 时间</text>
<text x="40" y="334" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">数组计数 cnt</text>
<text x="300" y="334" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="400">O(n) 时间 · 固定 26 格 = O(1) 空间</text>
<text x="40" y="366" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">字符集不固定 (Unicode 等): 26 格数组放不下, 换回 dict / Counter, 思路完全一样。</text>
</svg>
