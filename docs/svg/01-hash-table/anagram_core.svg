<svg width="100%" viewBox="0 0 680 396" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>Valid Anagram: anagram 就是频率表相同</title><desc>顺序不重要, 两个字符串映射到同一个频率表; 小写字母时用 26 格数组, 下标就是字母。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">anagram: 两个字符串用同样的字符、同样的次数, 顺序可以不同</text>
<rect x="40" y="40" width="110" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="95.0" y="57.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">s = "rat"</text>
<rect x="40" y="90" width="110" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="95.0" y="107.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">t = "tar"</text>
<rect x="250" y="38" width="390" height="88" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="445.0" y="74.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">频率表 (顺序被丢掉了)</text>
<text x="445.0" y="90.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">a:1   r:1   t:1</text>
<path d="M150 57 L248 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<path d="M150 107 L248 96" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="250" y="144" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">两个字符串得到同一张表  ⇔  anagram, 所以不需要 sort 来 "对齐顺序"</text>
<line x1="40" y1="162" x2="640" y2="162" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="184" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">小写字母: 用 [0] * 26, 字母直接当下标 (不需要 hash)</text>
