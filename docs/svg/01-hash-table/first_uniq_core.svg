<svg width="100%" viewBox="0 0 680 344" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>First Unique Character: 先数完再按顺序找</title><desc>一遍扫描不知道后面还会不会出现同一个字符, 所以 pass 1 数全局频率, pass 2 按原顺序找第一个 cnt == 1。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">s = "aabc" · 要找第一个只出现一次的字符的下标</text>
<text x="40" y="50" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">pass 1: 数全局频率 (不管顺序)</text>
<rect x="50" y="68" width="46" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="73.0" y="85.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a</text>
<rect x="102" y="68" width="46" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="125.0" y="85.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a</text>
<rect x="154" y="68" width="46" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="177.0" y="85.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">b</text>
<rect x="206" y="68" width="46" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="229.0" y="85.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">c</text>
<text x="330" y="56" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">cnt</text>
<rect x="330" y="70" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="357.0" y="84.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a:2</text>
<rect x="388" y="70" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="415.0" y="84.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">b:1</text>
<rect x="446" y="70" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="473.0" y="84.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">c:1</text>
<path d="M262 85 L324 85" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<line x1="40" y1="122" x2="640" y2="122" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="144" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">pass 2: 按原顺序再扫, 第一个 cnt == 1 的就是答案</text>
<rect x="50" y="162" width="46" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="73.0" y="179.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a</text>
<text x="73" y="214" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">cnt = 2</text>
<rect x="102" y="162" width="46" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="125.0" y="179.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a</text>
<text x="125" y="214" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">cnt = 2</text>
<rect x="154" y="162" width="46" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="177.0" y="179.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">b</text>
<rect x="151" y="159" width="52" height="40" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="177" y="214" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">cnt = 1 ✓</text>
<rect x="206" y="162" width="46" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="229.0" y="179.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">c</text>
<text x="229" y="214" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">没扫到</text>
<text x="330" y="170" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">i = 0, 1: cnt = 2, 跳过</text>
<text x="330" y="190" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">i = 2: cnt = 1, return 2</text>
<line x1="40" y1="236" x2="640" y2="236" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="258" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">为什么一遍不够?</text>
<text x="40" y="280" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">扫到 'b' (i = 2) 时, 一遍扫描回答不了 "后面还会不会再出现 b"。</text>
<text x="40" y="300" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">答案依赖全局信息 → 先数完 (O(n)), 再按原顺序查表 (O(n)), 合起来仍是 O(n)。</text>
<text x="40" y="324" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">不能直接遍历 cnt 找 == 1: 要的是 "在原串里最靠前", 不是 cnt 里最靠前 (dict 的顺序是首次出现顺序, 可行但不通用)。</text>
</svg>
