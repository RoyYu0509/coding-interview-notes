<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>Two Sum 运行流程</title><desc>每步: 算 need, 查 seen, 没找到就把 x 存进 seen, 直到命中。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">target = 9 · 每一步: need = target − x → 查 seen → 没命中才把 x→i 存进去</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">seen: 值 → 下标 (只装当前 i 前面的元素)</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">当前</text>
<text x="136" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">先查</text>
<text x="380" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">后存: seen 现在有</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="84" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="100.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 0</text>
<text x="78.0" y="116.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 3</text>
<path d="M116 108 L134 108" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="96" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">need = 9 − 3 = 6</text>
<text x="142" y="118" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">6 in seen? 否 → 存 3→0</text>
<rect x="380" y="94" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="402.0" y="108.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">3→0</text>
<line x1="40" y1="140" x2="640" y2="140" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="148" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="164.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 1</text>
<text x="78.0" y="180.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 8</text>
<path d="M116 172 L134 172" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="160" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">need = 9 − 8 = 1</text>
<text x="142" y="182" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">1 in seen? 否 → 存 8→1</text>
<rect x="380" y="158" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="402.0" y="172.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→0</text>
<rect x="428" y="158" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="450.0" y="172.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">8→1</text>
<line x1="40" y1="204" x2="640" y2="204" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="212" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="228.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 2</text>
<text x="78.0" y="244.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 5</text>
<path d="M116 236 L134 236" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="224" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">need = 9 − 5 = 4</text>
<text x="142" y="246" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">4 in seen? 否 → 存 5→2</text>
<rect x="380" y="222" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="402.0" y="236.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→0</text>
<rect x="428" y="222" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="450.0" y="236.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8→1</text>
<rect x="476" y="222" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="498.0" y="236.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">5→2</text>
<line x1="40" y1="268" x2="640" y2="268" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="276" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="292.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 3</text>
<text x="78.0" y="308.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 2</text>
<path d="M116 300 L134 300" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="288" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">need = 9 − 2 = 7</text>
<text x="142" y="310" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">7 in seen? 否 → 存 2→3</text>
<rect x="380" y="286" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="402.0" y="300.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→0</text>
<rect x="428" y="286" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="450.0" y="300.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8→1</text>
<rect x="476" y="286" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="498.0" y="300.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">5→2</text>
<rect x="524" y="286" width="44" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="546.0" y="300.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">2→3</text>
<line x1="40" y1="332" x2="640" y2="332" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="340" width="76" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="78.0" y="356.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">i = 4</text>
<text x="78.0" y="372.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 7</text>
<path d="M116 364 L134 364" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="142" y="352" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">need = 9 − 7 = 2</text>
<text x="142" y="374" font-size="12" fill="#085041" text-anchor="start" dominant-baseline="central" font-weight="500">2 in seen? 是 → seen[2] = 3</text>
<rect x="380" y="350" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="402.0" y="364.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→0</text>
<rect x="428" y="350" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="450.0" y="364.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8→1</text>
<rect x="476" y="350" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="498.0" y="364.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">5→2</text>
<rect x="524" y="350" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="546.0" y="364.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2→3</text>
<rect x="521" y="347" width="50" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="40" y="422" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">答案: return [3, 4]    因为 nums[3] + nums[4] = 2 + 7 = 9</text>
<text x="40" y="446" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">整个过程 seen 只增不减; 最后一步命中就返回, 所以没有再存 7。</text>
<rect x="40" y="470" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="476" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">新写入 seen</text>
<rect x="156.8" y="470" width="16" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="178.8" y="476" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">seen 里已有的</text>
<rect x="285" y="470" width="16" height="12" rx="3" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="307.6" y="476" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">命中的另一半</text>
</svg>
