<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>brute force 内层扫描 vs 一次查表</title><desc>同一个 Two Sum 例子: 左边每个 x 重新扫描前面所有元素, 右边把前面见过的存进 seen, 一次 lookup 找到另一半。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">nums = [3, 8, 5, 2, 7] · target = 9 · 现在轮到 i = 4, x = 7, 要找另一半 need = 9 − 7 = 2</text>
<text x="40" y="52" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">brute force: 内层循环扫描</text>
<text x="360" y="52" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">Hash Table: 内层循环变成一次查表</text>
<line x1="340" y1="40" x2="340" y2="300" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="50" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="70.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3</text>
<text x="70" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">0</text>
<rect x="94" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="114.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8</text>
<text x="114" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">1</text>
<rect x="138" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="158.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">5</text>
<text x="158" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">2</text>
<rect x="182" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="202.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2</text>
<text x="202" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">3</text>
<rect x="226" y="78" width="40" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="246.0" y="94.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">7</text>
<text x="246" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">4</text>
<rect x="223" y="75" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect x="370" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="390.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3</text>
<text x="390" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">0</text>
<rect x="414" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="434.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8</text>
<text x="434" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">1</text>
<rect x="458" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="478.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">5</text>
<text x="478" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">2</text>
<rect x="502" y="78" width="40" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="522.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2</text>
<text x="522" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">3</text>
<rect x="546" y="78" width="40" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="566.0" y="94.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">7</text>
<text x="566" y="124" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">4</text>
<rect x="543" y="75" width="46" height="38" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="50" y="152" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">x = 7 要和前面每个数比一次:</text>
<rect x="50" y="166" width="150" height="20" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="125.0" y="176.0" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="400">7 + 3 = 10 ≠ 9</text>
<rect x="50" y="190" width="150" height="20" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="125.0" y="200.0" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="400">7 + 8 = 15 ≠ 9</text>
<rect x="50" y="214" width="150" height="20" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="125.0" y="224.0" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="400">7 + 5 = 12 ≠ 9</text>
<rect x="50" y="238" width="150" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="125.0" y="248.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">7 + 2 = 9 ✓</text>
<text x="50" y="282" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">每个 x 最多比 n − 1 次</text>
<text x="50" y="304" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">n × n = O(n²) · 额外空间 O(1)</text>
<text x="370" y="152" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">seen (值 → 下标), 只装 i 前面的:</text>
<rect x="370" y="166" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="392.0" y="180.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→0</text>
<rect x="418" y="166" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="440.0" y="180.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8→1</text>
<rect x="466" y="166" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="488.0" y="180.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">5→2</text>
<rect x="514" y="166" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="536.0" y="180.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2→3</text>
<rect x="511" y="163" width="50" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<text x="370" y="218" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">need = 9 − 7 = 2</text>
<text x="370" y="240" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">2 in seen?  是 → seen[2] = 3</text>
<text x="370" y="262" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">只做 1 次 lookup</text>
<text x="370" y="282" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">每个 x 查 1 次</text>
<text x="370" y="304" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">n × 1 = O(n) · 额外空间 O(n)</text>
<line x1="40" y1="322" x2="640" y2="322" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="346" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">本质: 用 O(n) 空间记住 "见过什么", 把内层 "找" 的循环换成一次 O(1) 的查表</text>
</svg>
