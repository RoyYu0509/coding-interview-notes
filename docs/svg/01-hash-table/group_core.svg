<svg width="100%" viewBox="0 0 680 414" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>Group Anagrams: canonical key</title><desc>两两比较要 O(n^2) 次; 给每个词算一个 canonical key, 同组的词 key 相同, 一次遍历用 dict 分桶。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">strs = ["eat", "tea", "tan", "ate", "nat", "bat"]</text>
<text x="40" y="52" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">brute force: 两两比较</text>
<text x="370" y="52" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">canonical key: 算 key → 放进同一个桶</text>
<line x1="350" y1="40" x2="350" y2="264" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="82" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">6 个词 → C(6, 2) = 15 对</text>
<text x="40" y="104" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">每一对都要比一次 (sorted 或 Counter)</text>
<text x="40" y="126" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">eat vs tea ✓   eat vs tan ✗</text>
<text x="40" y="146" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">eat vs ate ✓   eat vs nat ✗</text>
<text x="40" y="166" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">eat vs bat ✗   tea vs tan ✗ ...</text>
<text x="40" y="210" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">n 个词 → n² 对</text>
<text x="40" y="232" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">O(n² · k log k)</text>
<text x="40" y="254" font-size="12" fill="#712B13" text-anchor="start" dominant-baseline="central" font-weight="400">浪费: 同组的词被反复比较</text>
<rect x="370" y="76" width="56" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="398.0" y="94.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">aet</text>
<path d="M428 94 L446 94" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<rect x="450" y="80" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="472.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">eat</text>
<rect x="498" y="80" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="520.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">tea</text>
<rect x="546" y="80" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="568.0" y="94.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">ate</text>
<rect x="370" y="138" width="56" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="398.0" y="156.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">ant</text>
<path d="M428 156 L446 156" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<rect x="450" y="142" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="472.0" y="156.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">tan</text>
<rect x="498" y="142" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="520.0" y="156.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">nat</text>
<rect x="370" y="200" width="56" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="398.0" y="218.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">abt</text>
<path d="M428 218 L446 218" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<rect x="450" y="204" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="472.0" y="218.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">bat</text>
<text x="370" y="268" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">key = sorted(w): "eat" → "aet", "tea" → "aet"</text>
<line x1="40" y1="288" x2="640" y2="288" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="310" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">对 key 的要求</text>
<text x="40" y="332" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">同组 → key 相同;  不同组 → key 不同;  key 必须 hashable (str / tuple, 不能是 list)</text>
<text x="40" y="356" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">sorted 当 key: O(k log k)</text>
<text x="300" y="356" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">26 格计数 tuple 当 key: O(k)</text>
<text x="40" y="380" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">n 个词, 每个词算一次 key + 一次 dict 操作 → 总共 O(n · k log k) 或 O(n · k)</text>
</svg>
