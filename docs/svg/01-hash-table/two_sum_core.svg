<svg width="100%" viewBox="0 0 680 392" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>Two Sum: seen 的 invariant 和先查后存</title><desc>进入第 i 轮时 seen 恰好装着 nums[0..i-1]; 先查再存才不会让 x 匹配自己。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">nums = [3, 8, 5, 2, 7] · target = 9 · 此刻 i = 4</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">invariant: 进入第 i 轮时, seen 恰好装着 nums[0..i−1]</text>
<rect x="50" y="62" width="56" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="78.0" y="80.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3</text>
<text x="78" y="112" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">i=0</text>
<rect x="112" y="62" width="56" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="140.0" y="80.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8</text>
<text x="140" y="112" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">i=1</text>
<rect x="174" y="62" width="56" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="202.0" y="80.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">5</text>
<text x="202" y="112" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">i=2</text>
<rect x="236" y="62" width="56" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="264.0" y="80.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2</text>
<text x="264" y="112" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">i=3</text>
<rect x="298" y="62" width="56" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="326.0" y="80.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">7</text>
<text x="326" y="112" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">i=4</text>
<rect x="295" y="59" width="62" height="42" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M50 126 L50 132 L286 132 L286 126" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="168" y="148" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">i 前面的 4 个数: 都已经在 seen 里</text>
<rect x="400" y="56" width="220" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="510.0" y="72.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">x = 7</text>
<text x="510.0" y="88.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">need = 9 − 7 = 2</text>
<path d="M362 80 L398 80" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a_green)"/>
<rect x="50" y="184" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="72.0" y="198.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">3→0</text>
<rect x="98" y="184" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120.0" y="198.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">8→1</text>
<rect x="146" y="184" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="168.0" y="198.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">5→2</text>
<rect x="194" y="184" width="44" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="216.0" y="198.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">2→3</text>
<rect x="191" y="181" width="50" height="34" rx="6" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<path d="M510 106 L510 166 L216.0 166 L216.0 180" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a_green)"/>
<text x="310" y="198" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">seen[2] = 3  →  答案 [3, 4]</text>
<text x="540" y="150" font-size="12" fill="#52514E" text-anchor="middle" dominant-baseline="central" font-weight="400">查 2</text>
<line x1="40" y1="244" x2="640" y2="244" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="266" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">为什么要先查后存? nums = [3], target = 6</text>
<rect x="40" y="282" width="280" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="180.0" y="302.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">先存后查</text>
<text x="180.0" y="318.0" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="400">seen = {3→0} → need = 3 → 命中 → [0, 0]</text>
<rect x="340" y="282" width="300" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="490.0" y="302.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">先查后存</text>
<text x="490.0" y="318.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">seen = {} → need = 3 不在 → 再存 3→0 → 无解</text>
<text x="40" y="358" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">先存后查会把 x 自己当成另一半, 同一个元素用了两次。</text>
<text x="40" y="378" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">先查后存: 命中的永远是 i 之前的元素, 所以 nums = [3, 3] 也能得到 [0, 1]。</text>
</svg>
