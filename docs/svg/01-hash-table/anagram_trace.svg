<svg width="100%" viewBox="0 0 680 544" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-sans-serif, system-ui, -apple-system, &quot;PingFang SC&quot;, sans-serif">
<title>Valid Anagram 运行流程</title><desc>s 的字符让 cnt +1, t 的字符让 cnt −1; 最后看 cnt 是否全 0。</desc>
<defs><marker id="a_grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="18" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">s = "rat", t = "car" · cnt = [0] * 26, 图里只画碰到过的格子 (letter:count)</text>
<text x="40" y="38" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">第一个循环: s 的每个字符 cnt +1 · 第二个循环: t 的每个字符 cnt −1</text>
<text x="40" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">当前字符</text>
<text x="146" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">操作</text>
<text x="380" y="64" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">cnt 现在是</text>
<line x1="40" y1="74" x2="640" y2="74" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="88" width="90" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="85.0" y="102.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">s[0]</text>
<text x="85.0" y="118.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">'r'</text>
<path d="M130 110 L144 110" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="152" y="100" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">cnt['r'] += 1</text>
<text x="152" y="122" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">0 → 1</text>
<rect x="380" y="94" width="54" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="407.0" y="108.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">r:1</text>
<line x1="40" y1="140" x2="640" y2="140" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="148" width="90" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="85.0" y="162.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">s[1]</text>
<text x="85.0" y="178.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">'a'</text>
<path d="M130 170 L144 170" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="152" y="160" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">cnt['a'] += 1</text>
<text x="152" y="182" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">0 → 1</text>
<rect x="380" y="154" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="407.0" y="168.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">r:1</text>
<rect x="438" y="154" width="54" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="465.0" y="168.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">a:1</text>
<line x1="40" y1="200" x2="640" y2="200" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="208" width="90" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="85.0" y="222.0" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="400">s[2]</text>
<text x="85.0" y="238.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">'t'</text>
<path d="M130 230 L144 230" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="152" y="220" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">cnt['t'] += 1</text>
<text x="152" y="242" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">0 → 1</text>
<rect x="380" y="214" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="407.0" y="228.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">r:1</text>
<rect x="438" y="214" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="465.0" y="228.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a:1</text>
<rect x="496" y="214" width="54" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="523.0" y="228.0" font-size="14" fill="#085041" text-anchor="middle" dominant-baseline="central" font-weight="500">t:1</text>
<line x1="40" y1="260" x2="640" y2="260" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="268" width="90" height="44" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="85.0" y="282.0" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="400">t[0]</text>
<text x="85.0" y="298.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">'c'</text>
<path d="M130 290 L144 290" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="152" y="280" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">cnt['c'] -= 1</text>
<text x="152" y="302" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">0 → -1</text>
<rect x="380" y="274" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="407.0" y="288.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">r:1</text>
<rect x="438" y="274" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="465.0" y="288.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a:1</text>
<rect x="496" y="274" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="523.0" y="288.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">t:1</text>
<rect x="554" y="274" width="54" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="581.0" y="288.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">c:-1</text>
<line x1="40" y1="320" x2="640" y2="320" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="328" width="90" height="44" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="85.0" y="342.0" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="400">t[1]</text>
<text x="85.0" y="358.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">'a'</text>
<path d="M130 350 L144 350" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="152" y="340" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">cnt['a'] -= 1</text>
<text x="152" y="362" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">1 → 0</text>
<rect x="380" y="334" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="407.0" y="348.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">r:1</text>
<rect x="438" y="334" width="54" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="465.0" y="348.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">a:0</text>
<rect x="496" y="334" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="523.0" y="348.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">t:1</text>
<rect x="554" y="334" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="581.0" y="348.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">c:-1</text>
<line x1="40" y1="380" x2="640" y2="380" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="388" width="90" height="44" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="85.0" y="402.0" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="400">t[2]</text>
<text x="85.0" y="418.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">'r'</text>
<path d="M130 410 L144 410" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a_grey)"/>
<text x="152" y="400" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">cnt['r'] -= 1</text>
<text x="152" y="422" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">1 → 0</text>
<rect x="380" y="394" width="54" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="407.0" y="408.0" font-size="14" fill="#712B13" text-anchor="middle" dominant-baseline="central" font-weight="500">r:0</text>
<rect x="438" y="394" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="465.0" y="408.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">a:0</text>
<rect x="496" y="394" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="523.0" y="408.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">t:1</text>
<rect x="554" y="394" width="54" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="581.0" y="408.0" font-size="14" fill="#444441" text-anchor="middle" dominant-baseline="central" font-weight="500">c:-1</text>
<text x="40" y="460" font-size="14" fill="#0B0B0B" text-anchor="start" dominant-baseline="central" font-weight="500">最后: cnt 里还有 t:1, c:-1 不是 0  →  any(cnt) 为 True  →  return False</text>
<text x="40" y="484" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">a、r 刚好抵消成 0; t 多了一个, c 少了一个, 所以 "rat" 和 "car" 不是 anagram。</text>
<rect x="40" y="508" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="514" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">s 的字符 +1</text>
<rect x="156.8" y="508" width="16" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="178.8" y="514" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">t 的字符 −1</text>
<rect x="273.6" y="508" width="16" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="295.6" y="514" font-size="12" fill="#52514E" text-anchor="start" dominant-baseline="central" font-weight="400">没变的格子</text>
</svg>
